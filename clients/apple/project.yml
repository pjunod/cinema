# XcodeGen spec — generates plurx.xcodeproj with an iOS app and a tvOS app that
# share every Swift file under Sources/. Build:
#   brew install xcodegen        # once
#   cd clients/apple && xcodegen generate && open plurx.xcodeproj
# then set your Signing Team on both targets and Run.
name: plurx
options:
  bundleIdPrefix: tv.plurx
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.9.1"
    # A fixed development placeholder, never bumped. The real build number is
    # derived from Git history by scripts/build-number and written into each
    # built app's Info.plist by the "Stamp derived build number" phase below;
    # a stored counter every client pull request had to raise made any two of
    # them conflict.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  plurx-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../crates/plurxd/src/web/reader.js
        buildPhase: resources
      - path: ../../crates/plurxd/src/web/offline-reader.js
        buildPhase: resources
      - path: ../../crates/plurxd/src/web/offline-reader.html
        buildPhase: resources
      - path: Resources/Assets.xcassets        # iOS app icon
      - path: Resources/PrivacyInfo.xcprivacy  # required-reason API manifest
    settings:
      base:
        PRODUCT_NAME: plurx
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"    # the build-number phase reads .git
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    postBuildScripts:
      # Runs every build (no dependency analysis) and before code signing, so
      # the signed bundle carries the derived number. It reads the repository's
      # Git history, which user-script sandboxing would forbid; the target
      # turns sandboxing off for that reason.
      - name: Stamp derived build number
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          mode=""
          if [ "${CONFIGURATION}" = "Release" ]; then mode="--release"; fi
          number="$("${SRCROOT}/../../scripts/build-number" ${mode})"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${number}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    info:
      path: Support/iOS-Info.plist
      properties:
        CFBundleDisplayName: Noirr Cinema
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # The Audio, AirPlay, and Picture in Picture background mode lets the
        # native PiP window keep its AVPlayer alive after leaving the app.
        UIBackgroundModes:
          - audio
        # Home servers are usually plain http on the LAN — permit it. The
        # narrower NSAllowsLocalNetworking is NOT a substitute: it misses
        # Tailscale's 100.64/10 and, on iOS 10+, its mere presence makes
        # NSAllowsArbitraryLoads be ignored. See docs/PUBLISHING.md §4.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Without this iOS silently refuses connections to 192.168.x.x —
        # a functional bug, not paperwork.
        NSLocalNetworkUsageDescription: "Cinema connects to your media server on your local network."
        NSCameraUsageDescription: "Cinema scans QR codes to connect to your media server, pair a remote, or import a sharing invitation."
        # Browsing is also the permission preflight: it makes iOS ask before a
        # login request can race the system sheet. The value must match the
        # service plurxd publishes through DNS-SD.
        NSBonjourServices:
          - _plurx._tcp
        # Skips the export-compliance questionnaire on every upload.
        ITSAppUsesNonExemptEncryption: false

  plurx-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources/tvOS.xcassets          # layered Brand Assets + Top Shelf
      - path: Resources/PrivacyInfo.xcprivacy  # required-reason API manifest
    settings:
      base:
        PRODUCT_NAME: plurx
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app
        # Names tvOS.brandassets inside Resources/tvOS.xcassets. Without it the
        # tvOS archive cannot be uploaded at all.
        ASSETCATALOG_COMPILER_APPICON_NAME: tvOS
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"    # the build-number phase reads .git
    postBuildScripts:
      # Runs every build (no dependency analysis) and before code signing, so
      # the signed bundle carries the derived number. It reads the repository's
      # Git history, which user-script sandboxing would forbid; the target
      # turns sandboxing off for that reason.
      - name: Stamp derived build number
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          mode=""
          if [ "${CONFIGURATION}" = "Release" ]; then mode="--release"; fi
          number="$("${SRCROOT}/../../scripts/build-number" ${mode})"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${number}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    info:
      path: Support/tvOS-Info.plist
      properties:
        CFBundleDisplayName: Noirr Cinema
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes:
          - audio
        # Same reasoning as iOS above — docs/PUBLISHING.md §4.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Cinema connects to your media server on your local network."
        NSBonjourServices:
          - _plurx._tcp
        ITSAppUsesNonExemptEncryption: false

  plurx-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../crates/plurx-core/tests/fixtures/diagnostics-events-v1.json
        buildPhase: resources
      - path: ../../crates/plurx-core/tests/fixtures/diagnostics-v1.json
        buildPhase: resources
      - path: ../../crates/plurx-core/tests/fixtures/remote-control-v1.json
        buildPhase: resources
      - path: ../../tests/contracts/channel-subject-wire.json
        buildPhase: resources
      - path: ../../tests/contracts/native-api.json
        buildPhase: resources
      - path: ../../tests/contracts/library-sort-cases.json
        buildPhase: resources
      - path: ../../tests/playback/player-input-contract.json
        buildPhase: resources
      - path: ../../tests/playback/playback-info-fields.json
        buildPhase: resources
      - path: ../../tests/playback/playback-surface-contract.json
        buildPhase: resources
      - path: ../../tests/playback/live-tv-guide-cases.json
        buildPhase: resources
      - path: ../../tests/playback/live-tv-start-cases.json
        buildPhase: resources
      - path: ../../tests/playback/pgs-overlay-cases.json
        buildPhase: resources
      - path: ../../tests/playback/dvr-visibility-cases.json
        buildPhase: resources
      - path: ../../tests/sharing/protocol-cases.json
        buildPhase: resources
    dependencies:
      - target: plurx-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app.tests.ios
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/plurx.app/plurx"
        BUNDLE_LOADER: "$(TEST_HOST)"

  plurx-tvOSTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
      - path: ../../crates/plurx-core/tests/fixtures/diagnostics-events-v1.json
        buildPhase: resources
      - path: ../../crates/plurx-core/tests/fixtures/diagnostics-v1.json
        buildPhase: resources
      - path: ../../crates/plurx-core/tests/fixtures/remote-control-v1.json
        buildPhase: resources
      - path: ../../tests/contracts/channel-subject-wire.json
        buildPhase: resources
      - path: ../../tests/contracts/native-api.json
        buildPhase: resources
      - path: ../../tests/contracts/library-sort-cases.json
        buildPhase: resources
      - path: ../../tests/playback/player-input-contract.json
        buildPhase: resources
      - path: ../../tests/playback/playback-info-fields.json
        buildPhase: resources
      - path: ../../tests/playback/playback-surface-contract.json
        buildPhase: resources
      - path: ../../tests/playback/live-tv-guide-cases.json
        buildPhase: resources
      - path: ../../tests/playback/live-tv-start-cases.json
        buildPhase: resources
      - path: ../../tests/playback/pgs-overlay-cases.json
        buildPhase: resources
      - path: ../../tests/playback/dvr-visibility-cases.json
        buildPhase: resources
      - path: ../../tests/sharing/protocol-cases.json
        buildPhase: resources
    dependencies:
      - target: plurx-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app.tests.tvos
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/plurx.app/plurx"
        BUNDLE_LOADER: "$(TEST_HOST)"

  plurx-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/LibraryRowsNavigationTests.swift
      - path: UITests/DiagnosticReportingTests.swift
      - path: UITests/ViewerNavigationQueries.swift
    dependencies:
      - target: plurx-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app.uitests.ios
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: plurx-iOS

  plurx-tvOSUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: plurx-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.plurx.app.uitests.tvos
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: plurx-tvOS

schemes:
  plurx-iOS:
    build:
      targets:
        plurx-iOS: all
        plurx-iOSTests: [test]
    test:
      targets:
        - plurx-iOSTests

  plurx-tvOS:
    build:
      targets:
        plurx-tvOS: all
        plurx-tvOSTests: [test]
    test:
      targets:
        - plurx-tvOSTests

  plurx-tvOS-navigation:
    build:
      targets:
        plurx-tvOS: all
        plurx-tvOSUITests: [test]
    test:
      targets:
        - name: plurx-tvOSUITests
          selectedTests:
            - TVNavigationTests
            - TVMeridianNavigationTests
            - TVSecondaryNavigationTests
            - TVPlaybackNavigationTests
            - TVLiveNavigationTests
            - TVDvrNavigationTests
            - TVRemoteManagementNavigationTests
            - TVSharedPlaybackNavigationTests
            - TVHomeNavigationTests
            - TVConnectionNavigationTests

  plurx-tvOS-physical:
    build:
      targets:
        plurx-tvOS: all
        plurx-tvOSUITests: [test]
    test:
      targets:
        - name: plurx-tvOSUITests
          skippedTests:
            - TVNavigationTests
            - TVMeridianNavigationTests
            - TVSecondaryNavigationTests
            - TVPlaybackNavigationTests
            - TVLiveNavigationTests
            - TVDvrNavigationTests
            - TVRemoteManagementNavigationTests
            - TVSharedPlaybackNavigationTests
            - TVHomeNavigationTests
            - TVConnectionNavigationTests

  plurx-iOS-library-ui:
    build:
      targets:
        plurx-iOS: all
        plurx-iOSUITests: [test]
    test:
      targets:
        - plurx-iOSUITests
