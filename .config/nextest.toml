# cargo-nextest settings for the PR-time Rust unit stage
# (.github/workflows/rust-units.yml; docs/ci/RUST-UNIT-FANOUT.md). A local
# `cargo nextest run --profile ci` behaves the same; plain `cargo test` and
# `make unit` ignore this file. It is an input of every crate's content key.
nextest-version = { required = "0.9.151" }

[profile.ci]
fail-fast = false
retries = 0
# One status line per test: the receipts' PASS evidence is read from these.
status-level = "pass"
final-status-level = "fail"
failure-output = "immediate-final"
success-output = "never"
# `make unit` has no per-test limit; this only stops a hung test from eating
# the shard's job budget. Twenty minutes is far past every measured test.
slow-timeout = { period = "300s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"
