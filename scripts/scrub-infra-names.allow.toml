# Intentional exceptions to scripts/scrub-infra-names.
#
# Every entry is a real infrastructure name the public mirror still carries,
# so keep this list short and give each one the reason it cannot be
# rewritten. `path` is a glob over repository-relative paths (fnmatch: `*`
# also crosses `/`). `rules` limits the exemption to the named rules (host,
# forge, lan, home, ssh-user, retired-name); without it the file is skipped
# entirely. tests/operations/test_infra_names.py fails on an entry that no
# longer matches a tracked file.
#
# Release inputs (clients/apple/Sources, clients/android/app/src/main) are
# never rewritten by --write. If one ever carries a real name, fix it in the
# next deliberate client change, or list it here with the reason
# "release input; rides next client build" until then. None does today.

[[allow]]
path = "scripts/scrub-infra-names"
reason = "the mapping table itself"

[[allow]]
path = "README.md"
rules = ["retired-name"]
reason = "the trademark reservation names the retired mark on purpose"

