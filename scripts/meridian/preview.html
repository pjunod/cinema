<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridian M0 design prototype</title>
<style>
.art-extreme .hero-art:before,.art-extreme .hero-art:after{display:none}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button,a,input,select{touch-action:manipulation}
button{border:0;background:var(--panel2);color:var(--text);border-radius:24px;padding:10px 18px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.focus{outline:3px solid var(--focus-ring);outline-offset:3px;box-shadow:0 0 0 3px var(--focus-gap)}
button svg,nav svg,.search svg{width:22px;height:22px;flex-shrink:0}
.muted,small{color:var(--muted)}
.primary{background:var(--action-bg);color:var(--action-ink);font-weight:700}
.selected{background:var(--selected-bg);color:var(--selected-ink)}
.evidence{padding:7px 24px;position:relative;z-index:10;background:var(--panel2);font-size:11px;font-weight:600;letter-spacing:.05em}
.shell{--nav:232px;padding-left:var(--nav);min-height:calc(100vh - 30px)}
.brand{font-size:24px;letter-spacing:-1px;font-weight:750;display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.sidebar{width:var(--nav);position:fixed;top:30px;bottom:0;left:0;padding:24px 16px;background:var(--panel);display:flex;flex-direction:column;gap:26px;z-index:4}
.sidebar .brand{padding:0 14px}
nav{display:flex;flex-direction:column;gap:6px}
nav a{display:flex;align-items:center;gap:14px;min-height:46px;padding:10px 16px;border-radius:26px;font-weight:550}
nav a .text{flex:1}
.navcaption{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:0 16px;margin-bottom:6px}
.rule{height:1px;background:color-mix(in srgb,var(--muted) 24%,transparent);margin:14px 16px}
.sidebar .lower{margin-top:auto}
.account{width:100%;justify-content:flex-start;background:transparent;padding-left:15px}
.avatar{background:var(--selected-bg);color:var(--selected-ink);font-weight:700;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0}
.topbar{height:64px;padding:10px 40px;display:flex;align-items:center;gap:16px;border-bottom:1px solid color-mix(in srgb,var(--muted) 15%,transparent);background:var(--bg)}
.search{background:var(--panel);border-radius:28px;height:42px;padding:8px 16px;display:flex;gap:12px;align-items:center;width:min(460px,50%);color:var(--muted)}
.search input{width:100%;background:none;border:0;color:var(--text);outline:0}
.search input::placeholder{color:var(--muted)}
.topbar .spacer{flex:1}
.topbar .brand{display:none}
.quiet{background:transparent}
.account-mobile{display:none}
.content{padding:28px 40px 50px}
.heading{display:flex;align-items:center;justify-content:space-between}
.heading h1{font-size:25px;margin:0 0 20px;font-weight:650}
.heading small{font-size:12px}
.hero{height:375px;position:relative;overflow:hidden;border-radius:18px;background:var(--bg)}
.hero-art{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 79% 15%,#dfb270 0,transparent 24%),linear-gradient(145deg,#345565,#1b3b4a 48%,#163342 60%,#b78761);isolation:isolate}
.hero-art:before{content:"";position:absolute;inset:20% -10% -20% 30%;background:linear-gradient(135deg,#10212d,#597a80);clip-path:polygon(0 100%,20% 29%,29% 51%,48% 0,70% 48%,90% 20%,100% 100%)}
.hero-art:after{content:"";position:absolute;inset:55% -5% 0 20%;background:linear-gradient(160deg,#1a343b,#5b7f82 50%,#111f28);clip-path:polygon(0 100%,10% 55%,30% 65%,50% 0,67% 45%,90% 35%,100% 100%)}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--hero-scrim) 96%,transparent) 0%,color-mix(in srgb,var(--hero-scrim) 94%,transparent) 55%,transparent 92%)}
.hero-copy{position:relative;max-width:55%;padding:34px 32px;color:var(--hero-ink)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.19em;margin:0 0 10px;color:var(--muted);font-weight:700}
.hero h2{font-size:48px;line-height:1.06;letter-spacing:-1.5px;max-width:450px;margin:0 0 16px;font-weight:650}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:13px}
.tag{border:1px solid currentColor;border-radius:4px;font-size:10px;padding:1px 4px}
.synopsis{font-size:14px;line-height:1.6;max-width:430px;color:var(--muted);margin:14px 0 20px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-art-label{position:absolute;right:24px;bottom:15px;font-size:10px;background:var(--panel);color:var(--muted);border-radius:4px;padding:3px 7px;z-index:1}
.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}
.sectiontitle h2{font-size:19px;font-weight:650;margin:0}
.sectiontitle a{font-size:13px;color:var(--muted)}
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.card{min-width:0;display:block;border-radius:9px;outline-offset:5px}
.art{aspect-ratio:1.78;position:relative;overflow:hidden;border-radius:9px;background:var(--art);isolation:isolate}
.art:before{content:"";position:absolute;width:130%;height:100%;left:-15%;top:40%;background:linear-gradient(150deg,#102332 15%,transparent);transform:rotate(-12deg)}
.art:after{content:"";position:absolute;border:1px solid #d4b999;width:50%;height:150%;right:10%;top:30%;transform:rotate(30deg);border-radius:50%}
.art b{position:absolute;bottom:18%;left:8%;right:8%;color:#fff;font-size:18px;line-height:1;letter-spacing:.12em;z-index:1;text-shadow:0 2px 5px #000}
.progress{height:4px;background:var(--panel2);margin-top:-4px;position:relative;z-index:2}
.progress span{display:block;height:100%;background:var(--accent)}
.card-title{font-size:14px;margin:9px 0 1px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{font-size:12px}
.poster .art{aspect-ratio:2/3}
.poster .art b{font-size:23px;line-height:1.2}
.poster .art:after{border-width:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px}
.filters button,.filters select{background:var(--panel);color:var(--text);border:0;border-radius:9px;padding:10px 16px;min-height:44px}
.filters .end{margin-left:auto}
.bottom{display:none}
.mobile-source{display:none}
.detail .hero{height:470px}
.detail .hero-copy{padding-top:60px}
.detail .hero h2{font-size:56px}
.detail-list{background:var(--panel);border-radius:12px;padding:20px;margin-top:24px}
.detail-list h2{margin:0;font-size:18px}
.detail-list p{color:var(--muted);margin:8px 0}
.more-list{max-width:650px;display:grid;gap:10px}
.more-list a{display:flex;gap:15px;align-items:center;background:var(--panel);padding:15px;border-radius:12px;min-height:48px}
.more-list svg{width:22px;height:22px}
.compact .shell{--nav:72px}
.compact .sidebar{padding:24px 10px}
.compact .sidebar .brand{padding:0 10px}
.compact .sidebar .brand span,.compact .sidebar .text,.compact .sidebar .navcaption,.compact .sidebar .rule,.compact .sidebar .avatar+span{display:none}
.compact nav a{padding:12px;justify-content:center}
.compact .account{padding:8px;justify-content:center}
.compact .content{padding-left:30px;padding-right:30px}
.tv{font-size:23px}
.tv .evidence{font-size:16px;padding:10px 60px;height:44px}
.tv .shell{--nav:128px}
.tv .sidebar{top:44px;left:48px;bottom:auto;transform:translateY(-50%);top:50%;width:72px;border-radius:36px;padding:18px 10px;gap:20px}
.tv nav{gap:12px}
.tv nav a{padding:12px;min-height:48px;justify-content:center}
.tv .sidebar .brand,.tv .sidebar .text,.tv .sidebar .navcaption,.tv .sidebar .rule,.tv .sidebar .lower{display:none}
.tv .topbar{height:90px;padding:20px 64px 10px 32px;background:transparent;border:0}
.tv .topbar .search{width:380px}
.tv .topbar button{font-size:20px;min-height:52px}
.tv .content{padding:18px 64px 50px 32px}
.tv .heading h1{font-size:32px;margin-bottom:24px}
.tv .heading small{font-size:18px}
.tv .hero{height:470px;border-radius:20px}
.tv .hero-copy{padding:45px 45px;max-width:55%}
.tv .hero h2{font-size:72px;max-width:620px}
.tv .eyebrow{font-size:16px}
.tv .meta{font-size:20px;gap:18px}
.tv .synopsis{font-size:21px;max-width:560px;margin-top:18px}
.tv .actions button{min-height:56px;font-size:22px;padding:13px 28px}
.tv .sectiontitle{margin-top:30px}
.tv .sectiontitle h2{font-size:28px}
.tv .shelf{gap:24px}
.tv .card-title{font-size:20px}
.tv .card small{font-size:18px}
.tv .art b{font-size:28px}
.tv .hero-art-label{font-size:14px}
.tv .focus{outline-width:4px;outline-offset:4px;box-shadow:0 0 0 4px var(--focus-gap)}
.tv.panel-open .sidebar{z-index:8;left:48px;top:96px;bottom:60px;transform:none;width:330px;border-radius:24px;padding:28px 22px;gap:25px}
.tv.panel-open .sidebar .brand,.tv.panel-open .sidebar .text,.tv.panel-open .sidebar .navcaption,.tv.panel-open .sidebar .rule,.tv.panel-open .sidebar .lower{display:flex}
.tv.panel-open .sidebar .brand{font-size:30px}
.tv.panel-open .sidebar .navcaption{font-size:15px}
.tv.panel-open nav a{justify-content:flex-start;font-size:23px;gap:18px;min-height:58px;padding:12px 20px}
.tv.panel-open nav a svg{width:26px;height:26px}
.tv.panel-open nav{gap:9px}
.tv.panel-open .sidebar .rule{margin:8px 18px}
.panel-shade{display:none}
.tv.panel-open .panel-shade{display:block;position:fixed;z-index:7;inset:44px 0 0;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.tv.panel-open .content{filter:blur(1px)}
.tv .lower button{font-size:21px}
.tv .sidebar .avatar{width:40px;height:40px}

@media(max-width:1099px){body:not(.tv) .shell{--nav:72px}
body:not(.tv) .sidebar{padding:24px 10px}
body:not(.tv) .sidebar .brand{padding:0 10px}
body:not(.tv) .sidebar .brand span,body:not(.tv) .sidebar .text,body:not(.tv) .sidebar .navcaption,body:not(.tv) .sidebar .rule,body:not(.tv) .sidebar .avatar+span{display:none}
body:not(.tv) nav a{padding:12px;justify-content:center}
.topbar{padding-inline:26px}
.content{padding:24px 26px 40px}
.hero{height:360px}
.hero-copy{max-width:64%;padding:28px 24px}
.hero h2{font-size:39px}
.hero-scrim{background:linear-gradient(90deg,color-mix(in srgb,var(--hero-scrim) 96%,transparent) 0%,color-mix(in srgb,var(--hero-scrim) 94%,transparent) 64%,transparent 100%)}
.shelf{grid-template-columns:repeat(4,minmax(0,1fr))}
.shelf>.card:nth-child(n+5){display:none}
}

@media(max-width:599px){html,body{font-size:14px}
.evidence{font-size:9px;padding:7px 16px;letter-spacing:.02em;white-space:normal;overflow:visible}
.shell{padding:0!important}
.sidebar{display:none!important}
.topbar{height:62px;padding:10px 18px;gap:8px}
.topbar>.search,.topbar>.quiet,.topbar>.avatar{display:none}
.topbar .brand{display:flex;font-size:25px}
.topbar .brand img{width:28px;height:28px}
.topbar .account-mobile{display:inline-flex!important;padding:4px;background:none}
.content{padding:20px 18px 100px}
.heading h1{font-size:23px;margin-bottom:17px}
.heading small{font-size:11px;align-self:flex-start;margin-top:6px}
.hero{height:470px;border-radius:16px}
.hero-art{bottom:28%;background-position:center}
.hero-art:before{left:-15%}
.hero-art:after{left:-20%}
.hero-scrim{background:linear-gradient(0deg,color-mix(in srgb,var(--hero-scrim) 100%,transparent) 0%,color-mix(in srgb,var(--hero-scrim) 94%,transparent) 56%,transparent 100%)}
.hero-copy{max-width:none;padding:210px 20px 20px}
.hero h2{font-size:34px;margin-bottom:10px;letter-spacing:-1px}
.eyebrow{font-size:9px;letter-spacing:.13em}
.meta{font-size:11px;gap:9px}
.synopsis{font-size:12px;line-height:1.6;margin:10px 0 14px}
.actions{gap:8px}
.actions button{font-size:12px;padding:10px 14px}
.hero-art-label{top:12px;bottom:auto;right:12px;font-size:8px}
.sectiontitle{margin-top:22px;margin-bottom:12px}
.sectiontitle h2{font-size:18px}
.sectiontitle a{font-size:11px}
.shelf{display:flex;overflow:auto;gap:12px;padding:5px 4px 8px;margin:-5px -4px -8px}
.shelf>.card{display:block!important;min-width:220px}
.poster>.card{min-width:130px}
.art b{font-size:17px}
.card-title{font-size:13px}
.card small{font-size:11px}
.bottom{display:flex;flex-direction:row;position:fixed;z-index:6;bottom:0;left:0;right:0;min-height:76px;padding:9px 12px 20px;background:var(--panel);border-top:1px solid color-mix(in srgb,var(--muted) 20%,transparent);gap:4px}
.bottom a{display:flex;align-items:center;justify-content:center;flex-direction:column;flex:1;padding:5px;gap:2px;font-size:10px;border-radius:13px;min-height:48px}
.bottom svg{width:22px;height:22px}
.mobile-source{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mobile-source button{width:100%;justify-content:space-between}
.filters{gap:8px}
.filters button,.filters select{padding:9px 12px;font-size:12px;min-height:44px}
.filters .end{margin-left:0}
.detail .hero{height:510px}
.detail .hero-copy{padding-top:230px}
.detail .hero h2{font-size:34px}
.detail-list{padding:16px}
.detail-list h2{font-size:17px}
.detail-list p{font-size:12px}
.more-list a{padding:14px}
.more-list a svg{width:21px}
.account-mobile{display:none}
.more-list{gap:8px}
}

</style><body><div class="evidence" id="evidence"></div><div class="panel-shade" aria-hidden="true"></div><div class="shell"><aside class="sidebar" aria-label="Cinema navigation" id="side"></aside><header class="topbar" id="top"></header><main class="content" id="content"></main></div><nav class="bottom" id="bottom" aria-label="Primary navigation"></nav>
<script>
"use strict";
const cfg=JSON.parse(document.getElementById("config").textContent);
const icon=name=>cfg.icons[name]||cfg.icons.folder;
const link=(name,label,cls="")=>`<a href="#${label.toLowerCase().replace(/\s+/g,'-')}" aria-label="${label}" class="${cls}">${icon(name)}<span class="text">${label}</span></a>`;
const brand=`<div class="brand"><img src="cinema-icon.png" alt=""><span>cinema</span></div>`;
document.body.className=[cfg.platform==='tv'?'tv':'',cfg.compact?'compact':'',cfg.panel?'panel-open':'',cfg.route].join(' ');
const active=cfg.route==='library'?'Movies':'Home';
document.getElementById('evidence').textContent=`M0 DESIGN PROTOTYPE · ${cfg.label} · Meridian / ${cfg.themeName} / ${cfg.mode} · synthetic data · not native acceptance`;
document.getElementById('side').innerHTML=brand+`<nav aria-label="Main">${link('home','Home',active==='Home'?'selected':'')}${link('search','Search')}${link('stack','Libraries')}<div class="rule"></div><div class="navcaption">Your libraries</div>${link('film','Movies',active==='Movies'?'selected':cfg.panel?'focus':'')}${link('tv','Shows')}${link('book','Books')}${link('cam','Home videos')}<div class="rule"></div>${link('tv','Live TV')}${link('folder','More')}</nav><div class="lower"><button class="account"><span class="avatar">V</span><span>Viewer</span></button></div>`;
document.getElementById('top').innerHTML=brand+`<button class="quiet collapse" aria-label="Toggle navigation">☰</button><label class="search">${icon('search')}<input aria-label="Search Cinema" placeholder="Search your libraries"></label><span class="spacer"></span><button class="quiet">Appearance</button>${cfg.platform==='desktop'?`<button class="quiet" aria-label="Activity">${icon('act')}</button>`:''}<button class="avatar" aria-label="Account">V</button><button class="account-mobile" aria-label="Account"><span class="avatar">V</span></button>`;
const titles=['The Far Shore','Signal at Dawn','Northbound','Low Orbit','After the Rain','A Place Between'];
const arts=['linear-gradient(150deg,#527986,#153744 50%,#d4a77d)','linear-gradient(130deg,#813c29,#291e36 55%,#c77a45)','linear-gradient(140deg,#b0b7aa,#354e53 58%,#142827)','radial-gradient(circle at 60% 25%,#dc8655,transparent 25%),linear-gradient(130deg,#203044,#070f24)','linear-gradient(130deg,#577860,#172e30 58%,#c2a967)','linear-gradient(130deg,#93727a,#261c3c 60%,#aaa0c0)'];
const card=(i,poster=false)=>`<a class="card" href="#detail-${i}" aria-label="Details for ${titles[i%6]}"><div class="art" style="--art:${arts[i%6]}"><b>${titles[i%6].toUpperCase()}</b></div>${poster?'':`<div class="progress"><span style="width:${[68,32,84,21,51][i%5]}%"></span></div>`}<div class="card-title">${titles[i%6]}</div><small>${poster?'2026 · Movie':i===1?'S1 E4 · 28 min left':'Movie · 42 min left'}</small></a>`;
const shelf=(heading,poster=false)=>`<section><div class="sectiontitle"><h2>${heading}</h2><a href="#library">View all ›</a></div><div class="shelf ${poster?'poster':''}">${Array.from({length:5},(_,i)=>card(i,poster)).join('')}</div></section>`;
const hero=()=>`<section class="hero"><div class="hero-art" aria-hidden="true" ${cfg.extreme?'style="background:'+cfg.extreme+'"':''}></div><div class="hero-scrim"></div><div class="hero-copy"><p class="eyebrow">${cfg.route==='detail'?'Movies · Feature film':'From your library'}</p><h2>The Far Shore</h2><div class="meta"><span>2026</span><span>1h 48m</span><span>Adventure</span><span class="tag">4K</span></div><p class="synopsis">A cartographer returns to a forgotten coast, following a signal that should have faded years ago.</p><div class="actions"><button class="primary ${cfg.platform==='tv'&&!cfg.panel?'focus':''}">▶ Resume</button><button>${cfg.route==='detail'?'✓ Watchlist':'Details'}</button></div></div><span class="hero-art-label">Synthetic artwork</span></section>`;
const heading=(t,sub)=>`<div class="heading"><h1>${t}</h1><small class="muted">${sub}</small></div>`;
let content='';
if(cfg.route==='library')content=heading('Movies','6 fixture titles')+`<div class="mobile-source"><button>Movies ${icon('folder')}⌄</button></div><div class="filters"><select aria-label="Sort"><option>Recently added</option></select><select aria-label="Watch status"><option>All titles</option></select><button>Filters</button><button class="end selected">Grid</button><button>Rows</button></div><div class="shelf poster">${Array.from({length:6},(_,i)=>card(i,true)).join('')}</div>`;
else if(cfg.route==='detail')content=heading('Movies','Cinema library')+hero()+`<section class="detail-list"><h2>Versions & details</h2><p>4K · Original version · English audio · Subtitles available</p><div class="actions"><button>Choose version</button><button>Audio & subtitles</button><button>More actions</button></div></section>`;
else if(cfg.route==='more')content=heading('More','Your Cinema')+`<div class="more-list">${[['folder','Shared libraries'],['tv','Live TV'],['cam','Recordings'],['tv','Library channels'],['folder','Downloads'],['act','Recording activity'],['gear','Settings & account'],['tv','Remotes'],['book','Help']].map(x=>link(...x)).join('')}</div>`;
else content=heading('Home','Your next great watch')+hero()+shelf('Continue watching')+shelf('Recently added',true);
document.getElementById('content').innerHTML=content;
document.getElementById('bottom').innerHTML=link('home','Home',cfg.route==='home'?'selected':'')+link('stack','Libraries',cfg.route==='library'?'selected':'')+link('search','Search')+link('folder','More',cfg.route==='more'?'selected':'');
if(cfg.panel){document.getElementById('content').inert=true;document.getElementById('top').inert=true;}
</script></body></html>
