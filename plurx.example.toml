# plurx configuration — copy to plurx.toml (or /etc/plurx/plurx.toml).
# Every key is optional; these are the defaults. Env vars override the file:
#   PLURX_SERVER_NAME, PLURX_BIND, PLURX_DATA_DIR, PLURX_CACHE_DIR,
#   PLURX_TRANSCODE_DIR, PLURX_CLUSTER_READ_POOL_SIZE,
#   PLURX_SCAN_PRUNE_PERCENT, PLURX_CLUSTER_BOUNDED_REPLICA_READS,
#   PLURX_CLUSTER_BOUNDED_REPLICA_MAX_LAG_ENTRIES, PLURX_CONFIG, PLURX_LOG

[server]
# Human-visible server name.
name = "plurx"
# Address:port the HTTP API binds to.
bind = "0.0.0.0:32400"

[storage]
# Authoritative database, node identity, and compatibility root. Created if
# missing. Empty cache/transcode overrides preserve the legacy child layout.
data_dir = "./data"
# Optional persistent node-local artwork, finished-transcode/offline, and
# subtitle-cache root. Empty keeps them under data_dir. Setting it on an
# existing install migrates nothing: copy <data_dir>/artwork,
# <data_dir>/cache/transcode, and <data_dir>/cache/subs to <cache_dir>/artwork,
# <cache_dir>/transcode, and <cache_dir>/subs yourself (docs/OPERATIONS.md).
cache_dir = ""
# Optional disposable live-session scratch, which must sit outside data_dir;
# naming <data_dir>/transcode here is refused. Empty uses <data_dir>/transcode.
# An explicit root is claimed only when empty and carries an ownership marker
# naming the durable root; startup refuses a populated unowned directory rather
# than clearing it. The root must be owned by the daemon uid; a group- or
# world-writable daemon-owned root is repaired to 0700 with a warning.
transcode_dir = ""
# A complete scan may remove at most this percentage of known files. Set 0 to
# require manual cleanup; values above 100 are rejected.
scan_prune_percent = 10

# [cluster]
# M2 uses both ports for the one-voter store but pins their listener hosts to
# loopback, regardless of the addresses below. M3 membership will make the
# hosts reachable and use the remaining peer/join settings.
# raft_bind = "0.0.0.0:32401"
# api_bind = "0.0.0.0:32402"
# Reserved for M3 membership:
# advertise_host = ""
# join_token_file = ""
# trusted_network = ""
# Opt in cluster-wide only after every voter advertises the same bounded-read
# protocol. False is the immediate Authority-read kill switch.
# bounded_replica_reads = false
# Fresh local reads also require commit-to-apply lag at or below this value.
# Range: 0..10000 entries. Keep identical on every voter.
# bounded_replica_max_lag_entries = 64
# Local replicated read-only connection pool; accepted range is 1 through 16.
# Keep 4 unless a retained 4/8/16 workload comparison proves another value.
# read_pool_size = 4
# Snapshot transfer/install deadline in seconds; accepted range is 10 through
# 3600. The 120-second default covers production-sized state snapshots on a
# healthy LAN without retrying from zero at the former 10-second boundary.
# install_snapshot_timeout_secs = 120
