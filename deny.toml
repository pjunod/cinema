# Dependency policy for plurx. Enforced by `make license-check`, which runs
# both `cargo deny check bans` and `cargo deny check licenses`. A dependency
# whose license is not on the list or whose native TLS stack is forbidden fails
# the check instead of arriving unannounced.
#
# plurx is Apache-2.0. The allow-list is every permissive license already in
# the resolved graph and nothing else. Copyleft is absent on purpose and is
# not listed -- adding one here is a licensing decision, not a build fix, so
# it belongs in a commit that says so.

[licenses]
# Every identifier below is present in the current graph. Keep them sorted
# and do not add one speculatively; an allow-list that permits more than the
# build actually uses stops being evidence of anything.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# LGPL-2.1-or-later is deliberately absent. `r-efi` offers
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later`; leaving LGPL off this list makes
# cargo-deny satisfy the disjunction with MIT rather than silently accepting
# the copyleft arm -- and makes a future LGPL-only dependency fail loudly.

# A crate whose SPDX expression is ambiguous needs a stronger textual match
# before its license is believed.
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"   # ecosystem lag is allowed; named native stacks are not
deny = [
    # This obsolete copy existed only below the cryptr/S3 edge, which is now
    # gated behind hiqlite's own backup/s3 features and, when those are
    # enabled, resolves through vendor/s3-simple instead. Pin the version:
    # aws-lc-sys 0.43 remains until the provider decision has evidence. This
    # ban only ever sees the workspace graph, so the fork's optional graph is
    # held to the same list by tests/operations/test_hiqlite_patch_ledger.py.
    { crate = "aws-lc-sys:=0.39.1", reason = "obsolete duplicate below the disabled cryptr/S3 edge" },
    # A second native TLS implementation is a security and build-policy
    # decision, never an incidental transitive dependency.
    { crate = "native-tls", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[advisories]
# Security advisories are the RustSec job, run separately. This file is
# licenses only, so an advisory must not make `check licenses` fail.
yanked = "allow"

[sources]
unknown-registry = "deny"     # a crate from an unvetted registry has unvetted terms
unknown-git = "deny"
