# --- lab6, lab3, lab4: Incus guest hosts, production plurx voters -------------
[[runners]]
name = "gha-lab6-general-02"
host = "lab6"
os = "Linux"
arch = "X64"
# General work in the existing 8 GiB guest with a 6 GiB / two CPU default.
labels = ["lab", "incus", "ubuntu-24.04", "general"]

# lab3 runners are retired (2026-10-11): observability and production share
# its disk. boot.autostart=false and no recovery allowlist entry keep them off.

# The former lab6 general and lab4 guests are retired; recovery must not
# recreate the obsolete FFmpeg capability. The second lab6 guest serves general jobs.

# --- media1: baremetal, production plurx voter -------------------------------
[[runners]]
name = "gha-media1-general-01"
host = "media1"
os = "Linux"
arch = "X64"
# Dedicated full unit capacity: one 16 GiB resident / 18 GiB combined job.
# Retain the former 12g capability for existing consumers.
# Keep the sole selector available after qualification; general jobs use the
# other registrations. This grants no heavy replicated-cluster eligibility.
labels = ["lab", "unit-memory-12g", "unit-memory-16g", "baremetal", "ubuntu-26.04"]

[[runners]]
name = "gha-media1-general-02"
host = "media1"
os = "Linux"
arch = "X64"
labels = ["lab", "general", "high-cpu", "baremetal", "ubuntu-26.04"]

[[runners]]
name = "gha-media1-general-03"
host = "media1"
os = "Linux"
arch = "X64"
labels = ["lab", "general", "high-cpu", "baremetal", "ubuntu-26.04"]

[[runners]]
name = "gha-media1-general-04"
host = "media1"
os = "Linux"
arch = "X64"
labels = ["lab", "general", "high-cpu", "baremetal", "ubuntu-26.04"]

# --- maca / macb: laptops, non-voters -----------------------------------------
# Apple CI uses the M4 Air (`maca`) as primary and the M3 Max Pro (`macb`)
# as standby; deploy/apple-runner controls eligibility during outages. The two
# ARM package registrations use Lima guests registered by hand.
# Their Forgejo roles are separate: `maca` serves release-arm64 only; `macb`
# supplies ci-arm64. The release guest has no qualified CI fallback role.
[[runners]]
name = "gha-maca-apple-01"
host = "maca"
os = "macOS"
arch = "ARM64"
labels = ["lab", "apple", "xcode-27", "primary", "xcode-27.2"]

[[runners]]
name = "gha-macb-apple-01"
host = "macb"
os = "macOS"
arch = "ARM64"
labels = ["lab", "apple", "xcode-27", "backup", "xcode-27.2"]

# Repository-scoped Forgejo signing registration, provisioned 2026-11-03.
# The signing user's separate LaunchAgent and private config are documented
# in docs/PUBLISHING.md. Capacity one; no general Apple CI eligibility.
[[runners]]
name = "gha-macb-mobile-signing-01"
host = "macb"
os = "macOS"
arch = "ARM64"
labels = ["mobile-release"]

# The existing Forgejo registration is release-only: the release image's
# arm64 leg builds natively instead of under QEMU on X64. Do not add ci-arm64
# or backup eligibility without separately qualifying that workload here.
[[runners]]
name = "gha-maca-linux-arm-01"
host = "maca"
os = "Linux"
arch = "ARM64"
labels = ["lab", "ubuntu-26.04", "release-arm64"]

# Capacity-one native CI guest on the release runner's physical host.
[[runners]]
name = "gha-maca-linux-arm-02"
host = "maca"
os = "Linux"
arch = "ARM64"
labels = ["lab", "ubuntu-26.04", "ci-arm64"]

# Native Linux Rust compiler on the M3 Max. Forgejo run #6624 passed the
# all-target check and vendored Hiqlite Clippy in the Ubuntu 24.04 job image.
# Capacity one, with an eight-CPU and 16 GiB job limit.
[[runners]]
name = "gha-macb-linux-rust-01"
host = "macb"
os = "Linux"
arch = "ARM64"
labels = ["lab", "ubuntu-26.04", "high-cpu"]
