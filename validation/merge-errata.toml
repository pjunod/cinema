# The merge-trailer audit's boundary, and its permanent errata.
#
# `enforce_after` is the boundary commit of §3.1 of
# docs/ci/LEDGER-TEXT-CONTRACTS-AND-RELEASE-TAGS.md. While it is unset the
# repository is in phase A: every commit is judged by the legacy corrective
# rule, `validation/regressions.d/` still accepts new fragments, and the
# merge-trailer audit reports nothing. Setting it starts phase B for every
# landing commit past it — those commits are judged by `CORRECTIVE_RE` and
# carry their evidence as a `Regression-Test: <path>::<name>` trailer — and
# phase C for everything at or before it, which keeps the rule and the
# fragments it was written under, forever.
#
# It is set to 8251d14f7, the tip of `main` when phase B was switched on
# (2026-09-25, Paul's approval). It must be no earlier than the merge that
# introduced this audit -- an earlier boundary would demand trailers on
# landing commits made before the trailer existed and that nobody can amend --
# and, for the same reason, no earlier than the last landing commit made while
# phase A was still in force. The plan named the audit's own landing commit
# (995b60f3e, #489), but phase A ran on `main` for fifteen landing commits
# after it, and in that time corrective commits landed without lines and new
# fragments were written for commits past 995b60f3e, both correct under the
# rules then in force. A boundary there gave 62 errors on `main`: 34 fragment
# mappings the freeze refuses, which no erratum can excuse and which the plan
# forbids deleting, and 28 corrective commits that would each need a
# permanent erratum. Everything at or before 8251d14f7 is phase C.
#
# Starting phase B is one change of two lines: set `enforce_after` here, and
# remove `continue-on-error: true` from the fast lane's "Check the pull
# request's Regression-Test fields" step. tests/validation/
# test_regression_field.py refuses either without the other.
#
# `[[errata]]` rows are permanent. A landing commit cannot be amended, so a
# `Regression-Test:` line that reaches `main` wrong (or missing) stays that
# way; a row naming that landing commit is the only way to record it and move
# on. A row may also name a corrective commit past the boundary that reached
# `main` without a landing commit at all. A row that names no commit past the
# boundary is an error. Expect this list to stay empty. If it does not, the
# pre-merge check in `validation/regression_field.py` is not doing its job and
# that, not the typo, is the thing to fix.

version = 1

enforce_after = "8251d14f75a54e9e84fec890cb8e3afadaad064b"

errata = []
