reason = "PR #512 landed corrective commit 1831ee898 (refuse empty caption audit results) without a Regression-Test trailer in its immutable merge message. The existing regression is tests/operations/test_live_tv_caption_audit.py::test_audit_requires_one_completed_test; fast lane #2976 passed on the reviewed head. PR #516 records this omission after fast lane #3000 found it. Future landing messages must carry the checked trailer."

