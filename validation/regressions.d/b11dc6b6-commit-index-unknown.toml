client to answer by dropping its echo. \
http::tests::commit_index_header_offers_the_acknowledged_position_or_unknown \
drives the production http_store_attribution middleware over a handler that \
records two indexed writes (header 45), one indexed and one unindexed write \
(header unknown) and no write (no header); with offer's unknown arm reverted \
to None it gets no header where it requires unknown. \
http::extract::tests::read_after_accepts_exactly_one_positive_decimal_index \
adds unknown to the values that parse as no fence, so a client that echoes \
the invalidation verbatim still reaches Authority. The revert was run on nuc3 \
(exit 101) and passes with the fix restored.
