reason = "Recorded against d90ca299, the squash merge that brought PR #873 onto the effort branch; the per-milestone commits no longer exist as separate SHAs. M2 — the attempt history: A backend-neutral Store contract drives one job through five charged attempts — four failures and a lease the claim sweep reclaims — with an uncharged yield in the middle, and asserts that attempt_errors lists exactly the five in order while last_error_code stays attempt_limit and the yield left no entry. It then asserts the two halves of the reset rule: an ordinary re-enqueue of an exhausted row keeps its history, and a row the sweep expires reopens with both the budget and the history empty, with queue_expired itself appending nothing. The same scenario reads the history back through analysis_history, which is the page the Analysis view renders. A replicated contract test rewinds a cluster to v25, opens it, and asserts the column arrives, that a row predating it reads an empty history rather than NULL, and that a second open is a no-op rather than a duplicate-column failure. The schema parity test now executes the component rebuild and the new column on both backends and compares objects and columns. A web test asserts the row renders every charged code and renders no list when nothing was charged. Reverting any writer drops its code from the contract's expected list; reverting the reset drops the empty-history assertion; reverting the probe count makes a fresh replicated cluster skip the step, which the v26 contract catches. M3 — the queue verdict: Unit tests drive the verdict rule directly, including a replay of the fleet numbers that produced it (396 jobs picked up, 1118 waiting, 0 ready in 24 h classifies dead) and the cases most likely to become false alarms: nothing waiting and nothing built is idle rather than dead; a fresh daemon with a hard failure in the last day is healthy rather than degraded, because both sides of that ratio are now the same 24-hour window over the same table; one sample with a row past its lease is healthy while two consecutive samples are degraded; and both dead floors are pinned either side of their boundary. A backlog nobody claimed is dead rather than idle, which is the exact silence the milestone exists to break. the_prometheus_snapshot_answers_what_the_queue_verdict_asks drives one job through queued, claimed, past-lease and ready on both backends and reads every figure off the snapshot, so the SQL is covered rather than only the arithmetic over it; it also pins that a job inside its retry wait is not claimable and that both 24-hour figures expire together. An exposition test renders the gauge block, which no test entered before because both callers passed queue_health: None, and asserts the family is absent rather than zero before the first sample. Web tests assert each verdict renders a distinct sentence, that the two halves of dead read differently, and that no verdict sentence says 'this node' — the jobs table is replicated and records no observer. prometheus_scrape_has_no_store_operation still passes, which is what keeps the sampling in the metrics loop rather than the scrape. Removing the idle case makes an unindexed fleet alarm every night; removing the claimable count restores the silence a wedged queue used to enjoy; removing the shared window returns a degraded verdict on every daemon restart; removing the per-process baseline makes a queue that built nothing for three days read as healthy off cumulative counters. M4 — bulk reopen: seeded_write_surface drives POST /api/v1/analysis/reopen end to end and asserts the property the endpoint exists for and the one that makes it safe: a terminal row whose successor is still queued is NOT reopenable, retiring that successor makes it reopenable, a dry run creates nothing and returns the same answer twice, a commit creates a successor that is queued while its tombstone stays terminal, and a second press reopens nothing. Without that last assertion the endpoint re-forces every already-repaired file on every press, which is a full fragment-index and marker rebuild of a library that is already indexed. It also covers the auth gate, both ends of the file-limit range, an invalid component, deny_unknown_fields, and a component filter that matches nothing returning nothing rather than whatever sorted first. The reopenable predicate itself lives in the store as reopenable_analysis_requests on both backends, so the successor rule is one statement rather than a filter the HTTP layer reconstructs. Removing the successor predicate turns the button into a library-wide re-force; removing the headroom check lets one bulk reopen fill the 4,096-row active-request ceiling and start refusing discovery, playback's foreground enqueue and the single-row Retry; removing the paused-queue refusal piles up work nothing will claim. M5.1 — settle by hydration: a_hydrated_job_settles_from_another_nodes_artifact_through_dyn_store drives the whole shape on both backends: two voters each hold a targeted job for one cache_key, the first builds and publishes, the second settles from that artifact without building, its job reaches ready, both nodes end up holding a location, and — the assertion that matters most — the stored artifact still names the node that actually built it. Relabelling a hydrated artifact to satisfy complete_cluster_fragment_index's builder check would have appeared to work, because the artifact insert is ON CONFLICT DO NOTHING, so this test is what stops a later simplification from doing exactly that. hydration_refuses_a_stale_claim_and_a_mismatched_blob pins that hydration is still a claimed write: with nothing published it settles nothing AND publishes no artifact of its own, and a stale fence settles nothing once the artifact is real. every_sqlite_transaction_site_is_classified and every_sqlite_transaction_is_named_once cover the new transaction boundary itself. Removing the hydration path returns the fleet to one full bitstream pass per voter per file for a single artifact; removing the artifact-exists requirement lets a node settle a job from bytes nobody published; removing the job_terminal mapping restores an uncharged infinite retry at two claims per tick per node against a job that is terminal forever, which is the loop that would have made M5.2 undeployable."
