reason = "C-04 M1, the bounded admission to the cluster revocation fence. Before this commit `try_acquire_revocation_operation` was a fail-fast `try_lock`, so a second concurrent sign-out on a cluster received 503 `admin_revocation_propagation_failed` and cleared a bearer the server still honoured; the `try_lock` was there because an unbounded queue of coordinators, each holding a replicated claim and a fanout, is worse than a 503. This replaces it with a bounded queue - eight waiters behind one active operation, a 2.5 second admission wait chosen to sit under the web client's 5 second logout abort - and four fixed-cardinality outcomes on `plurx_auth_revocations_total`. Begin, finish, `arm_ambiguity`, guard drop, `StableBeginRoster` and every fence timing constant are unchanged. `http::extract::tests::cache_admin_revocation_operation_queue_is_bounded_and_raii_released` pins the admission itself: the queue is exhausted at its stated depth, the caller past it is refused rather than parked, every queued caller that waits out the window is refused with the admission-timeout reason rather than the queue-full one, and dropping the active guard readmits - so a cancelled coordinator releases the gate instead of wedging the process. `http::internal_auth_revocation::tests::automatic_activation_checks_the_permanent_marker_before_taking_the_gate` and `replicated_membership_exclusion_spans_final_roster_read_and_peer_end` pin that admission still precedes any replicated claim and that the exclusion still spans the final roster read and the peer End, so a refused waiter cannot have created a claim. `http::tests::two_concurrent_logouts_queue_behind_one_operation_and_both_succeed` and `http::tests::a_logout_that_waits_out_the_admission_window_is_refused_and_changes_nothing`, added later on this branch under review #3378, are the end-to-end half: with the active slot held, two sign-outs queue and both succeed with both rows deleted, and one that waits out the window is refused having deleted nothing and armed nothing. On revert to `try_lock`, both of those fail - the first because the queued sign-out is refused instead of queuing, the second because the refusal arrives immediately instead of after the admission window - which is exactly the 503-on-contention behaviour this commit removes."
