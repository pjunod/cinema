reason = "The Linux transport-recovery qualification launches separate-process TLS clusters and requires twenty voter plus twenty learner snapshot recoveries on the exact candidate SHA; its explicit voter-only smoke command can establish a smaller pre-promotion confidence sample without weakening that retained artifact. The one absolute recovery window begins before the target is killed and snapshot creation starts, while its wall-clock handoff is monotonic-bounded and supervises early writer exit. Source attempt/retry counts advance only for work OpenRaft actually issues, including across a reconnect that changes the displayed phase. Its receipt feeds one immutable read of the retained bytes through the Rust closed-schema and semantic validator resolved from the active Cargo target directory before binding their digest, image identity, acknowledged writes, bounded duration, attempt chronology, and stable resource counts; static operations contracts pin the command, same-workflow first-attempt receipt policy, and promotion integration."
