reason = "The web player was the last shipped client not sending its capability document on session create, so every web create landed on `legacy_trusted_review` — the server trusting the body's echo of its own earlier `/decision` answer, with no document to check it against. `05ef1fbc` sends the document. `28ba5fed` sends the other half of the same question: `/decision` is asked with the quality menu's force on the query string, and a create that hands the server the document but not the force is re-derived under `Force::Auto`, which is a different question and answers worse in two real cases. `Quality → Original` on a title above the browser's HEVC ceiling: `Force::Original` never consults `video_ok`, `Force::Auto` does, derives a transcode, and `preserve_dolby_vision = preserve && method != Transcode` therefore lands false — so the viewer who explicitly asked for the untouched original gets Dolby Vision stripped, and the server logs a `plan_mismatch` against its own player, pinning the counter that exists to detect a client whose caps and player have drifted apart. The same happens wherever a learned decode limit applies, which Original is documented in the player as the explicit bypass for. `openSession` now sends `overrides.force` from the same `qualityForce()` the decision uses, only when it is not `auto`. The document is bounded on both axes now that every seek carries it, and the create route inherits the 64 KiB body limit `/files/{id}/decision` has carried since it started walking the same document. The tests in `tests/playback/web-policy.test.js` run the shipped `openSession` and `askDecision` through one set of fakes and compare the two bodies, so a build where the helper is dead fails rather than matching on source text; `make web-check` runs them under `web-static`."
