reason = "Two commits on one correction, both in `crates/plurx-core/src/cluster/membership.rs`, with their evidence beside them. Activation asked only whether every node had proven `learner_protocol_v5` with its current heartbeat, and that rule is a staleness rule rather than a liveness one: a node that proved the capability and then died freezes its capability row and its `last_seen_at` together, so the equality still holds and it reads as proven forever, while a node between redeeming its join token and its first heartbeat has no capability row at all and the roster is deliberately blind to it. Two further refusals now ride in the committing statement as well as in the read that names nodes — `learner_protocol_node_absent` and `join_in_flight` — and `aef85352` gives the second one its exits, checking absence first so an abandoned redemption is told to start or remove rather than to wait. Deactivation was corrected in the same direction: `redeem` commits the `role = 'learner'` row before the joiner joins Raft at all, so an aborted admission pinned the cluster on protocol 5 permanently, and a stale join-staging marker now excludes it. The SQL predicates are exercised directly against rusqlite fixtures by `a_node_that_proved_the_protocol_and_then_stopped_blocks_activation`, `a_join_in_flight_blocks_activation_without_making_the_pending_roster_lie`, `an_abandoned_join_stops_holding_activation`, `an_abandoned_learner_redemption_stops_blocking_rollback_once_it_is_stale`, `a_learner_that_finished_joining_blocks_rollback_however_stale_it_is` and `a_removed_node_is_not_an_absent_one`, each of which fails when its predicate is reverted; `cluster-auth` runs the same activation path against real separate processes."
