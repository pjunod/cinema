[[coverage]]
commits = ["37eea5a3"]
points = ["playback.pipeline"]
checks = ["rust-gate", "rust-gate-ci"]
reason = "M5a shipped `media_session_producer_recovery` keyed by `(user_id, playback_id, recovery_epoch)` and nothing in the system carried an epoch, so the automatic decoder-recovery budget had a key nobody could present and no daemon code could call it. This commit adds `media_sessions.recovery_epoch` and the mint-or-inherit rule that fills it, and every regression here rejects a way one logical playback could be granted more than the one automatic recovery the ledger exists to allow. `a_recovery_epoch_is_written_once_and_inherited_by_a_successor` (plurx-core `store_contract`, run through `dyn Store` on every backend) fails on the previous behaviour three ways: an activation replay identical but for the epoch is accepted and the row keeps its original, a replay that also changes a field the conflict arm can write is refused whole so no second epoch arrives alongside an ordinary refresh, and a staged successor reads its predecessor's epoch from the predecessor's own row rather than being handed one. It also asserts that an empty epoch is refused by the ledger, which is the whole safety of the column's `NOT NULL DEFAULT ''`. `a_new_play_mints_a_budget_and_every_continuation_inherits_one` (plurxd `http::hls`) rejects minting on a continuation, which is the failure the budget was built to stop: a viewer whose file cannot be decoded would otherwise get a fresh automatic retry after every reopen, seek and track change, forever. The reaped-pointer case, where maintenance deletes the playback pointer mid-watch and a reopen mints a second budget, is measured and recorded as owed in the status document rather than claimed as covered."
