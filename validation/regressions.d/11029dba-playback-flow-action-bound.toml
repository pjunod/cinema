reason = "An actor-authorized SIGSTOP or SIGCONT that never came back had no settlement: the desire stayed outstanding, every later flow evaluation coalesced behind a signal that no longer existed, and nothing woke to notice. PendingProducerAction bounds exactly one such transaction as a lifecycle bound rather than a second progress verdict — only an actor-issued signal arms it, and expiry records the bounded failure without changing a decision that already exists. Five regressions pin it: an unacknowledged hold becomes flow_stop_deadline and fences the signal token so a late acknowledgement cannot revive the producer; resume is distinguishable from hold; an acknowledged signal leaves no deadline behind; a lapsed action whose attempt no longer matches is observation-only and a successor does not inherit a fenced token; and next_deadline accounts for the outstanding action, without which the actor would never wake to fire it."
