reason = "The change and its evidence landed together. The CPU zscale chain in `crates/plurx-core/src/transcode/mod.rs` passed `tonemap=hable` no `peak` at all and converted primaries after tone mapping, so every HDR source was mapped against the linearization default no matter what luminance the file declared. `the_cpu_tone_map_names_peak_provenance_in_its_recipe` landed in the same commit and pins all three provenances the new `video_filters` derives — `peak=40` from MaxCLL, `peak=20` from the mastering display, `peak=10` when the file declares neither and the 1,000-nit value is policy — together with the `zscale=p=bt709,tonemap=` ordering, the `dither=error_diffusion` output stage, and the `default`/`cll`/`mdcv` names `TranscodeMediaOptions` carries into the plan. It is a `plurx-core` lib test, so dropping the peak argument or restoring the old stage order makes it fail under `unit-core` as well as under the workspace `cargo test` in `rust-gate` and `rust-gate-ci`. Two integration tests from the same commit hold the luminance that filter reads: `source_luminance_binds_into_the_facts_digest` in `crates/plurx-core/tests/decoder_selection.rs` requires two sources differing only in MaxCLL to answer different facts digests and requires catalog luminance to fill a selective probe's omission, and `luminance_round_trips_and_backfill_updates_are_exactly_fenced` in `crates/plurx-core/tests/store_contract.rs` requires `files_missing_luminance` and `set_file_luminance` to round-trip MaxCLL, MaxFALL, mastering peak and provenance on both backends and to answer false for a repeated update against a classified row. Both run in the workspace `cargo test` that `rust-gate` and `rust-gate-ci` execute; `unit-core` is `--lib` only and does not reach them."
