reason = "The bounded producer-decision vocabulary is a client contract: its strings appear in `delivery.producer_decision`, in `ControlAction::Terminal.code` and in `ControlAction::RetryResource.reason`, and `is_permanent` is what turns one into a terminal answer rather than a retry. This commit adds `source_decode_retry` beside `source_decode_failed`, and the pair is the one in this vocabulary most likely to be got backwards, because they describe the identical finding and differ only in whether the node has a software-decode alternate to install. Getting it backwards is not a cosmetic error in either direction: a permanent reason on a retry reaches a viewer as terminal while the successor is still coming up, so the client tears down a recovery that was about to work, and an impermanent reason on the failing branch tells a client to reopen against a source that will never decode, which is precisely the loop this effort exists to end. `only_a_verdict_about_the_source_itself_is_permanent` (plurxd `playback_control`) rejects both directions by asserting the permanent set over the whole of `ALL` rather than by spot-checking, so a new variant placed on the wrong side fails it whichever side that is, and it asserts the count separately so a variant added without a decision about its permanence cannot pass by resembling one that was decided. `every_decision_reason_round_trips_its_wire_name` rejects a status string that does not round-trip through `from_status`, which is what a relayed response from another node is validated against — an unrecognised decision makes the whole relayed control response unbelievable, so a spelling that does not round-trip degrades a cluster rather than one session. The same commit re-cuts the four M6 client documents, whose Part II states the vocabulary and its permanence split verbatim for three client teams building against it in parallel."
