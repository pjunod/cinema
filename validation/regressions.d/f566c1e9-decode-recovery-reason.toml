reason = "The bounded producer-decision vocabulary is a client contract: its strings appear in `delivery.producer_decision`, in `ControlAction::Terminal.code` and in `ControlAction::RetryResource.reason`, and `is_permanent` is what turns one into a terminal answer rather than a retry. This commit adds `source_decode_retry` beside `source_decode_failed`, and the pair is the one in this vocabulary most likely to be got backwards, because they describe the identical finding and differ only in whether the node holds a software-decode alternate to install. Getting it backwards is not cosmetic in either direction. `only_a_verdict_about_the_source_itself_is_permanent` (plurxd `playback_control`) rejects the placement directly: it computes the expected answer over the whole of `ALL` rather than spot-checking, so a variant on the wrong side fails the per-variant assertion whichever side that is, and it asserts the size of the permanent set separately so a fourth permanent reason cannot arrive unremarked. `a_permanent_decision_ends_the_session_and_a_transient_one_does_not` is the one that rejects the consequence, and it covers the new variant automatically because it drives every member of `ALL` through `resolve_action`: a permanent `source_decode_retry` would build a `Terminal` whose `message` is the bare status token, and because `last_decision` is never cleared the viewer would be told the file is permanently dead for the rest of the session while the successor was still coming up. `every_decision_reason_round_trips_its_wire_name` rejects a spelling that collides with another variant's, which is the realistic error for a pair this similar - writing the new arm as `source_decode_failed` makes the older variant parse back as the newer one - and the same test now also matches exhaustively over the variants, so a variant added to the enum and forgotten in `ALL` fails to compile there rather than becoming invisible to every test that iterates `ALL` while being unnameable by `from_status`. That last property was uncovered before this commit: `status` is exhaustive and forces a spelling to be written, and nothing forced it to be listed. The same commit re-cuts the four M6 client documents, whose Part II states this vocabulary and its permanence split verbatim for three client teams building against it in parallel."
