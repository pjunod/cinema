reason = "Row 17 (`degraded_notice`) had no web raise site at all and row 18 (`log_only`) was raised by nobody, so `surface_log_only` was never emitted; this commit gives both rows real sites. Six retained tests hold it, all under `make web-check`. In `tests/playback/web-policy.test.js`: `an Auto rung that attached says so as a degraded fault` builds the shipped `switchAutoRung` over `claimAutoFallback`/`releaseAutoFallback` with a `requestPlaybackMediaChange` that resolves true, and requires the raise list to be exactly one `degraded_notice` titled `Quality -> 1080p - sustained supply pressure`, plus `the claim is released either way`; `an Auto rung that did not attach says nothing` runs the same path with a change that resolves false and requires the raise list to be empty, `a failed change is the change's own refusal, not a downshift`. Revert the commit and the downshift goes back through `toast()` - a 2.2-second strip with no class, no identity and no ledger row - so the first test's `deepEqual` finds an empty list. `the decode rescue raises its notice as a degraded fault` drives the shipped `maybeDecodeRescue` through `autoRescueHarness` and requires exactly one `degraded_notice` titled `This browser can't hold Original smoothly - switching to optimized` and requires `a downshift is a notice beside a running picture, never a stop` (no `player_stopped`). In `tests/playback/web-control.test.js` three anonymous blocks hold row 18, named here by their assertions: a refused playback-control exchange - `session_gone` on a committed successor's first one, the row's own named case - requires `a failed exchange is log-only - nothing is drawn over a playing picture` and `and nothing about the player is stopped`; an abandoned prepared successor requires `an abandoned successor is log-only, and it is not nothing` and that `the row names the generation the incumbent is on`; and a prepared successor that failed on its own requires the same single `log_only` carrying `a4` as its attached generation. Each of those reads a `raisePlaybackSurface` seam wired into the prepared-replacement harness, so deleting the raise leaves an empty list where the test requires `[log_only]`. Now the honest part. The remaining five row 17 sites - the pre-play HDR/burn refusal in `play`, the same refusal from `setSub`, the `togglePip` failure, and the stats poll in `pollSessionHealth` - are held only by `every remaining row 17/18 site raises rather than toasts`, and that test is source-text matching, not behaviour: it requires each shipped function to contain `raisePlaybackSurface(\"degraded_notice\"` or `raisePlaybackSurface(\"log_only\"`, to still contain its copy (`That subtitle requires an SDR burn-in.`, `Picture-in-picture did not start.`), and not to also toast the same sentence. The test says so itself in its own comment - the harness for a cold-start `play()`, the subtitle menu, the PiP toggle and the two-second stats poll would cost more than the assertion is worth. So a refactor that keeps the call and breaks the condition around it passes. Two further things nothing asserts: that the pre-play raise now sits after `newAttempt` rather than before it - the reason the notice is no longer dropped by its own attach a moment later - and that the row-18 raises stay inside the existing 60 s exchange throttle and the health poll's transition, so neither becomes a ring of its own."
