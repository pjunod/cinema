reason = "The review round on the FFmpeg write boundary. `scratch_charge_a_starved_writer_rings_the_hold_signal_on_both_edges` requires an allocation to read as starved exactly while any writer waits and the manager to hear both edges; a starved writer that never produced a hold let the producer's progress deadline replace a producer that was only waiting on the budget. `scratch_put_a_refused_grant_writes_nothing_past_the_allowance` now also requires the refused upload to mark the allocation starved and the completed one to clear it. `scratch_charge_a_walk_subsumes_only_what_landed_before_it` is the mutation killer for the walk: bytes that land while a walk runs, and bytes behind a GC deletion, must stay charged, so zeroing the landed figure fails it. `scratch_put_a_retired_lane_is_refused_before_its_successor_writes` requires a reaped attempt's in-flight and later uploads to be refused from the moment its lane is retired, before the retry's first upload arrives. `scratch_put_an_older_lane_never_takes_the_endpoint_back` requires a replaced attempt whose first upload arrives after its successor's to be refused, and a lane retired before any upload arrived to stay retired. `scratch_put_a_playlist_waits_for_the_objects_it_names` now requires an early playlist to be held and promoted by the commit that completes it rather than waited on. `scratch_put_drain_admits_an_exited_producers_tail` requires drain to finish, charged, with the producer gone and the budget still full. `scratch_put_a_failed_write_is_reported_for_the_lane` requires a failed write to be recorded for the publication clock and a retired lane's failure to be discarded. `scratch_charge_grant_wait_gives_up_only_before_first_publication` is now bounded, so the inverted deadline fails it instead of hanging it."
