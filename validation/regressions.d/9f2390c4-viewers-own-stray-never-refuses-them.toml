reason = "This commit implemented same-viewer stray eviction on this branch, inline in `LiveTvManager::start` in `crates/plurxd/src/live_tv.rs`: when `registry.held()` has reached `max_sessions`, cancel the requesting viewer's own idlest activated session rather than answering `tuner_capacity`. `main` has since merged its own implementation of the same feature from `effort/live-tv-reliability`, and the merge kept main's, so the code this commit wrote is not in the tree any more - the behaviour it ruled on is, carried by `LiveTvSessionRegistry::stray_to_evict(user_id, now)` and the `match registry.stray_to_evict(...)` arm at the capacity check in `start`, which does the same thing and also evicts a session whose request id the viewer has retired, in any phase. The evidence is therefore main's test, and it is `a_full_owner_evicts_this_viewers_stray_and_nobody_elses` in the `#[cfg(test)]` module of `crates/plurxd/src/live_tv.rs`. It registers five sessions through `register_test_session_at` - viewer 7 Active and idle past `STRAY_EVICTION_IDLE`, viewer 7 Active and freshly touched, viewer 7 Starting and idle, viewer 7 Provisional and idle, viewer 8 Active and idle - and requires `stray_to_evict(7, now)` to choose the first and only the first, asserting `the one that has missed three heartbeats, and only that one` and then `assert_ne!` against each of the other four. Revert the behaviour and that `expect(\"this viewer has a stray\")` panics: the function returns `None` and the start path answers `all N plurx Live TV session slots are in use` to a viewer who is holding a dead tuner of their own. The same test requires `stray_to_evict(9, now)` to be `None` while viewer 7's sessions sit idle - `a viewer's own stray must not refuse them; it is not a licence to take someone else's tuner` - which is the guard that keeps the eviction from becoming a way to take another viewer's tuner. It then cancels the chosen stray and requires the next call to be `None`, pinning the phase rule this commit's message states: `a fresh active session, a start and a provisional are never evicted for idleness - their own timeouts bound them`. Finally it asserts `STRAY_EVICTION_IDLE < CAPABILITY_IDLE_TIMEOUT`, without which the owner would reap the slot before the viewer could ever reclaim it and the eviction would never fire at all. `a_retired_id_evicts_a_session_in_any_phase` covers main's addition on top of this commit: a freshly touched Provisional session is not evictable until `retire(7, id, now)` is called, after which `stray_to_evict` chooses it. Both run under `cargo test -p plurxd`, which is the `rust-gate` and `rust-gate-ci` checks. Named plainly because it matters: the coverage is at the `stray_to_evict` seam, not end to end. No test drives `LiveTvManager::start` to `max_sessions` and observes an admission where a refusal used to be, and nothing asserts the `plurx_live_tv_stray_evictions_total` counter that `observe_stray_eviction` feeds at the call site. The wiring between the helper and the capacity check is held by reading the source, not by a test."
