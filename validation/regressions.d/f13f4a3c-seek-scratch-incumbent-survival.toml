points = ["web.experience", "playback.pipeline"]
checks = ["rust-gate", "rust-gate-ci", "web-static"]
reason = "This is the commit that took the picture away. A refused create left `controlSeek` set, the incumbent's snapshot reported `render_state=seeking` with that foreign `seek_target_ms`, and `RollingStartupState::observe_control` resets its presentation baseline on every exchange carrying a seek — so a visibly playing stream never established `Presented` and was reaped at `first_served_at + 30 s`. The split is the `executed` flag, which is already set when a local seek is applied to the attached element or when a successor attaches, so an unexecuted destination is a replacement that has not attached and the incumbent reports the picture it is actually showing. `seek_scratch_incumbent_survives_a_pending_replacement` replays the shipped client's own snapshots through the real actor at the ordinary reporter cadence and requires `Presented` and no expiry out to sixty seconds. `seek_scratch_a_genuinely_unpresented_stream_still_expires` is the control that stops the repair being done by weakening the deadline: a start that never presents must still be retired on the original budget, so disabling or extending the deadline fails it. `seek_scratch_an_executing_local_seek_still_reports_its_target` is the other control — a seek the element is genuinely performing keeps reporting `seeking` and its target, so hiding all seek state would fail too. All three read `tests/playback/seek-scratch-snapshots.json`, and `tests/playback/seek-control.test.js` asserts the shipped `playbackControlSnapshot` produces exactly those bytes, so the client mapper and the server regression cannot drift apart: changing one without the other fails the other side."
