reason = "Two whole-PR adversarial reviews of the M2 candidate agreed on six defects; this commit repairs all of them, and each has a regression that rejects the old behaviour. The key was forked on provenance in two more places: `FactsDigest` carried `selection_provenance` and `plan_digest` carried `decode_evidence`, and the two planning routes used different stream-selection rules entirely — the stored-probe route asked for the first playable video stream while the descriptor-bound route asked for the stream FFmpeg's `0:v:0` resolves to, which on a file carrying cover art are different streams. `both_planning_routes_select_one_stream_through_one_rule` (plurxd `decode_facts`) and `explicit_and_first_playable_selection_of_one_stream_agree` plus `the_software_implementation_changes_the_plan_digest_and_the_evidence_class_does_not` (plurx-core `decoder_selection`) all fail on the previous composition. Four shipping regressions from the earlier M2 working tree are repaired with them: every GPU pipeline tone-mapped SDR sources because the plan passed `input_dynamic_range_name()` where the legacy path passed `MediaFile.hdr`; a file with `probe_json IS NULL` became unplayable including one already fully cached; any codec outside the seven-family startup inventory became unplayable on a software-decode node, and the inventory's `implementation == codec` claim forced `-c:v av1` where FFmpeg would choose libdav1d; and `media_offer_probe` hardcoded `cache_hit = false`, which is an eligibility input downstream, so a node holding a complete byte-verified generation was refused whenever its source was briefly unreadable. `missing_codec_or_uninventoried_software_decoder_is_a_typed_refusal` and the recipe suite's restored renderer-refusal assertions reject the corresponding old behaviour; the offer path's restoration is covered by the existing cache-offer tests, which return to production code from `cfg(test)` in this commit."
