reason = "PR #459 review findings 1-3, the web player's MediaSession (OS media keys, headset, lock screen) producers. Before this commit the `play`/`pause` handlers in `crates/plurxd/src/web/player/stats.js` branched on the element's `paused` while `togglePlay` flips the viewer's intent, so in a pending open or a reattach (element paused, viewer still wanting playback, and `updatePlayerMediaSession` telling the OS `paused`) a headset press arrived as `play` and flipped the intent to pause; the handlers also called `togglePlay`/`nudge` directly, bypassing the input contract table, and `nexttrack` was registered unconditionally so browsers drew a Next button that did nothing. `tests/playback/web-control.test.js` composes the shipped `installPlayerMediaSession`, `playerMediaPlayPause`, `playerMediaSkip`, `playerWantsPlayback`, `watchRouteInput` and the real `togglePlay`/`play` over a recording `navigator.mediaSession` and invokes the INSTALLED handlers: on an attached transcode player with `wantsPlayback=true` and a paused element it asserts `playbackState` is `playing`, `play` leaves the intent true, `pause` pauses once and a second `pause` stays paused, and a `failed` input state ignores `play`; during a pending open and a cold open it asserts `play.pendingIntent.wantsPlayback` survives `play` and follows `pause`. `tests/web/player-dom.test.js` composes the same handlers with the shipped routing over the real contract table and walks `failed` (play and skips ignored), `scrub` (commit before play/pause, skips ignored), `menu`/`info` (skips ignored, pause still pauses), `hidden`/`timeline` (skips reach `nudge` with the browser's `seekOffset`), an ended element (pause does nothing, play reaches the replay), Next registered only while autoplay-next is on and not for a movie, removed when the setting turns off, not re-registered after close, and `setAutoNext` calling `syncPlayerNextTrack`. Revert proofs on nuc3, each reverting the production hunk: handlers judging `e.paused` fail `MediaSession play paused a film the viewer wants playing` (web-control) and `play on a film the viewer wants playing toggled it off` (player-dom); `playbackState` from `v.paused` fails `the OS was told a reattaching film had been paused`; dropping the pending-open branch of `playerWantsPlayback` fails `MediaSession play during a cold open flipped its intent to pause`; removing the play/pause routing fails `a headset play acted behind a blocking prompt` and `a blocking prompt did not ignore the OS transport`; removing the skip routing fails the latter; registering `nexttrack` unconditionally fails `Next was registered with autoplay-next off`; and dropping the `setAutoNext` re-sync fails `setAutoNext no longer re-syncs the OS transport's Next`. `make web-check` runs both files (web-static) and `scripts/player-input-fence` keeps these producers inside the one `player-input-adapter` region."
