[[coverage]]
commits = ["bf73f64b", "f9335721"]
points = ["playback.pipeline"]
checks = ["rust-gate", "rust-gate-ci", "resource-bounds"]
reason = "Transcodes reserved the whole per-session scratch ceiling because FFmpeg's -f hls muxer wrote its own files with no grant before a write, and copy sessions that fell back to that muxer (an uncuttable source, a takeover, the segmenter's legacy retry) were admitted on the small startup allowance with no boundary at all. `scratch_put_a_refused_grant_writes_nothing_past_the_allowance` is the mutation killer for the boundary: a 5 MiB upload against a 2 MiB budget must leave at most 2 MiB on the disk and nothing committed, so writing before authorizing, or authorizing a block the budget cannot hold, fails it; the same upload must then complete when the budget grows. `scratch_put_ffmpeg_output_is_byte_identical_to_file_output` and `scratch_put_fmp4_copy_output_is_byte_identical_to_file_output` run real FFmpeg both ways and require identical objects, so any change to muxer semantics between file and upload output fails them. `scratch_put_a_playlist_waits_for_the_objects_it_names` requires a playlist naming an in-flight segment to stay out of the directory until the segment lands and a stale version never to replace a newer one; renaming on arrival fails it. `scratch_put_a_replaced_lane_cannot_overwrite_its_successor` requires a late upload from a replaced attempt to be refused at commit. `scratch_put_an_upload_is_a_scratch_writer_until_it_settles` requires every upload to register as a writer and a starved upload to wake at the fence, so retirement's barrier covers it. `scratch_put_drain_covers_an_upload_still_queued_on_the_socket` requires drain to return only once a finished upload is in place, which is what the completion probe relies on after FFmpeg exits. `scratch_charge_a_transcode_starts_small_and_writes_through_the_grant` drives a real transcode through the manager: admitted below a quarter of the ceiling, run to ENDLIST, every named object present, no temporaries left."
