version = 1

[[coverage]]
commits = ["830af59d"]
points = ["playback.pipeline"]
checks = ["rust-gate", "rust-gate-ci"]
reason = "The preceding commit let a contract-qualified decode fault rewrite a producer decision's reason to the new permanent `source_decode_failed`, but rewrote it before the retry branch was chosen and over any non-permanent verdict. Three consequences, and a regression for each. `a_retry_is_never_handed_a_permanent_reason_while_the_fallback_is_still_coming` (plurxd `playback_control`) rejects the worst: the reason on a `Retry` is not private to the server, it reaches `DeliveryView::producer_decision` and `resolve_action` turns any permanent reason into `ControlAction::Terminal`, so a retry carrying the new reason told the viewer the file was permanently dead while the node was still bringing up the software fallback that would very likely have played it, and because `last_decision` is never cleared that verdict stood for the rest of the session rather than for a moment. `a_fault_on_a_producer_that_published_is_recorded_and_not_acted_on` rejects the second: `PartialSuccessExit` is reached only after a completion probe finds a published frontier, so a long title with one corrupt region latched a fault, skipped the bad pictures, published most of itself and was then called permanently undecodable, tearing down a player still holding good buffer. `a_server_side_loss_is_never_relabelled_as_a_verdict_about_the_source` rejects the third: the `!is_permanent()` test also swept up `ExecutorLost` and the flow and install deadlines, which are facts about this node rather than about the file, so a passing outage became a permanent claim about a source a client cannot recover from by trying again. The gate is now a named list of the four verdicts that mean the producer stopped without producing. The same commit deletes `latched_action_qualified`, whose omission of `observation_complete` allowed a triggering window assembled entirely from an oversized line's retained head, an invalid-UTF-8 line's lossy transcription, or the partial record a stream killed mid-write yields; the latch now asks `automatic_action_allowed`, the same question as the settle, and the existing decoder-health suite covers that method."
