version = 1

[[coverage]]
commits = ["d905779f"]
points = ["live-tv.integration", "server.api"]
checks = ["rust-gate", "operations-contract"]
reason = "Two of the eight findings can make the system wrong rather than merely unavailable, and both retain a test that fails on a revert. Making readiness advisory removed the only refusal standing between an operator and enabling a tuner a previous owner may still hold — `validate_static` checks the barrier is well-formed, never that it is resolved — so admission is now a structural refusal in its own right and a standing barrier is never overwritten by a later disable; restoring either half lets an enable over an unfenced owner return 200 and erases the record that the first node was never drained. `a_refresh_with_no_cached_lineup_refuses_rather_than_storing_an_empty_guide` covers the cascade the first repair caused: a guide refresh may never talk to the tuner, so it reads the cached lineup only, and on a cold owner that cache is empty — matching against nothing produced an empty guide that was then stored over a good one and reported as the source's fault. The test seeds a good cache, refreshes against a cold lineup, and requires both the refusal and the surviving two channels. `an_xmltv_url_may_reach_the_lan_but_not_this_machine_or_link_local_space` and `a_name_that_resolves_to_loopback_is_refused_at_fetch_time` pin the SSRF boundary in both directions — the LAN stays open because the acceptance itself points XMLTV at another node, while loopback, link-local and the cloud metadata address are refused as literals and again after resolution, with the connection pinned to the addresses that were checked so a name cannot resolve past the check. `xmltv_text_survives_entities_and_cdata_because_real_grabbers_emit_both` requires 'Tom & Jerry' to survive as one title: quick-xml reports entities and CDATA as their own events, and reading only text events truncated most real titles at the first ampersand. `a_guide_far_over_the_cap_is_trimmed_rather_than_emptied` requires a guide well past the response cap to come back with channels and programmes intact, which the old proportional headroom did not. And `a_guide_never_carries_deviceauth_into_anything_that_leaves_the_owner` was rewritten because it proved nothing: it now puts the credential on the real request path and asserts it is there before asserting its absence from the served document, the settings tuple, the relayed value and a failed refresh's error copy."
