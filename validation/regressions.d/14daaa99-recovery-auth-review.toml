reason = "a_completed_removal_stops_fencing_the_exclusions_it_finished_with gained the third place the fence is carried: it runs enter_maintenance_admission_sql itself against a cluster that holds the maintenance lease and proves the capability with a current heartbeat, and requires admission on a cluster with a finished removal, refusal during a live one, and refusal again when the removal target cannot be resolved at all. That last case is the fail-open the review found: an orphaned removal row has no cluster_nodes row, the inner join dropped it, and both exclusions became acquirable while a fence was nominally up. Reverting the predicate to the join form fails that case; reverting it to the table-wide form fails the finished-removal case, so neither direction can be restored quietly. leader_handoff_precedes_the_durable_maintenance_fence keeps its ordering assertion against the call rather than the literal and additionally requires the extracted statement to still contain the insert, so extracting it cannot hollow the test out. cache_admin_exclusion_blockers_name_every_standing_condition executes the exact runtime-built query through rusqlite against the same fixture the acquire is tested on: it asserts the query's column names equal the row reader's list in order -- hiqlite's accessor panics on a missing column, and that panic would kill the activation loop's task outright and restore the original defect permanently with no retry -- then makes each standing condition true one at a time and requires it to light its own column alone, which is what stops a predicate wired to the wrong column reporting a plausible and wrong cause. It also pins the local hold apart from the remote one, because reporting our own exclusion as another node's sends an operator to the wrong machine. aggregate_request_reads_only_node_owned_projections now pins the publication ticket ahead of the Store read; moving it after the read compiles and passed all 1905 tests before this assertion existed, and reintroduces the stale-proof publication the cache generation exists to close. Its slice is scoped to the impl block instead of running to the test module, so a helper added between them cannot fail the counting assertion for the wrong reason. tests/web/cluster-recovery-session.test.js executes the shipped api out of index.html with a per-path fixture, because the recovery branch now makes a second request of its own and the two answers are the whole point: a refusal from a node whose /me still answers must keep the session and carry the server's stable code to the panel, a refusal whose /me also refuses must end the session exactly once, a 403 must end nothing and cost no probe, and an ordinary route's 401 must still log out. Disabling the branch and deleting the probe are both caught."
