reason = "C-04 M2, bounded login backoff with trusted-proxy handling. Before this commit there was no per-account or per-address failure accounting anywhere in `crates/`: a password guesser against one account from one address was limited only by the two Argon2 workers. This adds a process-local throttle on two bounded maps - hashed username plus effective client IP, and IP alone - with a sliding window, five free failures, exponential backoff capped at 60 seconds, a hard 4,096-entry ceiling with LRU eviction, and a 429 refused before the Store read and before the Argon2 work. There is deliberately no username-only key, because that is the map an attacker fills from a botnet to lock the real user out. Six tests in `http::auth::tests` pin it. `five_failures_are_free_and_the_sixth_waits_without_extending` asserts the first five attempts pass, the sixth reports a one-second wait, and asking again half a second later still reports one second rather than a longer one - so hammering during the wait does not extend it. `backoff_caps_at_sixty_seconds_and_another_address_is_independent` drives twenty failures and asserts the wait stops at 60 rather than growing, and that a different address is admitted immediately during it, which is the lockout-resistance number stated as a number. `success_clears_the_pair_without_resetting_rotating_username_protection` asserts a successful login clears the account/address pair but retains the address-wide bucket, so one account the attacker controls cannot reset the rotating-username defence. `throttle_maps_evict_to_the_hard_bound` drives 5,000 distinct keys and asserts both maps hold exactly the bound. `forwarded_for_requires_a_trusted_peer_and_uses_rightmost_untrusted_hop` asserts the header is ignored from an untrusted peer and, from a configured proxy, resolves to the rightmost hop that is not itself a proxy. `dominant_forwarded_address_sets_only_an_advisory` asserts the proxy-shape heuristic raises a readiness notice and refuses nothing. On revert, the first two restore an unbounded guessing rate against one account; reverting the eviction bound restores an attacker-grown map; reverting the trusted-proxy check makes the throttle key attacker-chosen, which is worse than having no throttle; reverting the advisory turns a readiness line into an enablement gate, which the standing no-feature-gate rule forbids."
