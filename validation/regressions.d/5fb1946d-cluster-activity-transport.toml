reason = "The retained cluster lifecycle first attempts to redeem a valid join credential as the active singleton's node id without an HTTP origin, then with an HTTP origin already owned by the singleton. Both serialized claims must fail while membership remains one voter. The harness then seeds the prior rolling binary's crash shape — an exact token reserved with no node or HTTP row — and exercises both no-HTTP and HTTP repair before admitting the voters. After the repair records durable origin provenance, a historical duplicate of that origin cannot authorize a retry that changes it. After removal, a separate valid credential targeting the tombstoned identity must fail with cluster_node_identity_in_use. Restoring split redemption writes, assuming every reservation already published, misordering Hiqlite placeholders, accepting historical duplicates as provenance, an identity upsert, or an active-only collision predicate reserves or promotes an unusable or corrupting node. Focused activity tests pin the exact private no-store header value and the deterministic global 512-candidate selector. The progressive and direct registries are each filled to 600 entries and must return the actual newest 512, while the shared top-K selector used by transcode is exercised at the same cardinality. A 512-item title workload invokes the candidate-title batching seam exactly once; the Rust gate compiles the handler's direct use of that seam and both one-query backend implementations. The manager regression pauses a selected session immediately before its first telemetry mutex while requiring a second sessions-map operation to complete, so restoring the map-lock-across-await path times out."
