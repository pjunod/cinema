reason = "a_segment_answer_carries_the_meter_its_own_session_publishes is the test this commit exists for. The review cut session_rendition's Arc::clone(&session.delivery) to a fresh meter and the entire suite stayed green at 1740 passing while every VOD session silently returned to delivered_bps: None and preparation went back to refusing throughput_unreported -- the seam the whole correction consists of had no coverage at all. It drives VodServe::segment, the production entry point, so nothing in the test chooses the meter, notes bytes into the answer exactly as the response pump does, and reads the count back off the session's own status rather than off the answer. It also requires a second viewer of the same immutable rendition to publish zero, which is what pins the meter as per-session rather than per-rendition: two viewers have two links, and a rate that averaged them would describe neither. Restoring the throwaway meter fails it at 0 against 4096. an_abandoned_vod_body_counts_nothing_it_did_not_hand_over is rewritten because its previous form was vacuous: it asserted only that the counter was below the whole segment length, which holds for a counter that never moves, and it survived deleting the pump's note entirely. It now drains a prefix and requires the meter to equal that prefix exactly, so both a counter that never moved and one that credited the whole object fail it. The claim that it pinned the note's ordering against the downstream acknowledgement is withdrawn rather than restated: the local body channel holds one chunk and the pump awaits each acknowledgement before reading the next, so it never reads ahead of what it has sent and read-time counting is externally indistinguishable at this layer. That ordering is argued from the code. The activity fixture in internal_activity.rs now carries non-zero delivered bytes and a rate, because the peer snapshot it covers hard-coded zero and a fixture that also said zero could not see the difference; the local and remote views of one VOD session would otherwise have disagreed on the admin page. delivered_idle_ms is marked serde(skip) on VodSessionInfo: that struct is the body of /hls/{session}/status, Apple's DeliveryStarvationDetector cannot fire without the key, and VOD has never carried it, so serializing it would have armed an automatic session reopen for every VOD viewer as a side effect of adding a measurement. DeliveryView::from_status reads the field in process, which is what needs it."
