reason = "K-04's M0 route attribution was an ordered substring classifier, so the evidence M4 is meant to compare was mixed at the source: `/api/v1/files/{id}/decision`, `/direct`, `/download`, `/content`, `/subs/{subtitle}` and the Plex `/library/parts/...` route all landed in `other`, while `/api/v1/system/search-index/rebuild` was counted as `search`. `http_route_group` is now an exact match over registered `MatchedPath` patterns with `other` reserved for genuinely unregistered paths. `every_registered_literal_route_has_an_explicit_group` in `crates/plurxd/src/http/mod.rs` parses the literal route patterns out of `router`, `dvr.rs` and `library_channels.rs` and fails on any registered pattern that still classifies as `other`, so a route added without an attribution entry fails closed rather than being silently pooled. `metrics_route_attribution_renders_fixed_labels_and_scoped_store_counts` pins the specific misclassifications above by asserting each path's group directly, and `registered_routes_reach_every_non_other_attribution_family` sends a real request through the production router and `http_store_attribution` for all eight non-`other` families and requires the group's counter to advance, which the previous focused test could not do because it invoked the hidden recorder and `HttpRouteMetrics::record` at both ends without ever traversing `MatchedPath`. Reverting the table to substring matching fails the inventory and the per-path assertions; disconnecting the middleware from the recorder fails the router-level test. The recording path is no longer faked either: `validation_time_http_store_operation` in `crates/plurx-core/src/store/hiqlite.rs` drives the same `time_store_operation` completion path every `TimedClient` query and execute uses, replacing `validation_record_http_store_operation`, which only seeded the request-local counter and so could stay green with the production timer unwired. The same commit closes the role label, which asserted `voter` for states where no committed voter role exists: `HTTP_NODE_ROLES` gains `fenced` and `unknown`, and `http_node_role` maps `LocalServingRole::Fenced` to `fenced` and both a role-lookup error and a clustered/unclustered contradiction to `unknown`. Those five mappings are asserted directly in `metrics_route_attribution_renders_fixed_labels_and_scoped_store_counts`, and the same test requires the exposition to carry exactly `HTTP_ROUTE_GROUPS.len() * HTTP_STORE_CLASSES.len() * HTTP_NODE_ROLES.len()` store-read cells, so widening the vocabulary without widening the metric arrays fails. All of these are Rust unit tests inside `crates/`, which `rust-gate` runs through `make rust-check`."
