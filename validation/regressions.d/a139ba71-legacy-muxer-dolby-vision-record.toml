reason = "`an_init_declaring_dolby_vision_the_playlist_does_not_is_stripped` builds a real muxer init carrying the Profile 7 record a stripping copy leaves behind plus the dby1 brand movenc writes beside it, serves it under a playlist advertising plain HEVC, and requires no dvcC, no dvvC and no dby1 to survive; making the strip unconditional-false fails it, and before this commit the legacy muxer path had no removal at all because ffmpeg's own HLS muxer writes init.mp4 to disk with no copyseg reader and no promotion in between. `an_advertised_dolby_vision_session_keeps_its_record` requires the record to survive untouched for a session that advertises Dolby Vision, driven across both spellings that matter: the converted and preserved 8.1 and 8.4 cases which name it in SUPPLEMENTAL-CODECS, and a preserved Profile 5 which names dvh1 in CODECS with nothing supplemental beside it because copied_hls_codecs only sets supplemental for the compatibility cases. Gating on supplemental codecs alone fails it, and that gate would strip the record off the one kind of session that cannot play without it. `anything_the_reader_does_not_fully_account_for_is_left_alone` requires bytes that do not parse, an empty buffer, and a real init with a trailing byte appended all to be served unchanged, with the un-appended init as a control proving the function otherwise rewrites it; the rewrite replaces the whole buffer with what the reader modelled, so dropping the round-trip guard silently truncates a file a client is about to play, and that mutation fails this test."
