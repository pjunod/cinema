reason = "Twenty red tests on main, and three of them were reporting live defects nobody could see because the censuses around them had stopped being true. The clustered fragment-index requeue bound twelve parameters against a thirteenth placeholder, so every holders-unavailable repair was refused before any I/O and its only caller discards the error; the forced-supersede guard ignored the incoming identity, so the admin force button could not displace any request written before the video_identity column existed. `delivery.preparation` was stamped after a response could come back out of a durable settlement, so a preparation or terminal answer and its own replay were different bytes. `Spawn::ffprobe` never piped stdout, so every colour tag the pipeline probe read was empty, no GPU tone-map graph has ever been validated on any node, and every HDR transcode fell back to software. The browse badge read the legacy refusal, which carries `Truncated` for every terminal typed code that is not literally `Unsupported`, so a permanently unindexable file was badged as pending forever. The peer-activity cache deep-cloned every snapshot per reader. The Rust gate covers all of it: both store backends, the durable receipt replayed byte-for-byte, the probe's real ffprobe read, the typed terminal badge, and the shared-allocation assertion. The censuses are restored to what shipped rather than relaxed - ten SQLite transaction boundaries and a module named, the migration ladder at 63, the sidecar at v9, the activity payload's base DVR key - and the content seed now records the byte length it actually writes, which is what direct play, range reads and Plex parts were answering 404 against. No stored media, probe or queue records were modified."
