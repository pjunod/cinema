reason = "Recorded against a1d7fc4f, which answers the nine findings of the adversarial review on PR #431. Each behavioural fix has a test that fails with the fix reverted, verified by reverting it in a scratch copy of the file and running the named test. `orphaned_derivatives_are_swept_after_grace` seeds a store with three referenced sources — a `{item}-backdrop-c{16hex}` backdrop, a legacy `{item}-poster.jpg` nobody has verified since boot, and a legacy poster whose digest is in the M1 cache — and seven aged entries under `derived/`: three live derivatives that must survive and four dead ones that must go (a derivative of the verified poster's previous bytes, a derivative of a source no longer in the catalogue, a stranded `.{name}.{uuid}.tmp`, and one file in the pre-review `{digest32}-{bucket}` layout). It asserts the count and then each file by name, then adds a fresh derivative and asserts a second pass removes nothing. Restoring the 32-against-16 prefix comparison makes it remove 6 instead of 4 — it eats the live backdrop and the live legacy derivative, which is the daily destruction of every TV hero's grid cache. Restoring the `has_unverified_legacy` early return makes it remove 0, the permanently inert sweep. Making the temporary arm return false makes it remove 3 and strand the `.tmp` forever. `a_failed_ffmpeg_serves_the_original` drives `serve_derivative` against bytes no decoder accepts, so the real child fails, and asserts the response is the original with `x-plurx-artwork: original-fallback` and `cache-control: private, max-age=0, must-revalidate`; restoring the immutable validator fails it with `private, max-age=604800, immutable`, which is the week-long client-cache poisoning that made the plan's cold/warm byte measurement meaningless. `an_exhausted_byte_budget_does_not_look_like_a_changed_source` holds the whole 64 MiB local byte budget and asserts a generation still commits; restoring the re-read fence fails it, because the second `local_permit` times out and the old code read that as a changed source, deleted a correct derivative and made no forward progress. `a_source_replaced_during_generation_is_not_committed` replaces the source with a different *decodable* image through the atomic install path — undecodable bytes would stop the child on their own and prove nothing — and asserts the rename is refused; disabling the fence commits a derivative whose contents do not match its key. `a_warm_derivative_hit_does_not_read_the_source` squeezes the byte budget to one KiB less than the source needs and asserts both a warm 200 and, with the derivative's own `ETag`, a 304; removing the warm path fails it with the capacity refusal, which is the amplification M1's budget exists to close and the plan's objective 3 on the route M2 exists for. `the_derivative_child_caches_in_the_runtime_cache_not_the_artwork_root` reads `XDG_CACHE_HOME` off the built command; pointing it at the source's directory fails it with the artwork root, which is the directory `sweep_content_orphans` enumerates every pass. `derivatives_are_single_flight` and `peer_route_refuses_size` are new coverage for surfaces that had none: removing the flight lock makes the first 10 instead of 1, and removing the refusal makes the second serve a 200. `derivative_key_is_the_verified_source_digest` no longer asserts a constant it also computes — both sides are written out, so narrowing the key to sixteen characters now fails it where the previous form held for any width. `the_derivative_child_leaves_nothing_in_the_served_artwork_root` asserts the artwork root ends a request holding only the source and `derived/`. The build itself is the ninth finding: the merge of main into this branch was textually clean and semantically broken, because `configure_ffmpeg_runtime` had moved to `crate::producer_spawn`; `cargo clippy --workspace --all-targets` and `cargo test -p plurxd --bin plurxd` were re-run against the tip that this entry names, not against a pre-merge commit."
