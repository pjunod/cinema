reason = """
PR #502 review finding 1. Recovering a poisoned standalone SQLite \
connection (housekeeping::validate, reached through lock_or_recover from \
with_conn and with_read while the slot's mutex is held) ran \
PRAGMA quick_check(1), which reads every page of a healthy database, so one \
closure that panicked on every call put a whole-file read in front of each \
later caller on that slot. Validation now checks the connection only: \
rollback of an open transaction, autocommit, SELECT 1, and foreign keys on \
the writer. \
recovering_a_poisoned_connection_does_not_read_the_database \
(store::sqlite::housekeeping::tests, plurx-core) builds a 452-page file, \
poisons a cold writer and a cold read connection, recovers each through \
lock_or_recover, and asserts from SQLite's per-connection cache-miss counter \
(sqlite3_db_status SQLITE_DBSTATUS_CACHE_MISS) that recovery read at most 4 \
pages, that the connection was kept rather than reopened (a marker \
busy_timeout survives), and, as a control, that a quick_check on the same \
connection reads more than 400. With quick_check restored in validate it \
fails: "Writer: recovery read 451 of 452 pages" (exit 101, run on nuc3). \
a_panicking_writer_closure_is_validated_and_rolled_back and \
a_writer_left_without_foreign_keys_is_reopened still pin the rollback and \
the reopen. Runs in the local and hosted Rust gates.
"""
