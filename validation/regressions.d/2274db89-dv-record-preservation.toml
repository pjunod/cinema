reason = "`a_largesize_record_box_is_not_renamed_over_its_own_length` (crates/plurx-core/src/fmp4.rs) fails against the pre-fix code by construction: the rename computed the name field as `payload.start - 4`, which is the name only in an 8-byte header, so a `largesize` box had its 64-bit length overwritten with the four-character name — the write returned Ok(true) and the resulting init no longer parsed, which the test's `reparse_init` catches. `correcting_a_record_does_not_discard_the_bytes_it_does_not_understand` fails because `to_payload` rebuilt all 24 bytes from zero, discarding `dv_md_compression` in the low nibble of byte 4 (ISO spec v2.1, written by the ffmpeg in the shipped image) and the whole reserved tail; the test sets those bytes and asserts only the flag byte moves. `writing_the_dolby_vision_record_keeps_the_box_tree_consistent` gained three arms that each fail without their fix: the `dolby_vision_config` assertion on the in-memory init, which was left stale after the splice while `promote_hdr10_static_metadata_from` and the daemon's `sanitize_stale_dolby_brand` both read it as an inhibitor; the read-back-then-write-back arm, which was a silent box rename for a `dvcC` box holding profile 8 and therefore a `PromotionDrift` under `InitIdentity`'s digest on every generation after the first; and the pure-rename arm, the only path that reaches the name-offset arithmetic at all. `a_record_that_cannot_be_written_is_refused_rather_than_truncated` fails because the fields were masked silently, so profile 128 wrote a `dvvC` box whose payload declared profile 0 — which `dolby_vision_codec_from_init` rejects, falling back to an `hvcC`-derived codec string the doc comment at hls.rs records AVPlayer refusing on a DV sample entry. The multi-entry `stsd` refusal in `locate_hvcc` has no fixture in the corpus to test against and is a fail-closed guard rather than a behaviour change: every init the reader can produce today has exactly one HEVC sample entry."
