reason = "a_failed_rendition_reclaims_its_producer_and_drops_its_hold is the regression for the leak this commit closes, and it is deliberately physical rather than a belief assertion. The fixture drives a real producer, SIGSTOPs it so it makes no progress while still holding everything a running one held, records a permanent failure, and then requires the pid to be gone with ESRCH -- reaped, not merely signalled and not a zombie this process owns. Restoring the bare early return in driver_pass fails it at the ten-second wait for reclaim, because Action::Idle is the only thing that reclaims a producer and it is reached only through the pass that return skipped: the dormant purge refuses an admitted rendition outright and the last Arc drop waits on whichever generation task or materialize watchdog outlives it, so on an admitted rendition nothing reaps the child at all. Deleting the kick from record_failure fails it the same way, which is the honest statement of what the kick buys -- kick_all would reach the rendition on the next maintenance tick, so the kick is promptness, and the test holds it to that rather than to eventual reclaim. The capacity hold assertion in the same test is deliberately narrow. It checks the field is cleared instead of latched for the life of the rendition; it does not claim a client saw the stale value. The first version of this change did claim that, and asserted a viewer reading producer_hold as no_room -- status answers failed ahead of every belief arm, so the latched hold was already shielded and no viewer could ever have seen it. The test states the correction in place so the ledger does not carry the claim the test disproved. one_unfinished_terminal_cleanup_cannot_wedge_node_maintenance pins the second defect, which is unrelated in mechanism and identical in cost: maintain waits on every unfinished cleanup belonging to a tombstoned session before doing anything else, unbounded, so a single cleanup that never completed stopped the idle reap, the dormant purge, the tombstone eviction and every driver kick for the life of the process, silently. The fixture installs one that never completes beside a tombstone that is due for eviction, and asserts both that the pass returned after exactly the documented bound and that the eviction behind the wait still happened. Under paused time the elapsed span is exactly the bound the wait armed, so widening the constant fails it at the new number rather than passing on finiteness -- an earlier version asserted only that the pass returned, and a hundred-thousand-second timeout passed it. Removing the timeout entirely leaves no timer to advance to and the pass never returns. The two arms that could install such a cleanup -- begin_end and the supersession sweep, both writing the tombstone and the cleanup before reading a rendition that may be None -- now complete it, which is why the fixture has to install one by hand; that completion is unreachable today by the invariant a debug_assert now states, and the bound is what holds when a later change to that ordering gets it wrong."
