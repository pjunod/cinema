reason = "encoder_capacity_is_settable_and_the_admission_path_reads_what_was_saved ends at TranscodeManager and at the hardware_slots pair rather than at the DTO that reports them, because the defect this class of change keeps producing is a reader left behind: it asserts the saved cap through max_hw_sessions and software_budget, so a boot-time copy of either fails it. It pins zero on both keys in both directions, which is the finding the adversarial pass returned: the DTO must report a stored zero rather than the default, or the page describes a node that does not exist, and the API must accept one, because the page sends the whole card on every save and a node already holding a zero could otherwise save nothing on that card at all. The bounds assertions ride the same round trip, and the closing assertion proves a refused write leaves the running capacity untouched. a_stored_offline_switch_reads_the_same_way_wherever_it_is_read drives nine stored spellings through the settings DTO and the offline API boundary in one loop; reverting stored_switch at either site puts back the untrimmed, case-sensitive match and the OFF spelling reads as enabled, which fails it. the_preparer_reads_the_stored_switch_the_way_every_other_reader_does covers the third reader, which no request reaches: the review found the first version of this change claiming all three while touching two, and the preparer's only prior test stored lowercase off -- a value the old parser also read as disabled -- so that reader could have been left behind with a green suite. On the web side, the settings-sections contract now asserts that Streaming writes the two capacity fields when they move and omits them when they do not, which is the cluster hazard rather than a style rule: the software default is derived from the node that answered while the setting is replicated, so a card that always wrote it would give a four-core node a sixteen-core machine's budget from an edit about the buffer limit; and the Maintenance contract asserts the offline card's four written fields, so a card rendering the switch while saving only the budgets would not pass."
