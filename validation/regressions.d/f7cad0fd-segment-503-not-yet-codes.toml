reason = "Two named tests in `tests/playback/web-policy.test.js` fail if this is reverted, both run by `make web-check`. `every fixture segment_503_not_yet code recovers an attached playback` reads the `segment_503_not_yet` row straight out of `tests/playback/playback-surface-contract.json`, asserts the row carries a non-empty `codes` list at all, and then requires `policy.classifyStreamFailure({status: 503, code, context: attached})` to answer `segment_503_not_yet` for every code in it - the two playlist codes `startup_timeout` and `playlist_state_changed`, the three `vod_error` waits, the durable route's `media_owner_transition` and `vod_resurrection_unavailable`, the six `response_*` publication refusals and the three cluster-gate refusals. Revert the fixture row and the first assertion fails on the missing list; revert only the matcher and the row's codes stop resolving. `an attached 503 the row does not list falls through to the code's own row` is the half that holds the actual defect: it requires `vod_disabled` on an attached 503 to classify as `null` and the same code on a `start` context to classify as `vod_disabled`. Before this commit `SURFACE_REFUSAL_BY_STATUS` mapped `segment_503_not_yet` to `status === 503` alone, so the service being switched off was read as the segment not being ready yet and the viewer got a `recovering` spinner over a stream that was never coming back; restore that predicate and this assertion reports `segment_503_not_yet` where it requires `null`. The same test also requires an unexplained 503 (`code: null`) on an attached context to be `null`, and requires `media_owner_transition` carried on a 425 to be `null` - that last one is what pins the new `SURFACE_REFUSAL_STATUS_FOR` table rather than a bare code lookup, because `media_owner_transition` is also a `create_503_not_yet` code and a code-only match would let it claim a status it never travels on. The embedded table itself is held by `the shipped policy carries the fixture verbatim` in `tests/playback/playback-surface-contract.test.js`, which deep-equals `SURFACE_SOURCES` in `crates/plurxd/src/web/playback-policy.js` against the fixture, so the generated block and `tests/playback/playback-surface-contract.json` cannot drift apart silently. Not covered: nothing asserts that the sixteen listed codes are the complete set the server can answer a playlist or segment request with - that list was read off the handlers by hand, and a new 503 code added to `http/mod.rs` or the publication path would simply fall through to the caller's own handling with no test going red."
