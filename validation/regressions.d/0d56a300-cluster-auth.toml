reason = "The retained `start_cluster_with_port_retry_reallocates_after_a_collision` releases the first PortReservation, takes its Raft port before the real voter binds, and requires the production retry wrapper to allocate different Raft and API ports and successfully start on its second attempt. The direct-voter regression separately requires synchronous ownership of both listeners to return the occupied address as a port collision rather than a durable-state verdict. Reverting the reservation, pre-bound listener handoff, or retry integration makes one of those mechanism checks fail."
