reason = "The surface reducer is the one policy all three clients transcribe, so its edges are pinned as fixture cases rather than as web tests, and the twenty cases this commit added are what would go red. `exhausted_survives_intent_settled` and `preparing_survives_intent_superseded` require a seek landing under a prompt to leave that prompt standing, because a retirement reason is a property of the class and not of the intent. `promotion_only_by_the_owner_stop` and `promotion_needs_the_same_generation` require only the owner's own stop, on the same generation, to promote a fault, and `auth_over_a_live_media_owner_lost_still_signs_in` requires a credential refusal raised over a live `media_owner_lost_410` to keep its own Sign in instead of being folded into the 410 and rejected as blocking without a stop; `promotion_keeps_the_class_default_actions` requires a promoted fault to inherit the class actions, so a terminal full screen is never drawn with no way out of it. `recovering_retired_by_presenting_after_in_place_reopen` and `hold_retired_by_presenting_after_raise` require presentation that BEGAN at or after the fault to retire it, which is what stops an owner that reopens in place from leaving its indicator up for good. `hold_timer_frozen_while_hidden` and `refused_progress_clock_frozen_while_hidden` require a hidden page to freeze its timers and restart the continuous-presenting clock rather than defer them, and `inert_event_does_not_run_a_due_timer` and `timed_notice_expires_exactly_on_its_boundary` pin the two edges of the timer itself. `blocking_raised_over_a_presenting_picture` requires the agreement rule to resolve at the raise and not at the next sample, `disagreement_banner_retires_after_continuous_progress` requires the banner a demotion leaves behind to end after continuous presentation instead of never, and `refused_continuity_interrupted` and `refused_continuity_needs_a_presenting_picture` require a paused picture to accumulate no continuity at all. `stale_generation_evidence_is_ignored`, `same_severity_tie_break_is_newest`, `user_action_clears_only_its_own_fault` and `force_transcode_is_offered_on_the_diagnosed_stall` pin identity, precedence, the scope of an answer and the diagnosed offer. Four invariants came with them and fail on the table rather than on a sequence: `every source mapping to a blocking class declares the stop it needs` is the one the rendered source table was lying about, and `every retirement reason a class names is reachable, and none is invented`, `every action in the vocabulary is offered by at least one case` and `every source row is exercised by at least one case` keep the generated blocks honest. `presentSurface does not mutate the state it was handed, faults and all` and `replaying from an earlier state gives the same answer as the first pass` run every case to completion and require the published surface to be frozen and its actions to be a copy, not a live alias into the reducer's own state. Every one of those runs in the embedded-JavaScript gate, which is what executes the fixture against the shipped policy. The fence half is separate evidence: the nineteen spellings it learned are proved by the must-trip and must-not-trip fixtures and by `test_an_allowed_region_covers_its_body_and_not_its_anchors`, `test_a_broken_region_fails_rather_than_silently_allowing_nothing`, `test_a_write_inside_the_region_is_allowed_and_one_outside_is_not` and `test_a_write_split_over_two_lines_is_still_one_write`, which run under the operations contract, while the fence itself runs over the tree as it stands."
