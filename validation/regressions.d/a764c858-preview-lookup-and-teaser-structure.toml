reason = "`a_preview_that_overruns_the_duration_still_bounds_the_guess` drives a trailing preview chapter whose end lands two seconds past the declared runtime — the MKV/ffprobe rounding artefact the no-preview path already has a test for — and requires that no estimated credits marker is invented. Reverting the lookup to read the emitted markers fails it, because the emitting loop drops that chapter for ending outside the runtime, `credits_end` reverts to the end of the file, and the estimate lands over the teaser. `a_mid_film_match_cannot_move_the_credits_window` requires the same lookup to keep CREDITS_MIN_START_PCT, so a substring match 41% into a film neither becomes a preview nor drags the credits window back; dropping that filter fails it. `a_teaser_split_across_two_chapters_is_bounded_at_its_first` pins `.min()` over a teaser marked as two chapters, so the credits stop at the first of them rather than calling the first half credits. `a_post_credits_stinger_does_not_anchor_the_guess` pins the 15s floor on the boundary search, requiring the proportional estimate rather than a Skip Credits button over a ten-second stinger. `a_tail_keyword_match_followed_by_more_story_is_not_a_preview` requires a keyword hit at 89% of the runtime followed by five more minutes of film to be refused the preview kind, so the file's real Skip Credits marker survives; deleting the trailing-run rule fails it, and that rule is the fix for a tail-position false preview which the position bound does not cover. `chapter_classification` pins Until Next Time, Till Next Time and Next Weekend to no marker while pinning Next Time, Next On and Next On: Better Call Saul to a preview, so reverting the leading-phrase match to a plain substring fails it. `a_trailing_chapter_overrunning_the_runtime_by_a_hair_is_clamped` and `an_overrunning_credits_chapter_is_not_demoted_to_an_estimate` require a chapter ending past the declared runtime by an MKV rounding artefact to keep its authored marker with the end clamped, rather than being dropped and replaced by the proportional estimate; `an_overrun_too_large_to_be_rounding_is_still_dropped` bounds that clamp."
