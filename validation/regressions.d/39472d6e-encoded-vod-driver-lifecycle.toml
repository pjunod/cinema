reason = "The correction and its evidence are the same commit, in `crates/plurxd/src/vodserve.rs`. The M3 acceptance cases had been proving the stopped-encoder contract by calling `driver_pass` by hand, so the driver loop's own wait -- the branch that arms `STOPPED_ENCODER_POLL` for a stopped encoder with nothing encoded-waiting -- was never executed, and review finding #3230, that a rolling-live waiter outside the VOD registry sends no kick and so might never be served, could not be answered from the suite. The only edit outside `#[cfg(test)]` is `spawn_driver` returning its `tokio::task::JoinHandle<()>` so a test can own and settle the real task; its single production caller binds it as `_driver` and drops it, which detaches exactly as discarding the handle did, so no shipped behaviour moves. On that seam, three `#[cfg(unix)]` cases now run against the real driver. `a_rolling_live_start_also_releases_a_stopped_encoder` registers a rolling-live waiter, deliberately sends no rendition kick, holds the belief at `Producer::Stopped` across `STOPPED_ENCODER_POLL` less one millisecond, and only past the poll sees the child reaped with `plurx_vod_producer_terminations_total{why=\"yield_to_waiter\"} 1` and the permit taken by a contending `Encoding`. `a_yielded_encoder_does_not_take_the_permit_back_while_still_ahead` parks a rendezvous barrier in the `admission_pause` seam and pins both sides of the boundary: a yielded rendition must not reach admission one segment above the `AHEAD_RESUME_SECONDS` low-water line, and must reach it at the line. `an_idle_stopped_encoder_is_reclaimed_after_the_session_ttl` proves the stopped child keeps its whole bundle until `maintain` detaches the last reader past `SESSION_IDLE_TTL`, then that the woken driver reaps it with `why=\"idle\"` and `try_admit_bundle` reacquires the full permit. Reverting the returned handle and the two test-only poll `Notify` fields makes all three fail to compile; reverting the `ahead_hold` latch, the `YieldToWaiter` contention step, or the one-second stopped-encoder poll wired by `4ff38c77`, `41211a5f` and `637f7443` makes them fail on their assertions rather than silently pass a hand-driven `driver_pass`. All three run under `cargo test --workspace`, which `rust-gate` reaches through `make rust-check` -> `test` -> `unit`."
