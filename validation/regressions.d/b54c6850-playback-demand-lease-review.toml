reason = "The rolling-control regressions require a claimed expiry to report its committed terminal facts, make a Snapshot command received at the exact actor deadline claim expiry before replying, and deny a physical producer signal at the same shared deadline even before timer scheduling. Playlist tests distinguish a successfully published response from startup timeout and in-flight waiting, while the retained-window case proves a pruned segment cannot renew the actor lease. The HTTP response commit points keep init, media, conditional, generated-playlist, subtitle, and VOD capability ownership fenced after object validation. The pure browser policy test pins distinct legacy, explicit-demand, and immutable-VOD lease labels in the shipped overlay. Reverting the review corrections revives a post-expiry signal, lets failed requests manufacture liveness, or reports a five-minute VOD lease as legacy."
