reason = "The correction and its evidence landed together in `crates/plurxd/src/http/hls.rs` and `crates/plurxd/src/transcode.rs`. An fMP4 AVC session published the profile/level string the session was started with rather than the one its `init.mp4` actually carries, and `master_requires_attempt_init` treated an `avc1` master as generation metadata, so the stale string was sealed into a stable contract and served for the life of the session. `an_fmp4_avc_session_normalises_its_codec_from_the_init` starts a session declaring `avc1.640034`, writes the H.264 fixture's real init bytes, and requires `exact_hls_context` to answer with the triplet derived from those bytes plus `mp4a.40.2`; without the derivation the declared string comes back unchanged and the assertion fails. `an_fmp4_avc_master_is_attempt_media_not_generation_metadata` requires a `SessionKind::Copy` `avc1` presentation to leave `sealed_stable_master_contract` unset while a `SessionKind::Transcode` one still sets it, so dropping the copy-session arm reseals the master and fails the first assertion. `an_mpegts_session_keeps_its_static_codec_string` requires a rolling MPEG-TS session, which has no initialization object to inspect, to come back byte-identical to its context, so the derivation cannot spread to sessions that have nothing to read. `avc_codec_from_init_reads_the_avcc_triplet` and `avc_codec_from_init_refuses_a_truncated_box` pin the derivation itself and its refusal to answer from an incomplete record; both names survive into the later `avc_rfc6381_codec` rewrite on this branch and still guard the same two outcomes. All of it runs under `cargo test -p plurxd`, which `rust-gate` and `rust-gate-ci` both run."
