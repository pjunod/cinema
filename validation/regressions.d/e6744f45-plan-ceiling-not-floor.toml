reason = "`an_sdr_title_from_a_pq_capable_client_is_not_a_mismatch` (crates/plurxd/src/http/hls.rs) fails against the pre-fix code on its first assertion: deriving `hdr10` from the caps document alone returns true for every PQ-capable client, so an ordinary SDR create both reported a plan mismatch and had its `hdr10` request rewritten to true, which moves `capability_height_ceiling_for_request`'s answer for a request that never asked for the HDR10 rung. `a_client_may_decline_the_plan_but_not_exceed_it` (same file) fails on `!declined.preserve_dolby_vision`: the both-directions clamp rewrote a client's `false` back to the derived `true`, which is Apple's compatible-base retry being handed the exact stream it just failed on, on every retry. `a_per_profile_ceiling_narrows_by_profile_and_falls_back_to_the_narrowest` (crates/plurx-core/src/playback/mod.rs) fails on the `None` case: the old fallback read `video_max_heights`, which `from_caps_v2` sets to the maximum across a codec's entries, so a client reporting `hevc/main 2160` and `hevc/main10 1080` was admitted a 4K Main10 direct play whenever ffprobe left `video_profile` null. `a_presentation_claim_is_not_a_display_claim` (crates/plurxd/src/http/stream.rs) fails on `!profile.supports_hdr`: `hdr10t=1&hdr=0` newly claimed HDR display support, which direct-plays PQ into an SDR panel — it renders grey and plays, so it is never reported. `learner_route_matrix_admits_only_bounded_reads_and_node_local_media` (crates/plurxd/src/http/mod.rs) fails on the POST decision row, which every learner node answered with 503 while answering the identical GET. `an_imperfect_capabilities_document_degrades_instead_of_refusing` (crates/plurxd/src/http/stream.rs) fails at parse: a `learned_limits` entry without `identity`, or an unrecognised transfer curve, failed the whole document and therefore the whole create. `the_capabilities_document_is_bounded_before_it_is_walked` (crates/plurxd/src/http/mod.rs) fails on the first assertion without the route's `DefaultBodyLimit`, and `every_review_is_counted_and_the_parts_never_exceed_the_total` (crates/plurxd/src/http/hls.rs) pins the counters that are the fleet's only view of this."
