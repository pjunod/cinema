reason = "The web player had no decoder rescue at all: a fatal `mediaError` from hls.js went straight to `notifyPlaybackControl(\"failed\")`. This commit adds `HLS_MEDIA_RECOVERY` and `hlsMediaFatalAction` to `crates/plurxd/src/web/playback-policy.js`, the `recover`/`swap_audio` branch ahead of that terminal report in `onHlsError`, and the `mediaRecoveries`/`mediaRecoveredAtMs` counters the branch spends in `crates/plurxd/src/web/player/decode-tiers.js`. Its evidence is the new `tests/playback/web-media-recovery.test.js`, added to `make web-check` in the same commit, plus the `hls.js media recovery is fenced by the shared attach and item budgets` case in `tests/playback/web-policy.test.js`; both run under `web-static`. The policy cases pin every decision the new function makes — one rescue per attach against the shared `hlsRetryAllowed` budget, at most two per item across internal reopens, nothing inside the 4 s settle window, `bufferIncompatibleCodecsError` and `bufferAddCodecError` never rescued, a second-round audio `bufferAppendError` answered with `swap_audio`, and a `networkError` answered `none` — and both files also read the served `onHlsError` to require that the `PlaybackPolicy.hlsMediaFatalAction` call precedes the terminal `notifyPlaybackControl(\"failed\")` and that the handler forwards `sourceBufferName` and spends `hlsRetryUsed`. Reverting the policy function leaves those requires unresolvable and reverting the `onHlsError` branch fails the ordering assertions, so either half of the revert turns `make web-check` red."
