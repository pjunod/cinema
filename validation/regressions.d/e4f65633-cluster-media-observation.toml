reason = "Retained exact-auth fixtures distinguish sender, signed nonce, method, normalized path, and raw-body mutations; allow identical concurrent envelopes with distinct nonces; exercise bounded nonce replay-window expiry and saturation; and keep household bearer rejection at the internal handlers. The shared transport fixture requires a canonical nonce and refuses redirects, declared content-length and chunked bodies above its exact budget, and a response body stalled past the caller's deadline. Snapshot fixtures directly reject wrong identity and protocol, cover the remaining signed fifteen-second lifetime and one-node no-HTTP behavior, and start the ninth peer while the first eight futures are blackholed. Root helpers cover reachable-peer gating, most-specific-root selection, and fact expiry; production roots run in disposable child processes under one common deadline, so a timed-out or removed mount cannot retain daemon worker admission. Offer helpers cover the common 200 ms fan-out deadline, exact audio/subtitle index existence, heterogeneous capability filtering, and ranking of explicit cache/eligibility/pressure values. Transcode request paths read an atomic background scratch sample that fails closed at its exact maximum age, while the sampler retains at most one uncancellable OS call. These checks intentionally make no claim that pure ranking fixtures execute every production refusal branch or that an absent-path fixture alone proves a source open was never attempted."
