reason = "Retained exact-auth fixtures distinguish sender, signed nonce, method, normalized path, and raw-body mutations; allow identical concurrent envelopes with distinct nonces; exercise bounded nonce replay-window expiry and saturation; and keep household bearer rejection at the internal handlers. Exact-request verification also has a tested fail-closed global rate bucket before body hashing and Ed25519 work, while the existing per-peer authority limit remains after successful verification. The shared transport fixture requires a canonical nonce and refuses redirects, declared content-length and chunked bodies above its exact budget, and a response body stalled past the caller's deadline. Snapshot fixtures directly reject wrong identity and protocol, cover the remaining signed fifteen-second lifetime and one-node no-HTTP behavior, and start the ninth peer while the first eight futures are blackholed. Root fixtures cover reachable-peer gating, command-safe normalization of supported relative roots, the configured root bound, most-specific-root selection, fact expiry, production deadline-aware reaping of an already successful child, retention of a killed child until explicit reap, and the capacity remaining after one complete timed-out generation. Production probes force symlinks to resolve as directories, start their common deadline before child launch, check that deadline before every child and at publication under the registry lock, use deadline-aware reaping throughout the refresh, and perform process launch behind one non-accumulating blocking supervisor. Offer helpers cover the common 200 ms fan-out deadline, exact audio/subtitle index existence, heterogeneous capability filtering, and ranking of explicit cache/eligibility/pressure values. Cache-hit offers now fail closed while one background byte verifier owns the global gate and reuse only a fresh bounded verdict; the retained test proves pending refusal, later verified reuse, and asynchronous corrupt-generation invalidation. Transcode request paths read a conventionally fenced seqlock-published background scratch sample that fails closed during publication and at its exact maximum age, while the sampler retains at most one uncancellable OS call. These checks intentionally make no claim that pure ranking fixtures execute every production refusal branch or that an absent-path fixture alone proves a source open was never attempted."
