reason = "Retained exact-auth fixtures distinguish sender, method, normalized path, and raw-body mutations; exercise bounded replay-window expiry and saturation; and keep household bearer rejection at the internal handlers. The shared transport fixture refuses redirects, declared content-length and chunked bodies above its exact budget, and a response body stalled past the caller's deadline. Snapshot fixtures cover identity/protocol bounds, the remaining signed fifteen-second lifetime, one-node no-HTTP behavior, and immediate ninth-peer polling while the first eight futures are blackholed. Root helpers cover reachable-peer gating, no resubmission of an outstanding OS probe, most-specific-root selection, and fact expiry. Offer helpers cover the common 200 ms fan-out deadline, exact audio/subtitle index existence, heterogeneous capability filtering, and ranking of explicit cache/eligibility/pressure values. Transcode request paths read an atomic background scratch sample, while the sampler and root registry each retain at most one uncancellable OS call per resource. These checks intentionally make no claim that pure ranking fixtures execute every production refusal branch or that an absent-path fixture alone proves a source open was never attempted."
