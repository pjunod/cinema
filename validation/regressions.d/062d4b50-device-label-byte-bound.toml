checks = ["rust-gate", "rust-gate-ci", "cluster-auth", "security-boundaries", "resource-bounds"]
reason = "Sole adversarial review of PR #433, finding P1: the device label a client sends at login was unbounded, so `TOKEN_SUMMARY_MAX` = 256 bounded the rows of a devices read but nothing bounded its bytes. `/auth/login` inherited axum's 2 MiB default body limit, both Stores persisted the label verbatim, and `list_tokens_for_user` materialized up to 256 whole labels before serialization, so one authenticated account could mint sessions with near-body-limit labels and turn a single `GET /api/v1/me/devices` into hundreds of MiB of allocation and response, replicating each label to every cluster member on the way. `MAX_DEVICE_LABEL_BYTES` = 256 is the bound, chosen so the worst case is arithmetic (256 rows x 256 bytes is a 64 KiB ceiling on the labels in one response) while staying above the roughly 150 bytes a user-agent-derived model name costs and above names in scripts that cost three bytes per character. Two tests pin it. `http::tests::login_bounds_the_device_label_and_caps_its_request_body` drives the real router: a label of exactly the bound logs in and is stored whole; one byte over is 400 with a message naming the device label and mints no token; a one-megabyte body is 413 from the route's own 8 KiB limit before the JSON is parsed, before any Argon2 work and before the Store is read; and the account ends with exactly the two sessions that were supposed to exist, so the refused attempts created nothing. `store::sqlite::users::tests::device_inventory_bounds_label_bytes_at_the_write_and_at_the_projection` pins both halves of the bound in the Store: a 4 KiB label written through `create_token` is capped to 256 bytes in the column itself, and two rows inserted by raw SQL with 64 KiB labels - one ASCII, one two bytes per character, standing in for a database written before this bound existed - both come back at exactly 256 bytes, as prefixes of what was stored, on a character boundary, with the row still listed rather than dropped, and the serialized inventory bounded by rows times the byte bound. On revert, each half fails on its own and was proved to. Removing the login validation makes the over-bound login return 200 with a minted token. Removing the route's 8 KiB body limit makes the megabyte body reach the handler and answer 400 instead of 413, so the parse and the allocation happen. Removing the Store write cap leaves a 4 KiB label in the column. Removing only the projection cap, with the write cap kept, projects the legacy row at its full 65,536 bytes - which is the response amplification the finding describes, reproduced in one assertion."
