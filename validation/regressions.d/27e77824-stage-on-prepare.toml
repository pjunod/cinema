reason = "a_vod_session_resolves_a_preparation_gate is the one that would have caught the defect this change shipped in its first form: it requires a session installed in the VOD engine to resolve a gate, and deleting the VOD arm of session_preparation_gate fails it. Every public create is Presentation::Vod, so a gate resolved through the rolling registry alone stages nothing in production while its own acceptance passes against a registry viewers never enter — which is precisely what PreparationGate's doc predicts and precisely what happened. a_prepared_transition_stages_a_successor_and_leaves_the_pointer_alone is §3.4's stated acceptance and its pointer assertion is load-bearing: activate_media_session reaps the predecessor and advances media_playback_pointers unconditionally, so a preparation built on it would retire the stream the viewer is still watching while a test that only checked a successor exists passed anyway. a_staged_successor_commits_into_a_usable_route commits the successor and reads the route back, because the staged-row read carries neither recipe_json nor response_json and therefore cannot see whether the row is usable at all; it requires the response to parse as a StartResponse and to carry a control bootstrap, without which the successor's first exchange is a 404 session_gone, requires the source snapshot to be the file's real size and mtime rather than the 0/0 sentinel that refuses a takeover forever, and requires previous_session_id and reopen_reason to be cleared so a successor does not stage claiming to be a stall reopen of a session that is still playing. a_staged_successor_resumes_at_the_accepted_playhead_not_the_fetch_frontier pins both start_seconds and media_origin_ms to the film time the accepted control envelope reported. It replaces this commit's original frontier assertion, which pinned the P1-6 defect in place: candidate_request clones the predecessor's request and overwrites only the selection, so committing its start would restart the film for a viewer forty minutes in — but media_origin_ms + fetched_through_ms, what this commit staged instead, is a high-water fetch mark that reaches the end of a segment as soon as the client asks for it and survives prefetch, retry and backward seeks, so it begins the successor past film the viewer has never been shown. Its arrangement separates all three candidates by construction — origin 90 000, accepted playhead 120 000, fetch frontier 240 000, double-counted origin 210 000 — so no assertion in it can pass for the wrong reason. the_control_seam_stages_from_the_accepted_playhead_not_the_route_frontier and a_backward_seek_stages_from_the_seek_target_at_the_control_seam prove the same resume through two real control_local_inner exchanges rather than the helper, because the helper test would still pass if the exchange handed it the wrong number; the backward-seek case is the one the frontier cannot survive, since the client has already fetched far past where the viewer just asked to go. a_prepare_decision_at_the_seam_reaches_the_ledger drives record_preparation_shadow rather than the staging helper, because the first version tested the helper and a mutation deleting the call that fires it survived the entire suite — the decision counted and nothing staged, which is the shadow behaviour this commit replaces. a_client_that_cannot_prepare_stages_nothing_at_the_seam runs the same seam with dual_player_preparation false and requires an empty ledger, proving the gate is the retained capability field rather than the platform enum. a_second_prepared_transition_is_refused_by_the_one_successor_slot requires the first staged successor to survive a second attempt rather than be replaced, and a_playback_with_no_live_worker_stages_nothing requires no row when no engine resolves a gate, because such a row holds a saturated user's admission slot until the maintenance backstop finds it."
