reason = "`a_record_claiming_an_enhancement_layer_the_samples_lack_is_corrected` (crates/plurx-core/src/fmp4.rs) fails against the pre-fix code on its third arm: `promote_from` did not touch the Dolby Vision record at all, so an init seeded with the exact shape the strip produces — profile 7, `el_present` set, over samples with no type-63 NAL — came back unchanged and still declaring an enhancement layer the stream does not carry. Its first two arms pin the directions that must NOT change anything: an absent observation and an observation that the layer is present. `the_enhancement_layer_observation_is_asked_only_where_it_means_something` fails without the `dolby_vision_config` guard in `PromotionInputs::from_fragment`, which would put an answer into digest-compared stored inputs for every ordinary HEVC track; its last arm pins that the correction only ever removes a claim and never adds one, which is the property that keeps a single access unit from asserting a layer for the whole stream. `promotion_inputs_from_before_this_field_still_decode_and_change_nothing` fails without `#[serde(default)]` on the new field: `PromotionInputs` is persisted per rendition and digest-compared on every later generation, so a field that failed to decode would refuse every open rendition on the fleet for `PromotionDrift` the moment this shipped. The evidence itself was measured rather than assumed — `docs/PLAYBACK-CAPS-V2-M0.md` section 8 records the ffprobe output showing a stripped Profile 7 output still reporting `dv_profile=7, el_present_flag=1, compat=6`."
