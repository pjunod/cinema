reason = "The M3 review round, mapped where its evidence lives. The lease-loop finding — every VOD route settled as stale ~3 s after create — is pinned by `lease_and_reopen_surfaces_report_live_sessions_only`: the surfaces the loop reads must list live VOD sessions and must not list tombstoned ones, which is also what ends a superseded session's route. The generation-lifetime pair is pinned from both sides: `a_kill_on_a_fragment_boundary_publishes_no_partial_entry` requires a drained pipe to be treated as a killed pipe (ffmpeg flushes per fragment, so a SIGKILL routinely lands exactly on a boundary — publishing the pending rump puts a fraction of a segment behind a permanent cache hit), and `a_stale_generations_write_is_refused` keeps a dead generation's queued bytes out of the manifest, the counters and the new producer's belief, which is the same respawn-loop discipline e8234c54 built, extended to the writer. The audio-tail contract is held by three tests at three layers: `the_plan_derives_video_from_the_index_and_audio_from_the_container` (a plan whose two durations are one container number never plans a tail), `an_unplanned_rump_one_past_the_plan_is_dropped_not_a_failure` (a sub-threshold rump the playlist never names must not poison the rendition at the end of every complete watch), and `a_seek_into_the_audio_tail_spawns_at_the_last_video_entry_and_serves_the_tail` (the scheduler must not position a generation at an entry no generation can start inside). Adoption is held by `a_resurrection_missing_only_its_init_regenerates_the_head_and_keeps_the_segments` and `a_resurrection_whose_identity_cannot_be_verified_purges_and_reproduces`, with `making_a_rendition_durable_fails_loudly_when_the_init_is_missing` closing the admission hole underneath them. The eviction/wait races are pinned by `a_satisfy_that_raced_registration_is_not_a_lost_wakeup`, `an_init_write_wakes_a_blocked_init_get`, `a_failure_wakes_a_blocked_init_get`, `a_purge_never_takes_a_rendition_a_create_just_attached`, `replacing_a_failed_rendition_keeps_the_working_set_honest` and `the_etag_changes_across_an_evict_and_regenerate`."
