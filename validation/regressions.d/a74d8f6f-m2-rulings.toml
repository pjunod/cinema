reason = "`promoting_from_captured_inputs_does_not_depend_on_the_landing_fragment` builds the minimal-hvcC shape promotion actually fires on and asserts the collision is real -- two landing fragments differing by one byte produce two different served inits -- before asserting captured inputs remove it. The first assertion is load-bearing: without it the second passes on any source promotion no-ops on, which is what a synthetic corpus gives you. `a_generation_landing_where_promotion_finds_nothing_still_serves_the_same_init` covers the other failure, where a landing fragment simply lacks the SEI and a naive compare refuses a generation whose media the stored init describes perfectly. `capturing_inputs_reproduces_what_promoting_from_the_fragment_would_do` keeps the canonical path from becoming a second implementation of promotion. `a_real_pipe_reports_its_parameter_sets_constant` requires the indexer to run the constancy check and to report the corpus carries nothing promotable, so a corpus that silently changed could not make the check pass for the wrong reason. `a_second_generation_serves_the_same_bytes_as_the_first` and `a_changed_video_pipeline_is_refused_before_a_segment_is_written` pin which digest is compared and what each refusal means. `a_segment_whose_length_disagrees_with_the_record_is_not_adopted` catches the torn write a zero-length check cannot see; `an_adopted_segment_nothing_claimed_keeps_its_own_length` bounds it so an unclaimed file is still adopted. `making_a_rendition_durable_covers_every_member_and_the_init` requires a rendition with holes to be syncable, and `making_a_rendition_durable_fails_loudly_when_a_member_is_missing` requires admission to refuse rather than promise presence for a member nothing can open. `rendition_plan_contract_runs_through_dyn_store` now exercises both sweep queries on both backends, which is where SQLite reading one database and hiqlite crossing its sidecar and the replicated table must agree. `sidecar_v4_keeps_everything_it_has_across_the_later_upgrades` requires the index table to survive the upgrade and a pre-v3 row to be refused rather than read."
