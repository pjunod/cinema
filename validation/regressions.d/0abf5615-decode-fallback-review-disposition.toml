reason = "The disposition of the sole adversarial review of `plan/S-13` (PR #424 comment 3333). Three corrections, each named with the test that holds it. (1) Hit-only phase latency. `DecodeFactMetrics::prometheus` published one `plurx_decode_facts_phase_seconds` histogram per phase and outcome over both cache hits and misses, so the warm-hit cost of `gate_wait`, `identity_validation` and `source_observation` -- the only three phases a hit executes, and exactly the numbers M0's fleet measurement has to read before M3 may open -- shared a series with a cold miss's samples and could not be recovered from it. A histogram whose p95 is dominated by whichever titles missed that minute answers a different question from the one the milestone asks. The commit adds a second fixed-cardinality `hit_phases: [DecodeFactPhaseCell; 5]` array with `record_hit_phase`, called for those three phases only on the `Ok((facts, DecodeFactLookupResult::Hit))` return of `DecodeFactCache::get_or_probe`, and exposes it as `plurx_decode_facts_hit_phase_seconds`. The new family carries one label, `phase`, over the same five compile-time constants, so it adds a fixed five series and no unbounded dimension. `metrics_count_each_phase_once` in `crates/plurxd/src/decode_facts.rs` is the regression. The commit adds `sleep 0.2` to that test's `/bin/sh` ffprobe fixture so the miss is deliberately slow, then requires `plurx_decode_facts_hit_phase_seconds_count{phase=...}` to be 1 for each of `gate_wait`, `identity_validation` and `source_observation` and 0 for `collection` and `final_validation` after one miss followed by one hit. Record the hit phases on the miss path too, or leave them summed with the old histogram, and the two zero assertions fail on the 200 ms the miss spent in collection. (2) Collection latency recorded by the task that owns the work. The waiter took `phase_started` immediately before `await_owned_collection` and wrote the `DecodeFactPhase::Collection` sample once that await returned, so when the caller's budget expired the sample was published at the instant the waiter gave up: it carried the waiter's elapsed time rather than the probe's, and it declared the phase finished while the detached task was still killing and reaping the child and had not yet released the source's offset gate. The commit moves the timer and the `record_phase` call inside the `tokio::spawn`ed collection task, which already owns the child and the singleflight permit, and passes it an `Arc::clone` of the metrics. `pidfd_read_failure_retains_source_ownership_until_reap` in `crates/plurxd/src/decode_facts.rs` pins both halves: it binds the cache to a local so the metrics can be read, asserts `plurx_decode_facts_phase_seconds_count{phase=\"collection\",outcome=\"deadline\"} 0` at the point where the caller has already detached with `Err(Deadline)` and the ownership semaphore is still held, then waits inside a 250 ms `tokio::time::timeout` for that same count to reach 1 only after `ownership.acquire_owned()` has returned. Move the recording back to the waiter and the first assertion fails, because the sample is already 1 while the child is still being reaped. (3) The caller-contract seam. `resolve_held_movie_plan` can now return an error that is a refusal rather than a planning failure, and its two callers must dispose of it differently: immutable VOD has to wrap it into the typed `vod_decoder_plan_refused` string that `vod_refusal` parses, so the HTTP layer answers a classified refusal instead of an anonymous 500, while the pretranscode job has to receive the raw actionable text for its own retry and settlement. That asymmetry previously existed only as a `map_err` on one of the two call sites with nothing asserting it. The commit introduces `BoundPlanCaller::{Pretranscode, Vod}` and `finish`, routes both call sites through it, and `source_change_refuses_bound_plan` in `crates/plurxd/src/transcode.rs` gains the two assertions: `vod_refusal` of `BoundPlanCaller::Vod.finish(Err(reason))` must be `Some((\"vod_decoder_plan_refused\", reason))`, and `BoundPlanCaller::Pretranscode.finish(Err(reason))` must be the untouched `Err(reason)`. Drop the VOD wrapping and the first fails with `None`, which is the unclassified string the HTTP mapper renders as a 500; wrap both and the second fails. The commit also extracts `resolve_held_movie_plan_facts` out of `resolve_held_movie_plan` so the fallback disposition can be driven with a synthetic `Err(DecodeFactError)`, and rewrites `held_plan_fallback_reasons` from a pure mapping table into a test of the real disposition -- a `PlanSourceBinding::CatalogRow` plan plus the recorded counter for every non-identity failure -- which is the strengthening described in the 8432e9bc entry beside this one. What is NOT pinned, stated plainly: nothing asserts the absolute latency values in either histogram, only that the right series exist and are attributed to the right lookup outcome, and the production-static-binary cold/warm measurement those series exist to serve is still open fleet evidence in `docs/streaming/DECODE-FACTS-GATE-AND-FALLBACK.md`."
