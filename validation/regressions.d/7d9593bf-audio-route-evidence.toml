reason = "The correction and its evidence landed together across `crates/plurx-core/src/playback/audio.rs`, `crates/plurx-core/src/playback/caps.rs`, `crates/plurx-core/src/transcode/recipe.rs`, and `crates/plurxd/src/http/stream.rs`. One number -- a client's channel ceiling for a codec -- was being read as four independent claims at once: that a decoder for that codec exists, that the sink can reproduce that many channels, that the route may pass the bitstream through untouched, and that the source's sample rate is reproducible. So a client that reported six E-AC-3 channels and nothing else had its bitstream copied with no decoder or passthrough evidence behind it, and a 44.1 kHz source was copied onto a route whose sink had never claimed that rate. `resolve_audio` now admits a copy only when the sink's channel ceiling, its declared `sample_rates_hz`, and either a true `passthrough` flag or a `claimed_audio_decoders` entry all agree, and the new `output_admitted` applies the same three-part test before selecting an E-AC-3 or AC-3 output. `sink_only_and_false_passthrough_do_not_authorize_copy` landed in the same commit and runs the identical six-channel E-AC-3 sink twice, once with `passthrough` false and once true, requiring `AudioAction::Copy` in exactly the true case; restoring the old `fits_sink` admission copies in both and fails it. `copy_requires_known_compatible_source_and_sink_sample_rates` pins the rate half against a claimed AAC sink: an absent `sample_rate` must transcode, 44.1 kHz must transcode, and only 48 kHz may copy, so dropping `rate_admitted` from the admission fails the first two assertions. `sink_claims_are_bounded_and_unambiguous` grew the two new `validate_audio_sinks` verdicts in the same commit, so a caps payload carrying a duplicate or an out-of-range sample rate must still be refused by name rather than reaching profile translation. On the daemon side `flat_audio_channel_claim_is_bounded_at_the_request_boundary` parses `achannels=0`, `achannels=17`, and `achannels=255` and requires each to be rejected at the request boundary; removing the `deserialize_audio_channels` hook lets all three through as ordinary `u8` values and fails it, while `achannels=16` must keep parsing as the documented ceiling. `progressive_aac_conversion_is_pinned_to_forty_eight_khz` fixes the remux argument vector, so putting `-c:a aac -ac 2 -b:a 256k` back without `-ar 48000` fails it, and the untouched arm must stay exactly `-c:a copy`. Because a pinned output rate changes produced bytes, `CACHE_RECIPE_VERSION` moved to 4 and the recipe key gained an `arate` field; `planned_v4_recipe_hash_is_a_golden_fixture` pins the exact digest, so reverting either the version bump or the field changes the hash and fails it. Every one of these is a `plurx-core` or `plurxd` unit test, which `rust-gate` runs through `make rust-check` and `rust-gate-ci` through `make ci-rust-gate`; both `cargo test` the workspace."
