reason = "The web-layout and VOD browser gates were scheduled simultaneously onto the two m6 runner VMs, which share one physical host. Under that contention the VOD player advanced at 0.5% speed with 124 visible hitches, while one otherwise-settled layout capture received a transient 500 from the activity endpoint; the same exact capture and all 72 layout cases passed without contention. The first repair assigned both jobs one non-canceling concurrency group and added an operations contract for it. Forgejo 16 accepted the configuration but continued to execute both siblings together; the follow-up corrective commit replaces that advisory grouping with a hard dependency in the workflow graph."
