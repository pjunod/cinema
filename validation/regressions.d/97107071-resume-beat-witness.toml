reason = "A startup that never presents a frame must not report a position. `reportProgress` builds its beat from `bookOffset + (offset + currentTime)`, so a session whose playlist never publishes leaves the element at readyState 0 with currentTime 0, and on a VOD or direct timeline `offset` is 0 as well - the beat that reaches `POST /items/:id/progress` is position 0 and the server takes it, destroying the resume point the viewer earned. `tests/web/progress-never-presented.test.js` runs in the embedded-JavaScript gate against the served shell and holds the shape of the rule: a zero beat needs a witness and a positioned beat does not, and the witness is the current attachment rather than the player. `a startup that never presented a frame reports nothing` is the regression itself. `a predecessor's close-time beat still reports its playhead` requires the positioned exemption, because closePlayer reports for a predecessor through `attachedOwner` against an element it no longer owns and that beat is the only save of a title watched for ninety minutes - the first draft of this fix suppressed it and turned `tests/playback/web-control.test.js` red. `evidence does not carry across a re-attach` requires the attachment scoping, because a stall retry and a quality reopen both reuse the player object while resetting the element and zeroing `offset`, so a per-player witness would readmit the same zero beats one button press later. `metadata alone is enough of a witness` pins the HAVE_METADATA boundary and `a genuine start-over reports its zero` keeps Start over writing its real zero. Every mutant is caught: guard removed, witness made sticky per player, predicate tightened to readyState>=2, and witness demanded of every beat including a positioned one."
