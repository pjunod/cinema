reason = "a_detached_viewer_stops_being_demand_with_its_reader is the end-to-end proof, and the one that fails against the code this commit replaces. Two viewers hold parked requests on the same rendition; one detaches, and its request must leave with its reader while the other's survives. Deleting the retire call from detach_reader fails it at 2 demands against 1. It is deliberately at the vodserve level rather than the pool level because the defect was not in the pool -- retiring worked, nothing called it -- and a pool-only test passes with detach_reader unchanged, which is how the gap existed in the first place. a_departing_session_takes_its_own_waits_and_nobody_elses pins the pool half: the departing session's waiter is answered Gone rather than left to time out, a second session waiting on the same index is untouched and is still served normally afterwards, and the surviving waits keep their cap slots. Both halves matter because playback_demands marks a session's oldest wait foreground exactly when it cannot find a reader to rank it against, so an abandoned request outranks a present viewer's and takes the producer with it. a_working_set_locked_inside_reader_windows_is_no_room_not_a_sweep pins the second defect and states both outcomes from one fixture: with nothing protected the answer is still MakeRoom, and with a reader window covering the whole materialized run it is Suspend with Hold::NoRoom. Removing the reader guard from has_evictable fails it. The distinction is that without it decide asked for room, the sweep skipped every protected index and freed zero bytes, and only then did the driver terminate the producer. This entry originally went further and claimed the change was what let a viewer see no_room; that was false and the adversarial review of this commit caught it. Suspend with NoRoom routes to Terminate for a running or stopped producer and after hard-codes Ahead for the only Stop that survives, so Producer::Stopped with reason NoRoom is unreachable and producer_hold could never carry it either before or after. On its own this commit skips a no-op sweep and changes no published state. The observability it was credited with is delivered by 259d331d, which records the capacity hold on the rendition and projects it across the terminated producer; the correction is recorded here rather than deleted so the history of what this commit actually proved stays readable. decide now takes the reader windows because the question it asks cannot be answered without them; every pre-existing call site passes an empty slice, which is precisely the behaviour it had before, so no existing decision changes."
