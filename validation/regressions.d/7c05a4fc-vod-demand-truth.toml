reason = "a_detached_viewer_stops_being_demand_with_its_reader is the end-to-end proof, and the one that fails against the code this commit replaces. Two viewers hold parked requests on the same rendition; one detaches, and its request must leave with its reader while the other's survives. Deleting the retire call from detach_reader fails it at 2 demands against 1. It is deliberately at the vodserve level rather than the pool level because the defect was not in the pool -- retiring worked, nothing called it -- and a pool-only test passes with detach_reader unchanged, which is how the gap existed in the first place. a_departing_session_takes_its_own_waits_and_nobody_elses pins the pool half: the departing session's waiter is answered Gone rather than left to time out, a second session waiting on the same index is untouched and is still served normally afterwards, and the surviving waits keep their cap slots. Both halves matter because playback_demands marks a session's oldest wait foreground exactly when it cannot find a reader to rank it against, so an abandoned request outranks a present viewer's and takes the producer with it. a_working_set_locked_inside_reader_windows_is_no_room_not_a_sweep pins the second defect and states both outcomes from one fixture: with nothing protected the answer is still MakeRoom, and with a reader window covering the whole materialized run it is Suspend with Hold::NoRoom. Removing the reader guard from has_evictable fails it. The distinction is not cosmetic: without it decide asked for room, the sweep skipped every protected index and freed zero bytes, and the driver terminated the producer as one that had made no progress -- so the viewer's control plane saw a producer stop and never saw no_room, which is the only fact that explains why nothing is arriving. decide now takes the reader windows because the question it asks cannot be answered without them; every pre-existing call site passes an empty slice, which is precisely the behaviour it had before, so no existing decision changes."
