reason = "a_recorded_cause_is_not_overwritten_by_its_own_consequence pins the ordering this commit fixes. A publication fence records that the source moved and then stops the generation, which ends by reporting that its sink refused the bytes; before first-wins the consequence overwrote the diagnosis and the session published producer_write_failed for a source that moved, naming the wrong subsystem in the one field a client acts on. Restoring last-write-wins fails it at ProducerWriteFailed against SourceChanged. It also requires the sentence to stay with the class it was recorded beside, because the two are different audiences and a class paired with someone else's prose is worse than either alone. a_source_that_moves_is_published_as_a_source_change closes the coverage gap the review found: the class chosen at each record_failure site was invisible, because the only test that exercised recording supplied its own class. It moves the file under the fence the rendition took at create, drives a real segment GET through VodServe::segment, requires the refusal, and reads the class back off the session status; mislabelling that site fails it at reader_failed against source_changed. a_relay_passes_on_a_decision_it_does_not_know is what makes widening the vocabulary safe at all. ControlResponseV1::is_valid_for runs on the relaying node against that node's own compiled vocabulary, so during a rolling deploy an ingress on the older build would reject an owner's newer reason, collapse a good exchange into a 503 control_unavailable carrying a 500 ms retry, and make that session poll ten times faster than its own cadence until the deploy finished. The relay now bounds the shape of the name rather than its membership; restoring the membership check fails the test. Malformed names are still refused, so the bound is real. only_a_verdict_no_retry_can_change_is_permanent is renamed and widened because the split is no longer about the source alone: EngineChanged is permanent because the fragment-index engine baseline is a per-process OnceCell, so once it moves every planned rendition fails identically until the node restarts and a reopen re-plans straight back into the same verdict. The test also requires every permanent reason to carry its own terminal sentence rather than falling through terminal_message's default to the wire name. every_generation_failure_names_what_actually_happened now pins permanence per arm as well as the class, so a future variant cannot be added as retryable by omission."
