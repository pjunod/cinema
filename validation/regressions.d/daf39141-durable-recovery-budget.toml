[[coverage]]
commits = ["daf39141"]
points = ["playback.pipeline"]
checks = ["rust-gate", "rust-gate-ci"]
reason = "The preceding commit built the durable recovery ledger and gave it no caller, so the only limit on automatic decode recovery remained the in-process one-shot: one recovery per session, and a reopen, a seek or a track change mints a fresh session. Against a source that cannot be decoded that is one recovery per attempt forever, which is the reopen loop this effort is named after wearing a different hat - each attempt tears down a producer, installs a software-decode alternate, fails the same way, and hands the viewer another impermanent reason to try again. Two retained tests reject that base. `a_spent_recovery_budget_refuses_the_retry_before_anything_is_torn_down` (plurxd `transcode`) drives the production executor with a budget an earlier incarnation of the same playback already settled and requires three things at once: the retry is refused, the refusal names which refusal it was, and the failed producer is still running with no replacement opened - because reserving after `begin_child_replacement` would turn 'this playback already recovered' into 'this playback has nothing playing', and a test that only asserted the refusal would pass on that ordering. `a_recovery_that_fails_to_install_still_spends_the_budget` drives a real transaction failure and reads the row back to find it `exhausted` with the alternate's own plan digest on it, which is reachable only if the reservation happened before the install and the settlement happened after the failure; without the settle the row stays `reserved`, and since the schema never deletes one, every later continuation of that playback would find a recovery permanently in flight."
