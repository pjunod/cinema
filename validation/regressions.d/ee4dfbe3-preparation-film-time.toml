[[coverage]]
commits = ["ee4dfbe3"]
points = ["playback.pipeline"]
checks = ["rust-gate", "rust-gate-ci"]
reason = "a_staged_successor_resumes_at_the_accepted_playhead_not_the_fetch_frontier is the test that fails against the formula this commit removes. It arranges the one case that tells every candidate resume point apart — session origin 90 000, accepted playhead 120 000, fetch frontier 240 000, origin double-counted onto an already-absolute playhead 210 000 — so an assertion cannot pass for the wrong reason. Restoring media_origin_ms + fetched_through_ms fails it at 240 000. the_control_seam_stages_from_the_accepted_playhead_not_the_route_frontier is the one that would have caught a wrong capture rather than a wrong computation: the helper test still passes if the exchange hands the helper the wrong number, so this drives two real control_local_inner exchanges — the first establishing a preparation-capable client and a delivered selection, the second asking for a height that crosses both resolution and delivery method — and lets the detached candidate run exactly as production spawns it, with the route carrying a frontier deliberately different from the envelope's position. a_backward_seek_stages_from_the_seek_target_at_the_control_seam is the case a fetch frontier cannot survive at all: the client has already fetched far past where the viewer just asked to go, so the frontier stays high while the intended position drops, and resuming at the frontier drops the viewer back at the point they seeked away from. It also proves seek_target_ms outranks position_ms, which matters because mid-seek the reported position is still the old one — the same reason ControlRequestV1::validate anchors its buffer checks on seek_target_ms.unwrap_or(position_ms). a_resume_past_the_end_of_the_film_is_bounded_by_the_film covers the bound this commit adds: the resume is now client-reported rather than derived from what the server observed itself delivering, and validate deliberately allows one target duration of slack past the end so a client reporting the final segment's end is not refused, so without the seam clamp a client could stage a successor past the end of the film and hold the playback's one preparation slot, a durable row and an admission slot for a full PREPARATION_DEADLINE_MS on a resume nobody can reach. Deleting the clamp fails it at 6 002 000 against 6 000 000. staged_resume_ms reads all three places the resume is written — the route's media_origin_ms, the recipe's start_seconds and the bootstrap response's start_seconds, the last of which had no assertion anywhere in the suite before this — so a partial correction cannot leave a successor whose row, recipe and bootstrap disagree about where the film starts; writing 0.0 to that one field fails all four tests. Every seam test paces past the protocol's exchange floor through the shared pace_control_exchanges helper, because a second exchange inside MIN_CONTROL_INTERVAL is answered 429 and never reaches the selection engine, so a test that skipped the pacing would assert an empty ledger against a request the server declined to consider and would read as staging being broken. The frontier assertion these replace was pinning the defect rather than guarding against it; its rationale on 27e77824 is corrected in place rather than deleted, so the history of what that commit actually proved stays readable."
