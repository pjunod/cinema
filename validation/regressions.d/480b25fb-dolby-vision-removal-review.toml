reason = "`removing_the_record_also_removes_the_dolby_file_type_brand` stamps the dby1 brand movenc writes beside a Dolby Vision sample entry, removes the record, and requires no dby1 survives anywhere in the ftyp — the shape copyseg documents AVPlayer as refusing outright, which the previous commit created by deleting the record after the stale-brand sanitizer had already declined on it. `a_stripped_stream_still_gets_its_hdr10_static_metadata` requires the promoted init of a stripped Profile 7 title to carry the mdcv and clli boxes and to be byte-for-byte the size of a stream that never had a record; moving the removal back after promote_hdr10_static_metadata_from fails it, because that promotion refuses to run on an entry carrying a Dolby Vision record and the record is not yet gone. `removing_the_record_removes_every_spelling_of_it` splices both dvcC and dvvC into one sample entry and requires neither survives, since locate_hvcc reports the first it finds and stops while the parsed dolby_vision_config flag is cleared regardless. `shrinking_a_box_past_its_own_header_is_refused` drives shrink_box directly at its underflow guard, its largesize arm and its unknown-header refusal, none of which any fixture reaches, and requires the size be left alone rather than clamped — a saturating subtraction there yields an init that parses as a different file. `the_recovery_path_removes_a_stale_dolby_vision_record_and_its_brand` covers the live-HLS recovery path, which builds its served init directly rather than through promote_from and had no removal at all, and pins the order: removing after the brand sanitizer leaves dby1 over an entry with no record. `a_removing_pass_stores_the_ask_in_the_promotion_inputs` and the pass-selection assertions in `a_strip_without_dovi_rpu_asks_the_promotion_to_remove_the_record` cover the production wire, which could previously be disabled entirely with a constant-false guard while the suite stayed green. `a_removal_rides_the_promotion_and_refuses_to_be_a_rewrite_too` now promotes the regenerated init from a serde round trip rather than from the same in-memory value, so it asserts the stored form carries what promotion needs rather than that promotion is deterministic, and pins that a rendition stored before the field existed promotes unchanged. `the_stale_record_predicate_matches_every_filter_that_leaves_one` additionally drives all 48 combinations of copy_video_args, whose hand-rolled filter list does not call hevc_copy_bsf_for_copy and whose agreement with the predicate was previously untested."
