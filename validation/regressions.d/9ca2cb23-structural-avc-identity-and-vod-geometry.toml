reason = "The correction and its evidence landed together across `crates/plurx-core/src/fmp4.rs`, `crates/plurx-core/src/testfixtures.rs`, `crates/plurxd/src/http/hls.rs` and `crates/plurxd/src/transcode.rs`, closing two review gaps left by the preceding two commits on this branch. First, AVC identity was read by scanning the whole init for the first `avcC` byte sequence, so a payload in an unrelated box or a second, disagreeing sample description could become playlist identity. The new `plurx_core::fmp4::avc_rfc6381_codec` resolves the sample descriptions of the selected video track instead and refuses when they do not all agree. `avc_codec_from_init_ignores_an_earlier_decoy_box` splices a `free` box holding a complete decoy `avcC` (profile 0x4D, level 0x1F) ahead of the fixture's real one and requires the answer to be unchanged, so the byte scan returns `avc1.4D001F` and the test fails. `avc_codec_from_init_rejects_ambiguous_sample_descriptions` accepts duplicated descriptions that agree and then requires `Err(Fmp4Error::Unsupported)` once the second triplet is changed, which the byte scan cannot produce because it never looks past the first match. `avc_codec_from_init_refuses_a_truncated_box` requires `Err(Fmp4Error::Malformed)` from a truncated fixture init, and `avc_codec_from_init_reads_the_avcc_triplet` requires the sample-entry fourcc to be the track's own, checking that an `avc3` track is named `avc3.`. At the delivery boundary `an_fmp4_avc_session_refuses_ambiguous_sample_descriptions` requires `exact_hls_context` to answer `hls_init_unsupported` for that ambiguous init rather than publishing one of the two identities. The `duplicate_avc_sample_entry`, `replace_second_avc_triplet` and `replace_avc_sample_entry` helpers added to `testfixtures.rs` are what let those tests build the adversarial inits from a real fixture. Second, the encoded-VOD presentation set `file.height` to the requested rung height while taking `file.width` from `output_size`, so a 640x360 source asked for 1080 advertised 640x1080 and an unprobed source advertised a height it had no width for. `encoded_vod_presentation_never_mixes_source_width_with_requested_height` requires both coordinates of that case to stay 640x360 and `encoded_vod_presentation_omits_both_unprobed_dimensions` requires both to stay unset, so restoring the split assignment fails each of them on its height assertion. Everything named here runs under `cargo test -p plurx-core` and `cargo test -p plurxd`, which `rust-gate` and `rust-gate-ci` both run."
