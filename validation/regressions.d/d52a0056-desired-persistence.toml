reason = "an_ask_is_offered_for_persistence_until_the_write_has_landed is the regression, and it guards two failures that pull in opposite directions, which is why it walks a sequence rather than asserting one branch. Offering the ask on every exchange would put a durable write on a path that runs about once a second per client, for a row that is already correct, and would make an ordinary heartbeat fail on a store hiccup; the test requires a repeat of an already-persisted ask to offer nothing. Retiring the offer on the attempt rather than on the landing would leave the store one ask behind whenever a write failed, with nothing left to notice, because the client is refused, retries, and the retry then says nothing needs writing; the test requires an unacknowledged ask to still be offered, and marking it persisted at the point of offer fails that assertion by name. It also pins the opening ask: a session whose viewer never changes their mind must still have a row, or an admission point comparing against no row cannot tell that from a viewer who has asked for something new. And it pins the stale acknowledgement, where a write lands for an ask the viewer has already left: accepting it would mark the row as naming an ask it does not name, so it retires nothing and the newer offer survives. The handler half is ordering rather than state and is stated where it is enforced: the write precedes the accepted response, and a failure returns control_unavailable rather than answering, because reporting a request taken that nothing has recorded is worse for the viewer than one retried exchange and worse for everything downstream, which would be comparing against a row that does not say what the client was told. The persistence record is deliberately separate from the dispatch record, since a single flag would tie a durable write to a scheduling decision -- a candidate the slot refused would suppress the write, and a failed write would suppress the candidate -- and it is deliberately not cleared on an owner-epoch rollover, because the row is keyed by playback so it survives a takeover and clearing it would make every takeover rewrite a row that is already correct."
