reason = "Five exact-head adversarial findings are retained by tests that fail on their original implementations. `hardware_measurement_requires_the_backend_statement_and_context_to_agree` requires a successful decode, the requested-backend selection statement, and post-initialization hardware-frame evidence together, so the pre-initialization selection line from a failed device open no longer creates a hardware measurement. `the_complete_inventory_has_one_startup_budget` drives a wedged fake FFmpeg through the production inventory with an aggregate deadline and verifies cancellation removes the partial probe clip. `an_enabled_partial_policy_qualifies_only_its_exact_decode_path` enables the operator request with only the VideoToolbox path covered and proves that plan alone gets the receipt-qualified identity while its uncovered software peer keeps the stable identity; `ambiguous_coverage_is_not_reported_as_missing_coverage` proves one ambiguous path cannot hide or disable another uniquely covered path. `serialized_inventory_uses_the_same_backend_names_as_contract_coverage` and `the_system_record_reports_the_encoder_the_probe_selected` preserve the original `/api/v1/system` string field and pin the versioned backend-aware sibling. `Automatic recovery requires a covered hardware and software pair for one codec` rejects the crossed-codec readiness bug in the shipped Developer card, whose tests also require prerequisites to remain advisory and never disable the operator control."
