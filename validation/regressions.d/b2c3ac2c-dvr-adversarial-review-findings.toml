[[coverage]]
commits = ["b2c3ac2c"]
points = ["live.dvr"]
checks = ["rust-gate", "rust-gate-ci"]
reason = "The five P1s and ten P2s from the one adversarial review of `effort/live-tv-dvr`, each addressed in this commit. Coverage is uneven across them and is named here finding by finding rather than claimed wholesale. The severe one is fully pinned: every path a recording owned was built with `Path::with_extension`, which replaces everything after the *last* dot, and a recording basename ends `<title> - <date> - 7.1 - <id8>` — so the built path was truncated at the dot inside the channel number, discarding the sub-channel and the id, which are precisely what make the name unique. Two sub-channels carrying one programme title at one instant collided on one file. No existing test could catch it because the unit test asserted the `String` basename and never a built `PathBuf`. The fix routes every path through one `sibling(base, suffix)` helper, and `a_channel_number_is_not_mistaken_for_a_file_extension` in the `#[cfg(test)]` module of `crates/plurxd/src/live_tv/dvr.rs` is the regression: it builds two basenames differing only in `7.1` versus `7.2` and requires `assert_ne!(final_path(&seven_one), final_path(&seven_two))`. Restore `with_extension` and both collapse to the same `.ts` and it fails. `a_recordings_paths_are_all_siblings_of_one_basename` pins the other half — that the final file, the sidecar and each attempt are the same name plus a suffix, so the sidecar is found by dropping one suffix rather than by re-deriving it. The concatenation P1 is pinned by `attempts_are_joined_in_order_and_their_parts_removed` and `a_capture_that_wrote_nothing_joins_to_nothing`: the bug was that the cancellation path skipped `stop_sink`, leaving a buffered `tokio::fs::File` whose last writes had not reached the kernel, so the join copied a short part and unlinked it, losing the end of every recording that finished normally. The test's coverage is of the join itself — ordering, removal of the parts, an empty capture producing nothing — not of the flush ordering that was the actual defect; that the cancellation path now goes through `stop_sink` (which cancels, flushes and `sync_all`s before taking the file) is held by reading the source. `a_sidecar_says_what_the_capture_actually_got` covers the P2 that a stopped recording's sidecar lacked the source codec a completed one carried, because the probe's facts were read after the transport had already closed. `a_full_webhook_queue_drops_the_oldest_event` covers the P2 that the queue dropped the *incoming* event when full — `tokio`'s bounded channel drops at that end, which is the wrong one, since the recording that just started is the event somebody is waiting on and the reminder nobody could deliver an hour ago is not; the test fills `DvrEventQueue` past its bound and requires the survivor set to be the newest. The empty-guide P1 — reconciliation treating a cold, generation-changed or stale-window guide as evidence that every programme had moved, which on a settings save would have withdrawn every rule row and marked every manual row `stale` with nothing to bring it back — is held by the type, not by a test: reconciliation now takes `into_some_if_populated()` and cannot be handed an empty guide at all, and no test drives `dvr_tick` against a cold cache. The remaining P1s and P2s have no direct test and are stated here rather than dressed up: the purge of a `deleted` recording's files (the route can only write the decision; only the owner has the root), the ordering that allocates the tuner before creating the `O_EXCL` attempt file (a refusal used to leave an orphan that made that attempt number unusable for ever, and the next tick read its own orphan as a fenced predecessor's), the recordings-list cursor, `get_dvr_recording_for_airing`, the capacity refusal's holders surviving the ingress relay, a cancelled session no longer counted as occupancy, `root_writable` moved to `spawn_blocking`, the gap measured from `started_at_ms` rather than `created_at_ms`, the sweeps that bound spent reminders and unlinkable finishes, and \"until watched\" honouring the rule's owner rather than anyone in the house. Those are covered only by `cargo test -p plurxd` continuing to compile and by the store contract scenarios that surround them; an end-to-end DVR tick has no harness, and building one needs a tuner this repository's tests do not have. The Developer readiness expectation in `crates/plurxd/src/http/mod.rs` also gains `tuner_reserve`, which is genuinely `met` on a node that has never seen a tuner because it is arithmetic over two configured numbers, and `developer_readiness_reports_what_it_reads_and_admits_what_it_cannot` fails if that row silently becomes unobservable."
