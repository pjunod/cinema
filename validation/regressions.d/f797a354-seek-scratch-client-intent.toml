reason = "Relative seeks counted from the attached element's clock, so three separately committed +10 taps from 100 seconds all landed on 110 while a replacement was pending: the incumbent is still showing the predecessor, and every tap measured ten seconds from a position the viewer had already asked to leave. The base is now the committed destination until an attachment executes it, and the scrubber follows the same number rather than snapping back — which is what made the second tap look correct and land wrong. The shipped `nudge` and `nudgeKeyboard` are driven through the real player adapter in `tests/playback/web-policy.test.js`, which composes `pbRelativeSeekBase` and `unexecutedPlaybackDestinationSec` out of the shipped source rather than reimplementing them, and reads the coalescing window from `PlaybackPolicy.contractTiming` instead of duplicating 350. Restoring `me._seekPending!=null?me._seekPending:pbPosSec()` fails it. The same commit records what each execution is for — a normalized key over file, target, method, audio, subtitle, burn, height, force, auto rung, HDR10, Dolby Vision and audio offset — so an identical command arriving while its create is open is suppressed instead of superseding it. The key is deliberately the whole recipe: deduplicating on position alone would swallow a track change at the same second, which `playbackChangeRecipeKey` makes impossible by construction. Suppression happens in `seekTo` before `beginPlaybackControlSeek`, because bumping the intent generation first and then noticing the duplicate would cancel the still-authoritative execution it matched, and `forceReopen` — the explicit Try again and stall-restart path — always bypasses it."
