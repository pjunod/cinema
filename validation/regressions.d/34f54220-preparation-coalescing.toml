reason = "an_ask_arriving_while_the_slot_is_busy_is_dispatched_once_it_frees is the regression, and it drives the whole sequence rather than the branch, because every individual assertion in it is satisfiable by a gate that is wrong in the other direction. An unchanged steady state must stay silent -- candidates cost two store reads and the exchange runs about once a second per client, so a gate that dispatched whenever the ask was non-empty would be a store read per second per viewer. A real change against a free slot must dispatch exactly once, not on every exchange after it. Three changes against an occupied slot must dispatch nothing, since the slot takes one successor and staging would be refused. And the first exchange after the slot frees must dispatch the one ask that survived, which is the defect being fixed: the old gate asked whether this packet differed from the last one, so an ask arriving while a successor was in flight was true for exactly one exchange and the candidate was built, refused and never rebuilt. The viewer simply never got what they asked for, with the session continuing to serve the old selection and nothing recording that a request had been lost. Marking the ask dispatched when the slot refuses it -- which is what the old gate effectively did -- fails the test at that assertion by name. The first-exchange case is asserted too and is deliberately unchanged behaviour: a session's opening ask is what it was created for, so it is recorded as dispatched without building anything, which is what selection.changed did through is_some_and on None. Coalescing needs no separate test because it is structural: only the latest ask is ever held in desired_digest, so the three-changes loop in the test is also the proof that three changes leave one candidate rather than three, and there is no queue that could retain a stale one."
