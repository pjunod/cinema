reason = "Unit tests drive the verdict rule directly, including a replay of the fleet numbers that produced it (396 jobs picked up, 1118 waiting, 0 ready in 24 h classifies dead) and the cases most likely to become false alarms: nothing waiting and nothing built is idle rather than dead; a fresh daemon with a hard failure in the last day is healthy rather than degraded, because both sides of that ratio are now the same 24-hour window over the same table; one sample with a row past its lease is healthy while two consecutive samples are degraded; and both dead floors are pinned either side of their boundary. A backlog nobody claimed is dead rather than idle, which is the exact silence the milestone exists to break. the_prometheus_snapshot_answers_what_the_queue_verdict_asks drives one job through queued, claimed, past-lease and ready on both backends and reads every figure off the snapshot, so the SQL is covered rather than only the arithmetic over it; it also pins that a job inside its retry wait is not claimable and that both 24-hour figures expire together. An exposition test renders the gauge block, which no test entered before because both callers passed queue_health: None, and asserts the family is absent rather than zero before the first sample. Web tests assert each verdict renders a distinct sentence, that the two halves of dead read differently, and that no verdict sentence says 'this node' — the jobs table is replicated and records no observer. prometheus_scrape_has_no_store_operation still passes, which is what keeps the sampling in the metrics loop rather than the scrape. Removing the idle case makes an unindexed fleet alarm every night; removing the claimable count restores the silence a wedged queue used to enjoy; removing the shared window returns a degraded verdict on every daemon restart; removing the per-process baseline makes a queue that built nothing for three days read as healthy off cumulative counters."
