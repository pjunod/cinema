reason = "`a_planned_generation_emits_exactly_the_tail_entries_the_plan_named` builds the dangerous band exactly -- six seconds of video then five of audio alone, under the fifteen-second ceiling -- and requires the tail to be its own segment and the video segment to stop where video stops. Against the ceiling rule it fails with one segment where the plan named two, which is the reader blocked forever on a segment nothing emits. `losing_a_member_demotes_an_admitted_rendition` requires `forget` to clear both admitted and reserved and to leave the rendition evictable again, so B3 cannot return through the repair path. `an_admitted_rendition_offers_nothing_to_an_eviction_sweep`, `nothing_materialized_is_nothing_to_evict` and `a_segment_somebody_is_waiting_on_is_not_a_candidate` pin `has_evictable`, which is what turns a spinning MakeRoom into a reported stall. `a_producer_sitting_on_the_budget_line_does_not_thrash` walks the corrected hysteresis and now requires the amount to be measured to the release line, so a fix that freed back to the budget fails the middle assertion. `a_full_working_set_with_nothing_evictable_is_a_stall_and_says_so` requires `Hold::NoRoom` rather than a repeated MakeRoom. `a_full_working_set_with_nobody_waiting_stops_and_says_why` now requires an amount rather than a level. `an_empty_plan_is_refused_rather_than_stranding_the_key` requires the refusal and that the key stays usable. `a_plan_truncated_on_an_entry_boundary_is_caught_by_the_count` truncates on a whole entry -- the case the blob length cannot catch -- and requires the declared count to catch it. `reconciling_a_directory_that_agrees_changes_nothing` now requires the init to be present for a clean report."
