reason = "a_new_ask_in_the_same_packet_refuses_the_old_asks_commit is the regression for the ordering defect, and it drives both outcomes from one fixture so it cannot pass by refusing everything. A viewer who has not changed their mind still gets the successor they waited for; a viewer whose packet carries a new selection alongside the previous selection's Committed acknowledgement gets that successor aborted with acknowledgement_rejected instead of published. Moving the ask back below record_terminal_preparation_acknowledgement -- which is exactly the accept-then-observe ordering this replaces -- fails it, because the commit is then decided against a selection the viewer replaced in the same message. Extending observe cannot fix that defect at all: observe runs after the directive already exists, which is why the fix is in acceptance rather than in the observation. a_successor_staged_without_a_recorded_ask_still_commits pins the other half. Several paths stage without an observed selection, and treating an absent record as a change would strand successors with nothing wrong with them, so the comparison is skipped rather than failed; the test drives a different ask against a slot carrying no record and requires the commit. a_refused_packet_cannot_advance_the_ask_and_strand_a_successor is worth reading before trusting it, because its first version proved nothing. It asserted a consequence -- that a replayed or rate-limited packet carrying a different ask still leaves the legitimate commit working -- and passed with the write moved above the rate-limit fence, because the only consumer of the ask runs inside the same call that writes it and the next accepted packet overwrites whatever a rejected one left. The test now reads the field through a test-only accessor and pins the placement itself, and the accessor's doc states why the property is established before it is observable: the durable desired-ownership row that follows is read outside acceptance, and from that point a rejected packet advancing this is a rejected packet changing what the system believes the viewer wants. the_normalized_selection_distinguishes_every_ask_the_wire_does underwrites all of it by proving the digest loses nothing the wire struct distinguishes, over the whole cross product of legal shapes rather than a handful of examples; collapsing Original into Auto fails it by name."
