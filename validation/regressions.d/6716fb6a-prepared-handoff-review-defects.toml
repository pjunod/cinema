reason = "Four defects an adversarial review found in the web prepared-replacement path, each correct in isolation and wrong once the page ran it. A `committed` acknowledgement omitted `committed_media_origin_ms`, which `ActionAcknowledgement::validate` requires and `bound_preparation_acknowledgement` compares against the offer; the resulting `400 invalid_control` is neither retryable nor a transport error, so the reporter stopped for the rest of the session immediately after the picture had been swapped. The commit could not have been sent in any case: it began a new media attachment, and `startPlaybackControl` captures the attachment and refuses to snapshot against any other, so `capture()` returned null forever and the control plane went silent with `stopped` false. Swapping which element is `#video` left the ~25 listeners `wirePlayer` binds once per page, and the five `play()` binds per playback, on the retired node — frozen scrubber, deaf stall watchdog, silent decode-error rescue, no autoplay-next, for the life of the page because `PLAYER_WIRED` never resets; the media set is now `wirePlayerMedia(v)`, keyed to the element, and `adoptPlaybackMediaElement` moves it with the picture while the retired element leaves the page. And every teardown path queued an `aborted` and then discarded it, because the reporter's own capture refuses once the player stops owning the media and `stop()` aborts what is in flight, so the session's one preparation slot burned its full 330-second deadline. The retained regressions are in `tests/playback/web-control.test.js`: the dispatch, the snapshot seam, the settle call and the teardown flush are driven through the shipped reporter rather than by calling the functions directly, the acknowledgement queue is proven to keep a superseded staging's abort behind its successor's progress, a settled `action_id` is proven not to rebuild on replay, and the first-frame watchdog is proven cancellable. `tests/web/settings-sections.test.js` checks each readiness row's markup against the verdict the readiness function gave it, because counting the word `met` cannot tell a met row from a `not met` one. Twenty mutations of these paths were run against the suite and all twenty failed it."
