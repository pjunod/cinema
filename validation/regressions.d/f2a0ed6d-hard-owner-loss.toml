version = 1

[[coverage]]
commits = ["f2a0ed6d"]
points = ["core.media", "server.api", "playback.pipeline", "cluster.auth", "web.experience"]
checks = ["rust-gate", "rust-gate-ci", "web-static"]
reason = "an_eligible_rolling_route_is_a_transition_however_long_it_has_been_dead pins a lease dead since the epoch as still retryable, which is the whole reason this classifies on the recipe rather than on a clock: the takeover gate shuts when a node dies and a survivor cannot know when a successor stops being possible. a_route_the_takeover_path_can_never_accept_is_unrecoverable drives all five permanent refusals — VOD presentation, EVENT playlist, exhausted epoch space, an unreadable recipe, and a recipe that no longer describes its route — because a classifier that loses any one of them starts telling viewers to reopen sessions that a successor is about to claim. the_offered_resume_matches_what_a_successor_would_restart_from asserts the offered position equals takeover_resume's own restart and is strictly behind the fetched frontier, which is the defect the first version shipped: fetched_through_ms advances to the end of a segment the moment the client asks for it, so an uncorrected number sends a viewer up to a whole copy segment past media they never saw. an_unreadable_recipe_still_resumes_and_errs_early requires an unknown shape to take the wider of the two overlaps, so the recoverable mistake is the one that gets made. a_resume_never_lands_before_the_session_start covers a session that served nothing. the_takeover_recipe_validator_refuses_vod and attempt_takeover_refuses_an_event_session together cover remaining-roadmap §4's rule that typeless-sliding takeover must not be expanded to VOD or EVENT sessions; the second drives attempt_takeover against a real AppState fixture and requires the EVENT gate to fire before any later refusal, because that half lives in the function rather than in a validator and nothing else reaches it. an_eligible_route_stays_retryable_and_still_says_where_to_reopen and an_untakeoverable_route_answers_gone_with_the_resume_and_no_continuity_claim pin both wire answers whole — status, code, both film-timeline numbers, reopen_required and continuous — where continuous is the machine-readable form of §10.3's requirement not to guess transparency. a_public_status_read_of_an_untakeoverable_route_answers_gone drives the public status handler rather than the classifier, so a call site left on the flat 503 fails even though every unit test on the helper would still pass. public_delete_tombstones_expired_route_but_reports_unreachable_exact_owner covers that the new answer does not disturb durable termination. typed_detail_cannot_shadow_the_code_a_client_dispatches_on requires the detail object to lose to code and message, so recovery data can never rename the error a client dispatches on. In tests/playback/web-policy.test.js, a lost owner is reported as a stopped stream, not a startup failure requires the overlay to stop saying 'Playback failed to start.' to a viewer forty minutes into a film and to keep the machine-addressed sentence off the screen, while an owner transition that may still recover still reads as still preparing pins that the retryable half keeps the sentence it had."
