reason = "Nothing in the shipped shell reported a script failure that happened before the app finished starting: a broken asset left a blank page and no server-side trace. This commit adds `crates/plurxd/src/web/core/errors.js` with `PlurxErrorReporter`, wires its `window` handlers and `markReady`/`setAuth` calls into `core/app.js`, `core/auth.js`, `core/api.js`, `router.js` and `index.html`, and adds the authenticated ingest route in `crates/plurxd/src/http/system.rs`. Its retained evidence is the new `tests/web/error-reporter.test.js`, added to `make web-check` in the same commit and run by `web-static`: it loads the served `core/errors.js` into a `vm` context with a stub document and fetch, and pins that reports raised before `setAuth` stay queued and drain on authentication, that the body is redacted (no bearer value, no `?token=` query) and truncated to 512 characters of message and 2048 of stack, that an identical message/source/line is sent once, that a burst stops at 20 reports and then opens one paced slot every 10 s, that a failure inside the reporter's own `fetch` cannot recursively report itself, and that the boot sentinel distinguishes `slow`, `crashed`, `waiting` and `timed_out` and clears on `markReady`. Every one of those assertions reads behaviour that exists only in the file this commit adds, so reverting the production change fails the test file outright; the commit also registers the new asset in `tests/web/asset-graph.js`, which `tests/web/asset-load.test.js` and `asset-order.test.js` read under the same check."
