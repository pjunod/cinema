reason = "The review of the web milestone found the class table moving the player and a test file that stopped running a quarter of the way through. `raisePlaybackSurfaceRefusal` is gone: it rewrote `auth_401_403` to `change_failed` whenever a predecessor was attached, and it paused the player because the class table said the class was blocking. The table is a first-match read now and each raising site takes its own stop, which the retained test `a refusal no source row claims still reaches the surface as the server's sentence` requires in three shapes off the shipped `playbackSurfaceSourceIsBlocking` and `showSessionOpenFailure` - an unclaimed 502 at a start is `owner_stopped` with one stop beside it, the same body during a pending change is `change_failed` with `player_stopped` false and no stop at all, and a 403 during a pending change is `auth_401_403` with Sign in and the stop that a blocking row needs. `a burn session-open refusal reaches the surface as a refused change` requires the same of the real `openSession` path and requires the predecessor never to be stopped. Finding 7 is pinned by `surface kind x class x input is a fixed cross-product`, which routes every kind and class with no PLAYER at all and requires the same answer, because the input state reads the surface model rather than a field on a player a refused cold start never built, and by `the shipped player adapter applies state precedence and preview-then-commit`, which drives the failed and transport routing off that model. The second half is the control suite: its harnesses slice owner code that raises typed faults, so the first one threw and roughly twenty-five assertions after it never ran. Every harness carries a seam that records what was raised and what was stopped, and the assertions are migrated onto the fault rather than deleted - the terminal verdict's title and its actions, the hold's sentence and its refusal to offer a recipe change, the fenced incumbent error handler that must paint nothing and stop nothing that is not its own, and the diagnosed stall's `stops the player before it raises` at each of the three probe failure points. Reverting any of the site stops leaves a stop count of zero against an expected one; reverting the seam leaves the file throwing again, which is the condition that hid all of it. Both suites run in the embedded-JavaScript gate. One part of this commit has no test of its own and is honest to name: an hls.js network-class fatal now raises `owner_recovery_step` over a picture that keeps playing instead of reaching `stopPlayerForExhaustion`, and only the source and the reviewed reasoning hold that branch."
