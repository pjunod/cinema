reason = "Before this commit every `DecodeFactError` leaving the bound decode-fact lookup landed in one `tracing::debug!` arm of `resolve_held_movie_plan` in `crates/plurxd/src/transcode.rs` and then fell through to `resolve_movie_plan`, the stored-catalogue planner. A probe that ran out of budget, a cancelled request, an ffprobe replaced on disk after startup, an unparseable probe payload, and -- the one that matters -- a held source whose bytes changed between binding and final identity validation were all the same invisible event: one debug line, no counter, and a `PlanSourceBinding::CatalogRow` plan handed back as if planning had succeeded. The last case is the defect. The probe had already proved that the object open under the descriptor is not the object the catalogue row describes, and the response was to plan the decode from that catalogue row anyway, so the decoder was chosen from a codec, profile and geometry that no longer belong to the bytes being read. This commit adds `DecodeFactError::fallback_reason()` in `crates/plurxd/src/decode_facts.rs`, an exhaustive `match` with no wildcard arm onto the seven-variant `DecodePlanFallbackReason`, and makes the `Err` arm record `plurx_decode_plan_fallbacks_total{reason=...}`, choose a severity per reason -- silence for `deadline` and `cancelled`, one process-lifetime `warn` for `probe_changed` behind `PROBE_CHANGED_WARNING_EMITTED`, `warn` for `probe_failed` and `identity_io`, `error` for `invariant` -- and, for `refused_source_changed` alone, return `Err(\"the held source changed during decoder probing; rescan before playback\")` instead of falling back at all. Two tests in the `#[cfg(test)]` module of `crates/plurxd/src/transcode.rs` pin it. `held_plan_fallback_reasons` walks every `DecodeFactError` variant that can still reach the arm, asserts `error.fallback_reason()` equals the expected reason, and then drives that same error through the real `resolve_held_movie_plan_facts` on a freshly built manager, requiring the returned plan's `source_binding()` to be `PlanSourceBinding::CatalogRow` and that manager's own `plurx_decode_plan_fallbacks_total{reason=\"<label>\"}` to be exactly 1. `DecodeFactError::SourceChanged` is deliberately absent from that table because it no longer yields a plan; it is covered by the second test instead. `source_change_refuses_bound_plan` (`#[cfg(unix)]`) is the end-to-end regression: it seeds a real media row over a real file, writes and chmods a `/bin/sh` ffprobe fixture that answers `-version` and one video stream, installs it as the manager's probe identity, sets `with_decode_source_final_identity_delay(Duration::from_millis(250))`, and spawns a joined task that rewrites the source file 100 ms in -- after the source has been bound and collected from, before the final identity check runs. It requires `resolve_held_movie_plan` to return exactly `Err(\"the held source changed during decoder probing; rescan before playback\")` and `plurx_decode_plan_fallbacks_total{reason=\"refused_source_changed\"}` to read 1. Revert the `return Err(...)` to the old shared debug-and-fall-through and `source_change_refuses_bound_plan` fails on its first assertion, because it receives `Ok(plan)` built from scanner-time facts for a file whose bytes changed under the probe; revert only the `record_fallback` call and both tests fail on their counter assertions, `held_plan_fallback_reasons` at the first of the thirteen variants it walks. Removing a `DecodeFactError` arm from `fallback_reason` is a compile error rather than a silent reclassification, because the `const fn` has no `_` arm. What is NOT pinned by an assertion, and is stated rather than implied: the tracing severity chosen per reason and the once-per-process latch on the `probe_changed` warning are read from the source only -- no test captures tracing output here, and the deliberate ffprobe-change observation that would exercise that path is still listed as pending lab evidence in `docs/streaming/DECODE-FACTS-GATE-AND-FALLBACK.md`."
