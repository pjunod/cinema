reason = "a_capacity_stall_still_says_no_room_after_its_producer_is_gone is the regression for the claim this commit makes true. A hold with no scheduled end terminates its producer, which leaves the belief Absent and takes the reason with it, so the status read waiting with no hold and DeliveryView::hold_reason -- whose only feed this is -- could never carry no_room. The test walks all three states from one rendition: a healthy rendition holds nothing, a recorded capacity hold is published as no_room even though the producer that hold terminated is gone, and clearing it publishes nothing again, which is what stops the record latching for the life of the rendition. Deleting the projection fails it at None against Some(no_room). reattaching_elsewhere_retires_the_waits_left_behind covers the path the previous commit missed: reattachment removes a reader inline rather than through detach_reader, so a viewer who creates again against a different recipe leaves a parked request on the rendition they moved off, and playback_demands marks a session's oldest wait foreground precisely when it cannot find a reader to rank it against. The test requires the two renditions to actually differ before asserting, so it cannot pass by the viewer never having moved; deleting the retire call fails it. a_departing_session_takes_its_own_waits_and_nobody_elses gains the cap-slot half. Retirement answers a waiter without handing back its admission slot -- retention is released by the response dropping its guard, and clearing it inside retirement would leak both the per-session and the global cap for the life of the pool. That was correct and completely untested: an implementation that also unpinned passed the entire suite. The test now requires the pool to still hold three slots immediately after retirement, exactly one to come back when the retired request drops, and the pool to be empty once every request is done."
