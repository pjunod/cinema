reason = """
A remembered PGS overlay preparation failure (demux, I/O, cancellation,
timeout, missing duration) was a plain 503, which both native clients read as
"still preparing" and polled for up to ten minutes showing nothing, and
capacity-full was the same 503.

`http::pgs_overlay::tests::a_remembered_preparation_failure_is_a_typed_terminal_answer_not_a_503`
pins that every `Unavailable` is a typed 500 `pgs_overlay_prepare_failed`
with no Retry-After. Reverting the `Unavailable` arm to the old
`ServiceUnavailable` fails it; that revert was run on 2026-09-23.
`capacity_full_is_the_only_retryable_503` pins the TypedRetry 503
`pgs_overlay_capacity` with Retry-After 5, and
`a_malformed_or_over_limit_stream_keeps_its_422_and_gains_the_code` pins the
422 bodies keeping their legacy `error` and `detail` fields beside the code.
`preparation_capacity_refuses_a_third_cold_generation` in
crates/plurxd/src/pgs_overlay.rs requires the capacity refusal to be
`OverlayError::Capacity`. Run `cargo test -p plurxd pgs_overlay`.
"""
