reason = "a_switch_releases_the_drain_through_the_relay_and_only_when_accepted is the evidence for where the release lives and when it runs, and each of its three assertions answers one review finding. It enters through control_authorized, the relay's own door, so a release placed anywhere ingress reaches but the relay does not — control_inner, where the first draft put it — never runs and the row stays active. It asserts the status of the releasing exchange is 200, not only that the row ended: the first draft released before the exchange, so the very packet reporting the switch was answered 410 session_ended and anything else riding it was lost. And it asserts a relayed control naming another generation leaves the row alone, which is the guard that the release runs only on an accepted exchange and therefore behind the client-instance and monotonic-sequence fences in ControlState::accept. The drain is put on the row the way production puts it there, by staging and committing a successor through the store, so the fixture cannot pass against a state the store never produces. a_switch_onto_media_that_never_published_aborts_the_preparation pins both halves of the staged case on the same acknowledgement: a slot still Staged is torn down and reported as rejected, and a slot already cleared by a real commit yields no directive, because issuing an abort there would tear down the stream the viewer is now watching. Deleting either half leaves the other passing, which is why they are one test. The withdrawn response field is covered by absence rather than by a test: ControlResponseV1 carries deny_unknown_fields and the relay re-parses it, so any field added to it is exercised by every cross-node control test in the suite."
