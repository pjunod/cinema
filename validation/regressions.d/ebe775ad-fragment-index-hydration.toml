reason = "a_hydrated_job_settles_from_another_nodes_artifact_through_dyn_store drives the whole shape on both backends: two voters each hold a targeted job for one cache_key, the first builds and publishes, the second settles from that artifact without building, its job reaches ready, both nodes end up holding a location, and — the assertion that matters most — the stored artifact still names the node that actually built it. Relabelling a hydrated artifact to satisfy complete_cluster_fragment_index's builder check would have appeared to work, because the artifact insert is ON CONFLICT DO NOTHING, so this test is what stops a later simplification from doing exactly that. hydration_refuses_a_stale_claim_and_a_mismatched_blob pins that hydration is still a claimed write: with nothing published it settles nothing AND publishes no artifact of its own, and a stale fence settles nothing once the artifact is real. every_sqlite_transaction_site_is_classified and every_sqlite_transaction_is_named_once cover the new transaction boundary itself. Removing the hydration path returns the fleet to one full bitstream pass per voter per file for a single artifact; removing the artifact-exists requirement lets a node settle a job from bytes nobody published; removing the job_terminal mapping restores an uncharged infinite retry at two claims per tick per node against a job that is terminal forever, which is the loop that would have made M5.2 undeployable."
