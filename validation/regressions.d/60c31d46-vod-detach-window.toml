reason = "abandoning_a_window_stops_the_flight_without_fencing_the_session is the regression, and it is deliberately a test about the distinction rather than about the mechanism. A subtitle window is keyed by session id alone, so a viewer reattaching to another rendition leaves a live ffmpeg extracting a span for the recipe they moved off; detach_reader releases one on every real ending and its comment claimed reattachment converged there, which it did not. The obvious repair is to call release_session_window from the reattachment path, and that is a regression: releasing also fences the id for WINDOW_RELEASE_FENCE, and the id belongs to a viewer who is still watching, so the fence refuses the first window of the attachment that just replaced it. The test asserts three things in order -- a stale flight identity stops nothing, the named flight stops and settles, and the very next window is admitted -- so substituting the releasing call passes the second assertion and fails the third with the reason in the message. It also pins the naming: the identity is read under the same guard that judges the flight obsolete, so a successor claiming the session between the read and the stop survives, which is what stops a viewer who reattaches twice quickly from losing the second attachment's work to the first one's cleanup. reattaching_elsewhere_stops_the_window_flight_it_left_behind is the serving-side half and proves reattachment reaches that operation at all: deleting the call fails it at the flight outliving the move. It uses a unique session id rather than the shared sess-a literal because the window registry is process-global, and a concurrent test releasing that id would fence this fixture's session and read as a defect in the code under test. Both reader guards are dropped before the stop, which is not decorative: settlement waits on a real ffmpeg, and the guards previously lived to the end of the attachment, so holding either across that await would let one viewer's recipe change stall every other reader of the rendition they left or the one they joined."
