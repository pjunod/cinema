reason = "The defect that made the whole DVR unusable from the web: `liveTvGridCell` in `crates/plurxd/src/web/index.html` opened with `if(airing){ liveTvSelect(channelId); return; }`, so clicking a programme that was on the air tuned the channel and returned before `liveTvPopover` was ever called. The popover is the only place Record, Record series, Remind me and the tuner sentence exist on the web — `onclick=\"liveTvGridCell(...)\"` is the cell's only handler, there is no context menu or long-press path — so recording anything currently broadcasting was impossible, which is the case a viewer asks for most. Everything needed for it was already built: `dvrAiringActions` in `crates/plurxd/src/web/live-tv.js` returns `watch: \"now\"`, `record: \"record\"` and `series: true` for an on-air programme, and `liveTvPopover` renders Watch first. Two cases in `tests/web/live-tv.test.js` pin it. `an on-air cell reaches Record, and the handler has no airing branch` composes the shipped `liveTvGridCell` out of `index.html` and RUNS it against an airing cell with `liveTvPopover` and `liveTvSelect` stubbed, asserting the popover is what gets called. That is deliberately behavioural rather than textual: the first version of this case matched the old spelling `if (airing)`, and an adversarial review defeated it by rewriting the short-circuit off `cell.airing` with an `else` — the defect fully restored, the test still green. The running version fails that rewrite on \"an airing cell opens its popover and does not short-circuit to tuning\"; I applied the rewrite and watched it fail rather than assuming. `the cell popover is a modal that a keyboard can leave` pins the second half: routing every cell through the popover is only an improvement if the popover can be dismissed, and it could not be — no role, no focus, and the one Escape listener did not know about it. What is not covered: no test drives a real click through a rendered grid into a rendered DOM popover, so focus return and the outside-click close are asserted at the source level; nothing covers the popover's placement near a viewport edge; and the same defect is still shipped on Apple and Android, addressed in this branch but without a compiled test of its own here."
