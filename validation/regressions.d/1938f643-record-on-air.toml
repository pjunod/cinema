reason = "The defect that made the whole DVR unusable from the web: `liveTvGridCell` in `crates/plurxd/src/web/index.html` opened with `if(airing){ liveTvSelect(channelId); return; }`, so clicking a programme that was on the air tuned the channel and returned before `liveTvPopover` was ever called. The popover is the only place Record, Record series, Remind me and the tuner sentence exist on the web — `onclick=\"liveTvGridCell(...)\"` is the cell's only handler, there is no context menu or long-press path — so recording anything currently broadcasting was impossible, which is the case a viewer asks for most. Everything needed for it was already built: `dvrAiringActions` in `crates/plurxd/src/web/live-tv.js` returns `watch: \"now\"`, `record: \"record\"` and `series: true` for an on-air programme, and `liveTvPopover` renders Watch first. Revert this and `an on-air programme offers all four verbs, not just Watch` in `tests/web/live-tv.test.js` fails on the assertion named \"no `if (airing)` short-circuit: that is the line that hid Record on everything on air\" — verified by re-introducing the line and running the file, not assumed. That case pins both halves: the action model's answer for an on-air programme, and the shipped handler's shape read out of `index.html` rather than a copy of it, so a future edit that returns early again fails here rather than in front of a viewer. What is not covered: no test drives a real click through a rendered grid into a rendered popover, so the wiring between the handler and the DOM is asserted at the source level; and no test covers the popover's own placement when a cell is near the viewport edge."
