checks = ["rust-gate", "rust-gate-ci"]
reason = "a_vod_body_counts_its_delivered_bytes_where_they_leave is the test that fails against the code this commit replaces. It drives a real VOD segment response, asserts the counter is still zero once the segment is open and the response is built -- opening a file and building a response delivers nothing -- and then drains the body and requires every byte the viewer took to be counted and only those. Deleting the pump's note leaves it at 0 against 24576. an_abandoned_vod_body_counts_nothing_it_did_not_hand_over covers the reason the note sits after the downstream acknowledgement rather than after the read: a viewer who walks away mid-segment must not leave behind a rate built from bytes that went nowhere, because a stalled link that measured fast is exactly what would let a prepared successor be staged against a link that cannot carry it. A meter advanced at read time would measure the disk. a_measured_vod_delivery_reaches_the_control_view_and_an_unmeasured_one_stays_unknown pins both halves of the contract in one test: a measured rate reaches DeliveryView with its idle age, which is what tells a stale rate from a dead link, and an unmeasured session reports no rate at all rather than a substituted one. Restoring delivered_bps: None fails it. a_measured_vod_rate_lets_the_headroom_decision_actually_run is the finding itself, stated as three outcomes rather than one: with no rate headroom_refusal answers ThroughputUnreported, which is the state every public session was in; with a rate ten times the delivered one it passes; and with a rate that saturates the link it still refuses ThroughputInsufficient -- so measuring cannot become a way to always pass. The encoder target is never a substitute for an unknown rate: bitrate_for_height describes what an encoder was asked to produce, and on VOD the presentation is a stream copy, so it describes nothing that was delivered. The meter is carried on SegmentReady as a non-optional field taken from the session the segment was opened for, so a body cannot be served without something to count it with; an Option there would silently reintroduce the refusal this commit removes."
