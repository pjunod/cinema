reason = "Sole adversarial review of PR #433, finding P2. Two defects, both fixed here. First, the off-by-one: `Semaphore::new(REVOCATION_WAITERS)` holds eight permits, but `RevocationAdmission` kept `_waiting` alongside `_operation`, so the active coordinator held a queue permit for its whole Begin/Store/End lifetime and eight permits admitted one active operation plus only seven queued callers - against a plan, a PR body and a doc comment that all say eight waiters. The permit is now released the moment the operation mutex is acquired, because the mutex is itself the single active slot. `http::extract::tests::cache_admin_revocation_operation_queue_is_bounded_and_raii_released` pins it three ways: `available_permits()` equals `REVOCATION_WAITERS` immediately after the first caller is admitted; eight spawned waiters - not seven - then exhaust the queue and a ninth caller is refused; and every one of the eight fails with `cache-admin revocation admission timed out` rather than `queue is full`, which is what proves all eight were actually queued rather than one being turned away at the door. On revert, restoring `_waiting` fails the first of those assertions with the message that an admitted operation must not occupy a waiting slot. Second, the plan-required end-to-end concurrency proof was absent: the suite covered the semaphore primitive, sequential router revocation and static phase order, but never two callers contending. `http::tests::two_concurrent_logouts_queue_behind_one_operation_and_both_succeed` holds the single active slot the way a live fence does, so the contention is a fact of the test rather than a race it hopes to win, then asserts that neither sign-out has completed while the slot is held - they queue, they are not refused - and that once it is released both return 200 with `ok` true, both bearers stop authenticating, and the user's token inventory is empty, which is the two-deleted-rows half of the M1 acceptance. `http::tests::a_logout_that_waits_out_the_admission_window_is_refused_and_changes_nothing` takes the other side: past `REVOCATION_ADMISSION_WAIT` the caller is refused with 503 and is shown to have actually waited its window rather than failed fast, and the refusal leaves nothing behind - no deleted row, no armed fence, both sessions still authenticating and both devices still listed. On revert to the pre-M1 fail-fast `try_lock_owned` admission, the first fails because a sign-out behind a running fence is refused instead of queuing, and the second fails because the refusal arrives immediately instead of after the admission window. Neither of these two pins the off-by-one - only the extract test does - and that is stated here rather than implied."
