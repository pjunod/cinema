reason = "The selected-video completion regressions generate a real Matroska fixture whose video ends three seconds before its audio, require the production held-source probe and video-only FFmpeg pass to publish an index, and prove that the former container-duration bound rejects the same complete video output; parser cases retain true malformed-output and video-shortfall refusals. Pure policy tests pin the exact two-second boundary, bounded diagnostics, fixed retry deadline and finite attempt ceiling. A backend-neutral Store contract drives the retry across a foreground rediscovery and the generic six-hour queue-expiry boundary, then runs the same scenario through SQLite and the three-voter Hiqlite harness; a second contract creates a legacy truncated predecessor, previews its exact engine/video identity, applies one receipt and successor, repeats the apply, and requires one retained predecessor plus the same successor. The SQLite transaction test also reads attempts, history, deadline and diagnostic state directly. HTTP and shipped-web contracts require typed retry evidence, distinct truthful timeout/unverified/shortfall/legacy explanations, hostile text as inert diagnostics, and an authoritative Developer enable switch whose readiness rows never disable or override the saved choice. Reverting the selected-stream expectation restores the valid longer-audio failure; resetting a typed cycle or allowing a foreground boost to lower not_before_ms fails both Store backends; recording a Hiqlite receipt without its successor fails repeated apply; collapsing operator causes or gating the switch fails the response and web contracts."
