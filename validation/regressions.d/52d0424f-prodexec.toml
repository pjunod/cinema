checks = ["rust-gate"]
reason = "`a_repositioned_producer_is_left_alone_to_reach_where_it_was_sent` and `a_repositioned_producer_is_not_told_to_reposition_again` pin the respawn loop from both sides: a producer sitting where it was sent must be left alone, and the scheduler must not name that same position again. Collapsing `positioned_at` back into `produced_through` fails both, and the failure in production is an encoder started and killed in a tight loop while the reader whose seek caused it waits out its deadline. `a_producer_positioned_short_of_what_is_owed_still_moves` bounds that so the new field cannot become a reason to leave a producer where it cannot reach what is owed. `an_indefinite_hold_terminates_rather_than_stopping` and `a_hold_that_turns_indefinite_gives_the_codec_back` require the two hold classes to be answered differently, because a stopped ffmpeg still holds its hardware codec session and only one of the two holds has a scheduled end; `an_ahead_hold_stops_because_a_reader_will_clear_it` holds the other direction so every hold does not simply become a kill. `a_producer_already_stopped_is_not_stopped_again`, `a_producer_already_running_is_not_started_again` and `nothing_is_signalled_at_a_process_that_is_not_there` pin idempotence, which is what keeps a signal off a recycled pid. `every_step_is_a_fixed_point_when_repeated` walks apply-then-ask-again across every action and is the test that found the respawn loop. `a_restart_forgets_progress_the_new_process_did_not_make` requires a repositioned producer to report no progress rather than progress it never made."
