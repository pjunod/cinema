reason = "Defects found by an adversarial review of the merge resolutions themselves — each side had been reviewed, the combination had not — plus the replicated migration lane they left red. every_replicated_placeholder_is_introduced_in_order covers the reopen query binding $2 before $1, which validate_parameter_order refuses before any I/O: that is the exact shape of the outage this effort repairs, in the endpoint written to recover from it, and the census is what stops it recurring. the_downgrade_fixture_undoes_every_migration_after_the_guard is the tripwire main built to fire on the commit that appends the next migration; it now counts both v45's negative index and v46's attempt history, so a future migration is named before the 20-minute lane runs rather than after. The fifteen replicated_v*_store_migrates_* fixtures cover the three causes of the cluster-lane failure together: a v22 shape predicate that had been made to count a v26 object, so every fixture winding a marker back read as not-v22 and replayed v22 DDL against tables that already had it; fixtures that bootstrap the current tables and leave the attempt-history column in a tree claiming to predate it; and two fixtures spelling their own version as AUTH_SCHEMA_VERSION minus an offset, which the head's move to 26 silently shifted so the test named for v23 constructed a v24 tree and failed on the migration it existed to prove. v6_rebuild_preserves_everything pins the SQLite head at 46 so a renumbering stays a decision. Removing the object-count pin re-breaks every replicated migration fixture at once; removing the version literals makes each future head bump silently retarget the fixtures; removing the placeholder fix makes bulk reopen error on exactly the clustered deployment it was written for."
