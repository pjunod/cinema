reason = "Three defects in the C-04 device inventory, each pinned by the executable inventory test that found it. `store::placeholder_census::every_replicated_placeholder_is_introduced_in_order` executes every replicated statement's placeholder ordering the way hiqlite does and refuses one that introduces `$2` before `$1`. The device-label cap added to the hiqlite inventory projection sat in the SELECT list, ahead of the user predicate, so the statement was refused before any I/O - the whole devices route would have answered a database error on every cluster. The cap is now `$1` and the user id `$2`. On revert, the census names the exact statement and the exact expected-versus-found placeholder. `store::replicated::tests::every_sqlite_transaction_site_is_classified` scans the SQLite modules for transaction boundaries and compares them against `SQLITE_TRANSACTION_SITES` by module, mechanism and count. `delete_token_by_prefix_for_user`, added by M3 (`b87ce2554`), opened an `unchecked_transaction` that was never registered, so `users.rs` scanned three boundaries against two recorded. It is registered as `ReadBranchWrite` with the reason written beside it: the prefix count is the authorization for the delete, so splitting them would let a token minted in between turn a unique prefix ambiguous under a delete that is already authorized - revoking a device the caller never saw. On revert, the test prints both maps with the `users.rs` count off by one. `http::tests::every_registered_literal_route_has_an_explicit_group` parses every literal route out of `router()` and asserts none lands in the unclassified `other` group. M3's four device routes had no `http_route_group` arm, so every Store read they made was attributed to `other` and `plurx_http_store_reads_total` could not tell an operator what the devices page costs. They now join group 0 with login, logout and user administration, which is the same rows. On revert, the test names `/api/v1/me/devices` as the unclassified MatchedPath. None of the three is a behaviour change to the fence, the throttle or the label bound; they are the inventories that keep those honest, and the branch's earlier evidence runs were focused rather than broad, which is why all three were still open."
