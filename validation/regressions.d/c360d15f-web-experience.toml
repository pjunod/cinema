reason = "Every claim below is a retained, executing assertion in tests/web/cluster-membership.test.js — that qualifier is load-bearing, because 501ad3a1 exists partly to fix a synchronous test harness under which the first commit's async coverage printed PASS with zero assertions run. The cadence: a harness runs the real shipped settingsTick against a fake clock and a stub document, and proves the direct status is collected when the gate is due, that the clock is stamped before the await rather than after it, that a probe still in flight is never overlapped, that a probe which took twenty seconds does not also push the next collection twenty seconds out, that nine seconds later nothing is collected and fifteen seconds later it is, that the interval is 15000 rather than an incidental number, and that a machine reporting membership_unavailable is never polled at all. The discipline: an aggregate differing only in its observed-at stamps, per-node sample ages, Raft sample and watermark ages and the embedded roster's last_seen_at projects identically and paints nothing, while an advanced commit index or a flipped restart verdict projects differently and paints exactly once; response key order is proven not to be a change. The survivability: repaintClusterPreserving is exercised against a stub document that clears the roster's scroll position, closes every drill-down and resets every control to its template default, and all three come back — the token lifetime and role assertions are the ones that stop a repaint between choosing and clicking from minting a ten-minute voter token instead of an hour-long read worker. A repaint arriving while a dialog is open is proven to be deferred and then paid on the next collection, so a force-election decision cannot be closed mid-sentence and the owed repaint is not lost. A refused collection is proven to patch the freshness row and leave the clock stamped, so the row whose only job is freshness cannot freeze exactly when the sample goes stale. The preserving repaint's call sites are counted rather than grepped: both branches of the tick, plus refreshClusterOperations, pollLocalRestart, toggleClusterRailPanel, mintJoinToken and clearJoinToken. The freshness cell's id is asserted in the rendered ledger markup as well as in the patch that looks it up, so removing either half fails. And the clock is asserted to be stamped inside the endpoint that performs the request rather than where a value is painted, because loadSettingsKey serves a cached aggregate with no request and stamping that path let tab switching starve the refresh indefinitely."
