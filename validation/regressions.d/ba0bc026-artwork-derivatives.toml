reason = "Recorded against ba0bc026, the commit that added the `?size=w300|w500|w780` derivative route to `crates/plurxd/src/http/images.rs` and `poster_sizes` to `ItemDto`. The route itself is pinned by tests that drive the real handler, not its helpers. `w300_never_upscales_a_small_source` asserts that a source already no wider than the bucket is answered with its own bytes rather than a resize, on both a PNG whose header parses and a file whose extension lies about its content, which is what stops the node spending an ffmpeg on every thumbnail in a grid. `derivative_key_is_the_verified_source_digest` writes out the whole expected key for two different sets of source bytes and asserts the parse back, so the key is the verified source digest rather than the filename and changed bytes can never be served under a stale key. `ffmpeg_derivative_is_bounded_and_preserves_the_original` runs the shipped ffmpeg against a generated 640x360 fixture and asserts the output is 300 pixels wide, is within `MAX_ARTWORK_BYTES`, and that the source bytes are byte-identical afterwards, which is the guardrail that `BACKDROP_SIZE` and `STILL_SIZE` stay `original`. `a_failed_ffmpeg_leaves_no_derivative` points the child at `/bin/false` and asserts `derived/` is completely empty, so a failed resize cannot leave a truncated file where a later request would serve it as a derivative. `derivatives_are_single_flight` issues ten concurrent first requests for one bucket and asserts exactly one generation committed; removing the keyed flight lock makes that ten, which is ten ffmpeg children for one grid tile. `an_animated_gif_yields_one_png_frame` and `an_alpha_png_stays_png` pin the two container decisions the plan names: an animated source is written as a single PNG frame rather than left a GIF, and an RGBA source keeps IHDR colour type 6 so the grid does not gain black corners. `peer_route_refuses_size` asserts the cluster route answers a bucket with a 400 and creates no `derived/` directory, so one node's resize can never become another node's source of record; its post-proof half is reachable because `serve_verified_peer_artwork` is separated from the HMAC extractor, which needs a consistent cluster read no unit test can supply. `the_derivative_child_caches_in_the_runtime_cache_not_the_artwork_root` reads `XDG_CACHE_HOME` back off the built command without spawning it. On the M1 half of the same file, `a_verified_hit_is_not_rehashed_and_a_validator_skips_the_read` counts SHA-256 calls and asserts the second read makes none and that an `If-None-Match` match takes no permit at all; `an_in_place_rewrite_with_a_new_ctime_is_reverified_and_quarantined` and `a_replaced_inode_is_reverified_and_install_evicts_the_entry` assert that the cached digest never survives a change of file identity, which is the whole safety argument for skipping the hash; and `local_reads_are_bounded_by_bytes_not_count` pins that twelve small posters fit where five maximum-size backdrops do not. Reverting the bucket enum makes every unknown `size` serve the original instead of failing closed; reverting the digest key serves last week's poster under this week's URL forever; reverting the single flight turns one cold grid row into one ffmpeg per tile; reverting the peer refusal lets a derivative replicate as if it were an original and fail its name authentication on the puller."
