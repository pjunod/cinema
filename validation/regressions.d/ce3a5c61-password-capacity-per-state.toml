version = 1

[[coverage]]
commits = ["ce3a5c61"]
points = ["identity.access", "server.api"]
checks = ["rust-gate", "rust-gate-ci"]
reason = """
Argon2 admission (PASSWORD_ACTIVE, 2 workers; PASSWORD_WAITERS, 16 queued)
was a pair of process-wide statics, so every test_app() queued its setup and
login hashes behind every other test's on libtest's threads. A test on a
paused tokio clock could not survive any queueing: while it waited on a
permit another test's blocking hash held, its idle runtime auto-advanced
through the 2 s admission wait and `setup_admin` got 503 "password
verification capacity is busy". That is how
`http::tests::production_logout_fence_outlives_the_short_deadline`
(start_paused) failed in an integration run under host load. The
semaphores now live in a `PasswordCapacity` on `AppState`; login, setup and
user create/update pass their state's capacity to `run_password_work`.
Production keeps one state per process and the same bounds.

`http::auth::tests::password_capacity_belongs_to_its_state_not_the_process`
holds every worker permit of one capacity and requires that capacity's work
to be refused (ServiceUnavailable), another capacity's to be admitted at
once, and the first to be admitted after its permits drop. With
`run_password_work` pointed back at process-wide semaphores it fails on the
first assertion (the refused work is admitted); that revert was run on
2026-09-24.

Loaded loop on nuc3 (16 cores, other agents' builds running): the main
binary at `http::tests:: --test-threads=64` failed 3 of 3 runs with 34-39
tests each answering that 503 from setup, the target among them; the fixed
binary passed 20 of 20 such runs (target 0 failures, no capacity 503 in any
run) while a second loop ran the whole `http::` filter (755 tests) 12 times
beside it, also with no capacity 503. One of the 20 runs failed
`repeated_metrics_scrapes_do_not_record_store_operations`, which compares
the process-wide store-operation counters and is unrelated to this change.
Run `cargo test -p plurxd password_capacity` and
`cargo test -p plurxd production_logout_fence`.
"""
