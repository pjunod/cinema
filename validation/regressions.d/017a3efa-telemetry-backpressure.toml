reason = "Covers plan/C-06's four milestone commits and the single commit that answers PR #434's sole adversarial review (#3381). All five are node-local playback telemetry: the bounded queue and its one supervised writer, the paired settings cache, counters that survive retention being off, and the drop/reserve/drain policy. 017a3efa (M1) replaced per-event `tokio::spawn` + `record_playback_event` with a bounded queue and one writer that drains it in batches through a new Store batch method on both backends. `store::telemetry::tests::a_batch_persists_every_event_in_one_transaction` drives 64 events through the real sidecar and reads all 64 back, so the batch is a transaction and not 64 statements that happen to succeed. `telemetry::tests::emit_stays_synchronous_under_a_wedged_writer_and_the_queue_stays_bounded` installs a Store whose batch write sleeps 30 seconds, drives 5,000 `emit` calls through the production registration path, and asserts all of them return in under a second, that queue occupancy never exceeds 1,024, that `dropped_total{reason=\"queue_full\"}` rises, and that nothing was written. Reverting the queue puts a task spawn and a store round trip back on the caller's thread and that time bound fails first. 755d9e38 (M2) seeded the effective retention/prior pair before the listener accepts and refreshed it on a 30-second window instead of reading two consensus settings per event. `settings_seed_precedes_the_first_event_and_local_changes_invalidate` asserts the seed carries the operator's stored values (retention off, priors on) before any event, that a local settings write clears `read_at`, and that the next refresh picks the change up; `a_fresh_cache_skips_replicated_setting_reads_for_its_window` asserts a refresh inside the window does not move `read_at` at all. Reverting the cache makes the second test's `read_at` move on every call, which is the per-event consistent read the milestone exists to remove. efe37aad (M3) moved `METRICS.record` out of the retention branch onto the emit side. `metrics_are_recorded_with_retention_off` sets `telemetry.retain_days = 0`, emits one `ttff`, and asserts `plurx_ttff_ms_count{method=\"remux\"}` rose by exactly one while `playback_events` stays empty. Reverting the move makes the counter flat and the node blind on every host where an operator turned retention off. dbf8c23a (M4) added the terminal classification, coalescing, the fixed drop reasons and the bounded drain. `durable_outcomes_and_error_levels_are_terminal` pins every arm `playback_control::durable_outcome` can produce plus the `level = \"error\"` escalation; `only_consecutive_samples_for_the_same_session_and_name_coalesce` asserts a sample is replaced only by an adjacent sample of the same session and name, that a lifecycle event between two samples stops the collapse, and that two consecutive terminals both survive; `shutdown_drain_returns_inside_its_bound` asserts the drain returns inside two seconds. Reverting coalescing lets a terminal be replaced by the sample behind it, which the terminal count in that test catches. 1258faf8 answers the three review findings, and each has a test that fails without it. (1) `store::telemetry::tests::a_batch_folds_its_priors_in_the_same_connection_lease` counts sidecar connection leases through `NodeLocalTelemetry::leases_taken` and asserts 64 events plus 64 prior folds cost exactly ONE lease; with the fold reverted to one `observe_prior` per observation it reports 65, which is the per-event acquisition of the mutex telemetry shares with fragment-index work. `a_prior_only_batch_writes_no_rows_and_still_takes_one_lease` pins the retention-off half (nine leases on revert), and `an_unusable_observation_does_not_take_the_batch_down_with_it` pins that a malformed observation is skipped rather than rolling back the retained events beside it. At the writer, `telemetry::tests::a_batch_with_priors_on_is_one_store_call_not_one_per_event` records every Store call and asserts one call carrying (64 events, 64 observations); on revert it records [(64,0)] followed by 64 (0,1) calls. `the_two_opt_ins_stay_independent_inside_the_shared_batch` asserts retention off with priors on is still one call carrying (0 events, 8 observations), so sharing the lease did not couple the switches. `playback_telemetry_contract_runs_through_dyn_store` exercises `record_playback_batch` on SQLite and on three voters, including the prior-only call, and `contract_inventory_matches_every_store_method` moves 380 -> 381 so the method cannot exist without a scenario. (2) `a_terminal_is_never_discarded_while_a_sample_is_queued` fills the queue with 896 samples and 128 terminals and asserts the next terminal is admitted by displacing the OLDEST sample, that occupancy stays at 1,024, that the late terminal is in the drained batch, and that exactly one sample -- the oldest -- is gone. Reverting the displacement returns `Refused`, which is a terminal discarded with 896 samples queued ahead of it. `the_reserve_is_what_the_queue_does_not_what_a_predicate_says` replaces the old pure `admission_allowed` unit test by driving the real queue to the 896 ceiling and then admitting 128 terminals; `a_queue_of_terminals_refuses_a_terminal_and_stays_bounded` pins the one case that may refuse one; `concurrent_producers_cannot_overrun_the_reserve` races eight threads through 32,000 pushes and asserts EXACTLY 896 non-terminal admissions and an intact reserve afterwards. That last one is an invariant guard, not failing-without-fix evidence: a reverted check-then-act shape still passed it in one run, because a mutex round trip either side of the window hides the interleaving the original `Sender::capacity()` snapshot exposed. The atomicity itself holds by construction -- admission happens inside the same lock as the enqueue -- and the displacement test is the executable half. (3) `a_panicking_store_accounts_for_the_batch_it_destroys` drives a Store whose batch future panics once and asserts the eight jobs it destroyed appear under `dropped_total{reason=\"writer_panic\"}`, that nothing was counted written, and that the supervisor restarts the writer and the next four jobs land; on revert the drop counter stays at 0 and the loss is silent. `a_wedged_writer_hands_shutdown_its_remainder_exactly_once` fills the queue to 1,024, lets a writer take a 64-job batch into a Store call that sleeps past the bound, runs the drain, and asserts the shutdown counter reads 1,024 -- the queue remainder AND the in-flight batch -- then waits for the Store to return and asserts the counter has not moved and `written_total{outcome=\"ok\"}` is still zero, which is what stops a wedged writer reporting as written what the drain reported lost. Counting sender occupancy alone reads 960. `every_drop_reason_is_rendered_with_a_fixed_label` pins all five reasons as fixed labels with no session, file or user identity in the exposition. decc4950 removes a deadlock the review's focused run could not have seen. `sink_for` looked the sink up in an `if let` scrutinee and constructed one in the `else` arm, and a temporary `MutexGuard` there lives to the end of the whole `if let` in this edition, so the `else` arm re-locked `SINKS` on the thread already holding it: `emit` against any Store `boot()` had not registered blocked forever. Every isolated handler test that drives a handler against its own in-memory Store hits that arm, and `cargo test -p plurxd --bin plurxd` stalled at `http::hls::tests::a_created_playback_points_at_the_ask_its_create_recorded` and never returned. `telemetry::tests::an_unregistered_store_registers_its_sink_without_relocking` emits against an unregistered Store and asserts the sink is registered, on its own thread with a ten-second timeout, because a deadlock does not fail a test -- it hangs the binary, which is how the branch reached review looking green. Reverting the binding to the `if let` makes it fail `Err(Timeout)` against `Ok(true)`. The whole binary now runs: 2,548 passed, 0 failed, 11 ignored. The ownership inventory in tests/playback/rolling-producer-owners.toml moves with this work: namespaced-task-spawn 547 -> 552 (the same single supervised writer, spawned from production, the test-only registration and four focused tests), namespaced-time-constructor 841 -> 848 (the batch window and the one shutdown bound, plus five test-only sleeps), and method-spawn 46 -> 47 with process-capable-launch-method 333 -> 334 for the one scoped OS thread in the concurrency test, which is joined by its scope and launches nothing."
