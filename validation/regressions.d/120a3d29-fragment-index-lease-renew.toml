reason = "The repo-wide placeholder census runs every parameterised statement in every replicated store slice through the validator the store applies at runtime — 533 of them — resolving format templates from same-file and shared-module constants and from each arm of a runtime-chosen fragment before judging, so a statement that opens on an interpolation is judged rather than skipped. Four literals resolve to no statement; they are predicate fragments whose hosts are judged instead, and the count is asserted so a fifth has to be looked at. The census checks its own module list against the directory and pins each entry to its own file. The backend-neutral Store contract then drives a fragment-index job through claim, renewal, a stale fence, a foreign owner, a foreign target, an expired lease, a node-local yield that refunds its attempt, a reclaim on a higher fence, a second renewal and completion, through both SQLite and three-voter Hiqlite. Reverting the renew and yield reorder fails the census statically and reproduces the outage on the replicated backend alone — the heartbeat's first tick errors before any I/O, the worker abandons the build without a write, and the row dies at attempt_limit — while the embedded backend, which binds by number rather than by first appearance, stays green. Reverting the dv_conversions renumbering fails the same census on the four M5b ledger writes that cannot otherwise advance past queued."
