reason = "The repo-wide placeholder census runs every production statement in every replicated store slice through the validator the store applies at runtime, resolves format templates before judging them, and checks its own module list against the directory so a new slice cannot escape it. The backend-neutral Store contract then drives a fragment-index job through claim, renewal, a stale fence, a foreign owner, a foreign target, an expired lease, a node-local yield that refunds its attempt, a reclaim on a higher fence, a second renewal and completion, through both SQLite and three-voter Hiqlite. Reverting the renew and yield reorder fails the census statically and reproduces the outage on the replicated backend alone — the heartbeat's first tick errors before any I/O, the worker abandons the build without a write, and the row dies at attempt_limit — while the embedded backend, which binds by number rather than by first appearance, stays green. Reverting the dv_conversions renumbering fails the same census on the four M5b ledger writes that cannot otherwise advance past queued."
