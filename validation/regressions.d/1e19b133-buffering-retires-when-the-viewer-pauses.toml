reason = "Revert this and four retained assertions go red, all of them under `make web-check`. Two are fixture cases in `tests/playback/playback-surface-contract.json`, replayed against the shipped reducer by the `the shipped web reducer runs all <n> cases` test in `tests/playback/playback-surface-contract.test.js`. `buffering_retires_when_the_viewer_pauses` attaches `g1`, stops presenting, raises `media_waiting`, ticks past `buffering_min_ms` so the spinner is actually drawn at t=1400, then sends `playback_requested: false` and requires the surface at t=2000 to be `none` with a `surface_cleared` entry in the log and to still be `none` at t=9000. With `playback_not_requested` off `buffering`'s `retired_by` list the reducer has nothing left that can retire that fault - presentation evidence is the only other reason, and a paused picture never produces another sample - so the surface stays `blocking` and the case fails on both the kind and the log, which is precisely the spinner sitting over a still frame until the generation changes. `a_pause_does_not_answer_a_prompt` holds the other edge: it raises `owner_exhausted` under the wait, pauses, and requires the prompt to still be blocking at t=2000 and t=9000 and to still be answerable by `close` at t=9500, so a reason that spreads onto `preparing` or onto the prompt classes fails there instead. The third is `every retirement reason a class names is reachable, and none is invented`, which asserts that the set of classes whose `retired_by` names `playback_not_requested` is exactly `[buffering]`; the fourth is `the shipped policy carries the fixture verbatim`, which deep-equals `SURFACE_CLASSES` as embedded in `crates/plurxd/src/web/playback-policy.js` against the fixture, so changing one side without the other is its own failure. The web wiring is pinned separately in `tests/playback/web-control.test.js`, in the transport-edge block that composes the shipped `handlePlaybackTransportEvent`, `playbackTransportEvents`, `applyPlaybackTransportIntent` and `resetMediaSource` and records every `playbackSurfaceStep` call: it asserts `a viewer pause tells the presenter media is not wanted`, `and a viewer play tells it the opposite`, and `the transport path tells the presenter one fact and nothing else`. Delete either `playbackSurfaceStep({playback_requested:...})` call from `handlePlaybackTransportEvent` in `crates/plurxd/src/web/index.html` and the first or second of those fails; pass any second key alongside it and the third does. What no test holds: that the owner's own `pausePlaybackInternally` never reaches the presenter is asserted only through `playbackTransportEvents`'s existing queue assertions (`internal reset pause is not a viewer pause`, `load cancels the old queued pause expectation`) rather than by counting surface steps across an internal pause, and no test drives a real media element through a buffer that fills while paused end to end - the reducer case is the fixture's model of it."
