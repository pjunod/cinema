reason = "The two P1 findings from the plan's sole adversarial review and the regressions that pin them landed together in `9789ca4ed`. `video_filters_for_contract` handed the Dolby Vision and HDR10 software renderers their own complete colour graph and returned before the generic CPU chain, so the `Deinterlace::BwdifSendFrame` decision the plan had already made and bound into plan identity was silently dropped for every interlaced source routed through `DoviTonemapx`, `DoviPassthrough` or `Hdr10Passthrough`, and an interlaced Dolby Vision or HDR10 file was encoded with its fields intact. `interlaced_special_renderers_apply_bwdif_without_breaking_dolby_vision_order` in `crates/plurx-core/src/transcode/mod.rs` builds the argv for all three of those pipelines from a `tt` field-ordered HDR source and requires exactly one `bwdif=mode=send_frame:parity=auto:deint=interlaced` ahead of the graph's `scale=` step, with `tonemapx=` still ahead of that bwdif on both Dolby Vision routes so reshaping keeps happening before the deinterlace; deleting the insertion fails the bwdif lookup outright, and moving it after the scale or ahead of the reshape fails the ordering assertions. On the Live TV side `resolve_live_delivery` took `.max()` of `max_height` across every matching H.264 `video_limits` row and settled output dimensions before the deinterlace cadence was computed, so a client advertising a 3840x2160 at 30 row beside a 1280x720 at 60 row was handed 1920x1080 at field-doubled 59.94 -- a rendition neither advertised row grants. `encoded_output_for_request` now selects one complete row that admits the scaled width, the height and the final frame rate together, and refuses with `client_route_unsupported` when no single row does. `interlaced_encode_selects_one_h264_limit_for_dimensions_and_final_cadence` in `crates/plurxd/src/live_tv_delivery.rs` drives exactly that pair of rows against a 1080i29.97 source: field output must resolve to 1280x720 at 60000/1001 from the 720p60 row, frame output to 1920x1080 at 30000/1001 from the 2160p30 row, and with the 720p60 row popped the field-output request must be refused with `no single final video limit` rather than inventing 1080p59.94. Restoring the per-field maximum returns 1920x1080 at 59.94 in the first case and returns a plan instead of an error in the third, so both assertions fail. Both are Rust unit tests inside `crates/`, which `rust-gate` runs through `make rust-check`."
