[[coverage]]
commits = ["e44b5426", "7e400202", "3f985ca6"]
points = ["live-tv.integration"]
checks = ["rust-gate", "rust-gate-ci", "history-regressions"]
reason = "Two failures with one root: nothing on the owner outlived the process and nothing on the client outlived the request. The retained tests are the ones that would go red if any of it were reverted. a_persisted_guide_survives_a_restart_at_its_real_age runs under a paused clock, where an hour-old copy has no instant to hang itself on, and requires the served age to be the real one and the stale window to close an hour early - the whole point of CachedGuide::age_at, which is now the only way to read an age. a_persisted_guide_past_the_stale_window_or_unreadable_is_not_adopted requires garbage, a future version and an expired copy to start cold rather than be served. an_invalidated_guide_leaves_nothing_on_disk_for_the_next_process requires a settings save to discard the copy a restart would otherwise adopt. a_settings_generation_change_wakes_the_guide_loop_once and a_lineup_that_fills_from_cold_wakes_the_guide_loop_and_a_warm_one_does_not require the two event wakes, and that neither fires when nothing changed. a_skipped_tick_on_the_owner_comes_back_in_a_minute_not_twenty and an_ingress_forgets_an_unavailable_answer_quickly_and_a_real_one_by_the_owners_clock require the cadences the empty grid came from. On the start side: a_retired_request_id_can_never_start_again, one_viewer_cannot_fill_the_shared_recovery_history_by_retiring, retire_stops_every_session_one_public_identity_produced (two matches for one identity, both stopped, and a POST racing the retire finding the fence rather than a fresh slot), resume_hands_back_one_stream_and_cancels_the_rest, resume_answers_pending_ended_and_retired_apart, a_full_owner_evicts_this_viewers_stray_and_nobody_elses over the five capacity fixtures including another viewer's idle session, a_retired_id_evicts_a_session_in_any_phase, a_retired_id_stops_being_retired_when_its_minute_is_up, a_started_session_reports_its_state_without_handing_back_a_capability, a_clean_release_is_counted_apart_from_a_failure, and a_session_end_line_names_the_channel_and_nothing_that_opens_a_stream. On the ingress: a_client_reads_what_this_whole_path_accepts_not_what_the_owner_alone_does, a_public_request_id_is_128_bits_of_hex_or_it_is_not_one, every_live_tv_error_says_what_to_do_next_and_who_decided_it, an_owner_that_answered_is_owner_decided_even_when_its_code_is_folded, and a_public_start_cannot_outlive_the_clients_own_timeout, which asserts the budget plus the awaited stop rather than the budget alone. The credential rule is retained by the existing DeviceAuth-absence test, extended here to the bytes on disk and to the session-end line. Every one of these runs in the local and hosted Rust gates; the two-node and hardware behaviour they describe is proved separately by live-tv-two-node and live-tv-hardware."
