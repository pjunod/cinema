reason = "one_file_holds_one_request_per_copy_video_identity pins the shape the milestone exists for: two identities of the same file enqueue as two requests instead of the second deduping against the first, and the identity survives the round trip so the resolver can build the one that was asked for. forcing_one_identity_leaves_its_siblings_alone is the assertion that justifies the column at all — a force cancels its own identity's background request and leaves the sibling queued; without the scope the sibling goes cancelled, which is terminal, so its generation is refused for good and the file never gets that index. an_unidentified_force_still_supersedes_everything_it_used_to pins the upgrade path: every pre-column row and every skip_markers row carries an empty identity meaning whichever identity is next, and a force with no identity must keep superseding all of them or requests in flight across the deploy change meaning. replicated_v27_store_migrates_the_request_identity_on_daemon_open drives the replicated migration end to end on a three-voter cluster — a row queued before the upgrade comes out the other side with an empty identity, re-opening an already-migrated store is a no-op, and a column present under a stale marker is refused rather than forgiven, because no other voter finished that step. The SQLite side is covered by v6_rebuild_preserves_everything at head 47 and the replay guard keyed on the column rather than the counter. Removing the identity scope on the forced cancellation strands two of every three identities permanently; removing the resolver's identity lookup settles two requests ready against work they never did; removing the empty-identity fallback changes the meaning of every request already queued when the fleet upgrades."
