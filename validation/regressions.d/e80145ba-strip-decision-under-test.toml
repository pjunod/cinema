version = 1

[[coverage]]
commits = ["e80145ba"]
points = ["playback.pipeline"]
checks = ["rust-gate"]
reason = "`a_stripping_session_writes_an_init_with_no_dolby_vision_claim` now drives the decision itself, not a literal: copyseg::run takes the source and the copy options its argv was built from and answers whether the record must go, so replacing that answer with false fails the test. Before this commit the same answer lived in spawn_copy_reader_owner, which no test reaches because it spawns an ffmpeg child, and constant-folding it to false left every one of the 1498 plurxd tests green. `a_session_that_strips_nothing_still_drops_a_brand_with_no_record` pins the stale-brand sanitizer independently of the removal: the two rewrote the same dby1 brand and each covered for the other, so deleting either alone was green; this drives a session that strips nothing over an init carrying the brand and no record, which is what ffmpeg's own dovi_rpu filter leaves and is the contradictory initialization segment AVPlayer refuses outright. `every_index_pass_agrees_with_the_argv_it_carries` gains the parameter-set-promotion branch of copy_video_args, which hand-rolls its filter list rather than calling hevc_copy_bsf_for_copy, with a counter requiring that branch to have been reached; and each row now carries the Dolby Vision columns its label describes, so the Profile 5 row enumerates a real Profile 5 file's identities rather than duplicating the Profile 7 row's. IndexPass additionally carries the CopyVideoOptions the argv and the record answer were derived from, so the index key cannot be computed from a different set than the recipe was built with."
