[[coverage]]
commits = ["b3106eb5"]
points = ["cluster.auth", "cluster.page-reads", "identity.access"]
checks = ["rust-gate"]
reason = "A defect shipped by #294, and the one that kept the DVR off the fleet. The DVR migration added schema v37 and the `MigrateFrom(DVR_SCHEMA_MIGRATION_SOURCE)` arm that performs it, but never added `DVR_SCHEMA_MIGRATION_SOURCE` to the accepted-predecessor match in `schema_migration_action`. A cluster sitting at v36 — which every voter was — therefore fell through to the catch-all and was told its schema version was unsupported, so the migration that existed could never be reached and a node carrying the DVR could not join. Nothing in #294 caught it: the store contract scenarios exercise the DVR operations against an already-migrated store, and the daemon schema gate's own test enumerated predecessors up to v35 without asserting the new one, so both halves passed while the path between them was missing. Revert this and `daemon_schema_gate_accepts_the_complete_supported_chain` in `crates/plurx-core/src/store/hiqlite.rs` fails three ways under `cargo test -p plurx-core --lib`: the arithmetic assertion `AUTH_SCHEMA_MIGRATION_SOURCE + 32 == AUTH_SCHEMA_VERSION` reads 31 against v37 and fails first; the two new equalities pinning `DVR_SCHEMA_MIGRATION_SOURCE` to the exact v36 shape and to one step below `DVR_SCHEMA_VERSION` fail next; and `schema_migration_action(&[row(DVR_SCHEMA_MIGRATION_SOURCE)], ClusterCompatibility::CURRENT)` returns the migration error rather than `MigrateFrom`, which is the shipped behaviour the fix restores. That last assertion is the one that maps directly onto the outage: it is a v36 cluster being offered a v37 daemon. What is still not covered: no test starts a real three-voter cluster at v36 and joins a v37 daemon to it, so the admission is asserted at the decision function rather than end to end, and `make cluster-store-check` runs its scenarios against voters that are already current."
