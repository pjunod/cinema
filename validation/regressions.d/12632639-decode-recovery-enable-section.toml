reason = "Settings > Developer described every switch that costs something and said nothing about the automatic decode recovery, which is the largest behaviour this effort added and the only one an operator cannot turn on. The gap was not cosmetic: writing the section is what surfaced that the recovery cannot fire on any node, because `DiagnosticObservation::resolve` refuses a grammar to a plan whose decode backend is not `Software` while `prepare_decode_restricted` refuses an alternate to a plan that already decodes in software, and there is no plan in between. Without the section an operator reading this panel would reasonably conclude the recovery was live, and the first evidence otherwise would have been a fleet qualification run in M8 finding a path that never fires. Two assertions in `tests/web/settings-sections.test.js` retain it. `Developer is where the switches that cost something live` now requires the card to be present and to carry the four statements that make it useful rather than decorative - that there is no switch, that the hardware-decoder contract is not true on any node today, that the budget is one per playback and never returned, and an enable path naming what actually closes it. The second is a tripwire rather than a description: the literal sentence `Not true on any node today` is asserted, so when a hardware contract is qualified the card becomes wrong and this test fails, instead of an operator-facing surface keeping a stale claim that the feature is unavailable. `tests/validation/test_decoder_recovery_status.py` holds the same statements against the shipped page and requires the status document to carry the finding, so the card and the ledger cannot drift apart."
