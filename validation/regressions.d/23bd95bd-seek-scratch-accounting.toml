reason = "Repeated seeks refused playback at the fourth reservation whatever was on the disk, because the charge was a sum of three separate critical sections — fold the live registry, fold the retired one, then infer provisional work by subtracting both folds from a free-running atomic. Retirement inserts into retired before it removes from live, so a session moving between the folds was counted twice and its reservation subtracted twice, and the zero clamp that hid the negative result also hid genuinely provisional starts. `scratch_charge_counts_one_incarnation_once_across_registry_transfer` is the mutation killer for the ledger's existence: it drives a bind, a retirement and a genuinely provisional start together and requires the total to stay at two charges with the provisional one still visible, which the old subtraction cannot produce. `scratch_charge_admission_serializes_and_refuses_with_exact_figures` pins the linearization point — three admissions fit an 8 GiB budget, the fourth is refused with the exact charged/requested/configured figures, and capacity returns on drop — so moving the check and the add out of one critical section fails it. `scratch_charge_twenty_retired_inventories_fit_beside_a_live_pair` and `scratch_charge_a_fourth_replacement_fits_when_the_retained_bytes_fit` are the product claim in accounting terms: twenty 128 MiB retained generations and three retired replacements must be charged their measured bytes, not their reservations, and both drive real `begin_retirement` and `commit_quiescent_measurement` transitions rather than dropping permits to make room. `scratch_charge_keeps_the_producer_charge_until_writers_settle` and `scratch_charge_barrier_waits_for_a_writer_and_reports_a_stall` pin the barrier the incident needed: ffmpeg's reap is not the copy reader's completion, the guard is registered before the worker is spawned so retirement cannot see zero writers for a reader about to exist, a conversion offered while a writer is registered is refused with `writers_outstanding`, and a stalled writer is reported rather than treated as settled — returning true on timeout fails it. `scratch_charge_refuses_a_measurement_that_raced_a_writer` and `scratch_charge_an_incomplete_measurement_keeps_the_conservative_charge` pin the measurement contract: a scan taken under a stale inventory generation is refused, a partial scan keeps the previous charge, and a sparse fixture proves the sum is apparent length rather than allocated blocks. `scratch_charge_measures_an_overrun_instead_of_clamping_it` requires an actual overrun to be charged, so clamping a measurement down to its reservation fails. `scratch_charge_keeps_an_unlinked_object_charged_until_its_last_reader_closes` drives two concurrent ranges over one object through unlink and close, requiring one charge and exactly one release; `scratch_charge_failed_cleanup_keeps_the_bytes_charged` and `scratch_charge_survives_the_owner_and_releases_once_cleanup_proves_it` require a failed unlink to stay charged and named, a dropped owner not to free bytes still on the disk, and a duplicate cleanup completion to subtract nothing. `scratch_charge_real_refusal_answers_503_through_the_http_mapper` takes the string `reserve_rolling_scratch` actually returns and feeds it to the real `session_start_error`: the defect was an unclassified bare String falling through to an anonymous 500 the browser rendered as a corrupt movie, and a test that constructed an already-prefixed string would have passed on the broken build. `scratch_charge_two_writes_cannot_share_one_allowance` is the mutation killer for the write boundary itself: the first version of `authorize_write` compared the grant against `used_bytes`, which only moves when the periodic directory walk runs, so every object published between two walks passed the same comparison and the bound was a timing bound rather than a write bound. The test authorizes two writes against one allowance without an intervening measurement and requires the second to be refused, which the compare-only shape cannot produce; `scratch_charge_authorize_write_grows_only_by_the_shortfall` pins that a grow covers exactly the shortfall and no more, and re-checks the allowance after the grow so a concurrent regrant cannot move it under a caller that already passed. `scratch_charge_regrant_never_falls_below_what_is_authorized` requires a lowered ceiling to stop at what is materialized or authorized, so handing the budget capacity an in-flight writer is about to spend fails it."
