reason = "Recorded against d0e5c630, the squash merge that brought PR #877 onto main; the two commits this row originally named no longer exist as separate SHAs. sampled_extents_layout pins the layout at both sides of the whole-file boundary and on a 43 GB file: head at zero, tail ending exactly at the end of the file, interior offsets 4 KiB-aligned, strictly ascending, non-overlapping, and a total read of exactly 64 MiB no matter the size — which is the entire point of the change. sampled_digest_is_domain_separated asserts the digest differs from a whole-file sha256 of the same bytes and from a bare hash of the same extents concatenated, so the preamble cannot be dropped. sampled_digest_sees_a_flip_in_any_extent flips a byte at the head, in an interior extent and at the tail and requires each to move the digest, and pins the accepted trade — a flip strictly between extents does not — so nobody removes the sampling by 'fixing' it. sampled_digest_sees_growth pins that size is in the preamble. attest_source_reports_progress_and_costs_a_fixed_read requires monotonic byte reports ending at exactly 64 MiB for a 70 MiB source, which is the regression that made a 43 GB title unattestable. attest_source_refuses_a_short_source requires a hard error rather than a digest over fewer bytes than claimed. a_timed_out_attestation_is_reported_as_a_timeout_not_a_refusal covers the two codes and pins the call site to the helper rather than a literal, so the cluster path cannot silently go back to reporting a hung mount as a source failure. a_non_forced_generation_carries_the_attestation_regime pins the regime token literally and requires it to change the fingerprint while staying deterministic. every_object_version_carries_the_attestation_regime pins the regime prefix on the key the memo table is matched by, which is the only thing that stops two nodes holding different digests — and therefore different cache keys — for the same file indefinitely. a_short_source_is_an_error_and_never_a_shorter_digest drives sampled_source_digest past the end of a real file and pins the exact refusal, reaching the read == 0 guard that attest_source own identity checks would otherwise mask; attest_source_refuses_a_source_that_shrank_under_it pins which check refuses a truncated file. sampled_extents_layout additionally walks every size in the 8 KiB band above the whole-file limit, where step is closest to one extent width and a rounded-down offset is likeliest to collide with its predecessor, plus u64::MAX and 1 << 47, and pins attestation_read_bytes at every boundary so the verify progress denominator cannot silently return to the file size. a_terminal_generation_blocks_its_own_reuse_and_only_its_own drives the store shape that stranded the fleet: a row failed to attempt_limit refuses re-enqueue under its own generation and returns the tombstone, while a moved generation enqueues beside it. The uncharged-timeout refund is already covered by foreground_retry_yields_without_spending_an_attempt and its counterpart charged_retries_exhaust_to_a_terminal_attempt_limit. Removing the domain preamble lets a sampled digest impersonate a whole-file one across a version boundary; removing the fixed extent count restores the forty-three-minute hash; removing the uncharged timeout returns an unreachable mount to spending five attempts into a terminal state; removing the generation token leaves every stranded file permanently unrequestable."
