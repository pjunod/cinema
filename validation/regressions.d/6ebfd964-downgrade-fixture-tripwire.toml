reason = "One appended migration produced three failures, none of them in the file that caused them. Three fixtures build a current database and wind `user_version` backwards — the rows they need can only be written through the store's own API — so everything the later migrations created is still standing and each has to be dropped by hand. `4f808421` and `e2480c8c` repaired the two guard fixtures in `dv_conversion.rs` and the v14 activation fixture in `tests/store_contract.rs`; both are right, and `DROP TABLE IF EXISTS` makes those drops idempotent rather than complete, so it says nothing about the next table. The worst of the three failures took twenty minutes of `cluster-store-check` to arrive and landed on a test about Dolby Vision recovery guards. `the_downgrade_fixture_undoes_every_migration_after_the_guard` asserts the count instead of deriving the drops — deriving them would be a down-migration this store deliberately does not have — and it sits in the fast Rust gate so it fires in the first minutes, on the commit that appends the migration, naming both fixtures that need extending. It also pins v44 as the guard migration, because the fixtures' hard-coded 43 is only right while that holds and an inserted migration would move it silently. Mutation-checked with a hypothetical v46: this test fails on its own message, and `sqlite_v43_guard_migration_refuses_an_unrecoverable_committed_claim` fails on `table mutation_probe already exists`, which is the failure it exists to pre-empt. Both run under `cargo test -p plurx-core --lib --features hiqlite-store`, which `rust-gate` runs."
