reason = "The transport-recovery campaign's resource check compared every cycle against one warmed sample at zero margin and never completed a campaign, because the counts it samples alternate between two states one recovery apart and threads jitter on their own. It now asserts an envelope over the two halves of the campaign: neither the floor nor the fourth-highest sample of the closing half may exceed the opening half's floor or highest sample by more than the recorded allowance (sockets 0, owned async tasks 0, threads 2); the sampler waits for idle and two identical samples only; the artifact is schema version 2 and records both bands per node, the window sizes and the order statistic, and the validator recomputes them from the cycles and refuses incomplete or reordered records. The focused suite pins a socket, thread or owned task leaked every cycle, a leak starting late on a flat and on an alternating series, three spikes against four, the measured drain and jitter, and every recorded envelope number tampered; the Makefile and the operations contracts pin the suite at forty. The opening band excludes the warmup baseline: it is sampled before the first recovery while a node's pools are still cold, so admitting it to the opening floor compared steady state against a cold start and read a thread count that stepped twice during warmup and then held for eleven cycles as a leak. Both bands are taken over recovery cycles alone, ten against ten, and the suite pins the measured plateau as no leak beside growth that never stops as one."
