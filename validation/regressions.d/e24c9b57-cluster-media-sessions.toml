reason = "The retained backend-neutral Store contract runs request claim, conflict, failed-attempt reacquisition, owner assignment, activation, supersession, exact-expiry renewal refusal, unexpired owner inventory, release, expiry-to-terminal maintenance, and ended-row retention through both SQLite and three-voter Hiqlite; it also rejects noncanonical uppercase fingerprints. Runtime unit fixtures reject incompatible or unfenced start DTOs, bind responses to their session capability, validate path-safe relay resources and bounded request headers, split the complete admitted owner inventory into no more than sixteen renewal batches for one concurrent common-deadline fan-out, require every voter to have a reachable current-protocol snapshot before remote placement, and bound read-proof preverification. Relay fixtures retain Range-related response metadata and Content-Disposition while excluding cookies, connection headers, and private peer fields, and prove response bodies remain streamed. HLS helpers exercise public playback-id bounds plus normal, open-ended, suffix, unsatisfiable, and multi-range parsing. Observability fixtures require full one-way correlation values instead of raw bearer session ids, including client telemetry and activity diagnostics. Existing route tests retain household-credential rejection at peer-only endpoints and the typed node-removal ownership barrier. These fixtures do not claim an end-to-end multi-daemon transfer, wall-clock behavior under a blackholed socket, or rolling-upgrade orchestration; those remain PR integration and operational validation responsibilities."
