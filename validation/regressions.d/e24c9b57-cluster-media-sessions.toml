reason = """
The retained backend-neutral Store contract exhaustively inventories the media-session Store surface, then runs request claim, conflict, exact-expiry and failed-attempt reacquisition, deadline-fenced owner assignment and activation, exact-or-legacy-empty expected-predecessor CAS supersession, delayed-stale-successor refusal, exact-expiry renewal refusal, unexpired owner inventory, release, expiry-to-terminal maintenance, and ended-row retention through both SQLite and three-voter Hiqlite; it also rejects noncanonical uppercase fingerprints. A replicated-only contract seeds retained max-revision and removed-owner lease rows and requires activation to reject both when the authoritative lease mutation cannot advance.

The exact SQLite v25 and Hiqlite v9-to-v10 migration/current-import fixtures require the request, pointer, and session tables plus all five request/owner/user/expiry/retention indexes while preserving predecessor data. Runtime fixtures reject incompatible or unfenced start DTOs, bind responses to their session capability, preserve zero/low/above-ladder copy-source heights while keeping transcode rungs strict, validate path-safe relay resources and bounded request headers, and split the complete admitted owner inventory into no more than sixteen renewal batches. That retained arithmetic fixture does not claim production wall-clock, timeout, or commit-unknown behavior. Runtime fixtures also require every voter to have a reachable current-protocol snapshot before remote placement and bound read-proof preverification. Separate read-replay fixtures make each five-second signed nonce single-use without consuming the longer mutation replay cache.

Relay fixtures retain Range-related response metadata and Content-Disposition while excluding cookies, connection headers, and private peer fields, and prove response bodies remain streamed. HLS fixtures exercise public playback-id bounds, normal/open-ended/suffix/unsatisfiable/multi-range parsing, exact partial-response byte accounting, bodyless 304 and 416 completion, and buffered init-range accounting without false incomplete-delivery events; the serving path also refuses zero-length live objects before range arithmetic. The observability helper fixture requires a full one-way correlation value instead of a raw bearer session id; the Rust gate retains its use by playback telemetry, activity diagnostics, claim warnings, and copy-segment logs. Cluster membership coverage retains the typed active-owner removal barrier with a real-time lease fixture. The documented authorization contract makes terminal routes refuse new cache admission immediately and bounds an already-validated media capability to the one-second monotonic route-cache TTL; household credential revocation remains immediate.

These fixtures do not claim an end-to-end multi-daemon transfer, wall-clock behavior under a blackholed socket, or rolling-upgrade orchestration; those remain PR integration and operational validation responsibilities.
"""
