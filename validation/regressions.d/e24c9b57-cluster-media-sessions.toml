reason = """
The retained backend-neutral Store contract exhaustively inventories the media-session Store surface, then runs playback-bound request claim, conflict, exact-expiry and failed-attempt reacquisition, deadline-fenced owner assignment and activation, exact-or-legacy-empty expected-predecessor CAS supersession, delayed-stale-successor refusal, exact-expiry renewal refusal, unexpired owner inventory, release, expiry-to-terminal maintenance, and ended-row retention through both SQLite and three-voter Hiqlite; it also rejects noncanonical uppercase fingerprints. A separate cap fixture fills all 64 current slots and proves that a first claim, exact expired-claim recovery, owner assignment, and activation may replace the exact current playback without admitting a 65th session. A replicated-only contract seeds retained max-revision and removed-owner lease rows and requires activation to reject both when the authoritative lease mutation cannot advance.

The exact SQLite v25 and Hiqlite v9-to-v10 migration/current-import fixtures require the playback-bound request, pointer, and session tables plus all five request/owner/user/expiry/retention indexes while preserving predecessor data. Runtime fixtures require public and private starts to share file, playback, start-time, track, offset, height, and reopen bounds; bind both local and remote responses to the same capability/timeline contract; preserve zero/low/above-ladder copy-source heights while keeping transcode rungs strict; validate path-safe relay resources and bounded request headers; and split the complete admitted owner inventory into no more than sixteen renewal batches. The retained timing arithmetic proves the remote confirmation watcher strictly outlives every ingress phase plus margin, without claiming production wall-clock behavior. Runtime fixtures also require every voter to have a reachable current-protocol snapshot before remote placement, expose separate enabled/rollout-ready/ready diagnostics, refuse an unavailable standalone enable attempt, and bound read-proof preverification. Separate read-replay fixtures make each five-second signed nonce single-use without consuming the longer mutation replay cache.

Relay fixtures retain Range-related response metadata and Content-Disposition while excluding cookies, connection headers, and private peer fields, and prove response bodies remain streamed. HLS fixtures exercise public playback-id bounds, normal/open-ended/suffix/unsatisfiable/multi-range parsing, exact partial-response byte accounting, bodyless 304 and 416 completion, and buffered init-range accounting without false incomplete-delivery events; the serving path also refuses zero-length live objects before range arithmetic. Route fixtures require a repeated random capability to produce one Store read, activation to supersede a cached miss immediately, stale pre-activation/pre-fence reads to remain suppressed after cache eviction, and terminal rows to cache only as negative answers. One common three-second deadline covers the 32-shard admission queue and Store read, while a fixed 4,096-slot generation table preserves publication order beyond the one-second cache TTL; DELETE performs cached route admission before its exact end mutation. SQLite route and owner-inventory reads use the read pool. The observability fixture captures both ffmpeg command and stderr events and requires the raw bearer UUID and full capability URL to be absent; workers use independent scratch ids while playback telemetry, activity diagnostics, claim warnings, and copy-segment fields retain the one-way correlation helper. Replacement fixtures serialize immutable-user/playback starts through the durable verdict, refuse a gate wait past its bounded/common deadline before predecessor reap, preserve one-slot replacement admission, keep rename-safe retry/reopen identity, stop fenced workers from renewing while teardown is blocked, and resample resolved-replay freshness at the one-second boundary. Cluster membership coverage retains the typed active-owner removal barrier with a real-time lease fixture. Bounded stale-settlement attempts always release one of their 64 tracking slots for an idempotent retry. The documented authorization contract makes missing, terminal, and expired routes negative-cache immediately and bounds an already-validated media capability to the one-second monotonic route-cache TTL; household credential revocation remains immediate.

These fixtures do not claim an end-to-end multi-daemon transfer, wall-clock behavior under a blackholed socket, commit-unknown timing, or rolling-upgrade orchestration; those remain PR integration and operational validation responsibilities.
"""
