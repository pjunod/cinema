reason = "The create-retry deadline block in `tests/playback/web-control.test.js` is what holds this, and it runs under `make web-check`. The blocks are anonymous, so they are named here by the assertions that fail. The harness is the point of the fix as much as the code is: `createRetryHarness` now slices the shipped `beginPlaybackPreparation` in beside `openSessionRetryingNotYet` and `playbackCreateRetryContext`, and its `open()` runs the sequence inside a real preparation owner, so what is exercised is the wiring rather than a copy of it. The deadline case pushes one `startup_timeout` refusal followed by a create that never settles, advances 1000 ms and requires `the first refusal put the sequence on its ladder` (two posts), advances 18_999 ms and requires `nothing is raised one millisecond early`, then advances the last millisecond and requires `the owner stops the player on the preparation clock`, `...and raises the exhaustion M5 designed` (exactly one `owner_exhausted`), `the viewer reads the server's own sentence, not a generic preparation failure` (the raised fault's `detail` is the server's own `the transcoder is still starting`), `settled.error.createRetryReason === preparation_deadline`, and `failPreparation must leave this prompt standing` (`surfaceRaised === true`). Revert the fix and every one of those goes red at once: the 20 s preparation bound aborts the create, the sequence throws a bare `AbortError` with no `surfaceRaised`, and `failPreparation` paints `owner_stopped` `Playback could not prepare.` over a viewer whose server had been answering `still building` for twenty seconds - which is precisely the lie this commit removed, since M5's own 60 s deadline needed at least 56 s to fire and so could never fire on the web at all. The second block is the guard on the new `expiry` hook: a create that is merely slow, with no `not yet` answer behind it, advances the full 20 s and requires `nothing was exhausted - nothing had refused` (no stops, no `owner_exhausted`), `TimeoutError`, and `surfaceRaised === undefined`, `so failPreparation still owns this one`. Make `expiry` answer unconditionally instead of only when `sequence.refusal` is set and that block fails - it is what keeps a slow server from borrowing M5's sentence. The third block is what makes deleting M5's own 60 s watchdog safe: it calls `bare()`, a sequence with no preparation owner, and requires it to reject with a `TypeError` and `and it never reached the wire` (zero posts), so an unbounded create cannot exist. The fourth requires a cancelled preparation to end the sequence with an `AbortError` and raise nothing, and the late-success assertions require the create that finally lands to be released and not attached (`a late success is released, not attached`) with no second prompt. Said plainly: the removals themselves - the 60 s `deadline` promise, `deadlineTimer`, `disarm()`, the `Promise.race`/`attempts.catch` pair, `sequence.expired` and its two guards, and the dead `exhaust(deadline)` half of the late-success fork - are pinned by no assertion that says `this code is gone`. Their unreachability is argued from the 20 s bound and the ownerless-sequence refusal, and the ownerless block is the only one of those two that a test states. `CREATE_RETRY.deadline_ms` and `createRetryStep`'s `deadline` reason stay in `crates/plurxd/src/web/playback-policy.js` for Apple and Android, and `the create-retry deadline is absolute and never schedules past itself` in `tests/playback/web-policy.test.js` still holds those."
