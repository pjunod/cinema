reason = "The reviewed implementation that began in this commit now commits the package's recovery budget before alternate planning and scripts primary, alternate, restart, and crash-at-pending paths through the daemon and its shipping OfflineManager. Backend-neutral Store contracts run on SQLite and a real three-voter Hiqlite cluster; they reject stale owners and same-node claim generations, primary replay, a second alternate, late cache-hit/fresh-cache/Ready publication after the durable cancellation fence, and unsupported worker capability protocol versions. The membership-removal harness rehomes a consumed package, preserves the spent budget while clearing owner-local recipe references, rejects the removed owner, and binds the survivor's alternate."
