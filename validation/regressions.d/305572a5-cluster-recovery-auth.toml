reason = "a_completed_removal_stops_fencing_the_exclusions_it_finished_with is the finding itself: it inserts a tombstoned node together with the removal and removal-attempt rows finalize_node_removal deliberately leaves behind, and requires both the cache-admin exclusion and the planned-outage lease to be acquirable anyway; restoring the table-wide NOT EXISTS makes both acquisitions answer zero rows, which is exactly the fleet state where the credential-guard activation retried every three seconds for two weeks. The same test holds the other half with fresh fixtures whose removal target is untombstoned, so the fix cannot be a blanket removal of the fence: an in-flight removal must still exclude both, and deleting the removed_at condition fails it. a_closed_recovery_proof_refuses_by_condition_never_by_credential drives the whole route rather than the extractor: it closes the proof cache the way the readiness projection closes it, then asks GET /api/v1/cluster/status three times with three credentials and requires three different answers, because the defect was that all three got the same one. The admin case asserts the handler's own cluster_roster_unavailable code rather than a status, so it proves the request reached past the guard and cannot pass on an unrelated refusal; the viewer case pins FORBIDDEN, which is the answer that must not become 401 when someone later simplifies the match; and the unknown-token case pins the one UNAUTHORIZED the guard is still allowed to give. Restoring .ok_or(ApiError::Unauthorized) fails it with authentication required. aggregate_request_reads_only_node_owned_projections keeps the property the old absence assertion was protecting, in a form that survives the fallback: the cached answer and its early return must both appear before the source mentions the Store, the Store read must be inside a bounded timeout, and exactly two ApiError::Unauthorized may exist in that guard -- so a later edit cannot put the Store in front of the cache or re-widen the 401. tests/web/cluster-recovery-session.test.js executes the shipped api function out of index.html rather than matching its text, with a fake fetch and a counting logout: an ordinary route's 401 must still call logout exactly once, a keepSessionOn401 refusal must call it zero times while still carrying the status and the server's stable code to the panel, and a 403 must behave the same. Removing the branch fails the second case. Its remaining assertions count the three /cluster/status call sites, because a correct api with the flag never passed is the same bug again. cluster-membership.test.js keeps the tick's refusal path honest: a refused recovery read now repaints and ages the reading like every other refusal instead of rethrowing toward a logout, and the assertion is scoped to the cluster branch because the sibling branches poll ordinary admin routes where a 401 really is the credential."
