reason = """
The retained backend-neutral Store contract activates a media session with a nonzero write-once `media_origin_ms` and requires both the expired-route inventory and the takeover compare-and-swap to carry it through unchanged, because every generation's frontier is measured from that zero. It renews with a frontier below the one already recorded and requires the row not to follow it: a generation that restarts its local encoder resets its own index, and the replicated sequence high-water mark is what the next successor starts above. It ends an incarnation that has just been taken over and requires the returned route to name the owner the end is actually stopping, the ended row to be retained with no live lease, the coordination lease `session:<incarnation>` to be reacquirable by a third node — which is what proves the clamp landed rather than being asserted from the same snapshot that drove it — and the ended incarnation to be neither offered for takeover nor claimable, so §7.2's delete-versus-takeover resolution admits no replacement child. Every one of these runs through SQLite and through three-voter Hiqlite; the replicated backend is the only one a takeover executes on, and its expired-route statement is compiled by that suite, which the pushed branch's temporary-borrow formulation was not.

Two properties are asserted against the replicated source itself, because neither is reachable through the public Store API. No statement in the module may introduce its `$N` placeholders out of numeric order: SQLite resolves them by first appearance while the parameter list binds positionally, so an out-of-order statement compiles, runs, affects rows, and writes every value into the wrong column with nothing to observe at the call site — the failure that had scrambled four statements at once, including the renewal that writes the frontiers this milestone reads back. And the end-session transaction must read owner and fence back out of `media_sessions` rather than from its pre-transaction snapshot, must clear the pins of every epoch of the ended incarnation, and must return a route re-read after the commit; the interleaving those guard against cannot be staged through the store API, so the shape of the statements is what is pinned.

Runtime fixtures pin the coordinates a successor publishes, at the point each is decided rather than in an extracted helper. Every ownership generation's init object round-trips the serving allowlist while that allowlist stays an allowlist, so the `EXT-X-MAP` URI a replacement advertises is one the segment path returns. The published start number — the epoch floor composed with the replicated sequence, which is what reaches the muxer — stays inside the range ffmpeg can name, with the epochs either side of that ceiling decided differently, and a takeover past it is refused rather than published as a generation whose every segment resolves to a truncated negative filename. A successor overlaps one whole segment of its own shape, so an owner lost part way through a fifteen-second remux segment cannot strand media between generations; the same fixture requires the restart to be measured from the row's write-once origin and to clamp at both ends. A session's frontier offset is read back off a constructed session and follows the media origin it achieved, so a remux pulled back to an earlier keyframe reports the media it really starts at. An untouched successor playlist reports its epoch floor rather than zero, emits exactly one discontinuity, and has every URI it advertises checked against the serving allowlist. The abort path reaches a taken-over worker through the incarnation carried on the session — a successor is created by no request on its node — while a different incarnation still cannot touch it. A settling takeover is live but not renewable, decided from the settlement registry itself rather than a caller-supplied set, and an overlapping attempt's guard release does not un-protect the winner. The source-snapshot predicate admits only an unchanged size and modification time, and refuses the impossible `0/0` snapshot recorded when a session's file row could not be read at placement.

These fixtures do not claim an end-to-end multi-daemon transfer, a real ffmpeg run at any start number, wall-clock recovery timing, retrievability after the predecessor's disk is gone, client behavior across the discontinuity, or the eighty-session Raft budget. Those remain PR integration and physical-device validation responsibilities, and the recovery-time gap between the shipped lease constants and §8.8's ten-second acceptance is recorded in the plan rather than claimed here.
"""
