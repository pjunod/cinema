reason = "Four shipped lines that each passed their own deletion against the whole lane, and the harnesses that could not see them. The hls.js budget case composes the shipped attachHls and scheduleHlsNetworkRetry rather than a hand-made PLAYER, and requires hlsRetryUsed to be 0 after the shipped attach, the first spendHlsRetry to be taken, the second on the same attach to be refused, and a second attach to restore the budget; delete attachedPlayer.hlsRetryUsed=0 from beginHlsAttachment and the last two assertions go red instead of passing on a player the test made up. The failPreparation case drives the shipped play() and its beginPlayAttempt() helper through a cold transcode whose create answers still building four times and requires exactly one owner_exhausted, no owner_stopped at all, exactly one stop, four creates, and one request identity replayed across them; without the surfaceRaised guard in failPreparation a second fault is stacked on the owner's own prompt and the owner_stopped assertion fails. The row 6 / row 7 boundary is asked of the shipped playbackCreateRetryContext() directly through the harness's context() seam, which requires a cold start to answer start, an attached predecessor to answer change, the PREDECESSOR rather than the incoming player to decide it, and then requires a sequence that supplies no context at all to post once over an attached predecessor, stop nobody and reject; returning start unconditionally passed every earlier case because each one supplied its own context, and it now fails both halves, which is the difference between a refused change keeping its banner and four retries ending in a stop over a picture the viewer is watching. On the Kotlin side the web-policy case no longer asserts a bare player.prepare(), a call that appears at eight other sites in Controller.kt and so pinned nothing: it requires the owner to hand the recovery a seekTargetMs on the player's own timeline together with the player's seekTo and prepare, requires exactly two behindLiveWindow.attached() call sites so a committed prepared successor cannot inherit a spent budget, and requires the branch to ask behindLiveWindow.recover with nothing gating it. flushDeep is local to the M5 section on purpose, so deepening one section's await chain does not quietly change the timing every other case in the file pins at. All of it runs under make web-check, which is the web-static gate: it executes tests/playback/web-policy.test.js and tests/playback/web-control.test.js against the shipped crates/plurxd/src/web/index.html and the shipped Android Controller.kt."
