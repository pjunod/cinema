reason = "the_ingress_control_gate_answers_a_lost_owner_gone posts a real control exchange at a durable EVENT route whose lease has expired and requires 410, the owner_lost code, and the absence of retry_after_ms. It drives the public-ingress gate rather than the classifier behind it, which is the whole point: an adversarial review found that the first version's helper-level test let a mutation reverting that gate to its old unconditional 425 survive the entire suite, and the gate returns before verify_authority ever runs, so that mutation would have shipped the defect to every real client while the change looked tested. the_ingress_control_gate_keeps_a_claimable_owner_retryable and the_loss_answer_reports_the_epoch_its_caller_was_fenced_against pin the other arm and the fields a client is fenced on, so answering every expiry as loss, or dropping the epoch, both fail. a_publication_fence_with_a_live_lease_stays_retryable_on_the_control_plane covers the second producer of a control transition: a committed replacement holds a live lease through its whole publication window and its recipe, being a VOD handle's, is one no takeover would accept, so classifying on the recipe alone would end a session whose successor is alive — and before this commit that gate was answered unconditionally here while the media plane classified it, a live disagreement between the two planes about one route. the_relay_shaped_loss_answer_is_a_legal_control_body deserializes the answer back through ControlErrorBody and requires is_valid_for_status to accept it, because a body the relay refuses never reaches a client at all; it also pins that the relay shape reports no epoch rather than inventing one. a_lost_owner_is_a_distinct_control_answer_from_a_transition pins the code at 410 and refuses it at 425, which is the allowlist the relay applies, and records the mixed-fleet direction: an ingress node predating the code degrades a newer owner's answer to a retry rather than to a wrong terminal answer. durable_authority_fences_generation_owner_expiry_and_end drives both answers through a real store, its fixture gaining a recipe parameter so the two cases differ only in the fact that decides them. The relay's own gate cannot be driven — signing an internal request needs a replicated membership fixture that does not exist — so the condition was moved into control_owner_refusal beside the answer, leaving that site no part of the decision; the ingress test proves the shared function. Without these a viewer whose session stops being renewed keeps a control loop retrying twice a second against a session nothing will ever answer."
