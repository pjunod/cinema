reason = "`a_stripping_session_writes_an_init_with_no_dolby_vision_claim` drives copyseg::run end to end with the strip ask over a feed whose init carries the Profile 7 record a stripping muxer copies out of the source, and requires the written init.mp4 to contain no dvcC, no dvvC and no dby1; a control run without the ask requires the fixture to carry a record, so neither assertion can pass on an empty or record-free result. Deleting the removal branch in run fails it, and before this commit the entire recovery-path fix could be disabled with the whole binary suite green. `every_index_pass_agrees_with_the_argv_it_carries` drives every identity video_identities enumerates across Dolby Vision, HDR10 and plain sources with and without dovi_rpu and with and without conversion, and requires the pass to remove the record exactly when its own rendered filter chain strips NAL types 62-63 without asking ffmpeg for dovi_rpu; the argv and the pass are now one IndexPass value, so a caller cannot build the argv and drop the answer, and a final count requires the removing branch to have been reached rather than the equality holding vacuously. `a_removal_rides_the_promotion_and_refuses_to_be_a_rewrite_too` requires promotion inputs asking to both rewrite and remove the record to error having changed nothing, driven on an init whose hvcC has no arrays with parameter sets a control proves do move bytes; moving the refusal back into the Dolby Vision match arm, where it ran after the parameter-set and HDR10 promotions, fails it. `the_brand_rewrite_declines_on_an_ftyp_it_cannot_walk` pins the guards on replace_dolby_file_type_brand across a ragged size, a largesize box, a size larger than the buffer, a non-ftyp box and one too short, and requires the minor version at bytes 12 through 16 to be left alone; dropping the size-minus-sixteen-modulo-four check fails it, and that check is what keeps the compatible-brands walk from stepping past the declared size."
