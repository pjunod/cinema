reason = "#842 closed the way `convert_dolby_vision` was lost on the wire; three routes to `{preserve: true, convert: false}` on a dual-layer source remained, and that state is the delivery no consumer decoder outside Blu-ray hardware takes. The legacy blanket `supports_dolby_vision` bit was read as covering dual-layer, so a client saying only \"I do Dolby Vision\" had `dv_handling` answer `None` and `decide` preserve raw Profile 7. `legacy_trusted_review` trusted an echoed `preserve_dolby_vision` that is the server's own answer produced expecting a conversion, so an operator switch or a label-only row turned it into the same delivery. And the unreadable-caps arm returned no review at all, skipping `apply_plan_review` entirely, which left the echo unclamped for any client posting a `\"v\":1` or empty body. `decodes_dolby_vision_as_copied` requires an enumeration for a dual-layer source while `allows_dolby_vision` stays wide for the HDR-bit excuse and Apple's remux normalization; `served_copy_options` now also asks the file, which the live-recovery path cannot be wrong about. `a_blanket_dolby_vision_claim_is_not_a_claim_about_dual_layer` in `plurx-core`, `a_build_with_no_caps_document_is_never_handed_unconverted_dual_layer` and the unreadable-arm assertion in `http/hls.rs`, and `a_copy_never_preserves_dual_layer_dolby_vision_it_cannot_convert` in `transcode.rs` each fail under the reversion of their own half, all under `cargo test`, which `rust-gate` runs."
