reason = "Three defects #294 shipped, all of them invisible to the run that qualified it: the DVR's replicated-store surface is behind `#[cfg(feature = \"hiqlite-store\")]`, which `cargo test -p plurx-core --lib` does not enable, so 282 tests were compiled out rather than run. Each fix is pinned by a test that fails on its revert under `cargo test --locked -p plurx-core --features hiqlite-store --lib`. (1) `store::hiqlite_dvr::schema_tests::every_assembled_statement_introduces_its_placeholders_in_order` — `recording_page_statement` bound the cursor instant once and interpolated it twice, so the schedule page carried three bound values against four placeholder occurrences; hiqlite binds positionally in introduction order, so every later value was bound one position early and the page limit arrived where the row id belonged. Revert the second `binder.bind(after_start)` and that test reads 3 against 4 again. This is a live defect on a replicated store, not a lint: listing recordings on a cluster was wrong. (2) `store::hiqlite_import::tests::replicated_tables_exclude_node_local_and_derived_state` — the three DVR tables entered the replicated import set and moved its reviewed count from 46 to 49 with no one stating why each belongs; the count is the review gate and the commit now names the reason beside it. (3) `store::sqlite::dv_conversion::tests::the_downgrade_fixture_undoes_every_migration_after_the_guard` — two fixtures wind a current database back by hand and neither dropped v57's tables, so a reopen replayed the DVR migration against a database that already had it; both fixtures now drop all three and `DROPPED_BY_THE_FIXTURE` names the migration. What is still not covered: the feature-gated suite is not in the fast lane at all, so nothing stops the next change from repeating exactly this mistake — `make test-full` and the cluster lanes are where these run, and both are slower than the gate that guards a merge."
