reason = "The web-static gate executes the shipped startup owner and the vendored hls.js loader. Its retained cases require an unloaded manifest to recover with loadSource rather than ineffective startLoad, enforce one attachment-owned corrective credit and the sixteen-send/deadline boundary, suppress auth and typed terminal retries before stock scheduling, preserve pause and control-intent cancellation, scope failure ordering by attachment and resource, bound typed bodies, and refuse presentation until a pending target seek settles. The same gate serves the shipped page to Chromium: eight typed manifest 503s exhaust the real stock ladder, the application reloads the captured URL, and generated fMP4 media presents at the requested non-zero position; the receipt includes the fixture hash, browser and vendored-library versions, request count, and observed position. The focused Rust tests named web_hls_startup_ require playlist-time init reads to remain internal delivery, map unavailable reads to init_inspection_unavailable, reject a Dolby Vision init missing its required configuration, and keep exact owner/deadline fencing. Reverting the init outcome split maps storage uncertainty to missing/corrupt media; reverting the required-record check advertises an init that cannot satisfy hvc1/dvh1; reverting the client owner either sends after pause/replacement or reports manifest/media uncertainty as decoder failure."
