reason = "Two independent corrections, each held by a named test under `make web-check`. First, Keep waiting comes off the create-exhaustion prompt. `the two stall prompts offer Keep waiting, and the create one does not` in `tests/playback/web-policy.test.js` - a test this commit renamed from `the exhausted prompt offers Keep waiting on every path that raises it`, because that is exactly the claim that turned out to be wrong - slices `openSessionRetryingNotYet` out of `crates/plurxd/src/web/index.html` as text and requires it to match `actions:[retry,close]`, requires it not to contain `keep_waiting`, and requires it to still name `stallDiagnose` so the comment that explains the absence stays anchored to the function that proves it. Put `keep_waiting` back on that prompt and the regex match and the not-contains assertion both fail. The same commit leaves the two stall sites alone, and the same test still requires `playbackExhaustedActions` to lead with `keep_waiting` on both a remux and a transcode session, so this is a narrowing and not a retreat. The wired half is in `tests/playback/web-control.test.js`: the create-retry ladder block that drives the shipped `openSessionRetryingNotYet` through three refusals and a stop asserts `deepEqual(exhausted[0].actions, [retry, close])` beside `the ladder is three retries and stops`, so the list the viewer would actually be shown is read off a real raise rather than off the source. Without the fix that assertion reports the three-action list. What this pins is a button that would have cleared the prompt and done nothing: nothing is attached at that site, so `armStall` arms a watchdog whose `stallDiagnose` returns on its first line, leaving a stopped black player whose only way out is the chrome's Close. Second, the supply rescue's `degraded` notice moves to after the switch has landed. `the supply rescue raises its notice once the switch has landed` requires the raise list to be exactly `[owner_recovery_step]` while the open is still in flight, and only after `finishOpen` to become `[owner_recovery_step, degraded_notice]` with the title `Quality -> Auto transcode - supply stalls`. Raise the notice beside the recovery step again, as it was, and the first `deepEqual` fails on a rank-1 notice sitting under a rank-2 progress fault, which is the whole defect: the notice spent its 5 s timer behind a spinner and expired unseen. `a supply rescue that did not land says nothing` is the companion: it fails the open and requires the raise list to stay `[owner_recovery_step]`, so a rescue that never attached cannot claim the quality moved. Both run against the shipped `rescueAutoSupply` through `autoRescueHarness`. Not covered: nothing asserts the 5 s `degraded_notice_ms` timer is actually visible to a viewer once the notice does land - the tests read the raise, not the render - and the STATUS.md and implementation-doc prose this commit also corrected is governed by no check."
