reason = "a_successor_is_refused_when_the_viewer_has_asked_for_something_else is the regression, and it runs against both backends because a predicate that meant different things in SQLite and in the replicated store would make a single-node deployment and a cluster disagree about what a viewer asked for. It drives the whole sequence rather than one branch: a stale expectation is refused at admission, a current one is admitted, an ask that changes while the successor is in flight refuses the commit, the refusal tears the successor down rather than leaving it holding the playback's one preparation slot, the pointer does not move, and a fresh successor admitted under the ask that is now current commits -- so the refusal is demonstrably about the ask rather than about anything else having gone wrong with that playback. Dropping either backend's commit predicate fails it at the assertion that a successor built for an ask the viewer has left must not be published. a_playback_with_no_recorded_ask_is_still_admitted pins the direction the predicate must fail in. An absent row admits, which is why the SQL is NOT EXISTS (revision != expected) rather than EXISTS (revision = expected) -- the two differ exactly where the row is missing, and missing is the upgrade shape: a playback that predates this schema, or one whose viewer has never sent an intent-changing request, has no ask to disagree with. Inverting the predicate on either backend fails it by name, and a node that fenced every session older than its own schema would be a worse failure than the one this closes. Two points, because the change genuinely spans both: the admission decision and the awaits around it are playback.pipeline's, and the predicate that enforces it lives in the replicated and SQLite session stores, which is cluster.auth's. cluster-auth is listed as a required check rather than as a convenience because the three-voter contract run under it caught a real divergence that no single-backend run could see. The first version checked the ask before the commit CAS and returned early, which left SQLite holding the stale successor while the replicated backend tore it down; the predicate now sits inside the CAS in both, so a stale ask falls into the same abort branch a lost pointer race does. That is also the correct outcome rather than the merely convergent one, because a successor whose recipe is for the old ask can never legitimately commit and would otherwise block the successor the viewer is actually waiting for until its deadline. The expected revision is read at each admission point rather than carried from the exchange that triggered the work: the source file read and the height resolution before staging, and the client round trip before the commit, are exactly the awaits a captured value cannot see across."
