reason = "a_serving_proof_outlives_a_newer_unapplied_watermark_until_its_own_deadline is the regression for the defect and for the constraint that bounds the fix. It builds the exact shape: a proof captured at zero lag, then a newer watermark anchored 300 ms later with local apply unmoved, asserting first that the fixture really does put apply behind and then that the older proof has not expired. It then catches the node up and walks the deadline to the nanosecond -- valid at anchor plus lease minus one, invalid at anchor plus lease -- while separately proving the replacement proof is still perfectly good at that instant, which is what makes the expiry the original one rather than an artefact of everything going stale together. Measuring the lease from the current anchor instead of the captured one fails it at that nanosecond boundary and also fails retained_serving_proofs_cannot_outlive_the_election_floors. a_retained_serving_proof_dies_on_every_generation_change walks each hard drop from its own fixture: new term, new leader, lost leader, explicit invalidation from a successor publish, and a local sample past the freshness bound. The leader-flap case is the one that needed a second attempt and is worth reading before touching this code. The first version asserted a re-observed leader was refused and passed with the epoch comparison deleted, because publish_at sets watermark_invalidated on any observation change and that flag was doing the work. But the next successful watermark publish clears that flag, so after a flap and a fresh sample the observation epoch is the only thing distinguishing a pre-flap proof from a current one. The test now publishes a fresh watermark, asserts a fresh proof is earnable at that instant so it cannot be testing the flag, and only then requires the pre-flap proof to be refused; deleting the epoch comparison fails it. retained_serving_proofs_cannot_outlive_the_election_floors pins the safety arithmetic that makes this change bounded: retention reuses QUORUM_WATERMARK_LEASE from an anchor never later than the current watermark's, so a retained proof always expires before the current one, and the test demonstrates exactly that ordering against live state as well as asserting the lease against both the vendor election floor and the previous release's 1,500 ms floor directly rather than by implication. a_retained_proof_sustains_serving_authority_and_never_restores_it and only_a_serving_node_that_lost_eligibility_consults_its_retained_proof cover the half that lives in plurxd: which of the four situations the poller can be in may consult a retained proof at all. The fourth matters most -- a node that has already published a loss has bumped its generation and torn down every admitted session, so returning on a retained proof would resume service on grounds it had already declared insufficient. That is enforced structurally rather than by comment, and the laziness test proves neither an eligible node nor a fenced one even evaluates the retained proof. Bounded replica reads are deliberately untouched and still refuse on lag, which is why serving may continue while apply is behind: the reads that need freshness remain the ones that demand it. bounded_replica_permit_is_revoked_when_the_latest_entry_gap_grows and bounded_replica_permit_deadline_is_not_extended_by_a_newer_watermark both still pass unchanged. Nothing in the HLS or direct-file body path is touched, so the existing no-progress and maximum-body deadlines are unchanged and serve_file_range still carries no whole-body deadline; an HLS-sized total-transfer bound there would cut a legitimate multi-hour direct play at five minutes."
