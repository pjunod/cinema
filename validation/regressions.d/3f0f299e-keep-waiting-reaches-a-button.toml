version = 1

[[coverage]]
commits = ["3f0f299e"]
points = ["playback.pipeline", "web.experience"]
checks = ["web-static"]
reason = "`keep_waiting` had a label in `SURFACE_ACTION_LABELS` and a branch in `playbackSurfaceAction` since M1 and no site that offered it, so it was vocabulary no viewer could reach. Four retained tests in `tests/playback/web-policy.test.js` hold what this commit put there, all under `make web-check`. `the two stall prompts offer Keep waiting, and the create one does not` - the name this test carries today, after 7dc8400d narrowed it - slices the shipped `playbackStallActions` and `playbackExhaustedActions` out of `crates/plurxd/src/web/index.html` and requires `playbackExhaustedActions` to answer `[keep_waiting, retry, force_transcode, close]` on a remux session and `[keep_waiting, retry, close]` on one that is already a transcode, and requires the bare `playbackStallActions` to still answer `[retry, force_transcode, close]`. Delete `playbackExhaustedActions` and the first two assertions fail on a function that no longer exists; fold `keep_waiting` into `playbackStallActions` instead, which is the tempting shortcut this commit deliberately refused because that list is also what the D1 terminal verdict and the diagnosed-stall `decoder_failed` carry, and the third assertion fails. `the stall-recovery prompt stops the player before it raises` builds the shipped `showStallRecoveryFailure` over `stopPlayerForExhaustion` and deep-equals the raised fault's actions against `[keep_waiting, retry, force_transcode, close]`, so the wiring at the stall raise site - not just the helper - is pinned. `Keep waiting re-arms the ladder, and does nothing else` drives the shipped `playbackSurfaceAction` with `keep_waiting` and requires the call list to be exactly the presenter step `{user_action: keep_waiting}` followed by `armStall` at the current position, requires the handler to return nothing to await, and requires `recoveringStall` to be cleared - so a handler that also reopened, seeked or reported would fail on the deep-equal, and the button could not quietly become a second recovery actor. `every other action is still its own effect` walks `retry`, `close` and `force_transcode` through the same harness and requires each to reach its own effect, which is what stops the new branch from swallowing the others. Not covered: the words on the button. `every contract case reaches the shipped render as the kind it names` renders each surface through the shipped `renderPlaybackSurface` and `playbackSurfaceActionHtml` with the real `SURFACE_ACTION_LABELS` bound in, but it only counts buttons against `surface.actions.length` - no assertion anywhere reads the `Keep waiting` label text back, and no browser-level case in `tests/playback/` presses the rendered control. The coverage is at the action-list and handler seams."
