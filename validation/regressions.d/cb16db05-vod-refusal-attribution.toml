checks = ["rust-gate", "rust-gate-ci"]
reason = "refusals_are_attributed_to_the_cap_that_produced_them is the regression for the counting half. It asserts all five numbers together -- parked now, the ceiling they are against, admitted, and refusals per class -- because no subset answers the operator question P2-10 opens with: refusals without the ceiling cannot tell a node at its limit from one nowhere near it, and the two classes summed cannot tell one client's seek storm from a genuinely full node, which is the distinction that decides whether raising the setting helps at all. Folding the two increments into one counter fails it at refused [2, 0] against [1, 1]. Deleting the gauge decrement fails it at 3 waiting against 2, and that decrement lives on the slot guard's destructor rather than in State::release precisely so it is taken on the disconnect path too, which is the path a dropped request future uses and the one an admission gauge leaks on if it is missed. The test drops a registered wait to drive exactly that path. the_two_blocked_get_caps_answer_a_client_apart is the wire half. Both classes previously collapsed at the single line that produces them, .map_err(|_| VodError::Busy), and answered one typed code with a message about this session -- wrong for half of them and wrong in the direction that makes a client slow its own requests when the node is what is out of capacity. The test requires two distinct codes, both still 503 so the retry ladder is unchanged, and requires each message to name the right limit; restoring the shared code fails it at the assertion that a client cannot act on a distinction it cannot see. the_blocked_get_render_carries_only_bounded_labels drives a distinctive session id and a distinctive rendition key through the pool and requires neither to appear in the rendered text. Those are exactly the labels an attribution counter invites and exactly what makes a metrics endpoint a cardinality bomb, and the existing endpoint tests already forbid titles, user names and paths for the same reason. The counters are the pool's own rather than module statics, which is what makes any of these assertable at all under a parallel suite; the statics were also blind to the transcode manager replacing its VodServe on the cluster boot path, where a captured handle addresses a pool nothing serves from and the counter reads as a quiet node. metrics_session_snapshot_does_not_wait_for_the_session_map and repeated_metrics_scrapes_do_not_record_store_operations both still pass: every field here is a plain atomic load, so the scrape takes neither the pool lock -- held on every blocked segment GET and every driver pass that reads demand -- nor the Store."
