reason = "A seek on an attached rolling transcode reopened the session even when the target was already inside the media the player held or the playlist had published. This commit adds `seekRoute` and `SEEK_LOCAL_SETTLE_MS` to `crates/plurxd/src/web/playback-policy.js` and rebuilds `seekTo` in `crates/plurxd/src/web/player/transport.js` around them, with the three helpers that read the buffered ranges and the published range off the current level. Its evidence is three cases added to `tests/playback/seek-control.test.js`, which `make web-check` runs under `web-static`. The first calls `policy.seekRoute` directly and pins the routing table: inside a buffered range it answers `local`/`buffered`, inside the published range it answers `local`/`published`, a target within one `targetduration` of the live edge or below the evicted floor answers `reopen`, `remux` is buffered-only, `direct_play` and VOD are always local, and `forceReopen` or an in-flight change is always `reopen`. The other two build the shipped `seekTo` and its helpers into a harness with a fake video element and pin the settle timer: with no buffer coverage at expiry the local seek is followed by exactly one `seek_local_fallback` and one media change at the same 50 000 ms target with `forceReopen`, and either buffer growth or a `seeked` event retires that timer with no reopen at all. Reverting `transport.js` removes the `seek_local` log and the single bounded reopen those two cases assert, and reverting the policy function leaves the first case with nothing to call, so the revert fails `tests/playback/seek-control.test.js`; the same commit also adds the three helpers to the full-open harness in `tests/playback/web-control.test.js`, which would otherwise fail to build the shipped `seekTo`."
