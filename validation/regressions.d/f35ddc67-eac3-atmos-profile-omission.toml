reason = "A July scan omits `profile` on an E-AC-3 track and the playback node's FFprobe derives `Dolby Digital Plus + Dolby Atmos`, so the only remaining normalized difference refused the encoded session. Retained regressions with the `held_probe_comparison` prefix admit that omission in both directions, alone and beside the TrueHD one, and refuse everything the exception must not cover: two reported profiles that disagree, missing versus null, empty, numeric or unrecognized, an Atmos label on AC-3, AAC or video, and an index that is missing, null, negative, fractional, a string, mismatched or reordered — the identity guard now sits on the shared pairing predicate, so reverting it fails the index cases for the downmix removals too. Measured media facts still refuse with the admitted omission present: codec, type, channels, sample rate, channel layout, geometry, cadence, duration, size, track count and chapters. The diagnostic regressions pin the four difference kinds, require the refusal to name the disagreeing path, and prove it cannot carry a container tag name, a title, a pathname, more than eight paths or a path longer than 128 characters. encoded_vod_manager_admits_a_reported_eac3_atmos_profile_the_node_omits builds a real E-AC-3 source, stores a catalog row reporting the profile this node's FFprobe omits, and requires create_session to succeed, then requires the same path to refuse and name the field when the channel count genuinely changes. bound_source_rejects_same_size_same_mtime_path_replacement is unchanged and still passing, so the source-replacement fence was not widened. docs/evidence/wicked-probe-compatibility-replay.py compiles the comparator from the serving node beside this one and, with --real-pair, ran both over the real remux probed by FFprobe 5.1.9 and Jellyfin 8.1.2: refused, then admitted."
