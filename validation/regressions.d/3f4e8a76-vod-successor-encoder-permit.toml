reason = "A quality change at a full encoder pool killed the stream: the prepared successor is primed as speculative work, speculative admission registers no waiter and is refused while the pool is full, and the viewer's own running predecessor only released its permit when it stopped or went idle, which comes after the successor's first frame, so the handoff was a circular wait that ended in init.mp4 producer_failed (m6, 2026-09-25 acceptance run). a_prepared_successor_takes_its_own_viewers_running_predecessors_permit is the reproduction: a one-permit pool, a running predecessor inside its ahead window whose preparation slot stages exactly this successor's incarnation, and a speculative successor; the predecessor must give its process up, must not re-admit while the handoff stands, and the successor must then be admitted; on the unfixed tree the predecessor stays Running. a_handoff_reserves_the_yielded_permit_for_its_successor proves another live start cannot take the yielded capacity before the successor claims it. a_successor_without_a_live_preparation_preempts_nothing (never staged, and staged then aborted) and a_stale_prepared_successor_cannot_take_the_permit_staged_for_a_newer_one (slot names a different incarnation) prove the handoff is bound to the exact staged successor. a_handoff_that_would_not_admit_the_successor_preempts_nothing proves a predecessor is not killed when its release (a hardware slot) cannot admit the successor (software, pool full). a_prepared_successor_never_preempts_past_a_waiting_viewer_or_a_shared_rendition proves a waiting live viewer or a second viewer of the predecessor rendition blocks the handoff. an_aborted_preparation_releases_its_parked_predecessor_at_once and a_parked_predecessor_wakes_when_its_handoff_lapses prove a parked predecessor is released and woken on abort and on expiry. a_closed_or_failed_successor_stops_waiting_for_a_handoff proves the successor's handoff poll and reservation end with it. Each of these vodserve tests was checked to fail under the matching source mutation (binding removed or weakened, fit check disabled, abort release removed, expiry wake removed, reservation removed, cancel_wait keeping handoff_wait). a_handoff_reservation_is_claimable_only_by_its_token, a_speculative_fit_after_release_keeps_every_priority_rule, a_running_encoder_yields_to_its_own_viewers_prepared_successor and a_handoff_never_starts_or_rewrites_a_move pin the admission and prodexec rules. Cross-node handoff (predecessor on another node) is not covered."
