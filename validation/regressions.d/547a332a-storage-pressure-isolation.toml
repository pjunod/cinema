reason = "The retained configuration and startup tests pin exactly this much: omitted cache and scratch roots select every legacy path unchanged; a restart empties only the declared scratch while the artwork, transcode, subtitle, ffmpeg-runtime, and rendition caches survive it; an explicit root that aliases or nests inside the authoritative data root, another managed root, or the credential key is refused by canonical path and by device/inode identity before any cleanup runs; runtime and rendition children receive the same validation before scratch cleanup, and a legacy transcode-cache symlink cannot relocate their explicitly passed sibling paths; a scratch entry that is a symbolic link, device, socket, or FIFO aborts startup without unlinking it or its target; cleanup holds no-follow directory and marker descriptors, so a rename or marker swap aborts instead of deleting the replacement; an incomplete .claiming state never authorizes deletion; the scratch marker names the durable root it was claimed for, so a changed storage.data_dir is refused rather than silently adopting another install's scratch; and cluster.read_pool_size is validated to 1..=16 and carried into the node's Hiqlite defaults without changing the WAL, snapshot, sync, or election defaults. The schema-v2 named workload additionally proves the configured pool is attested in every raw run and campaign while a fixed 32-row corpus receives 256 concurrent bounded follower reads with no Authority fallback; exact raw samples recompute read p50/p95/p99, and campaign summaries retain local-read p95, write p99, and aggregate peak RSS with fixed selection guardrails. The startup-guard follow-up adds tests for the daemon-owned root repaired instead of refused, the foreign-uid root still refused, permissive-mode and foreign-uid children cleared, a faulting readdir reported as an error rather than an empty directory, an interrupted pending claim redone, a truncated published marker still failing closed, the marker naming another durable root, and both traversal ceilings leaving an oversized owned tree whole for the next boot. A startup-level hard-link fixture proves the selected credential-key inode reaches cleanup as a protected identity. The privileged Linux `make bind-mount-check` target exercises bind-source ancestry, a mount point inside scratch, and a cross-device child; `make storage-pressure-check` fills a bounded tmpfs to real ENOSPC and proves cache or scratch exhaustion cannot relocate or create authority. Both targets now fail before Cargo off Linux or without root, and their exact build/image/machine class and passing counts are retained in the schema-validated physical evidence artifact. The mapped macOS snapshot experiment and its mapping were explicitly superseded by the ownership-reconciliation commit once active issue #550 claimed that independent correction; their net tree change is empty, and #543 retains only the shared-cache topology regression."
