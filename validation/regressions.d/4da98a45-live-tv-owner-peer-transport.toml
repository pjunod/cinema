reason = "Covers plan/L-02's M2 commit, which executes review item L3 / F-ltv-3. It is a structural change to how an ingress reaches the Live TV owner, and it is here rather than only under a plan document because two of the four behaviours it introduces are invalidation rules that a later refactor could silently drop without any test outside this branch noticing. The commit does three things. (1) Nine `PeerTransport::new(state.membership.clone())` sites in `crates/plurxd/src/http/live_tv.rs` became one `LiveTvPeers` held for the life of the process in `AppState`, so a relayed playlist, segment, init, fragment, status, keepalive, start, activate, stop, retire, resume, drain, guide or snapshot exchange no longer builds and discards a `reqwest::Client` and its connection pool per request. (2) `owner_peer` gained a five-second memory of the owner's `(node_id, http_base)` in front of `activity_peers`, which is a node-local hiqlite `query_map` plus an in-process metrics read. (3) Every exchange now reports what it proved about the address, and the entry is dropped when it proved the address wrong. Four focused tests are failing-without-the-change evidence, each verified by applying the named revert to a scratch checkout, running the one test, and restoring. `http::live_tv::tests::relayed_requests_share_one_client_and_resolve_the_owner_once_per_ttl` drives twenty resolutions through the production `LiveTvPeers::owner_base` with a counting resolver on a paused clock and asserts one resolution and nineteen hits, then advances past `OWNER_PEER_TTL` and asserts a second resolution, so the TTL is proved to be a bound rather than a latch; reverting the TTL comparison to `Duration::ZERO` reports twenty resolutions. `an_owner_move_is_a_miss_and_never_answers_for_the_wrong_node` resolves owner A, then asks for owner B, and asserts the answer names B; reverting the cache hit condition to time alone -- dropping `entry.node_id == expected` -- returns A's base for a capability B owns, which would relay a live session to a node that does not hold it, and the test reports `left: \"owner-a\"`. That is the specific wrong implementation this entry exists to keep out: the capability already names its owner before the cache is consulted, and the cache maps a node id to a base, it never chooses the owner. `a_failed_owner_exchange_invalidates_the_cached_peer` runs all three `PeerTransportError` variants and asserts each re-resolves on the next request; reverting `note_owner_exchange` to ignore `Err` reports one resolution instead of two, which is an ingress that keeps signing requests at an address the transport has just told it is unreachable, timed out, or answering with a signature this node cannot verify -- for the rest of the five-second window, on every retry. `an_owner_that_does_not_serve_an_internal_path_is_re_resolved_and_any_other_status_is_not` pins both halves of the status rule: 200, 410, 503 and 409 all keep the entry, because each of them is the owner answering from the address the entry claims, and only 404 drops it, because a 404 on an internal path is an older build that does not serve the route and re-resolving is the only way this node notices a newer peer taking it over. Reverting either half fails it. Two further new tests in the same commit are invariant guards rather than failing-without-the-change evidence and are recorded as such: `the_owner_peer_ttl_stays_inside_the_window_the_roster_derives_reachability_from` asserts `OWNER_PEER_TTL` stays at or below one sixth of the roster's own 30 s `NODE_REACHABLE_WINDOW_MS`, so this memory always expires well before the roster itself stops calling a peer reachable, and `a_failed_resolution_is_not_remembered_as_an_address` asserts a roster read that found no reachable owner leaves the cache empty rather than turning one unreachable moment into five seconds of them; neither has a one-line revert that produces the wrong behaviour. What the commit deliberately does not change is the security boundary, and that is why `cluster.auth` is not in the points above: `PeerTransport` still signs every request and verifies every response from `membership` per request, exactly as it did when each call site built its own client, and `capability_owner(request.capability())` still decides which node a request belongs to before any of this is consulted. Nothing about a credential is cached. The invalidation rules live inside `LiveTvPeers::request` and `request_stream` rather than at the nine call sites precisely so that a future site cannot be added that takes the shared transport and forgets them. No ownership-inventory count in tests/playback/rolling-producer-owners.toml moves: the commit adds no task spawn, no timer, no process and no `Command`, and the one `PeerTransport::new` that remains is the single constructor `AppState` calls. This commit has no fleet evidence: `make live-tv-two-node-check` needs a host that can bind 80 and 5004 and was not run, and no before/after resolution count has been taken from a real ingress, so `plurx_live_tv_owner_peer_total{outcome}` exists to make that observation possible rather than to report one already made."
