reason = "a_classified_vod_failure_becomes_a_serialized_client_action drives the whole path the finding is about, because the value of a failure class is entirely in the action it produces: it walks every ProducerDecisionReason, puts it on a VOD status, reads it back off DeliveryView, resolves an action and serializes that action to JSON, requiring a permanent verdict to become terminal carrying the same code and a transient one to become retry_resource carrying the same reason and a positive after_ms. Restoring producer_decision: None in the VOD arm fails it. an_unclassified_vod_failure_still_says_nothing is the control: a failed VOD status with no class must still resolve to ControlAction::None, which is exactly what P1-2 was, so the test above cannot be passing on some other signal in the fixture. a_recorded_failure_publishes_its_class_not_only_its_sentence proves the class survives the store-and-publish round trip on a real rendition and that the operator's sentence is not replaced by it -- the two are different audiences and dropping either one loses something. It also pins the healthy case: a session that has not failed publishes no decision, because absence must keep meaning not classified rather than healthy. every_generation_failure_names_what_actually_happened pins each arm of classify_failure separately: a match that fell through to one bucket would compile and would make the whole vocabulary decorative, and collapsing Stream into MediaLandingFailed fails it. It also requires every VOD class to be non-permanent, which is the load-bearing judgement of this change rather than an incidental property: is_permanent is reserved for verdicts about the source itself, a VOD rendition is planned once against an exact source and an exact fragment-index engine, so every way it fails is a statement about that plan and a fresh create can succeed. Answering terminal would make a client abandon media its own reopen would have played. Stream maps onto rolling's existing ReaderFailed because it is the same fact and an early exit onto PartialSuccessExit; the five additions exist because borrowing a rolling name for a producer that never started, a fragment that did not land, or a sink that refused bytes would misdescribe all three."
