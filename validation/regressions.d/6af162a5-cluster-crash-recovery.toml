reason = "The retained Hiqlite unit test proves AppendEntries receives the full OpenRaft hard deadline while votes and snapshots keep the soft deadline. The production timing contract keeps the 4.0-second election plus 1.8-second vote round below 8-second discovery, bounds priority stream handoff at 6 seconds around the 5-second WebSocket attempt, and fits the resulting 14-second recovery plus one 800 ms heartbeat inside the 16-second exact-state envelope. Five 3-second idempotent attempts plus four 100 ms gaps total 15.4 seconds without relaxing ordinary Store deadlines. Detached discovery is coalesced per client and Raft type; target-scoped stream acknowledgements prove the replacement WebSocket is usable, reject expired or superseded controls, and accept an authenticated fallback leader without a reconnect loop. The leader-loss workload completes all 64 writes without an error, while the no-quorum probe fails inside its explicit harness bound. The post-start initialization-failure regression proves shutdown removes the crash sentinel and state-machine lock instead of creating a destructive restart loop. The replicated Store suite exercises the recovery surface, while the Compose contract and rendered configuration pin a 65-minute stop grace that exceeds the maximum configured snapshot admission, catch-up, and database shutdown window."
