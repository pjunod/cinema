reason = "Test fixtures were published with rename, so a second test process regenerating the same fixture unlinked the inode a first process's tests were already reading; device, inode, size and mtime all survive that, but the unlink moves ctime, which is a component of the object version SourceFence compares, so four vodserve resurrection tests failed with a source-change refusal for a source that never changed. This commit replaced the rename with a hard link so publication could refuse rather than replace. That removed the replacement and did not fix the failures: linking makes the destination visible before the temporary is unlinked, and unlinking it moves the ctime of the inode now published, so a reader that fenced the source inside that window was rejected exactly as before. b8cbf21f supersedes it with an advisory lock held from the absence check through the rename, which is what actually makes the destination visible only once its metadata is final. What survives here is the per-process temporary name, and republishing_a_fixture_leaves_a_held_reader_undisturbed, which pins the property that publishing must not disturb a held reader and fails if publication returns to an unguarded rename."
