reason = "Three findings from the adversarial pass over the web milestone, two of them behaviour a viewer sees. A refusal no source row claims - a 502 `producer_failed`, which no row names and which no bare-status row matches - made `classifyStreamFailure` answer null and `showSessionOpenFailure` return false, so the caller fell back to its own `Playback could not prepare.` and the raw error message: the generic sentence this whole path exists to replace. The retained test `a refusal no source row claims still reaches the surface as the server's sentence` builds the shipped `showSessionOpenFailure` out of index.html and requires an unclaimed 502 to be handled, to fall to `owner_stopped` at a start and to `change_failed` over a predecessor, and to carry the explained title and detail; restoring the `if(!source) return false` turns it red on the first assertion. The second finding is `handleEnded`, whose two terminal branches claimed `player_stopped: true` on the strength of the `ended` event while the ask above them can take seconds, in which a viewer who pressed play is exactly the disagreement the contract is written for. Both branches take the stop themselves now, and the shipped-source harness in the control test pins each: the terminal verdict requires `the owner stops before the verdict goes over it` and the repeated-early-end branch requires one stop beside its `repeated_early_end` fault, so deleting either `stopPlayerForExhaustion()` leaves a stop count of zero against an expected one. The third is a comment that overclaimed - a fault dying with its generation bounds the fault, not the ninety-second `STREAM_FAILURE` freshness window - and changes nothing that runs. The fence learned the two surfaces the milestone added, `#psurface` and `#pindicator`, so a one-line write to either is a failure rather than a hole; the must-trip fixture carries those spellings and the fence runs over the tree as it stands. The two JavaScript suites run in the embedded-JavaScript gate."
