reason = "`the_stale_record_predicate_matches_every_filter_that_leaves_one` drives all 24 combinations of the four inputs `hevc_copy_bsf_for_copy` takes and requires `copy_leaves_a_stale_dolby_vision_record` to equal the property read off the rendered filter itself — removes NAL types 62-63 without asking ffmpeg for dovi_rpu — so a branch added to the filter and forgotten in the predicate fails, in either direction, and a final assertion keeps the equality from holding vacuously. `removing_the_dolby_vision_record_keeps_the_box_tree_consistent` inserts the Profile 7 record a stripping muxer copies out of the source, removes it, and requires that no dvcC or dvvC fourcc survives anywhere in the init, that the parsed `dolby_vision_config` flag agrees with the bytes, and that the ordinary reader parses the result back with the same video track and complete HEVC parameter sets; skipping any ancestor's size patch, or shrinking hvcC as if the record were its child, fails it. `a_removal_rides_the_promotion_and_refuses_to_be_a_rewrite_too` requires the removal to travel in the stored promotion inputs and to produce byte-identical results on the live path and a head regeneration, which is what stops a regenerated init being refused for drift, and requires promotion inputs asking to both rewrite and remove the record to be a loud error rather than a precedence decision. `a_strip_without_dovi_rpu_asks_the_promotion_to_remove_the_record` pins the wire from the copy options to that ask, and pins each neighbouring branch — dovi_rpu present, preserve, convert, and a non-Dolby-Vision source — as needing no compensation."
