reason = "The encoded live layout list led with 5.1(side), which the AAC encoder signals as ADTS channel configuration 0 plus a PCE; browsers read that as an AAC track with no channels and never start, so Safari and Chrome sat black with 0 decoded frames on an ATSC 3.0 channel whose AC-3 5.1 simulcast was being converted. The coverage pins that no listed layout lacks an ADTS configuration and the hardware harness asserts an encoded AAC segment probes with a positive channel count; the unfixed list fails both, and the fixed daemon was run against the real tuner with the harness's --surround route."
