reason = "`the_grade_is_the_highest_all_three_parties_admit` (crates/plurx-core/src/playback/mod.rs) walks every (source, node) pair and every client refusal, and three of its rows fail against the pre-fix negotiation: a client whose video_codecs omit hevc must be refused because the rung emits HEVC Main10 and nothing else, a source shorter than 1080 must be refused because `hdr10_rung_fits` admits only 1080 and 2160 and `output_size` never upscales, and a node whose `hdr10_max_height` is below 1080 must be refused because that is exactly the software-only node whose Auto ceiling is 720. It also asserts the SDR-display case produces exactly one tone-map line in the plan, which the duplicate-reason fix is the only way to satisfy. `the_hdr10_grade_is_refused_until_every_precondition_is_proved` (crates/plurxd/src/transcode.rs) proves the daemon half: a plain HDR10 source on a Dolby-only node stays Sdr, the same source on a node with the plain proof reaches Hdr10 AND builds `Pipeline::Hdr10Passthrough` rather than the Dolby graph, a burn tone-maps, and QSV is refused until the plain route's own QSV probe passes -- the last of which fails against the version that reused `dovi_passthrough_qsv`. `the_plain_hdr10_rung_touches_no_pixel_values_and_takes_no_dolby_source` (crates/plurx-core/src/transcode/pipeline.rs) pins the chain, the encoder set and the source set, and `names_round_trip_and_are_unique` pins the new pipeline out of the tone-map candidate list so an SDR session can never land on a graph that tags its output PQ."
