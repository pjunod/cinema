reason = "`an_expired_limit_hands_the_decision_back_to_the_client_that_can_retest` (crates/plurx-core/src/playback/mod.rs) fails against the pre-fix code on the 8-day row: `at_ms` was carried and never read, so an identity match applied a limit for the whole twenty-three days between the browser's 7-day re-test threshold and its 30-day TTL — entries the browser itself returns `retest` for and refuses to apply. It also pins the three shapes `pruneDecodeLimits` drops and the server accepted: a missing timestamp, a future one, and a server with no clock. `the_server_keys_a_learned_limit_the_way_the_browser_does` (same file) fails on the `HDR_DV_HLG`, `dv中`, `advanced video`, `highlight pass`, U+FEFF, U+0085 and MAX_SAFE_INTEGER rows: JavaScript's `\\b` is ASCII and `char::is_alphanumeric` is Unicode, JS whitespace includes U+FEFF and excludes U+0085 where Rust does the reverse, and `positiveInteger`/`bitrateBucket` both clamp where Rust did not — a differential sweep found 3,069 of 4,872 generated sources disagreeing. Its `BOTH dolby vision and hdr10` row fails if the two label checks are reordered, which re-keys `Dolby Vision · Profile 7 (HDR10-compatible)`, the exact label this feature exists for; the same test's by-name lookups now panic rather than silently iterating an empty set, which is how the previous version of that assertion passed over nothing. `a_strip_overtaken_by_a_demotion_stops_claiming_the_base_was_kept` fails because the strip branch pushed 'compatible HDR base kept' unconditionally, so a learned limit that turned that remux into a transcode left a statement about untouched bytes on a delivery that re-encoded them. `the_reason_names_the_grade_the_demotion_costs` and `a_partial_learned_limit_still_produces_a_whole_sentence` fail on the reason string: the server printed 'measured unstable original playback' over a zero-rate entry the browser prints in full (`pruneDecodeLimits` admits `rate: 0`), and never emitted the `HDR10 → SDR` clause `docs/PLAYBACK.md` promises. `a_hostile_learned_limit_is_bounded_before_it_is_ever_printed` fails without the control-character strip and the two caps: `label` is reprinted verbatim into a log line, and a newline there forges a second line. `a_learned_limit_with_no_identity_can_never_match` pins the fail-closed direction for the shape the plan's own section 4.6 makes likely, where the identity is the map key and the serialized value omits it. The JS half of the identity contract is `tests/playback/web-policy.test.js`, which reads the same fixture."
