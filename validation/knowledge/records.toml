[[anchors]]
id = "plurx:section:routing.server.capability-profile"
path = "docs/PLAYBACK.md"
kind = "section"
selector = ["Playback — how a file becomes a stream", "Routing inventory — every fork has one owner and one regression pin", "Server — decide the bytes, recipe, and hardware path"]
digest = "sha256:a0a2a958e85b16844b102bcd55fe7c40d03029f6ffa695a3ce02d6fd32e4c9e6"
excerpt = "| `server.capability-profile` | Reported caps vs named profile | Runtime caps win when any codec/container cap is present; missing fields get conservative browser defaults. Otherwise use the named profile, then `web-h264`. Explicit DV profiles override the legacy all-DV bit, and for a dual-layer source they are the only thing that can approve it. | Rust unit in `http/stream.rs` |"

[[anchors]]
id = "plurx:section:routing.server.learned-decode-limit"
path = "docs/PLAYBACK.md"
kind = "section"
selector = ["Playback — how a file becomes a stream", "Routing inventory — every fork has one owner and one regression pin", "Server — decide the bytes, recipe, and hardware path"]
digest = "sha256:a0a2a958e85b16844b102bcd55fe7c40d03029f6ffa695a3ce02d6fd32e4c9e6"
excerpt = "| `server.learned-decode-limit` | Honour a limit the client learned | An entry the client sent in caps v2 whose identity matches this exact media load routes to a **transcode** — the limit is a statement about the decoder, so the same frames in a different envelope change nothing. Matching is on the whole identity and never a codec-and-height prefix. The reason is the browser's own sentence, verbatim, with its `HDR10 → SDR` clause when the demotion is what costs the grade. | Rust unit in `playback/mod.rs` |"

[[anchors]]
id = "plurx:section:routing.server.learned-decode-limit-expiry"
path = "docs/PLAYBACK.md"
kind = "section"
selector = ["Playback — how a file becomes a stream", "Routing inventory — every fork has one owner and one regression pin", "Server — decide the bytes, recipe, and hardware path"]
digest = "sha256:a0a2a958e85b16844b102bcd55fe7c40d03029f6ffa695a3ce02d6fd32e4c9e6"
excerpt = "| `server.learned-decode-limit-expiry` | When one still applies | The **client's** policy, reproduced: applied inside the 7-day re-test window, ignored past it, and ignored outright past the 30-day TTL, with no timestamp, or with a timestamp in the future. Standing aside past re-test is not leniency — the browser only consults its own limits when the server answered direct or remux, so a server that answers transcode first is a server that stops the weekly re-measure from ever running. | Age matrix in `playback/mod.rs` |"

[[anchors]]
id = "plurx:section:routing.server.verdict"
path = "docs/PLAYBACK.md"
kind = "section"
selector = ["Playback — how a file becomes a stream", "Routing inventory — every fork has one owner and one regression pin", "Server — decide the bytes, recipe, and hardware path"]
digest = "sha256:a0a2a958e85b16844b102bcd55fe7c40d03029f6ffa695a3ce02d6fd32e4c9e6"
excerpt = "| `server.verdict` | Direct vs remux vs transcode | Video codec, height, bitrate, or HDR failure means transcode. Container, audio, or A/V correction alone means remux. No failures means direct. Unknown container is not permission to direct-play it. | Table-driven Rust unit in `playback/mod.rs` |"

[[anchors]]
id = "plurx:section:routing.server.manual-quality"
path = "docs/PLAYBACK.md"
kind = "section"
selector = ["Playback — how a file becomes a stream", "Routing inventory — every fork has one owner and one regression pin", "Server — decide the bytes, recipe, and hardware path"]
digest = "sha256:a0a2a958e85b16844b102bcd55fe7c40d03029f6ffa695a3ce02d6fd32e4c9e6"
excerpt = "| `server.manual-quality` | Auto vs Original vs a rung | Auto uses the ordinary verdict. Original never re-encodes video; it may direct or remux and lets the client rescue a rejection. Any numbered rung forces transcode. Unknown force values degrade to Auto. | Force matrix in `playback/mod.rs` |"

[[anchors]]
id = "plurx:section:routing.server.execution-plan"
path = "docs/PLAYBACK.md"
kind = "section"
selector = ["Playback — how a file becomes a stream", "Routing inventory — every fork has one owner and one regression pin", "Server — decide the bytes, recipe, and hardware path"]
digest = "sha256:a0a2a958e85b16844b102bcd55fe7c40d03029f6ffa695a3ce02d6fd32e4c9e6"
excerpt = "| `server.execution-plan` | Verdict to API action | Direct owns `/direct`; remux owns `/stream.mp4` plus a copy-session URL and flags; transcode owns the HLS-session URL. A caller's `audio=` selection travels in the plan — applied to the remux URL and repeated as `audio` for the session body — and a selection the container's own default cannot deliver reports remux instead of an unexecutable direct plan. Clients execute this plan instead of rebuilding it from `method`. | Exhaustive `DeliveryPlan` Rust unit plus a follow-the-plan selection regression |"

[[anchors]]
id = "plurx:section:routing.plan.learned"
path = "docs/streaming/PLAYBACK-CAPS-V2-PLAN.md"
kind = "section"
selector = ["Playback capabilities v2 — highest deliverable grade, negotiated not guessed", "4. Contracts — exact interfaces (re-verify each against the file at build time)", "4.6 Learned limits (M6)"]
digest = "sha256:bc7a2d0acb9440b9f0709405572435e5de6846a9ce555682f0c93e729996d0e3"
excerpt = "The server does **not** store\nthem in M6 — it reports them. Storing per device is a later decision."

[[anchors]]
id = "plurx:section:routing.decision.profile-claims"
path = "docs/streaming/PLAYBACK-CAPS-V2-PLAN.md"
kind = "section"
selector = ["Playback capabilities v2 — highest deliverable grade, negotiated not guessed", "9. Decisions — taken 2026-08-29, and the one still defaulted"]
digest = "sha256:7f4c0107dcc93c20e40519125b3a0fd61d04971e0a3fcd002c8fcb3851df151f"
excerpt = "| 5 | Profile 7 claims (§6) | **Allowed from a real decoder enumeration** (Android `DolbyVisionProfileDvheDtb`); never from a display bit. Paul: \"claim profile 7 all you want if you can do it.\" |"

[[anchors]]
id = "plurx:section:routing.decision.plan-ceiling"
path = "docs/streaming/PLAYBACK-CAPS-V2-PLAN.md"
kind = "section"
selector = ["Playback capabilities v2 — highest deliverable grade, negotiated not guessed", "9. Decisions — taken 2026-08-29, and the one still defaulted"]
digest = "sha256:7f4c0107dcc93c20e40519125b3a0fd61d04971e0a3fcd002c8fcb3851df151f"
excerpt = "| 4 | `plan_mismatch` (§4.5) | **Warn, never refuse.** Paul: \"I don't see a reason for it to prevent functionality.\" Server plan is a **ceiling**: an upward claim is clamped, noted in `plan_notes` and counted on `/system`; a downward echo is the client's to make. See §4.5 for why the original both-directions wording was wrong. |"

