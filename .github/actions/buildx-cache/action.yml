name: Configure BuildKit cache
description: >-
  Reuse named BuildKit state on persistent runners while preserving an
  isolated ephemeral builder on GitHub-hosted runners.

inputs:
  lane:
    description: Stable, filesystem-safe lane name used to validate callers.
    required: true

outputs:
  builder-name:
    description: Name of the active Buildx builder.
    value: ${{ steps.configure.outputs.builder_name }}
  local:
    description: Whether BuildKit state persists on this runner.
    value: ${{ steps.configure.outputs.local }}

runs:
  using: composite
  steps:
    - name: Select the BuildKit state contract
      id: configure
      shell: bash
      env:
        CACHE_LANE: ${{ inputs.lane }}
      run: |
        set -euo pipefail
        [[ "$CACHE_LANE" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || {
          echo "::error::BuildKit cache lane must be filesystem-safe"
          exit 1
        }
        # The same rule the Cargo cache follows, for the same reason.
        #
        # When this returns `local=false` the caller passes `type=gha` to
        # BuildKit, which writes its layer blobs into the Forgejo runner's
        # internal cache server — the one with no eviction — and the
        # `ci-buildkit-prune` step that bounds the builder is skipped, because
        # it only runs when the builder is named. So the branch that was
        # supposed to be the safe one was the unbounded one, and it was the only
        # branch any job ever took: `bolt.db` on `gha-m6-general-01` held 15
        # `buildkit-blob-1-sha256` entries beside the Cargo tarballs.
        #
        # A self-hosted runner gets the named builder, whose state is pruned to
        # a budget after every packaging job. Hosted runners keep the ephemeral
        # builder and the hosted cache, which is evicted for them.
        if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ]; then
          echo "local=false" >> "$GITHUB_OUTPUT"
          echo "builder_name=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        runner_name=$(printf '%s' "$RUNNER_NAME" \
          | tr '[:upper:]' '[:lower:]' \
          | tr -c 'a-z0-9_.-' '-')
        echo "local=true" >> "$GITHUB_OUTPUT"
        echo "builder_name=plurx-$runner_name" >> "$GITHUB_OUTPUT"

    - name: Start a persistent self-hosted builder
      if: steps.configure.outputs.local == 'true'
      uses: https://github.com/docker/setup-buildx-action@v3
      with:
        name: ${{ steps.configure.outputs.builder_name }}
        keep-state: true
        buildkitd-config: ${{ github.workspace }}/.github/buildkitd.toml

    - name: Start an ephemeral hosted builder
      if: steps.configure.outputs.local != 'true'
      uses: https://github.com/docker/setup-buildx-action@v3
      with:
        buildkitd-config: ${{ github.workspace }}/.github/buildkitd.toml
