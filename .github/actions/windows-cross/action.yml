name: Windows MSVC cross-build
description: Compile the Windows server with the repository-pinned cargo-xwin lane

runs:
  using: composite
  steps:
    - name: Install the pinned Windows target and cross-build driver
      shell: bash
      run: |
        set -euo pipefail
        rustup target add x86_64-pc-windows-msvc
        if ! cargo xwin --version 2>/dev/null | grep -Fq '0.23.1'; then
          cargo install cargo-xwin --version 0.23.1 --locked
        fi
        {
          echo "XWIN_ARCH=x86_64"
          echo "XWIN_CRT_VERSION=14.44.17.14"
          echo "XWIN_HTTP_RETRIES=8"
          echo "XWIN_SDK_VERSION=10.0.26100"
          echo "XWIN_VARIANT=desktop"
          echo "XWIN_VERSION=17"
        } >> "$GITHUB_ENV"
        tool_dir="$RUNNER_TEMP/plurx-windows-toolchain"
        mkdir -p "$tool_dir"
        expose_tool_dir=false
        if ! command -v clang-cl >/dev/null 2>&1; then
          clang="$(command -v clang)"
          ln -sf "$clang" "$tool_dir/clang-cl"
          expose_tool_dir=true
        fi
        if ! command -v mt.exe >/dev/null 2>&1; then
          llvm_mt="$(command -v llvm-mt)"
          ln -sf "$llvm_mt" "$tool_dir/mt.exe"
          expose_tool_dir=true
        fi
        if [ "$expose_tool_dir" = true ]; then
          echo "$tool_dir" >> "$GITHUB_PATH"
        fi
    - name: Build the Windows workspace
      shell: bash
      env:
        AWS_LC_SYS_NO_ASM: "1"
      run: >-
        cargo xwin build --workspace --all-targets --locked
        --exclude plurx-cluster-check
        --target x86_64-pc-windows-msvc
