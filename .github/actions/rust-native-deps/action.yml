name: Rust native dependencies
description: Supply native build libraries in retained CI containers
inputs:
  desktop:
    description: Include GTK4 and DBus for the Linux desktop workspace member
    default: "false"
runs:
  using: composite
  steps:
    - name: Verify native OpenSSL build support
      shell: bash
      run: |
        set -euo pipefail
        # The retained immutable CI image predates WebAuthn. New CI images
        # include libssl-dev; provision the same dependency on retained ones.
        if ! pkg-config --exists openssl; then
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libssl-dev
        fi
        pkg-config --modversion openssl
        probe="$(mktemp -d)"
        trap 'rm -rf "$probe"' EXIT
        printf '#include <openssl/ssl.h>\nint main(void) { return OPENSSL_init_ssl(0, 0) != 1; }\n' > "$probe/openssl.c"
        cc "$probe/openssl.c" $(pkg-config --cflags --libs openssl) -o "$probe/openssl"
        "$probe/openssl"
    - name: Verify Linux desktop build support
      if: inputs.desktop == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Only workspace jobs build the tray; server-only jobs need no GTK.
        if ! pkg-config --exists 'gtk4 >= 4.0' dbus-1; then
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libgtk-4-dev libdbus-1-dev
        fi
        pkg-config --modversion gtk4 dbus-1
