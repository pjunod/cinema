name: Configure Cargo cache
description: >-
  Use a bounded runner-local Cargo cache on persistent self-hosted runners and
  the GitHub cache service on disposable hosted runners.

inputs:
  lane:
    description: Stable, filesystem-safe name for this Cargo compilation lane.
    required: true
  disk-gb:
    description: >-
      Free space required before this job starts, in whole gigabytes. A full
      debug workspace tree is 21G and the persistent Cargo cache lives outside
      the workspace, so 21G is what a job grows by; the default is that plus
      link headroom. Lanes that also carry Playwright browsers or build ffmpeg
      should ask for more.
    default: "25"
  budget-gb:
    description: Maximum Cargo bytes retained across every toolchain on this runner.
    required: false
    default: "30"

outputs:
  local:
    description: Whether this job uses persistent runner-local storage.
    value: ${{ steps.configure.outputs.local }}
  target-dir:
    description: Absolute Cargo target directory selected for this lane.
    value: ${{ steps.configure.outputs.target_dir }}
  cache-root:
    description: Canonical persistent Cargo root, empty for hosted jobs.
    value: ${{ steps.configure.outputs.cache_root }}
  budget-gb:
    description: Enforced persistent Cargo budget, empty for hosted jobs.
    value: ${{ steps.configure.outputs.budget_gb }}
  last-used:
    description: Explicit LRU marker for the selected persistent lane.
    value: ${{ steps.configure.outputs.last_used }}

runs:
  using: composite
  steps:
    - name: Select and bound the Cargo cache
      id: configure
      shell: bash
      env:
        CACHE_BUDGET_GB: ${{ inputs.budget-gb }}
        DISK_GB: ${{ inputs.disk-gb }}
        CACHE_LANE: ${{ inputs.lane }}
      run: |
        set -euo pipefail
        # First, and before the cache mode is even chosen. A runner that
        # cannot fit this build reports a linker bus error rather than a full
        # disk, and that message costs an hour to read correctly.
        #
        # This lived inside the persistent-cache branch on its first attempt,
        # which meant it never ran on any lane that took the hosted path —
        # including the `fast Rust gate`, which then filled the disk exactly
        # as before while the check reported nothing at all. A preflight that
        # only guards some jobs is worse than none, because the jobs it
        # skips look identically clean.
        #
        # The number is measured rather than chosen: a full debug workspace
        # tree is 21G on the pinned toolchain, and the persistent Cargo cache
        # lives outside the workspace, so 21G is what a job actually grows by.
        # 25G is that plus link headroom.
        #
        # It was 30G for a few hours and that was too high. `gha-m6-general-02`
        # has 30G free with nothing left to prune — its cache is live and its
        # images are already gone — so a 30G bar refused a job on a healthy
        # runner over one gigabyte. That is the worse failure: the bus error
        # this guards against is recoverable by re-running, while a false
        # refusal blocks the work outright and no rerun helps.
        #
        # A lane that genuinely needs more says so; `vod-web` asks for 45G
        # because it carries Playwright browsers and an ffmpeg build on top.
        # The audit runs FIRST, and this ordering is the point of it. It
        # reports the one cache on this runner that no job can bound -- the
        # runner's own `actions/cache` server, which evicts nothing, ever --
        # and `ci-require-disk` below ends in `exit 1`. Run the refusal first
        # and the audit never runs on the hosts where its number is the only
        # thing that answers "can the janitor reclaim enough here?". Three
        # refusals on `gha-nuc4-general-01` on 2026-09-08 all said `18G
        # available` and none of them carried a cache figure.
        if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
          "$GITHUB_WORKSPACE/scripts/ci-runner-cache-audit" \
            "$(dirname -- "$RUNNER_TOOL_CACHE")" 20 || true
        fi
        "$GITHUB_WORKSPACE/scripts/ci-require-disk" \
          "${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}" "${DISK_GB:-25}"
        [[ "$CACHE_LANE" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || {
          echo "::error::Cargo cache lane must be filesystem-safe"
          exit 1
        }
        # Where the cache lives follows the RUNNER, not a rollout flag.
        #
        # This gate used to also require an explicit non-voter scheduling
        # proof from the caller and a rollout mode of shadow or accelerated.
        # The repository variable that carries that mode has
        # never been set on this repository, so the condition was false on every
        # job, and every job took the branch below: `Swatinem/rust-cache`,
        # writing a compressed copy of the target directory into the Forgejo
        # runner's internal cache server.
        #
        # That server has no eviction of any kind — `forgejo-runner` 13.1.0's
        # own `generate-config` offers `enabled`, `dir`, `host`, `proxy_port`
        # and the secrets, and nothing else: no size cap, no TTL, no GC. So
        # every entry it is ever handed is permanent. Measured on
        # `gha-m6-general-01` on 2026-09-07: 118 entries, 41G, every one of them
        # created in the previous three days, on a 78G disk. The whole fleet
        # was carrying ~167G of cache blobs that nothing would ever delete, and
        # runners were failing jobs for want of space while a bounded cache
        # implementation sat in this repository behind a flag nobody had set.
        #
        # A bound that a configuration variable can switch off is not a bound.
        # The runner-local path below is bounded by construction — an LRU budget
        # enforced before and after every job, under a filesystem floor — so it
        # is what a self-hosted runner gets, always. The hosted service is for
        # hosted runners, which evict on their own, and for the rare self-hosted
        # runner that exposes no tool cache to put a bounded cache in.
        if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] \
          || [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
          target_dir="$GITHUB_WORKSPACE/target"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "local=false" >> "$GITHUB_OUTPUT"
          echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"
          echo "cache_root=" >> "$GITHUB_OUTPUT"
          echo "budget_gb=" >> "$GITHUB_OUTPUT"
          echo "last_used=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Forgejo's runner does not export RUNNER_NAME -- that is a GitHub
        # Actions variable, and under `set -u` reading it aborted the step with
        # `RUNNER_NAME: unbound variable`. Nothing caught it because this branch
        # had never executed on any job: the gate above sent every one of them
        # down the hosted path instead.
        #
        # The fallback has to stay unique per runner INSTANCE, not per host:
        # nynuc runs four runners and rogg16 five, and two of them sharing a
        # Cargo cache root would have them pruning each other's target
        # directories mid-build. Each instance already has its own runner root
        # -- /opt/forgejo-runner, -02, -03 -- and RUNNER_TOOL_CACHE sits inside
        # it, so the root's name is that identity.
        runner_name=${RUNNER_NAME:-}
        if [ -z "$runner_name" ]; then
          runner_name="$(hostname -s)-$(basename -- "$(dirname -- "$RUNNER_TOOL_CACHE")")"
        fi
        runner_name=$(printf '%s' "$runner_name" | tr -c 'A-Za-z0-9_.-' '-')
        toolchain=$(rustc -Vv | sed -n 's/^release: //p')
        [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "::error::Cannot derive the pinned Rust toolchain"
          exit 1
        }
        # macOS still ships Bash 3.2, which has arrays and process
        # substitution but not `mapfile`. Keep this action runnable on every
        # self-hosted runner rather than making the cache lane Linux-only.
        cache_paths=()
        while IFS= read -r cache_path; do
          cache_paths[${#cache_paths[@]}]=$cache_path
        done < <(
          "$GITHUB_WORKSPACE/scripts/ci-cargo-cache-prepare" \
            "$RUNNER_TOOL_CACHE" "$runner_name" "$toolchain" "$CACHE_LANE"
        )
        [ "${#cache_paths[@]}" -eq 4 ] || {
          echo "::error::Cargo cache preparation returned an incomplete path set"
          exit 1
        }
        cache_root=${cache_paths[0]}
        target_dir=${cache_paths[1]}
        cargo_home=${cache_paths[2]}
        last_used=${cache_paths[3]}
        "$GITHUB_WORKSPACE/scripts/ci-cache-prune" \
          "$cache_root" "$CACHE_BUDGET_GB"
        {
          echo "CARGO_HOME=$cargo_home"
          echo "CARGO_TARGET_DIR=$target_dir"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"
        echo "local=true" >> "$GITHUB_OUTPUT"
        echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"
        echo "cache_root=$cache_root" >> "$GITHUB_OUTPUT"
        echo "budget_gb=$CACHE_BUDGET_GB" >> "$GITHUB_OUTPUT"
        echo "last_used=$last_used" >> "$GITHUB_OUTPUT"

    - name: Restore the hosted Cargo cache
      if: steps.configure.outputs.local != 'true'
      uses: https://github.com/Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.lane }}
