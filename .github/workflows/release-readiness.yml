name: release readiness

# The weekly release tag (docs/RELEASING.md "The weekly release tag";
# docs/ci/LEDGER-TEXT-CONTRACTS-AND-RELEASE-TAGS.md §3.5 option (a), the
# cadence Paul chose on 2026-09-23). Every Monday this asks `main`'s tip
# whether a release is waiting: its version is dated in CHANGELOG.md and not
# yet tagged. If one is, it names the release commit -- the landing commit of
# the `scripts/release-cut` pull request -- and reads the CI evidence that
# landing already carries: `scripts/land` only lands a head whose fast-lane
# `Main promotion gate` is green (validation/release_evidence.py). When that
# evidence is there, the `tag` job pushes the annotated `v` tag onto that
# commit, which is what starts release-tag.yml's image publication.
# Nothing is retested here: the release code passed its gate once, when it
# merged (Paul, 2026-11-25). No green gate, an untested landing, or a commit
# scripts/land did not make tags nothing. Whatever merged on top of the
# release commit since is not in the tag. A manual dispatch answers the
# readiness question and never tags.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: release-readiness
  cancel-in-progress: false

jobs:
  release-check:
    name: current version is ready to tag
    runs-on: [self-hosted, Linux, X64, lab, general]
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:6a989b4d92f55b29befa9eae08f9cd59940b3067d771629549ebf5ab1f4d433d
      options: --memory 7g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    # Reads git history and two forge endpoints; it runs no test suite.
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.release.outputs.pending }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the release commit, if a release is waiting
        id: release
        run: |
          # Not a pipe: a refusal (a dated section that no release commit
          # explains) has to fail this step, not vanish into `tee`.
          found=$(mktemp)
          scripts/release-cut --pending > "$found"
          cat "$found"
          cat "$found" >> "$GITHUB_OUTPUT"
      - name: Require the release commit's existing green promotion gate
        if: steps.release.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: python3 -m validation.release_evidence --sha "$RELEASE_SHA"
      - name: Report that no release is pending
        if: steps.release.outputs.pending != 'true'
        run: echo "No release pending; nothing to tag."
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"

  tag:
    name: tag the green release commit
    needs: release-check
    # Only a scheduled run tags, only when the release commit's gate evidence
    # was found above, and only a commit that is an untagged, dated release.
    if: github.event_name == 'schedule' && needs.release-check.result == 'success' && needs.release-check.outputs.pending == 'true'
    runs-on: [self-hosted, Linux, X64, lab, general]
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:6a989b4d92f55b29befa9eae08f9cd59940b3067d771629549ebf5ab1f4d433d
      options: --memory 7g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-check.outputs.sha }}
      - name: Push the annotated tag on the release commit the gate passed
        env:
          # A tag pushed with the run's own token starts no workflow, so the
          # tag that must start release-tag.yml is pushed with a repository secret
          # scoped to this one step.
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          TESTED_SHA: ${{ needs.release-check.outputs.sha }}
          TAG: ${{ needs.release-check.outputs.tag }}
        run: |
          set -eu
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "RELEASE_TAG_TOKEN is not set; $TAG was not pushed. See docs/RELEASING.md." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          scripts/release-cut --pending | grep -qx "pending=true"
          scripts/release-cut --pending | grep -qx "tag=$TAG"
          scripts/release-cut --pending | grep -qx "sha=$TESTED_SHA"
          auth=$(printf 'x-access-token:%s' "$RELEASE_TAG_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          if git -c http.extraheader="AUTHORIZATION: basic $auth" \
              ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists on origin; nothing to do" >&2
            exit 1
          fi
          git -c user.name="plurx release" -c user.email="release@plurx.invalid" \
            tag -a "$TAG" -m "$TAG" "$TESTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push origin "refs/tags/$TAG"
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"
