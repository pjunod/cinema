name: release readiness

# The weekly release tag (docs/RELEASING.md "The weekly release tag";
# docs/ci/LEDGER-TEXT-CONTRACTS-AND-RELEASE-TAGS.md §3.5 option (a), the
# cadence Paul chose on 2026-09-23). Every Monday this asks `main`'s tip
# whether a release is waiting: its version is dated in CHANGELOG.md and not
# yet tagged. If one is, the run checks out the release commit itself -- the
# commit `scripts/release-cut` produced, which dated that section -- runs the
# full release gate there, and when it is green the `tag` job pushes the
# annotated `v` tag onto that same commit, which is what starts ci.yml's full
# sweep and the image publication. Whatever merged on top of the release
# commit since is not in the tag. A red gate tags nothing. A week with no
# release pending runs the gate on the tip and tags nothing. A manual
# dispatch answers the readiness question and never tags.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-readiness
  cancel-in-progress: false

jobs:
  # The gate runs as two halves that each fit the fleet's 3 h job limit, which
  # the runner enforces whatever timeout-minutes says: run 9461 was stopped at
  # exactly 3 h, 2 h 41 min into the serial `cargo test --workspace`. Every
  # Rust unit and integration test now runs in `rust-units.yml`'s complete
  # mode on the release commit -- one archive, sharded across idle runners, no
  # receipt adopted, any failure blocking -- and the rest of the sweep runs in
  # `release-check` under the catalog's release profile (the CI profile with
  # that serial check replaced by `rust-gate-release`). The tag needs both.
  find:
    name: find the release commit
    runs-on: [self-hosted, Linux, X64, lab, general]
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:6a989b4d92f55b29befa9eae08f9cd59940b3067d771629549ebf5ab1f4d433d
      options: --memory 7g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.release.outputs.pending }}
      tag: ${{ steps.release.outputs.tag }}
      # The commit both halves test: the release commit when one is waiting,
      # otherwise main's tip.
      sha: ${{ steps.release.outputs.pending == 'true' && steps.release.outputs.sha || github.sha }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the release commit, if a release is waiting
        id: release
        run: |
          # Not a pipe: a refusal (a dated section that no release commit
          # explains) has to fail this step, not vanish into `tee`.
          found=$(mktemp)
          scripts/release-cut --pending > "$found"
          cat "$found"
          cat "$found" >> "$GITHUB_OUTPUT"
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"

  release-units:
    name: every Rust unit test passes on the release commit
    needs: find
    uses: ./.github/workflows/rust-units.yml
    with:
      base: ${{ needs.find.outputs.sha }}
      ref: ${{ needs.find.outputs.sha }}
      complete: true
    secrets: inherit

  release-check:
    name: current version is ready to tag
    needs: find
    # Use the shipped media runtime, independently of the host's FFmpeg.
    # The complete Rust suite needs the same memory pool as ci.yml:check: the
    # plurxd test build alone peaks near 15.3 GiB, which a 16 GiB container on
    # the unit-memory-16g carrier killed (run 9325). The heavy nonvoter VM is
    # the host-mode pool with a verified 20 GiB swapless bound, as for the
    # nightly sweep; release-readiness runs its container at 18 GiB there.
    runs-on: [incus, ci-nonvoter-heavy-amd64]
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "2"
      # As ci.yml:check: debug source-actor futures need 8 MiB test threads
      # (docs/ci/RUST-UNIT-FANOUT.md).
      RUST_MIN_STACK: "8388608"
    # Includes the candidate-owned runtime build and the strict release-profile
    # sweep. The sweep without rust-gate-ci took about 65 min in run 9325;
    # rust-gate-release adds Clippy and the doctests. The runner stops any job
    # at 3 h, so this must stay inside 180 minutes.
    timeout-minutes: 175
    steps:
      - name: Verify effective nonvoter resource bounds
        shell: sh
        run: |
          set -eu
          cgroup_membership=/proc/self/cgroup
          cgroup_mount=/sys/fs/cgroup
          # Exactly one unified (cgroup v2) line; unrelated v1 hierarchies such as a
          # VPN's net_cls may precede it on hybrid hosts and are ignored.
          relative=
          while IFS=: read -r hierarchy controllers path; do
            if [ "$hierarchy" = 0 ]; then
              if [ -n "$relative" ] || [ -n "$controllers" ]; then exit 1; fi
              relative=$path
            fi
          done < "$cgroup_membership"
          case "$relative" in /*) ;; *) exit 1 ;; esac
          case "/$relative/" in */../*|*/./*) exit 1 ;; esac
          cgroup_root="$cgroup_mount$relative"
          for limit in memory.max=21474836480 memory.swap.max=0 'cpu.max=400000 100000' cpuset.cpus.effective=0-3 pids.max=4096; do
            name=${limit%%=*}
            expected=${limit#*=}
            actual="$(cat "$cgroup_root/$name")"
            if [ "$actual" != "$expected" ]; then
              printf '%s\n' "Unexpected effective $name: $actual (required $expected)" >&2
              exit 1
            fi
          done
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: release-readiness
          disk-gb: "45"
      - name: Prepare the shipped-runtime release runner
        run: |
          # Keep the current runner outside the checkout: a pending release
          # can predate this workflow fix and its helper.
          cp scripts/release-readiness "$RUNNER_TEMP/release-readiness"
      - name: Check out the release commit
        if: needs.find.outputs.pending == 'true'
        env:
          RELEASE_SHA: ${{ needs.find.outputs.sha }}
        run: git checkout -q --detach "$RELEASE_SHA"
      - name: Verify release readiness
        if: needs.find.outputs.pending == 'true'
        run: python3 "$RUNNER_TEMP/release-readiness" make release-check
      - name: Verify main is releasable (no release pending)
        if: needs.find.outputs.pending != 'true'
        run: |
          echo "No release pending: $(scripts/release-cut --pending | tr '\n' ' ')"
          python3 "$RUNNER_TEMP/release-readiness" scripts/validate run --profile release --all --strict
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  tag:
    name: tag the green release commit
    needs: [find, release-units, release-check]
    # Only a scheduled run tags, only when both halves of the gate passed, and
    # only a commit that is an untagged, dated release.
    if: >-
      github.event_name == 'schedule' && needs.find.outputs.pending == 'true' &&
      needs.release-units.result == 'success' && needs.release-check.result == 'success'
    runs-on: [self-hosted, Linux, X64, lab, general]
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:6a989b4d92f55b29befa9eae08f9cd59940b3067d771629549ebf5ab1f4d433d
      options: --memory 7g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.find.outputs.sha }}
      - name: Push the annotated tag on the release commit the gate passed
        env:
          # A tag pushed with the run's own token starts no workflow, so the
          # tag that must start ci.yml is pushed with a repository secret
          # scoped to this one step.
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          TESTED_SHA: ${{ needs.find.outputs.sha }}
          TAG: ${{ needs.find.outputs.tag }}
        run: |
          set -eu
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "RELEASE_TAG_TOKEN is not set; $TAG was not pushed. See docs/RELEASING.md." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          scripts/release-cut --pending | grep -qx "pending=true"
          scripts/release-cut --pending | grep -qx "tag=$TAG"
          scripts/release-cut --pending | grep -qx "sha=$TESTED_SHA"
          auth=$(printf 'x-access-token:%s' "$RELEASE_TAG_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          if git -c http.extraheader="AUTHORIZATION: basic $auth" \
              ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists on origin; nothing to do" >&2
            exit 1
          fi
          git -c user.name="plurx release" -c user.email="release@plurx.invalid" \
            tag -a "$TAG" -m "$TAG" "$TESTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push origin "refs/tags/$TAG"
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"
