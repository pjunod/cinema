name: release readiness

on:
  schedule:
    - cron: "41 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-check:
    name: current version is ready to tag
    # Readiness answers "would the gate pass if we tagged now", so it has to run
    # the gate's ffmpeg rather than the week's. See .github/actions/ffmpeg.
    runs-on: [self-hosted, Linux, X64, lab, general, ubuntu-24.04]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Verify Playwright and install its pinned browser
        run: |
          requirement=playwright==1.62.0
          actual="$(python3 -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')"
          test "$requirement" = "playwright==$actual"
          python3 -m playwright install chromium
      - name: Verify release readiness
        run: make release-check
