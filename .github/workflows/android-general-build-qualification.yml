name: Qualify production Android general jobs
on:
  push:
    branches: [codex/qualify-general-android-build]
jobs:
  android_jvm:
    name: Android JVM tests and lint
    runs-on: [self-hosted, Linux, X64, lab, general, incus]
    timeout-minutes: 20
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/android-build@sha256:42e42068b13e991882ee02f64b49a9517613129c66a99c6ecb579419e7a15239
      options: --memory 7g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Git and Node for Forgejo actions
        run: |
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends git xz-utils
          node_dir=$(mktemp -d "$RUNNER_TEMP/android-node.XXXXXXXX")
          archive="$node_dir/node.tar.xz"
          curl -fsSL --retry 2 --proto '=https' https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o "$archive"
          printf '%s  %s\n' 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$node_dir" --strip-components=1
          echo "$node_dir/bin" >> "$GITHUB_PATH"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache Gradle dependencies
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            clients/android/.gradle-validation/caches
            clients/android/.gradle-validation/wrapper
          key: gradle-${{ hashFiles('clients/android/build.gradle.kts', 'clients/android/settings.gradle.kts', 'clients/android/app/build.gradle.kts', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Run unit tests and lint in the pinned Android toolchain
        env:
          RETAIN_JVM_LANE: "false"
          RETAIN_JVM_UNITS: "false"
          PLURX_RETAINED_UNITS: "false"
        run: |
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/clients/android/.gradle-validation"
          if [ "$RETAIN_JVM_LANE" = true ] || [ "$RETAIN_JVM_UNITS" = true ]; then
            (cd clients/android && ./gradlew --no-daemon --max-workers=2 compileDebugUnitTestKotlin compileDebugUnitTestJavaWithJavac lintDebug)
            if [ "$RETAIN_JVM_UNITS" = true ]; then
              python3 -m validation.jvm_unit_discovery --verify-adopted --source-commit "$(git rev-parse HEAD)"
            fi
          else
            (cd clients/android && ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug)
          fi
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"

  android_apks:
    name: Build Android instrumentation APKs
    runs-on: [self-hosted, Linux, X64, lab, general, incus]
    timeout-minutes: 25
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/android-build@sha256:42e42068b13e991882ee02f64b49a9517613129c66a99c6ecb579419e7a15239
      options: --memory 7g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Git and Node for Forgejo actions
        run: |
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends git xz-utils
          node_dir=$(mktemp -d "$RUNNER_TEMP/android-node.XXXXXXXX")
          archive="$node_dir/node.tar.xz"
          curl -fsSL --retry 2 --proto '=https' https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o "$archive"
          printf '%s  %s\n' 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$node_dir" --strip-components=1
          echo "$node_dir/bin" >> "$GITHUB_PATH"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache Gradle dependencies
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            clients/android/.gradle-validation/caches
            clients/android/.gradle-validation/wrapper
          key: gradle-${{ hashFiles('clients/android/build.gradle.kts', 'clients/android/settings.gradle.kts', 'clients/android/app/build.gradle.kts', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build app and instrumentation APKs in the pinned toolchain
        working-directory: clients/android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/clients/android/.gradle-validation
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest
      - name: Upload app and test APKs
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: android-tv-instrumentation-apks
          path: |
            clients/android/app/build/outputs/apk/debug/app-debug.apk
            clients/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"

  android_compile:
    name: fast Android compile
    runs-on: [self-hosted, Linux, X64, lab, general, incus]
    timeout-minutes: 10
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/android-build@sha256:42e42068b13e991882ee02f64b49a9517613129c66a99c6ecb579419e7a15239
      options: --memory 7g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Git and Node for Forgejo actions
        run: |
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends git xz-utils
          node_dir=$(mktemp -d "$RUNNER_TEMP/android-node.XXXXXXXX")
          archive="$node_dir/node.tar.xz"
          curl -fsSL --retry 2 --proto '=https' https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o "$archive"
          printf '%s  %s\n' 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$node_dir" --strip-components=1
          echo "$node_dir/bin" >> "$GITHUB_PATH"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache Gradle dependencies
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            clients/android/.gradle-docker/caches
            clients/android/.gradle-docker/wrapper
          key: main-fast-gradle-${{ hashFiles('clients/android/build.gradle.kts', 'clients/android/settings.gradle.kts', 'clients/android/app/build.gradle.kts', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            main-fast-gradle-
            effort-gradle-
      - name: Compile the Android debug application without running tests
        working-directory: clients/android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/clients/android/.gradle-docker
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"
