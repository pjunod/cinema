name: validation nightly

on:
  workflow_dispatch:
    inputs:
      fuzz_only:
        description: Run only the five bounded parser fuzz campaigns
        required: false
        type: boolean
        default: false
      seed_pgs_crash:
        description: Prove the fuzz failure gate with a disposable harness panic
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deep-validation:
    if: ${{ !inputs.fuzz_only }}
    name: playback, recovery, bounds, clients, UI, and packaging
    # SDK builds stay inside hard-bounded VMs on verified non-voter hosts.
    runs-on: [incus, ci-nonvoter-heavy-amd64]
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "2"
    timeout-minutes: 240
    steps:
      - name: Verify effective nonvoter resource bounds
        shell: sh
        run: |
          set -eu
          cgroup_membership=/proc/self/cgroup
          cgroup_mount=/sys/fs/cgroup
          # Exactly one unified (cgroup v2) line; unrelated v1 hierarchies such as a
          # VPN's net_cls may precede it on hybrid hosts and are ignored.
          relative=
          while IFS=: read -r hierarchy controllers path; do
            if [ "$hierarchy" = 0 ]; then
              if [ -n "$relative" ] || [ -n "$controllers" ]; then exit 1; fi
              relative=$path
            fi
          done < "$cgroup_membership"
          case "$relative" in /*) ;; *) exit 1 ;; esac
          case "/$relative/" in */../*|*/./*) exit 1 ;; esac
          cgroup_root="$cgroup_mount$relative"
          for limit in memory.max=21474836480 memory.swap.max=0 'cpu.max=400000 100000' cpuset.cpus.effective=0-3 pids.max=4096; do
            name=${limit%%=*}
            expected=${limit#*=}
            actual="$(cat "$cgroup_root/$name")"
            if [ "$actual" != "$expected" ]; then
              printf '%s\n' "Unexpected effective $name: $actual (required $expected)" >&2
              exit 1
            fi
          done
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: nightly-deep
          disk-gb: "45"
      - name: Run every scheduled validation with the shipped media runtime
        run: python3 scripts/release-readiness --memory-gb 8 --host-network make validate-nightly
      # Split, because the two halves have wildly different value per byte.
      #
      # The JSON under target/validation is what anyone actually reads weeks
      # later — which points ran, what they measured, which regressed. It is a
      # few megabytes and keeps its fortnight.
      #
      # target/playback-lab and target/ui-baseline are captures: video frames
      # and screenshots. Together they are ~200 MB *per night*, which at a
      # fortnight's retention is a standing 2.8 GB from this job alone — more
      # than the whole account's artifact allowance, and the actual reason
      # every upload in every repository has been refused since 2026-08-25.
      # They are worth looking at when something failed or in the days right
      # after a change; nobody opens a green night's screenshots from twelve
      # days ago.
      - name: Upload deep-validation evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: nightly-deep-validation-evidence
          path: target/validation
          if-no-files-found: warn
          retention-days: 14
      - name: Upload deep-validation captures
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: nightly-deep-validation-captures
          path: |
            target/playback-lab
            target/ui-baseline
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  pgs-fuzz:
    name: bounded PGS parser fuzz campaign
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Every other Rust job here installs its toolchain through this action.
      # This one assumed `rustup` was already on the box — true of a hosted
      # runner image, not of a self-hosted one — and died with
      # `rustup: command not found` before running a single fuzz case.
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      # `cargo install cargo-fuzz` is twenty minutes of compiling that does not
      # change between nights.
      - uses: https://github.com/Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: nightly-pgs-fuzz
      - name: Install the PGS fuzz runner
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          cargo install cargo-fuzz --locked
        timeout-minutes: 20
      - name: Prove the fuzz seed is opt-in
        run: cargo +nightly-2026-08-01 test --manifest-path fuzz/Cargo.toml --lib
      - name: Fuzz the bounded PGS parser
        id: pgs_fuzz
        continue-on-error: true
        timeout-minutes: 20
        env:
          PLURX_FUZZ_SEEDED_CRASH: ${{ inputs.seed_pgs_crash && '1' || '' }}
        run: |
          mkdir -p target/validation
          before="$(find fuzz/corpus/inspect_sup -type f | wc -l | tr -d ' ')"
          echo "corpus_before=$before" >> "$GITHUB_OUTPUT"
          set -o pipefail
          cargo +nightly-2026-08-01 fuzz run inspect_sup fuzz/corpus/inspect_sup \
            -- -max_total_time=900 -print_final_stats=1 2>&1 | tee target/validation/pgs-fuzz.log
      - name: Upload PGS fuzz evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: nightly-pgs-fuzz-evidence
          path: |
            target/validation/pgs-fuzz.log
            fuzz/artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize the PGS campaign
        if: always()
        run: scripts/fuzz-campaign --summarize inspect_sup target/validation/pgs-fuzz.log ${{ steps.pgs_fuzz.outcome == 'failure' && 1 || 0 }} "${{ steps.pgs_fuzz.outputs.corpus_before }}"
      - name: Fail when the PGS fuzzer finds a crash
        if: always() && steps.pgs_fuzz.outcome == 'failure'
        run: |
          echo "The bounded PGS fuzz campaign found a reproducible failure." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # The four parser seams of docs/ci/SERVICE-LIMITS-CHILD-PRIORITIES-AND-BUILD-HYGIENE.md
  # §3.6, on the same bounded budget and artefact upload as the PGS campaign.
  # They are their own cargo-fuzz package, fuzz/parsers/, so the PGS job above
  # never compiles plurx-core under AddressSanitizer inside its step budget.
  # One matrix job rather than four copies: the toolchain and cargo-fuzz install
  # are identical, and `fail-fast: false` keeps one target's finding from
  # cancelling the other three. `scripts/fuzz-campaign` writes executions and
  # corpus growth as a one-row table into each job's own step summary, and the
  # run's summary page lists all five campaigns under their job headings, so a
  # target that has stopped finding new edges is visible without opening its
  # log; fifteen minutes per target is a budget, not coverage evidence.
  parser-fuzz:
    name: bounded ${{ matrix.target }} fuzz campaign
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [fmp4_reader, rpu_rewrite, nfo_parse, epub_facts]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      # One cache key for the whole matrix: the four targets share every
      # dependency, so whichever job saves first warms the other three.
      - uses: https://github.com/Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: nightly-parser-fuzz
          workspaces: |
            fuzz/parsers -> target
      - name: Install the fuzz runner
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          cargo install cargo-fuzz --locked
        timeout-minutes: 20
      - name: Check the seed corpus is present
        run: scripts/fuzz-seeds --check
      - name: Fuzz ${{ matrix.target }}
        id: campaign
        continue-on-error: true
        timeout-minutes: 60
        run: scripts/fuzz-campaign ${{ matrix.target }} 900
      - name: Upload ${{ matrix.target }} fuzz evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: nightly-fuzz-${{ matrix.target }}-evidence
          path: |
            target/validation/fuzz-${{ matrix.target }}.log
            fuzz/parsers/artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when the ${{ matrix.target }} fuzzer finds a crash
        if: always() && steps.campaign.outcome == 'failure'
        run: |
          echo "The bounded ${{ matrix.target }} fuzz campaign found a reproducible failure." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Every other lane in this repository runs ffmpeg 6, which is how #380 —
  # ffmpeg 8 declaring `-readrate_initial_burst` and ignoring it — reached three
  # worker hosts without CI noticing. A pin alone would have kept that blind
  # spot permanent, so the other major gets a lane of its own.
  #
  # Nightly rather than the required gate, deliberately: the capability probe
  # this asserts is #386's territory, and a required matrix over both majors
  # would have the fleet staring at a red required check until that lands. This
  # runs the same `playback-recovery` capability assertion the deep tier already
  # owns (validation/points.toml), so when #386 changes what the probe reports,
  # this lane is where the change meets a real ffmpeg 8 rather than a mock.
  ffmpeg8-pacing:
    if: ${{ !inputs.fuzz_only }}
    name: pacing capability contract on ffmpeg 8
    # The container tag is the pin here — `ubuntu:26.04` is where ffmpeg 8 comes
    # from, and it moves only when this line does. The final step restores the
    # persistent runner's ownership after the root job container exits.
    runs-on: [self-hosted, Linux, X64, lab, general]
    container: ubuntu:26.04
    timeout-minutes: 45
    steps:
      # A bare distro image, unlike a hosted runner image, ships none of this;
      # `git` in particular has to exist before checkout, or the action falls
      # back to a tarball and `./.github/actions/ffmpeg` below has no repository
      # to resolve against. `cmake` is aws-lc-sys'.
      - name: Install the container's build prerequisites
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: https://github.com/Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: nightly-ffmpeg8
      - uses: ./.github/actions/ffmpeg
        with:
          major: "8"
      # `--ignored` because the assertion is a runner capability contract rather
      # than a unit test: it is meaningless on a machine whose ffmpeg nobody
      # chose, which until this job was every machine CI had.
      - name: Assert the pacing capability contract on ffmpeg 8
        run: |
          cargo test --locked -p plurxd \
            ffmpeg::tests::nightly_runner_has_ffmpeg_readrate \
            -- --exact --ignored --nocapture
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"

  mutation:
    if: ${{ !inputs.fuzz_only }}
    name: report-only weekly mutation spot-check
    # Mutants execute against the same shipping media package as the app.
    runs-on: [incus, ci-nonvoter-heavy-amd64]
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "2"
    timeout-minutes: 120
    steps:
      - name: Verify effective nonvoter resource bounds
        shell: sh
        run: |
          set -eu
          cgroup_membership=/proc/self/cgroup
          cgroup_mount=/sys/fs/cgroup
          # Exactly one unified (cgroup v2) line; unrelated v1 hierarchies such as a
          # VPN's net_cls may precede it on hybrid hosts and are ignored.
          relative=
          while IFS=: read -r hierarchy controllers path; do
            if [ "$hierarchy" = 0 ]; then
              if [ -n "$relative" ] || [ -n "$controllers" ]; then exit 1; fi
              relative=$path
            fi
          done < "$cgroup_membership"
          case "$relative" in /*) ;; *) exit 1 ;; esac
          case "/$relative/" in */../*|*/./*) exit 1 ;; esac
          cgroup_root="$cgroup_mount$relative"
          for limit in memory.max=21474836480 memory.swap.max=0 'cpu.max=400000 100000' cpuset.cpus.effective=0-3 pids.max=4096; do
            name=${limit%%=*}
            expected=${limit#*=}
            actual="$(cat "$cgroup_root/$name")"
            if [ "$actual" != "$expected" ]; then
              printf '%s\n' "Unexpected effective $name: $actual (required $expected)" >&2
              exit 1
            fi
          done
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: nightly-mutation
          disk-gb: "45"
      - name: Mutation spot-check using the shipped media runtime
        id: mutants
        run: python3 scripts/release-readiness --memory-gb 8 bash scripts/nightly-mutation
      - name: Publish mutation summary
        if: always()
        run: |
          if test -f target/mutants/summary.md; then
            cat target/mutants/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: nightly-mutation-evidence
          path: target/mutants
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
