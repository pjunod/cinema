name: lint

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: false

# Post-merge and manual badge workflow. Pull requests and merge groups run
# Clippy once inside ci.yml's fast Rust gate, where the aggregate gate owns it.
jobs:
  lint:
    name: rustfmt + clippy
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
      - run: make fmt-check lint
