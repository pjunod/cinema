name: lint

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: false

# Release-tag and manual badge workflow. Main pull requests run Clippy in
# main-fast-lane.yml after the one adversarial review.
jobs:
  lint:
    name: rustfmt + clippy
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Run rustfmt and Clippy
        id: lint
        continue-on-error: true
        run: make fmt-check lint
      - name: Publish the lint result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: |
          if [ "$LINT_RESULT" = success ]; then
            message=passing; fill='#4c1'; color=brightgreen
          else
            message=failing; fill='#e05d44'; color=red
          fi
          scripts/publish-badge \
            --branch badges-lint \
            --alias codex/badges-lint \
            --filename lint \
            --label lint \
            --message "$message" \
            --fill "$fill" \
            --json-color "$color" \
            --label-width 27 \
            --message-width 48
      - name: Preserve the lint verdict
        if: steps.lint.outcome != 'success'
        run: exit 1
