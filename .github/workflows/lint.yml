name: P-01 temporary Rust lane measurement

# Temporary M1 instrumentation in a workflow already registered on main.
# Revert this commit after recording the named run URLs.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Measurement scenario (cold, warm-1, warm-2, or unit-only)
        required: true
        default: cold

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: p01-measure-${{ inputs.scenario }}
  cancel-in-progress: false

jobs:
  measure:
    name: ${{ inputs.scenario }} Rust lane measurement
    runs-on: [self-hosted, Linux, X64, lab, general, high-cpu]
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out the measurement candidate
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Install the pinned FFmpeg
        uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Restore the measurement Cargo cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: p01-measure
      - name: Prune the cold compilation tree
        if: inputs.scenario == 'cold'
        run: cargo clean
      - name: Record the runner identity
        run: |
          echo "P01_RUNNER_HOST=$(hostname -s)"
          rustc --version
          ffmpeg -version | sed -n '1p'
      - name: Compile every Rust target without executing tests
        if: inputs.scenario != 'unit-only'
        run: |
          started=$(date +%s)
          make effort-rust-check
          make hiqlite-vendor-clippy
          echo "P01_TIMING compile_seconds=$(($(date +%s)-started))"
      - name: Measure workspace Clippy
        if: inputs.scenario != 'unit-only'
        run: |
          started=$(date +%s)
          make lint
          echo "P01_TIMING lint_seconds=$(($(date +%s)-started))"
      - name: Measure the unit lane
        run: |
          started=$(date +%s)
          make unit
          echo "P01_TIMING unit_seconds=$(($(date +%s)-started))"
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        continue-on-error: true
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
