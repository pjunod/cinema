name: lint

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: false

# Release-tag and manual badge workflow. Main pull requests run Clippy in
# main-fast-lane.yml after the one adversarial review.
jobs:
  lint:
    name: rustfmt + clippy
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: make fmt-check lint
