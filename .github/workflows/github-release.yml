name: github release artifacts
run-name: github release ${{ inputs.release_tag || (github.event_name == 'push' && github.ref_name) || 'dry run' }}

# GitHub-only. The public GitHub repository is a push mirror of Forgejo, so
# the release tag the weekly release-readiness job pushes on Forgejo arrives
# here when the mirror syncs, and that push runs this workflow on GitHub-hosted
# runners. It builds the installable server from the tagged commit, checks
# each artifact on the systems it is for, and publishes them as the GitHub
# release for the tag:
#
#   plurxd_X.Y.Z-1_{amd64,arm64}.deb        Debian 12+, Ubuntu 24.04+
#   plurxd-X.Y.Z-1.{x86_64,aarch64}.rpm     Fedora, RHEL 9+ with RPM Fusion
#   plurxd-X.Y.Z-macos-universal.tar.gz     Apple Silicon and Intel
#   plurxd-X.Y.Z-windows-x86_64.zip         Windows 10 1809+ / Server 2019+
#   plurx-desktop_X.Y.Z-1_{amd64,arm64}.deb optional local Linux GUI
#   plurx-desktop-X.Y.Z-1.{x86_64,aarch64}.rpm
#   plurx-update-v1.json + .sig (raw Ed25519), only for qualified in-app upgrades
#   SHA256SUMS
#
# Forgejo reads this file as well, because its runners take .github/workflows.
# Every job has the exact positive `github.server_url == 'https://github.com'`
# guard plus explicit build/release/qualification mode routing where needed.
# (GitHub adds the implicit success() of its needs); Forgejo
# evaluates a job-level `if` on the server and records the run as skipped
# without allocating a runner (probed on Forgejo 16.0.3 on 2026-10-10). So
# nothing here reaches the lab fleet, and tests/operations/test_contracts.py
# holds this file to its own contract instead of the self-hosted one.
#
# The build jobs hold a read-only token and hand their output on as workflow
# artifacts. A separate protected macOS job signs/notarizes the archive without
# executing its contents. Only `publish`, which compiles and runs nothing from the source,
# can write: it checks that it holds exactly the expected files, computes
# SHA256SUMS over them, and creates the release in one step.
#
# Every job takes its packaging from the commit this workflow runs at and builds
# the release source from the tag. On a tag push those are the same commit; a
# manual dispatch with `release_tag` back-fills an older tag with current
# packaging. A dispatch without one is a dry run of the dispatched ref: every
# artifact is built and checked, and nothing is published. A nonempty
# desktop_qualification_build_run_id instead consumes an already completed
# exact-candidate dry run through the local reusable native qualification workflow;
# it never rebuilds or enters publication/signing jobs.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated vX.Y.Z tag to build and publish (empty for a dry run)
        required: false
        default: ""
        type: string
      desktop_qualification_build_run_id:
        description: Existing successful dry-run artifact build for this exact commit; empty builds normally
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # One run per release tag, whichever way it was started; dry runs never wait.
  group: >-
    github-release-${{ inputs.release_tag ||
    (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name) ||
    github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  resolve:
    name: resolve the release source
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      source_tree: ${{ steps.release.outputs.source_tree }}
      build_ref: ${{ steps.release.outputs.build_ref }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      expect_version: ${{ steps.release.outputs.expect_version }}
      publish_updates: ${{ steps.update_qualification.outputs.enabled }}
    steps:
      - name: Validate the release tag and read its source
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_QUALIFICATION_RUN_ID: ${{ inputs.desktop_qualification_build_run_id }}
        run: |
          set -euo pipefail
          # A tag push publishes that tag. A dispatch publishes the tag it is
          # given, or is a dry run of the dispatched ref when given none --
          # even when dispatched from a tag.
          tag=
          if [ "$EVENT_NAME" = push ]; then
            case $GITHUB_REF in refs/tags/*) tag=$GITHUB_REF_NAME ;; esac
          else
            tag=$INPUT_TAG
          fi
          if [ -n "$INPUT_QUALIFICATION_RUN_ID" ]; then
            [ "$EVENT_NAME" = workflow_dispatch ] && [ -z "$tag" ] || {
              echo "::error::qualification cannot be combined with release publication"
              exit 1
            }
            [[ "$INPUT_QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::qualification build run ID must be a positive decimal integer"
              exit 1
            }
            printf 'mode=qualification\ncommit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git init -q source
          cd source
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::release tag must be exactly vX.Y.Z, got '$tag'"
              exit 1
            }
            git fetch -q --depth 1 "$REPO_URL" "+refs/tags/$tag:refs/tags/$tag"
            test "$(git cat-file -t "refs/tags/$tag")" = tag || {
              echo "::error::$tag must be an annotated tag"
              exit 1
            }
            commit=$(git rev-parse "refs/tags/$tag^{commit}")
            mode=release
            build_ref=$tag
          else
            git fetch -q --depth 1 "$REPO_URL" "$GITHUB_SHA"
            commit=$GITHUB_SHA
            mode=dry-run
            build_ref=dryrun-${commit:0:12}
          fi
          git checkout -q --detach "$commit"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::cannot read the workspace version at $commit"
            exit 1
          }
          if [ "$mode" = release ]; then
            test "$version" = "${tag#v}" || {
              echo "::error::$tag does not match workspace version $version"
              exit 1
            }
            grep -Fq "## [$version]" CHANGELOG.md || {
              echo "::error::CHANGELOG.md has no $version release heading"
              exit 1
            }
          fi
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "build_ref=$build_ref"
            echo "source_date_epoch=$(git show -s --format=%ct "$commit")"
            echo "expect_version=plurxd $version ($build_ref)"
          } >> "$GITHUB_OUTPUT"
          echo "$mode: builds $commit as plurxd $version ($build_ref)"

      - name: Select qualified in-app update publication
        id: update_qualification
        if: steps.release.outputs.mode == 'release'
        env:
          UPGRADE_FROM: ${{ vars.PLURX_UPDATE_UPGRADE_FROM }}
          DATA_COMPATIBILITY: ${{ vars.PLURX_UPDATE_DATA_COMPATIBILITY }}
          CLUSTER_COMPATIBILITY: ${{ vars.PLURX_UPDATE_CLUSTER_COMPATIBILITY }}
          MINIMUM_CONTROLLER: ${{ vars.PLURX_UPDATE_MINIMUM_CONTROLLER }}
          ROLLBACK: ${{ vars.PLURX_UPDATE_ROLLBACK }}
        run: |
          set -euo pipefail
          enabled=true
          for name in UPGRADE_FROM DATA_COMPATIBILITY CLUSTER_COMPATIBILITY MINIMUM_CONTROLLER ROLLBACK; do
            if [ -z "${!name}" ]; then
              enabled=false
              printf 'In-app update qualification is missing: %s\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = false ]; then
            echo 'Verified installers will publish without advertising authenticated in-app upgrades.' >> "$GITHUB_STEP_SUMMARY"
          fi

  linux:
    name: Linux packages (${{ matrix.arch }})
    needs: resolve
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode != 'qualification'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rustup_triple: x86_64-unknown-linux-gnu
            rustup_sha256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
            nfpm_asset: nfpm_2.46.3_Linux_x86_64.tar.gz
            nfpm_sha256: 9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rustup_triple: aarch64-unknown-linux-gnu
            rustup_sha256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
            nfpm_asset: nfpm_2.46.3_Linux_arm64.tar.gz
            nfpm_sha256: 7871d72bb1035924eab56031f962ae3f004b1f7695151789ef018bdbc507a2fa
            rpm_arch: aarch64
    env:
      # AlmaLinux 8 is glibc 2.28: the binary itself loads on any distribution
      # from that floor up. The packages' ffmpeg dependency is what narrows
      # the supported list (see deploy/packaging/nfpm.yaml).
      BUILD_IMAGE: almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe
      GLIBC_FLOOR: "2.28"
      RUSTUP_VERSION: 1.28.2
      VERSION: ${{ needs.resolve.outputs.version }}
      PLURX_BUILD_REF: ${{ needs.resolve.outputs.build_ref }}
      PLURX_BUILD_SHA: ${{ needs.resolve.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
      EXPECT_VERSION: ${{ needs.resolve.outputs.expect_version }}
    steps:
      - name: Fetch the packaging tree and the release source
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          git init -q .
          git fetch -q --depth 1 "$REPO_URL" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q release-source
          git -C release-source fetch -q --depth 1 "$REPO_URL" "$COMMIT"
          git -C release-source checkout -q --detach FETCH_HEAD
      - name: Build plurxd against the glibc floor
        env:
          RUSTUP_TRIPLE: ${{ matrix.rustup_triple }}
          RUSTUP_SHA256: ${{ matrix.rustup_sha256 }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD/release-source:/src" --workdir /src \
            --env PLURX_BUILD_REF --env PLURX_BUILD_SHA --env SOURCE_DATE_EPOCH \
            --env CARGO_TERM_COLOR --env RUSTUP_VERSION --env RUSTUP_TRIPLE --env RUSTUP_SHA256 \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            "$BUILD_IMAGE" bash -euo pipefail -c '
              dnf -y -q install gcc gcc-c++ make git >/dev/null
              curl -fsSL -o /tmp/rustup-init \
                "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$RUSTUP_TRIPLE/rustup-init"
              echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c -
              chmod 0755 /tmp/rustup-init
              /tmp/rustup-init -y -q --profile minimal --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install "$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml)" \
                --profile minimal
              git config --global --add safe.directory /src
              cargo build --locked --release -p plurxd -p plurx-desktop-control --bins
              chown -R "$HOST_UID:$HOST_GID" target
            '
      - name: Check the binary's identity and glibc floor
        run: |
          set -euo pipefail
          binary=release-source/target/release/plurxd
          test -f "$binary.dwp"
          file -b "$binary"
          max_glibc=$(readelf --version-info "$binary" \
            | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' | sort -V | tail -1)
          test "$(printf '%s\n' "$max_glibc" "$GLIBC_FLOOR" | sort -V | tail -1)" = "$GLIBC_FLOOR" || {
            echo "::error::plurxd requires GLIBC_$max_glibc; the floor is $GLIBC_FLOOR"
            exit 1
          }
          reported=$("$binary" --version)
          test "$reported" = "$EXPECT_VERSION" || {
            echo "::error::plurxd reports '$reported', expected '$EXPECT_VERSION'"
            exit 1
          }
          echo "$reported; highest glibc symbol $max_glibc"
      - name: Build the optional desktop against the GTK4 and glibc floors
        env:
          RUSTUP_TRIPLE: ${{ matrix.rustup_triple }}
          RUSTUP_SHA256: ${{ matrix.rustup_sha256 }}
        run: |
          set -euo pipefail
          # Server remains Alma8/glibc2.28; only the optional GUI uses Alma9.
          # Official Alma9 AppStream carries gtk4-devel 4.12.3. The Rust GUI
          # enables GTK4.0 APIs only, so Debian12 GTK4.8 remains supported.
          docker run --rm \
            --volume "$PWD/release-source:/src" --workdir /src \
            --env PLURX_BUILD_SHA --env VERSION --env SOURCE_DATE_EPOCH \
            --env CARGO_TERM_COLOR --env RUSTUP_VERSION --env RUSTUP_TRIPLE --env RUSTUP_SHA256 \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16 bash -euo pipefail -c '
              dnf -y -q install gcc gcc-c++ make git gtk4-devel pkgconf-pkg-config >/dev/null
              curl -fsSL -o /tmp/rustup-init \
                "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$RUSTUP_TRIPLE/rustup-init"
              echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c -
              chmod 0755 /tmp/rustup-init
              /tmp/rustup-init -y -q --profile minimal --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install "$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml)" --profile minimal
              git config --global --add safe.directory /src
              CARGO_TARGET_DIR=/src/target-desktop cargo build --locked --release -p plurx-tray
              test "$(target-desktop/release/plurx-tray --version)" = "plurx-tray $VERSION ($PLURX_BUILD_SHA)"
              chown -R "$HOST_UID:$HOST_GID" target-desktop
            '
          binary=release-source/target-desktop/release/plurx-tray
          max_glibc=$(readelf --version-info "$binary" | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' | sort -V | tail -1)
          test "$(printf '%s\n' "$max_glibc" 2.34 | sort -V | tail -1)" = 2.34
      - name: Package the standalone host tray (no server package dependency)
        env:
          ARCH: ${{ matrix.arch }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          python3 scripts/linux-tray-release \
            --binary release-source/target-desktop/release/plurx-tray \
            --icons release-source/deploy/desktop --out dist \
            --version "$VERSION" --commit "$COMMIT" --arch "$ARCH"
      - name: Package the .deb and .rpm
        env:
          NFPM_ASSET: ${{ matrix.nfpm_asset }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nfpm"
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.46.3/$NFPM_ASSET"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/nfpm" nfpm
          PATH="$RUNNER_TEMP/nfpm:$PATH" \
          PLURX_PKG_REPOSITORY="$REPO_URL" \
          PLURX_PKG_SOURCE_ROOT="$PWD/release-source" \
            scripts/package-linux --arch "$ARCH" --version "$VERSION" \
            --binary release-source/target/release/plurxd \
            --control-dir release-source/target/release \
            --desktop-binary release-source/target-desktop/release/plurx-tray --out dist
          ls -l dist
      - name: Install, start, reinstall and remove each package on its distributions
        env:
          DEB: plurxd_${{ needs.resolve.outputs.version }}-1_${{ matrix.arch }}.deb
          RPM: plurxd-${{ needs.resolve.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm
        run: |
          set -euo pipefail
          # What every distribution checks once its package manager has
          # installed the package: the symlinked binary answers, the
          # post-install script made the service user and its state directory,
          # and the server comes up ready as that user with the distribution's
          # own ffmpeg.
          serve='
            test "$(plurxd --version)" = "$EXPECT_VERSION"
            getent passwd plurx >/dev/null
            test "$(stat -c %U:%a /var/lib/plurx)" = plurx:750
            grep -qx "ExecStart=/usr/lib/plurx-control/plurx-service-launch" /usr/lib/systemd/system/plurxd.service
            test -x /usr/bin/plurx-control
            test -x /usr/lib/plurx-control/plurx-recovery
            test -f /etc/plurx/installation.json
            su -s /bin/sh plurx -c "PLURX_DATA_DIR=/var/lib/plurx PLURX_BIND=127.0.0.1:32400 plurxd run" \
              > /tmp/plurxd.log 2>&1 &
            tries=0
            until curl -fsS http://127.0.0.1:32400/readyz >/dev/null 2>&1; do
              tries=$((tries + 1))
              if [ "$tries" -ge 120 ]; then cat /tmp/plurxd.log; echo "not ready in 120 s" >&2; exit 1; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:32400/api/v1/server; echo
          '
          # Removal keeps the state and the user and records that it happened;
          # installing again consumes that record (and so re-enables the
          # service on a systemd host).
          removed='
            test ! -e /usr/bin/plurxd
            test "$(stat -c %U /var/lib/plurx)" = plurx
            test -f /var/lib/plurx/.plurxd-package-removed
          '
          reinstalled='
            test "$(plurxd --version)" = "$EXPECT_VERSION"
            test ! -e /var/lib/plurx/.plurxd-package-removed
          '
          run_in() {
            local image=$1 script=$2
            echo "::group::$image"
            docker run --rm --volume "$PWD/dist:/dist:ro" \
              --env EXPECT_VERSION --env DEB --env RPM \
              "$image" bash -euo pipefail -c "$script"
            echo "::endgroup::"
          }
          deb='
            export DEBIAN_FRONTEND=noninteractive
            apt-get -qq update
            apt-get -qq install -y --no-install-recommends "/dist/$DEB" curl >/dev/null
            '"$serve"'
            apt-get -qq remove -y plurxd >/dev/null
            '"$removed"'
            apt-get -qq install -y --no-install-recommends "/dist/$DEB" >/dev/null
            '"$reinstalled"'
          '
          run_in debian:12 "$deb"
          run_in ubuntu:24.04 "$deb"
          run_in fedora:42 '
            dnf -y -q install "/dist/$RPM" util-linux >/dev/null
            command -v curl >/dev/null || dnf -y -q install curl >/dev/null
            '"$serve"'
            dnf -y -q remove plurxd >/dev/null
            '"$removed"'
            dnf -y -q install "/dist/$RPM" >/dev/null
            '"$reinstalled"'
          '
          # RHEL takes ffmpeg from RPM Fusion, which a stock image lacks, so
          # this proves the scriptlets and that the binary loads there.
          run_in almalinux:9 '
            rpm -i --nodeps "/dist/$RPM"
            test "$(plurxd --version)" = "$EXPECT_VERSION"
            test "$(stat -c %U:%a /var/lib/plurx)" = plurx:750
            rpm -e --nodeps plurxd
            '"$removed"'
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  macos_build:
    name: macOS plurxd (${{ matrix.arch }})
    needs: resolve
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode != 'qualification'
    runs-on: ${{ matrix.runner }}
    # A slice takes about an hour on these runners (63 min arm64, 72 min
    # x86_64 on 2026-10-10).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Each slice builds natively on its own hardware, in parallel, and
        # runs there; the archive job joins them.
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      PLURX_BUILD_REF: ${{ needs.resolve.outputs.build_ref }}
      PLURX_BUILD_SHA: ${{ needs.resolve.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
      EXPECT_VERSION: ${{ needs.resolve.outputs.expect_version }}
    steps:
      - name: Fetch the release source
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          git init -q release-source
          git -C release-source fetch -q --depth 1 "$REPO_URL" "$COMMIT"
          git -C release-source checkout -q --detach FETCH_HEAD
      - name: Build and run plurxd on ${{ matrix.arch }}
        working-directory: release-source
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target "$TARGET"
          cargo build --locked --release -p plurxd -p plurx-desktop-control --bins --target "$TARGET"
          binary="target/$TARGET/release/plurxd"
          test "$(lipo -archs "$binary")" = "$ARCH"
          test "$("$binary" --version)" = "$EXPECT_VERSION"
          mkdir -p ../slice
          cp "$binary" "../slice/plurxd-$ARCH"
          dsymutil "$binary" -o "../slice/plurxd-$ARCH.dSYM"
          for tool in plurx-control plurx-install-helper plurx-update-worker plurx-service-launch plurx-recovery; do
            cp "target/$TARGET/release/$tool" "../slice/$tool-$ARCH"
          done
          clients/server-tray/macos/build --configuration release \
            --version "$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)" \
            --output "$RUNNER_TEMP/Plurx Server.app"
          tar -C "$RUNNER_TEMP" -czf "../slice/desktop-$ARCH.tar.gz" 'Plurx Server.app'
          python3 scripts/build-macos-source-parser --output "$RUNNER_TEMP/source-parser" --jobs 3
          python3 scripts/build-macos-video-ffmpeg --output "$RUNNER_TEMP/media-package" \
            --source-parser-package "$RUNNER_TEMP/source-parser"
          tar -C "$RUNNER_TEMP/media-package" -czf "../slice/media-$ARCH.tar.gz" .
          python3 scripts/build-subtitle-engine --output "$RUNNER_TEMP/subtitle-engine" --architecture "$ARCH" --jobs 3
          # Artifact upload normalizes permissions; tar preserves the signed
          # executable's mode and the complete per-slice package directory.
          tar -C "$RUNNER_TEMP/subtitle-engine" -czf "../slice/subtitle-engine-$ARCH.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-slice-${{ matrix.arch }}
          path: slice/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  macos:
    name: macOS universal archive
    needs: [resolve, macos_build]
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode != 'qualification'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      EXPECT_VERSION: ${{ needs.resolve.outputs.expect_version }}
    steps:
      - name: Fetch the packaging tree
        run: |
          set -euo pipefail
          git init -q .
          git fetch -q --depth 1 "$REPO_URL" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-slice-*
          path: slice
          merge-multiple: true
      - name: Assemble and check the universal archive
        run: |
          set -euo pipefail
          name="plurxd-$VERSION-macos-universal"
          mkdir -p "$RUNNER_TEMP/universal/bin" dist
          for tool in plurxd plurx-control plurx-install-helper plurx-update-worker plurx-service-launch plurx-recovery; do
            lipo -create -output "$RUNNER_TEMP/universal/bin/$tool" "slice/$tool-arm64" "slice/$tool-x86_64"
            test "$(lipo -archs "$RUNNER_TEMP/universal/bin/$tool")" = "x86_64 arm64"
          done
          cp -R slice/plurxd-arm64.dSYM "$RUNNER_TEMP/plurxd.dSYM"
          lipo -create slice/plurxd-arm64.dSYM/Contents/Resources/DWARF/plurxd \
            slice/plurxd-x86_64.dSYM/Contents/Resources/DWARF/plurxd \
            -output "$RUNNER_TEMP/plurxd.dSYM/Contents/Resources/DWARF/plurxd"
          for arch in arm64 x86_64; do
            mkdir -p "slice/media-$arch" "slice/subtitle-engine-$arch" "slice/desktop-$arch"
            tar -C "slice/media-$arch" -xzf "slice/media-$arch.tar.gz"
            tar -C "slice/subtitle-engine-$arch" -xzf "slice/subtitle-engine-$arch.tar.gz"
            tar -C "slice/desktop-$arch" -xzf "slice/desktop-$arch.tar.gz"
          done
          python3 scripts/package-macos --combine-ffmpeg "$PWD/slice/media-arm64" "$PWD/slice/media-x86_64" \
            --output "$RUNNER_TEMP/universal-media"
          python3 scripts/build-subtitle-engine --output "$RUNNER_TEMP/universal-engine" \
            --combine "$PWD/slice/subtitle-engine-arm64" "$PWD/slice/subtitle-engine-x86_64"
          cp -R 'slice/desktop-arm64/Plurx Server.app' "$RUNNER_TEMP/Plurx Server.app"
          app_executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$RUNNER_TEMP/Plurx Server.app/Contents/Info.plist")
          lipo -create "slice/desktop-arm64/Plurx Server.app/Contents/MacOS/$app_executable" \
            "slice/desktop-x86_64/Plurx Server.app/Contents/MacOS/$app_executable" \
            -output "$RUNNER_TEMP/Plurx Server.app/Contents/MacOS/$app_executable"
          codesign --force --deep --sign - --options runtime "$RUNNER_TEMP/Plurx Server.app"
          python3 scripts/package-macos --daemon "$RUNNER_TEMP/universal/bin/plurxd" \
            --ffmpeg-package "$RUNNER_TEMP/universal-media" --subtitle-engine-package "$RUNNER_TEMP/universal-engine" \
            --debug-symbols "$RUNNER_TEMP/plurxd.dSYM" --desktop-app "$RUNNER_TEMP/Plurx Server.app" \
            --control-dir "$RUNNER_TEMP/universal/bin" --version "$VERSION" \
            --source-commit "${{ needs.resolve.outputs.commit }}" --output "$PWD/dist/$name"
          test "$("dist/$name/runtime/plurxd" --version)" = "$EXPECT_VERSION"
          python3 scripts/package-macos --archive "$PWD/dist/$name" --output "$PWD/dist/$name.tar.gz"
          rm -rf "dist/$name"
          ls -l dist
      - name: Validate complete archive without modifying host startup policy
        run: |
          set -euo pipefail
          name="plurxd-$VERSION-macos-universal"
          mkdir -p "$RUNNER_TEMP/archive-check"
          tar -C "$RUNNER_TEMP/archive-check" -xzf "dist/$name.tar.gz"
          package="$RUNNER_TEMP/archive-check/$name"
          test -f "$package/runtime/plurx-source-parser.wasm"
          test -x "$package/runtime/ffmpeg"
          test -x "$package/runtime/ffprobe"
          test -x "$package/control/plurx-service-launch"
          codesign --verify --strict "$package/runtime/plurxd"
          codesign --verify --deep --strict "$package/Plurx Server.app"
          # Actual login/stop/reboot and rollback are native qualification,
          # separate from archive assembly; this job does not claim them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.resolve.outputs.mode == 'release' && 'macos-candidate' || 'release-macos' }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  macos_signing:
    name: sign and notarize the macOS install archive
    needs: [resolve, macos]
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode == 'release'
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release-signing
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
      PACKAGING_COMMIT: ${{ github.sha }}
      TRUSTED_PACKAGING_COMMIT: ${{ vars.PLURX_TRUSTED_PACKAGING_COMMIT }}
    steps:
      - name: Fetch only the explicitly approved immutable packaging code
        run: |
          set -euo pipefail
          [[ "$TRUSTED_PACKAGING_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$PACKAGING_COMMIT" = "$TRUSTED_PACKAGING_COMMIT"
          git init -q trusted
          git -C trusted fetch -q --depth 1 "$REPO_URL" "$TRUSTED_PACKAGING_COMMIT"
          git -C trusted checkout -q --detach FETCH_HEAD
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_PACKAGING_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-candidate
          path: candidate
      - name: Sign every native image, notarize, staple and verify the complete archive
        env:
          CERTIFICATE_BASE64: ${{ secrets.PLURX_MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.PLURX_MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.PLURX_MACOS_NOTARY_PRIVATE_KEY }}
          SIGNING_IDENTITY: ${{ vars.PLURX_MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ vars.PLURX_MACOS_DEVELOPER_TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.PLURX_MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.PLURX_MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD NOTARY_PRIVATE_KEY SIGNING_IDENTITY TEAM_ID NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            test -n "${!name}" || { echo "::error::missing macOS release configuration: $name"; exit 1; }
          done
          credentials="$RUNNER_TEMP/macos-release-credentials"
          mkdir "$credentials"
          keychain="$credentials/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$credentials"
          }
          trap cleanup EXIT
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"macos-release-credentials","certificate.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE_BASE64"],validate=True))'
          printf '%s\n' "$NOTARY_PRIVATE_KEY" > "$credentials/notary.p8"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$credentials/certificate.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$credentials/certificate.p12"
          unset CERTIFICATE_BASE64 CERTIFICATE_PASSWORD NOTARY_PRIVATE_KEY keychain_password
          mkdir dist
          python3 trusted/scripts/sign-macos-release \
            --archive "$PWD/candidate/plurxd-$VERSION-macos-universal.tar.gz" \
            --output "$PWD/dist/plurxd-$VERSION-macos-universal.tar.gz" \
            --version "$VERSION" --source-commit "$SOURCE_COMMIT" \
            --identity "$SIGNING_IDENTITY" --team-id "$TEAM_ID" \
            --key "$credentials/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
      - name: Remove Apple credentials even after cancellation
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/macos-release-credentials/signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/macos-release-credentials"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows x64 archive
    needs: resolve
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode != 'qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      PLURX_BUILD_REF: ${{ needs.resolve.outputs.build_ref }}
      PLURX_BUILD_SHA: ${{ needs.resolve.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
    steps:
      - name: Fetch the packaging tree and the release source
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          git init -q .
          git fetch -q --depth 1 "$REPO_URL" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git init -q release-source
          git -C release-source fetch -q --depth 1 "$REPO_URL" "$COMMIT"
          git -C release-source checkout -q --detach FETCH_HEAD
      - name: Install the cross-build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -qq update
          sudo apt-get -o Acquire::Retries=3 -qq install -y --no-install-recommends clang lld llvm >/dev/null
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' release-source/rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target x86_64-pc-windows-msvc
      - uses: ./.github/actions/windows-cross
        with:
          compile-workspace: "false"
      - name: Build plurxd.exe
        working-directory: release-source
        run: cargo xwin build -p plurxd --release --locked --target x86_64-pc-windows-msvc
      - name: Assemble the Windows archive
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$PWD/release-source/target" \
          PLURX_PKG_SOURCE_ROOT="$PWD/release-source" \
            scripts/package-windows
          mkdir -p dist
          mv target/windows-package/plurxd-windows-x86_64.zip "dist/plurxd-$VERSION-windows-x86_64.zip"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  windows_smoke:
    name: Windows archive runs on Windows
    needs: [resolve, windows]
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode != 'qualification'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      EXPECT_VERSION: ${{ needs.resolve.outputs.expect_version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: dl
      - name: Run the packaged plurxd.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "dl\plurxd-$env:VERSION-windows-x86_64.zip" -DestinationPath x
          $exe = "x\plurx-windows-x86_64\plurxd.exe"
          $reported = (& $exe --version | Out-String).Trim()
          if ($reported -ne $env:EXPECT_VERSION) { throw "plurxd.exe reports '$reported', expected '$env:EXPECT_VERSION'" }
          Write-Output $reported

  desktop_metadata:
    name: validate complete desktop cohort (fixture signatures on dry runs)
    needs: [resolve, linux, macos, macos_signing, windows, windows_smoke]
    if: github.server_url == 'https://github.com' && !cancelled() && !failure() && needs.resolve.outputs.mode != 'qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No environment or secrets: candidate qualification needs no owner approval.
    env:
      MODE: ${{ needs.resolve.outputs.mode }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
      SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
      PACKAGING_COMMIT: ${{ github.sha }}
    steps:
      - name: Fetch packaging tools without any release credentials
        run: |
          set -euo pipefail
          git init -q trusted
          git -C trusted fetch -q --depth 1 "$REPO_URL" "$PACKAGING_COMMIT"
          git -C trusted checkout -q --detach FETCH_HEAD
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends rpm >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Check every platform artifact and create candidate metadata
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            "plurxd_${VERSION}-1_amd64.deb" "plurxd_${VERSION}-1_arm64.deb" \
            "plurxd-${VERSION}-1.x86_64.rpm" "plurxd-${VERSION}-1.aarch64.rpm" \
            "plurx-desktop_${VERSION}-1_amd64.deb" "plurx-desktop_${VERSION}-1_arm64.deb" \
            "plurx-desktop-${VERSION}-1.x86_64.rpm" "plurx-desktop-${VERSION}-1.aarch64.rpm" \
            "plurx-tray-${VERSION}-linux-amd64.tar.gz" "plurx-tray-${VERSION}-linux-arm64.tar.gz" \
            "plurxd-${VERSION}-macos-universal.tar.gz" "plurxd-${VERSION}-windows-x86_64.zip" \
            | LC_ALL=C sort)
          test "$(ls assets | LC_ALL=C sort)" = "$expected"
          umask 077
          key="$RUNNER_TEMP/desktop-fixture-key.pem"
          trap 'rm -f "$key"' EXIT
          mkdir candidate
          signing=()
          if [ "$MODE" = dry-run ]; then
            # Isolated fixtures are never published or installed as production trust.
            openssl genpkey -algorithm ED25519 -out "$key"
            signing=(--signing-key "$key")
          fi
          created=$(date +%s)
          python3 trusted/scripts/create-desktop-update-manifest \
            --assets "$PWD/assets" --output "$PWD/candidate/plurx-update-v1.json" \
            --version "$VERSION" --sequence "$GITHUB_RUN_NUMBER" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" --packaging-commit "$PACKAGING_COMMIT" \
            --created-unix "$created" --expires-unix "$((created + 30 * 86400))" \
            --upgrade-from ">=0.0.0, <$VERSION" --data-compatibility fixture-only \
            --cluster-compatibility fixture-only --minimum-controller 0.0.0 \
            --rollback manual_recovery --inspect-packages "${signing[@]}"
          python3 trusted/scripts/create-desktop-update-manifest --validate candidate/plurx-update-v1.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-update-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 7

  desktop_signing:
    name: validate and sign desktop release metadata
    needs: [resolve, desktop_metadata]
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode == 'release' && needs.resolve.outputs.publish_updates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers and trusted branch/tag restrictions here.
    # This environment alone owns the release signing key; no build job does.
    environment: desktop-release-signing
    env:
      MODE: ${{ needs.resolve.outputs.mode }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
      SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
      PACKAGING_COMMIT: ${{ github.sha }}
      TRUSTED_PACKAGING_COMMIT: ${{ vars.PLURX_TRUSTED_PACKAGING_COMMIT }}
    steps:
      - name: Fetch only the explicitly approved immutable packaging code
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then
            [[ "$TRUSTED_PACKAGING_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$PACKAGING_COMMIT" = "$TRUSTED_PACKAGING_COMMIT"
          else
            TRUSTED_PACKAGING_COMMIT=$PACKAGING_COMMIT
          fi
          git init -q trusted
          git -C trusted fetch -q --depth 1 "$REPO_URL" "$TRUSTED_PACKAGING_COMMIT"
          git -C trusted checkout -q --detach FETCH_HEAD
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_PACKAGING_COMMIT"
          # Read only the exact candidate's compiled-in public-root data; no
          # candidate source or binary is executed in this key-bearing job.
          git -C trusted fetch -q --depth 1 "$REPO_URL" "$SOURCE_COMMIT"
          git -C trusted show FETCH_HEAD:crates/plurx-desktop-control/production-trust-roots.json > candidate-trust-roots.json
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends rpm >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Validate complete cohort and sign exact manifest bytes
        env:
          # This secret is used in this protected job only, never in a build.
          PRODUCTION_KEY: ${{ secrets.PLURX_UPDATE_ED25519_PRIVATE_KEY }}
          UPGRADE_FROM: ${{ vars.PLURX_UPDATE_UPGRADE_FROM }}
          DATA_COMPATIBILITY: ${{ vars.PLURX_UPDATE_DATA_COMPATIBILITY }}
          CLUSTER_COMPATIBILITY: ${{ vars.PLURX_UPDATE_CLUSTER_COMPATIBILITY }}
          MINIMUM_CONTROLLER: ${{ vars.PLURX_UPDATE_MINIMUM_CONTROLLER }}
          ROLLBACK: ${{ vars.PLURX_UPDATE_ROLLBACK }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/desktop-release-key.pem"
          trap 'rm -f "$key"' EXIT
          mkdir -p signed
          if [ "$MODE" = release ]; then
            test -n "$PRODUCTION_KEY"
            test -n "$UPGRADE_FROM"
            test -n "$DATA_COMPATIBILITY"
            test -n "$CLUSTER_COMPATIBILITY"
            test -n "$MINIMUM_CONTROLLER"
            test -n "$ROLLBACK"
            printf '%s\n' "$PRODUCTION_KEY" > "$key"
          fi
          unset PRODUCTION_KEY
          created=$(date +%s)
          python3 trusted/scripts/create-desktop-update-manifest \
            --assets "$PWD/assets" --output "$PWD/signed/plurx-update-v1.json" \
            --version "$VERSION" --sequence "$GITHUB_RUN_NUMBER" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" --packaging-commit "$PACKAGING_COMMIT" \
            --created-unix "$created" --expires-unix "$((created + 30 * 86400))" \
            --upgrade-from "$UPGRADE_FROM" --data-compatibility "$DATA_COMPATIBILITY" \
            --cluster-compatibility "$CLUSTER_COMPATIBILITY" --minimum-controller "$MINIMUM_CONTROLLER" \
            --rollback "$ROLLBACK" --inspect-packages --signing-key "$key" --production \
            --trusted-roots "$PWD/trusted/crates/plurx-desktop-control/production-trust-roots.json" \
            --trusted-roots "$PWD/candidate-trust-roots.json"
          test "$(stat -c %s signed/plurx-update-v1.json.sig)" = 64
          python3 trusted/scripts/create-desktop-update-manifest --validate signed/plurx-update-v1.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-metadata
          path: signed/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release (a dry run stops at the check)
    needs: [resolve, linux, macos, macos_signing, windows, windows_smoke, desktop_metadata, desktop_signing]
    if: github.server_url == 'https://github.com' && !cancelled() && !failure() && needs.resolve.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MODE: ${{ needs.resolve.outputs.mode }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      PUBLISH_UPDATES: ${{ needs.resolve.outputs.publish_updates }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Check the asset set and compute its checksums
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            "plurxd_${VERSION}-1_amd64.deb" "plurxd_${VERSION}-1_arm64.deb" \
            "plurxd-${VERSION}-1.x86_64.rpm" "plurxd-${VERSION}-1.aarch64.rpm" \
            "plurx-desktop_${VERSION}-1_amd64.deb" "plurx-desktop_${VERSION}-1_arm64.deb" \
            "plurx-desktop-${VERSION}-1.x86_64.rpm" "plurx-desktop-${VERSION}-1.aarch64.rpm" \
            "plurx-tray-${VERSION}-linux-amd64.tar.gz" "plurx-tray-${VERSION}-linux-arm64.tar.gz" \
            "plurxd-${VERSION}-macos-universal.tar.gz" "plurxd-${VERSION}-windows-x86_64.zip" \
            | LC_ALL=C sort)
          if [ "$PUBLISH_UPDATES" = true ]; then
            expected=$(printf '%s\n' "$expected" "plurx-update-v1.json" "plurx-update-v1.json.sig" | LC_ALL=C sort)
          fi
          test "$(ls assets | LC_ALL=C sort)" = "$expected" || {
            echo "::error::unexpected asset set:"; ls -l assets; exit 1; }
          (cd assets && sha256sum $(ls | LC_ALL=C sort)) > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        if: needs.resolve.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A published release is never rebuilt over, and neither is a draft
          # a person wrote. A draft this workflow's own token left behind is
          # what an interrupted publish leaves, and is replaced.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft) \(.author.login)\"" > existing.txt
          while read -r id draft author; do
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published; delete it on GitHub to rebuild it"
              exit 1
            fi
            if [ "$author" != "github-actions[bot]" ]; then
              echo "::error::$author has a draft release for $TAG; publish or delete it on GitHub first"
              exit 1
            fi
          done < existing.txt
          while read -r id draft author; do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
            echo "replaced an interrupted draft for $TAG"
          done < existing.txt
          git init -q source
          git -C source fetch -q --depth 1 "$REPO_URL" "$COMMIT"
          git -C source checkout -q --detach FETCH_HEAD
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' source/CHANGELOG.md > notes.md
          if [ "$PUBLISH_UPDATES" = true ]; then
            printf '\n## In-app updates\n\nThis release includes authenticated update metadata for the qualified upgrade baselines.\n' >> notes.md
          else
            printf '\n## In-app updates\n\nThis release provides verified manual installers. Authenticated in-app upgrades are not advertised until upgrade qualification is complete.\n' >> notes.md
          fi
          deb="plurxd_${VERSION}-1"
          rpm="plurxd-${VERSION}-1"
          cat >> notes.md <<NOTES

          ## Install

          | Platform | Download | Install |
          |---|---|---|
          | Debian 12+, Ubuntu 24.04+ | \`${deb}_amd64.deb\`, \`${deb}_arm64.deb\` | \`sudo apt install ./${deb}_amd64.deb\` |
          | Fedora, RHEL 9+ | \`${rpm}.x86_64.rpm\`, \`${rpm}.aarch64.rpm\` | \`sudo dnf install ./${rpm}.x86_64.rpm\` |
          | macOS | \`plurxd-${VERSION}-macos-universal.tar.gz\` | unpack, then \`./install\` in the folder |
          | Windows x64 | \`plurxd-${VERSION}-windows-x86_64.zip\` | see \`README.md\` in the archive |

          The Linux packages install the \`plurxd\` systemd service and start it; open
          \`http://<host>:32400\` to create the first administrator. They need the
          distribution's ffmpeg 5.1 or newer (6.1 or newer for the paced-stream burst;
          RHEL and its rebuilds take it from RPM Fusion, which needs EPEL).
          The optional \`plurx-desktop\` package adds the Linux tray/control window;
          install it beside the same version of \`plurxd\` on a local GUI host.
          \`plurx-update-v1.json\` and its raw Ed25519 \`.sig\` bind native update cohorts.
          \`SHA256SUMS\` lists the checksum of every file.
          NOTES
          # Only the highest release tag is "latest", so back-filling an older
          # tag never displaces the current release.
          highest=$(git ls-remote --tags --refs "$REPO_URL" 'refs/tags/v*' \
            | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -1)
          latest=false
          [ "$highest" = "$VERSION" ] && latest=true
          # gh uploads every asset to a draft and publishes it only once all
          # of them are attached.
          gh release create "$TAG" assets/* SHA256SUMS --verify-tag \
            --title "noirr cinema $TAG" --notes-file notes.md --latest="$latest"
          echo "published $TAG (latest: $latest)"

  desktop_qualification:
    name: qualify existing exact-candidate native artifacts
    needs: resolve
    if: github.server_url == 'https://github.com' && needs.resolve.outputs.mode == 'qualification'
    uses: ./.github/workflows/desktop-qualification.yml
    with:
      candidate_run_id: ${{ inputs.desktop_qualification_build_run_id }}
      candidate_sha: ${{ github.sha }}
      run_local_fixture_updates: true
