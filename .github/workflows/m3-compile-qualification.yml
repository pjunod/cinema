name: M3 Linux compile qualification
on:
  workflow_dispatch:
jobs:
  rust_compile:
    name: effort Rust compile
    # Use the same compiler pool and cold-build budget as main-fast-lane.
    runs-on: [self-hosted, Linux, ARM64, lab, rust-arm64-canary]
    container: ubuntu:24.04
    timeout-minutes: 60
    # Bound Cargo before parallel working sets reach the runner's memory cap.
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Identify native compiler host
        run: uname -a
      - name: Install Rust gate prerequisites
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl git libssl-dev lld llvm \
            libgtk-4-dev libdbus-1-dev make nasm ninja-build xz-utils pkg-config python3
          # Forgejo needs Node before checkout; use the patched upstream build.
          case "$(dpkg --print-architecture)" in
            amd64)
              node_arch=x64
              node_sha=1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce
              ;;
            arm64)
              node_arch=arm64
              node_sha=6287aa46b6c375d816e63ae66d024fbbfd70404825aabdfdf898a970871d2f4b
              ;;
            *) echo "Unsupported Node architecture" >&2; exit 1 ;;
          esac
          node_tmp="$(mktemp -d)"
          trap 'rm -rf "$node_tmp"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-${node_arch}.tar.xz" \
            -o "$node_tmp/node.tar.xz"
          echo "$node_sha  $node_tmp/node.tar.xz" | sha256sum --check --strict
          tar -xJf "$node_tmp/node.tar.xz" -C /usr/local --strip-components=1 --no-same-owner
          node --version | grep -Fx 'v22.23.4'
      - name: Check out the candidate
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Restore the effort Rust cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: effort-rust
      - name: Compile every Rust target without executing tests
        run: |
          make effort-rust-check
          make hiqlite-vendor-clippy
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"
