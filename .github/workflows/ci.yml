name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Task pull requests aimed at effort/** use effort-ci.yml's compile-only
  # development gate. A final effort/** -> main pull request lands here and
  # deliberately expands to the complete fan-out below.
  pull_request:
    branches: [main]
  # Queue support remains available for a future plan upgrade. Every
  # merge_group event fails open into the full cross-surface fan-out, and the
  # aggregate gate reports on both PR and queue events so enabling a queue
  # later will not strand its required check.
  merge_group:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A later main push contains every earlier main push, so one exhaustive
  # post-merge run is enough. Tags and merge groups remain immutable evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # Resolve the PR diff once. Expensive jobs consume these outputs in parallel;
  # merge groups, pushes, and tags deliberately enable every surface.
  scope:
    name: validation scope
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      apple: ${{ steps.scope.outputs.apple }}
      android_jvm: ${{ steps.scope.outputs.android_jvm }}
      android_device: ${{ steps.scope.outputs.android_device }}
      web_layout: ${{ steps.scope.outputs.web_layout }}
      release_build: ${{ steps.scope.outputs.release_build }}
      container: ${{ steps.scope.outputs.container }}
      mobile_version: ${{ steps.scope.outputs.mobile_version }}
      hiqlite_spike: ${{ steps.scope.outputs.hiqlite_spike }}
      cluster_auth: ${{ steps.scope.outputs.cluster_auth }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      qualification: ${{ steps.scope.outputs.qualification }}
      execution_mode: ${{ steps.execution_mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected CI surfaces
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          scope_event="$EVENT_NAME"
          qualification=false
          if [ "$EVENT_NAME" = pull_request ] \
            && [ "$BASE_REF" = main ]; then
            case "$HEAD_REF" in
              effort/*)
                scope_event=effort_qualification
                qualification=true
                ;;
            esac
          fi
          python3 -m validation.ci_scope \
            --event "$scope_event" --base "$VALIDATION_BASE" >> "$GITHUB_OUTPUT"
          echo "qualification=$qualification" >> "$GITHUB_OUTPUT"
      - name: Validate the configured runner mode
        env:
          CI_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE || 'self-hosted' }}
        run: |
          case "$CI_RUNNER_MODE" in
            self-hosted|github) ;;
            *) echo "::error::CI_RUNNER_MODE must be self-hosted or github"; exit 1 ;;
          esac
      - name: Resolve the fail-safe execution rollout mode
        id: execution_mode
        env:
          REQUESTED_MODE: ${{ vars.CI_EXECUTION_MODE || 'legacy' }}
        run: |
          mode="$(scripts/ci-execution-mode resolve "$REQUESTED_MODE")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # A stale counter must fail the aggregate gate without hiding the native test
  # result. Run release hygiene beside preflight and the affected platform jobs
  # rather than making it their prerequisite.
  mobile_version:
    name: mobile release version
    needs: scope
    if: needs.scope.outputs.mobile_version == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The recorded base sha is the target tip at event time, not now. Two
      # branches that write the same build counter auto-merge with no conflict
      # and no BEHIND signal in this job, so a branch bumped to N stays green
      # forever once an unrelated release bump lands N on the target. Re-fetch
      # the target here so the counter is compared against what the target
      # actually ships, while the recorded base still scopes which release
      # inputs this branch touched.
      - name: Resolve the current merge target
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --force origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          echo "MERGE_TARGET=origin/$BASE_REF" >> "$GITHUB_ENV"
      - name: Check mobile release hygiene
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$VALIDATION_BASE" ] \
            && git cat-file -e "$VALIDATION_BASE^{commit}" 2>/dev/null; then
            PLURX_VALIDATION_MODE=changed-from \
              PLURX_VALIDATION_BASE="$VALIDATION_BASE" \
              PLURX_VALIDATION_MERGE_TARGET="$MERGE_TARGET" \
              python3 -m validation.mobile_versions
          else
            python3 -m validation.mobile_versions
          fi

  # The failure history says policy mistakes are both common and cheap to
  # detect. Run the structural contracts before provisioning Rust, browsers,
  # simulators, emulators, cross compilers, or Docker builds, and make every
  # expensive fan-out job in this workflow depend on this result.
  preflight:
    name: fast policy and contract preflight
    needs: scope
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit corrective-history evidence
        run: make history-check
      - name: Check validation catalog and contract unit tests
        run: |
          make validation-lint
          python3 -m unittest discover -s tests/validation -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check CI, deploy, and shipping contracts
        run: make operations-check
      - name: Record the documentation-only lane
        if: needs.scope.outputs.docs_only == 'true'
        run: echo "Documentation-only diff; runtime and compiler surfaces are skipped."

  check:
    name: fast Rust gate
    needs: [scope, preflight]
    # Kotlin and Swift diffs compile nothing under crates/, so the cargo lane
    # only runs when the diff can reach it; qualification and queue runs force
    # the complete fan-out.
    if: needs.scope.outputs.rust == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general","high-cpu"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: rust-gate
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
      - name: Run format, Clippy, unit, and SQLite contracts
        run: make ci-rust-gate
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  cluster_store_legacy:
    name: replicated Store contracts (legacy)
    needs: [scope, preflight]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' &&
      needs.scope.outputs.execution_mode != 'accelerated'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","ci-store"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-store-legacy
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
          persistent-eligible: "true"
      - name: Run replicated Store contracts
        id: store_contracts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/validation
          make cluster-store-check 2>&1 | tee target/validation/cluster-store.log
      - name: Record the Store lane result
        if: always()
        env:
          LANE_RESULT: ${{ steps.store_contracts.outcome }}
        run: >-
          python3 -m validation.ci_lane_receipt
          --output target/validation/cluster-store-receipt.json
          --log target/validation/cluster-store.log
          --lane cluster-store-legacy
          --result "$LANE_RESULT"
          --command "make cluster-store-check"
      - name: Retain the Store lane log and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-store-legacy-contracts
          path: |
            target/validation/cluster-store.log
            target/validation/cluster-store-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the Store contract result
        if: always() && steps.store_contracts.outcome != 'success'
        run: exit 1

  cluster_store_shards:
    name: required replicated Store shard graph
    needs: [scope, preflight]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' &&
      needs.scope.outputs.execution_mode == 'accelerated'
    uses: ./.github/workflows/store-shards.yml
    with:
      execution-mode: accelerated

  # Shadow evidence is deliberately absent from every required job's `needs`
  # graph. An offline experimental runner can leave this call queued without
  # delaying the legacy Store verdict or Main promotion gate.
  cluster_store_shadow:
    name: non-blocking replicated Store shard shadow
    needs: [scope, preflight]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' &&
      needs.scope.outputs.execution_mode == 'shadow'
    uses: ./.github/workflows/store-shards.yml
    with:
      execution-mode: shadow

  cluster_store:
    name: replicated Store contracts
    needs:
      - scope
      - preflight
      - cluster_store_legacy
      - cluster_store_shards
    if: always() && needs.scope.outputs.cluster_auth == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    timeout-minutes: 2
    steps:
      - name: Select the required Store graph
        env:
          EXECUTION_MODE: ${{ needs.scope.outputs.execution_mode }}
          LEGACY_RESULT: ${{ needs.cluster_store_legacy.result }}
          SHARD_RESULT: ${{ needs.cluster_store_shards.result }}
        run: |
          case "$EXECUTION_MODE" in
            legacy)
              test "$LEGACY_RESULT" = success
              test "$SHARD_RESULT" = skipped
              ;;
            shadow)
              test "$LEGACY_RESULT" = success
              test "$SHARD_RESULT" = skipped
              echo "Store shadow evidence is intentionally outside this gate"
              ;;
            accelerated)
              test "$LEGACY_RESULT" = skipped
              test "$SHARD_RESULT" = success
              ;;
            *)
              echo "::error::Unknown resolved execution mode: $EXECUTION_MODE"
              exit 1
              ;;
          esac

  cluster_topology:
    name: replicated topology contracts
    needs: [scope, preflight]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' ||
      needs.scope.outputs.hiqlite_spike == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","ci-topology"]') }}
    # A cold runner builds the command-profile dependency graph before the
    # three-voter proof. Persistent non-voter caches shorten later runs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Resolve pinned Rust executables for the long contract run
        run: |
          cargo_bin="$(rustup which --toolchain 1.97.1 cargo)"
          rustc_bin="$(rustup which --toolchain 1.97.1 rustc)"
          printf 'CARGO=%s\nRUSTC=%s\n' "$cargo_bin" "$rustc_bin" >> "$GITHUB_ENV"
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-topology
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
          persistent-eligible: "true"
      - name: Run replicated topology contracts
        id: topology_contracts
        continue-on-error: true
        shell: bash
        env:
          RUN_CLUSTER_AUTH: ${{ needs.scope.outputs.cluster_auth }}
          RUN_HIQLITE_SPIKE: ${{ needs.scope.outputs.hiqlite_spike }}
        run: |
          set -euo pipefail
          mkdir -p target/validation
          {
            if [ "$RUN_CLUSTER_AUTH" = true ]; then
              make cluster-harness-check
            fi
            if [ "$RUN_HIQLITE_SPIKE" = true ]; then
              cargo clippy --locked --manifest-path spikes/hiqlite-m0/Cargo.toml \
                --tests --no-deps -- -D warnings
              make hiqlite-spike
            fi
          } 2>&1 | tee target/validation/cluster-topology.log
      - name: Record the topology lane result
        if: always()
        shell: bash
        env:
          LANE_RESULT: ${{ steps.topology_contracts.outcome }}
          RUN_CLUSTER_AUTH: ${{ needs.scope.outputs.cluster_auth }}
          RUN_HIQLITE_SPIKE: ${{ needs.scope.outputs.hiqlite_spike }}
        run: |
          set -euo pipefail
          receipt=(
            python3 -m validation.ci_lane_receipt
            --output target/validation/cluster-topology-receipt.json
            --log target/validation/cluster-topology.log
            --lane cluster-topology
            --result "$LANE_RESULT"
          )
          if [ "$RUN_CLUSTER_AUTH" = true ]; then
            receipt+=(--command "make cluster-harness-check")
          fi
          if [ "$RUN_HIQLITE_SPIKE" = true ]; then
            receipt+=(
              --command "cargo clippy --locked --manifest-path spikes/hiqlite-m0/Cargo.toml --tests --no-deps -- -D warnings"
              --command "make hiqlite-spike"
            )
          fi
          "${receipt[@]}"
      - name: Retain the topology lane log and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-topology-contracts
          path: |
            target/validation/cluster-topology.log
            target/validation/cluster-topology-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain deterministic topology evidence
        if: always() && needs.scope.outputs.cluster_auth == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cluster-topology-semantic
          path: target/validation/cluster-topology-semantic.json
          if-no-files-found: error
          retention-days: 1
      - name: Retain deterministic failure-drill evidence
        if: always() && needs.scope.outputs.cluster_auth == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cluster-failure-drills
          path: target/validation/cluster-failure-drills.json
          if-no-files-found: error
          retention-days: 1
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the topology contract result
        if: always() && steps.topology_contracts.outcome != 'success'
        run: exit 1

  cluster_wal:
    name: replicated WAL recovery contracts
    needs: [scope, preflight]
    if: needs.scope.outputs.cluster_auth == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general","high-cpu"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-wal
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
      - name: Run exact Hiqlite and WAL recovery regressions
        run: make cluster-wal-check
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  cluster_daemon:
    name: cluster daemon contracts
    needs: [scope, preflight]
    if: needs.scope.outputs.cluster_auth == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general","high-cpu","ffmpeg-6"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-daemon
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Verify the cluster fixture generator
        run: |
          command -v ffmpeg
          ffmpeg -version
      - name: Run real-daemon activation and activity contracts
        run: make cluster-daemon-check
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  web_layout:
    name: web layout and accessibility
    needs: [scope, preflight]
    if: needs.scope.outputs.web_layout == 'true'
    # Pinned for the same reason as `check`: a browser sweep still plays media
    # through ffmpeg. See .github/actions/ffmpeg.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general","ffmpeg-6"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: web-layout
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
      # Pinned so the browser-bundle cache key below is meaningful; bump both
      # together. A cache hit skips the ~150 MB Chromium download every run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - uses: ./.github/actions/playwright
        with:
          version: "1.62.0"
      - name: Check every affected web layout
        run: make ui-check
      # Cheap (one page, no server, no media) and it covers the one thing the
      # Node web tests structurally cannot: that the shipped reporter actually
      # runs in a browser.
      - name: Run the playback-control reporter in a real browser
        run: make control-browser-check
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  vod_web:
    name: film-addressed VOD browser acceptance
    needs: [scope, preflight]
    if: needs.scope.outputs.web_layout == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general","ffmpeg-6"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: vod-web
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - uses: ./.github/actions/playwright
        with:
          version: "1.62.0"
      - name: Build the exact server under test
        run: cargo build --locked -p plurxd
      - name: Run VOD browser acceptance
        run: |
          mkdir -p target/playback-lab/acceptance
          chrome="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          scripts/playback-lab run --suite vod --case suspend-resume --browser chrome \
            --chrome "$chrome" --json target/playback-lab/acceptance/vod.json
          # Steady, seek-storm, and stall-recovery are intentionally out of CI.
          # See docs/VOD-STEADY-ACCEPTANCE-HANDOFF.md,
          # docs/VOD-SEEK-STORM-ACCEPTANCE-HANDOFF.md, and
          # docs/VOD-STALL-ACCEPTANCE-HANDOFF.md for restoration prompts.
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  android_jvm:
    name: Android JVM tests and lint
    needs: [scope, preflight]
    if: needs.scope.outputs.android_jvm == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","android-kvm"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The toolchain image only changes when its Dockerfile does, yet both
      # Android jobs used to rebuild it from scratch — cmdline-tools plus four
      # sdkmanager downloads — on every run. Keyed on the Dockerfile hash, a
      # pull replaces the rebuild; any failure falls back to the local build.
      - name: Reuse the pinned Android toolchain image from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}/android-build:$(sha256sum clients/android/Dockerfile | cut -c1-16)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull "$tag"; then
            docker tag "$tag" plurx-android-build
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          else
            make android-image \
              && docker tag plurx-android-build "$tag" \
              && docker push "$tag" || true
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          fi
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            clients/android/.gradle-validation/caches
            clients/android/.gradle-validation/wrapper
          key: gradle-${{ hashFiles('clients/android/build.gradle.kts', 'clients/android/settings.gradle.kts', 'clients/android/app/build.gradle.kts', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Run unit tests and lint in the pinned Android toolchain
        run: |
          mkdir -p target/validation/buildx
          BUILDX_CONFIG=target/validation/buildx make android-test

  apple:
    name: Apple iOS + tvOS tests
    needs: [scope, preflight]
    if: needs.scope.outputs.apple == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["macos-26"]' || '["self-hosted","macOS","ARM64","lab","apple","xcode-26"]') }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ vars.CI_RUNNER_MODE == 'github' && '/Applications/Xcode_26.6.app/Contents/Developer' || '/Applications/Xcode.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen on the disposable GitHub runner
        if: vars.CI_RUNNER_MODE == 'github'
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
      - name: Verify the pinned Apple toolchain
        run: |
          xcode_version="$(xcodebuild -version)"
          grep -Fxq "Xcode 26.6" <<< "$xcode_version"
          grep -Fxq "Build version 17F113" <<< "$xcode_version"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.5"
          test "$(xcrun --sdk appletvos --show-sdk-version)" = "26.5"
          test "$(xcodegen --version)" = "Version: 2.46.0"
          simulator_runtimes="$(xcrun simctl list runtimes)"
          grep -Fq "iOS 26.5 (26.5 - 23F77)" <<< "$simulator_runtimes"
          grep -Fq "tvOS 26.5 (26.5 - 23L470)" <<< "$simulator_runtimes"
      # Warm Swift incrementals: the Makefile builds into
      # clients/apple/build/DerivedData precisely so this cache can restore it.
      # restore-keys accepts the newest prior entry when sources moved — an
      # incremental rebuild from a near miss still beats a cold compile, and a
      # poisoned cache only ever costs the rebuild we paid before caching.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: clients/apple/build/DerivedData
          key: apple-dd-${{ hashFiles('clients/apple/project.yml') }}-${{ hashFiles('clients/apple/Sources/**', 'clients/apple/Tests/**') }}
          restore-keys: |
            apple-dd-${{ hashFiles('clients/apple/project.yml') }}-
            apple-dd-
      - name: Create isolated iPhone, iPad, and Apple TV simulators
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ios_id=$(xcrun simctl create \
            "plurx CI iPhone ${suffix}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "APPLE_IOS_SIM=platform=iOS Simulator,id=$ios_id" >> "$GITHUB_ENV"
          ipad_id=$(xcrun simctl create \
            "plurx CI iPad ${suffix}" \
            com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "APPLE_IPAD_SIM=platform=iOS Simulator,id=$ipad_id" >> "$GITHUB_ENV"
          tvos_id=$(xcrun simctl create \
            "plurx CI Apple TV ${suffix}" \
            com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K \
            com.apple.CoreSimulator.SimRuntime.tvOS-26-5)
          echo "APPLE_TVOS_SIM=platform=tvOS Simulator,id=$tvos_id" >> "$GITHUB_ENV"
      - name: Run the shared XCTest suite on iPhone, iPad, and Apple TV
        run: make apple-test
      - name: Delete the run's simulators
        if: always()
        run: |
          for destination in "${APPLE_IOS_SIM:-}" "${APPLE_IPAD_SIM:-}" "${APPLE_TVOS_SIM:-}"; do
            udid="${destination##*,id=}"
            if [ -n "$destination" ] && [ "$udid" != "$destination" ]; then
              xcrun simctl delete "$udid" || true
            fi
          done

  android_device:
    name: Android instrumented UI tests
    needs: [scope, preflight]
    if: needs.scope.outputs.android_device == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","android-kvm"]') }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Isolate the Android SDK from the repository checkout
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
      - name: Provision or verify emulator acceleration
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Reuse the pinned Android toolchain image from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}/android-build:$(sha256sum clients/android/Dockerfile | cut -c1-16)"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull "$tag"; then
            docker tag "$tag" plurx-android-build
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          else
            make android-image \
              && docker tag plurx-android-build "$tag" \
              && docker push "$tag" || true
            echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
          fi
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            clients/android/.gradle-validation/caches
            clients/android/.gradle-validation/wrapper
          key: gradle-${{ hashFiles('clients/android/build.gradle.kts', 'clients/android/settings.gradle.kts', 'clients/android/app/build.gradle.kts', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build app and instrumentation APKs in the pinned toolchain
        run: make android-instrumentation-build
      - name: Run the Compose and TV focus suite on a disposable emulator
        id: android_instrumentation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Google's Android TV repository publishes API 36 for both x86 and
          # x86_64 (and none for API 35). The x86_64 guest hangs its QEMU CPU
          # threads under nested KVM on the lab runners; the x86 guest keeps
          # the same TV/API contract without that broken boot path.
          api-level: 36
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p target/validation
            touch target/validation/android-instrumentation-started
            PLURX_ANDROID_SERIAL="emulator-${EMULATOR_PORT}" make android-instrumentation-run
      - name: Freeze whether the first instrumentation script started
        id: android_instrumentation_first_attempt
        if: always()
        run: |
          if [[ -f target/validation/android-instrumentation-started ]]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Retry a pre-test emulator boot failure once
        if: steps.android_instrumentation.outcome == 'failure' && steps.android_instrumentation_first_attempt.outputs.started == 'false'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The upstream action checks boot completion and then sends one
          # unretied unlock command. API 36 can briefly reconnect ADB between
          # those commands. Retry the disposable AVD only when our script never
          # started; an instrumentation failure is never retried or hidden.
          api-level: 36
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p target/validation
            touch target/validation/android-instrumentation-started
            PLURX_ANDROID_SERIAL="emulator-${EMULATOR_PORT}" make android-instrumentation-run
      - name: Propagate an instrumented-test failure without retrying it
        if: steps.android_instrumentation.outcome == 'failure' && steps.android_instrumentation_first_attempt.outputs.started == 'true'
        run: exit 1
      - name: Upload Android test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            clients/android/app/build/reports/androidTests
            clients/android/app/build/outputs/androidTest-results
            target/validation/android-instrumentation.txt
          if-no-files-found: warn
          retention-days: 1

  coverage:
    name: coverage
    # Same fast unit and SQLite-contract suite as `check`, so the same pinned
    # ffmpeg. See .github/actions/ffmpeg.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general","high-cpu","ffmpeg-6"]') }}
    needs: [scope, check]
    timeout-minutes: 30
    # PR coverage was a second run of the Rust suite whose result was discarded;
    # the badge is published only from the merged main branch.
    if: github.ref == 'refs/heads/main'
    # Private-repository coverage badge — no codecov.io account or token.
    # Measure the runner-neutral fast lane and force-push both the endpoint JSON
    # and a directly renderable SVG to an orphan `badges` branch. The README
    # loads the SVG through github.com so authorized private-repo viewers work;
    # shields.io cannot read a private raw.githubusercontent.com branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: coverage
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Instrumented or not, this runs the same suite as the check job, so it
      # needs the same ffmpeg.
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Measure line coverage
        # Tests intentionally terminate helper processes. A helper can leave one
        # truncated .profraw behind even though the suite and every other profile
        # completed; merge the valid profiles, but still fail if none are valid.
        run: >-
          cargo llvm-cov --workspace --locked --exclude plurx-cluster-check
          --summary-only --json --output-path cov.json --failure-mode all
      - name: Build the unit coverage badges
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent' cov.json)
          msg=$(printf '%.1f' "$pct"); int=${msg%.*}
          if   [ "$int" -ge 90 ]; then color=brightgreen; fill='#4c1'
          elif [ "$int" -ge 75 ]; then color=green;       fill='#97ca00'
          elif [ "$int" -ge 55 ]; then color=yellowgreen; fill='#a4a61d'
          elif [ "$int" -ge 40 ]; then color=yellow;      fill='#dfb317'
          elif [ "$int" -ge 20 ]; then color=orange;      fill='#fe7d37'
          else color=red; fill='#e05d44'; fi
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"unit coverage","message":"%s%%","color":"%s"}\n' "$msg" "$color" > badge/coverage.json
          cat > badge/coverage.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="142" height="20" role="img" aria-label="unit coverage: ${msg}%">
            <title>unit coverage: ${msg}%</title>
            <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
            <clipPath id="r"><rect width="142" height="20" rx="3" fill="#fff"/></clipPath>
            <g clip-path="url(#r)"><rect width="91" height="20" fill="#555"/><rect x="91" width="51" height="20" fill="$fill"/><rect width="142" height="20" fill="url(#s)"/></g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11"><text x="45.5" y="15" fill="#010101" fill-opacity=".3">unit coverage</text><text x="45.5" y="14">unit coverage</text><text x="116.5" y="15" fill="#010101" fill-opacity=".3">${msg}%</text><text x="116.5" y="14">${msg}%</text></g>
          </svg>
          SVG
          cat badge/coverage.json
      - name: Publish badge to the `badges` branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badge
          git init -q
          git checkout -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json coverage.svg
          git commit -q -m "coverage badge"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

  package_smoke:
    name: package and smoke (${{ matrix.arch }})
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general","high-cpu"]') }}
    needs: [scope, preflight]
    if: needs.scope.outputs.release_build == 'true' || needs.scope.outputs.container == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - id: buildx-cache
        uses: ./.github/actions/buildx-cache
        with:
          lane: package-smoke-${{ matrix.arch }}
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
      - name: Derive the binary-only Bookworm build
        run: >-
          python3 -m validation.release_dockerfile --binary-export
          Dockerfile Dockerfile.binaries
      - name: Compile and export the exact candidate binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.binaries
          target: release-binaries
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=binary-export
          build-args: |
            PLURX_BUILD_REF=${{ github.sha }}
            PLURX_BUILD_SHA=${{ github.sha }}
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,scope=package-compile-{0}', matrix.arch) || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,mode=max,scope=package-compile-{0}', matrix.arch) || '' }}
      - name: Bind the binary set to this candidate tree
        run: |
          scripts/release-package-candidate \
            . . binary-export release-bin \
            "${{ matrix.target }}" "$GITHUB_SHA" "$GITHUB_SHA"
          for name in plurxd plurx-cluster-check; do
            max_glibc=$(readelf --version-info "release-bin/$name" \
              | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
              | sort -V | tail -1)
            test -n "$max_glibc"
            test "$(printf '%s\n' "$max_glibc" 2.36 | sort -V | tail -1)" = 2.36 || {
              echo "::error::${{ matrix.arch }} $name requires GLIBC_$max_glibc; Bookworm provides 2.36"
              exit 1
            }
          done
      - name: Build the runtime from only the verified binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: false
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: plurx/plurxd:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            tv.plurx.build-ref=${{ github.sha }}
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,scope=package-runtime-{0}', matrix.arch) || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,mode=min,scope=package-runtime-{0}', matrix.arch) || '' }}
      - name: Verify architecture, identity, and stop/start runtime
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: plurx/plurxd:ci-${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/$ARCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test "$(docker run --rm --platform "linux/$ARCH" "$IMAGE" --version)" = "plurxd $version ($GITHUB_SHA)"
          test "$(docker run --rm --platform "linux/$ARCH" \
            --entrypoint /usr/local/bin/plurx-cluster-check \
            "$IMAGE" build-identity)" = "$GITHUB_SHA"
          scripts/container-smoke "$IMAGE"
      - name: Retain the exact package receipt
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-receipt-${{ matrix.arch }}
          path: |
            release-bin/build-manifest.json
            release-bin/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain candidate binaries for push, tag, and qualification runs
        if: github.event_name == 'push' || needs.scope.outputs.qualification == 'true'
        continue-on-error: ${{ needs.scope.outputs.qualification != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-binaries-${{ matrix.arch }}
          path: |
            release-bin/plurxd
            release-bin/plurx-cluster-check
            release-bin/build-manifest.json
            release-bin/*.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Bound persistent BuildKit state
        if: always() && steps.buildx-cache.outputs.local == 'true'
        env:
          BUILDER_NAME: ${{ steps.buildx-cache.outputs.builder-name }}
        run: scripts/ci-buildkit-prune "$BUILDER_NAME" 50

  # This is native Linux evidence from a dedicated ARM64 VM, never an emulator
  # and never a required dependency. The label remains unassigned until the VM
  # is provisioned without overlapping the host's macOS/Xcode runner.
  native_arm_shadow:
    name: native Linux ARM64 package shadow
    needs: [scope, preflight]
    if: >-
      needs.scope.outputs.execution_mode != 'legacy' &&
      (needs.scope.outputs.release_build == 'true' ||
      needs.scope.outputs.container == 'true')
    runs-on: [self-hosted, Linux, ARM64, lab, ci-arm64-shadow]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove the runner and Docker engine are native Linux ARM64
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = Linux/aarch64
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = linux/aarch64
      - id: buildx-cache
        uses: ./.github/actions/buildx-cache
        with:
          lane: native-arm-shadow
          execution-mode: ${{ needs.scope.outputs.execution_mode }}
          persistent-eligible: "true"
      - name: Derive the binary-only Bookworm build
        run: >-
          python3 -m validation.release_dockerfile --binary-export
          Dockerfile Dockerfile.binaries
      - name: Compile and export the exact native ARM64 binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.binaries
          target: release-binaries
          platforms: linux/arm64
          outputs: type=local,dest=binary-export
          build-args: |
            PLURX_BUILD_REF=${{ github.sha }}
            PLURX_BUILD_SHA=${{ github.sha }}
      - name: Bind the native binary set to this candidate tree
        run: |
          set -euo pipefail
          scripts/release-package-candidate \
            . . binary-export release-bin \
            aarch64-unknown-linux-gnu "$GITHUB_SHA" "$GITHUB_SHA"
          for name in plurxd plurx-cluster-check; do
            max_glibc=$(readelf --version-info "release-bin/$name" \
              | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
              | sort -V | tail -1)
            test -n "$max_glibc"
            test "$(printf '%s\n' "$max_glibc" 2.36 | sort -V | tail -1)" = 2.36
          done
      - name: Build the native runtime from only the verified binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: false
          load: true
          platforms: linux/arm64
          tags: plurx/plurxd:ci-native-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            tv.plurx.build-ref=${{ github.sha }}
      - name: Verify native architecture, identity, and stop/start runtime
        env:
          IMAGE: plurx/plurxd:ci-native-arm64
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/arm64
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test "$(docker run --rm "$IMAGE" --version)" = "plurxd $version ($GITHUB_SHA)"
          test "$(docker run --rm \
            --entrypoint /usr/local/bin/plurx-cluster-check \
            "$IMAGE" build-identity)" = "$GITHUB_SHA"
          scripts/container-smoke "$IMAGE"
      - name: Retain the native ARM64 package receipt
        uses: actions/upload-artifact@v4
        with:
          name: native-arm64-shadow-receipt
          path: |
            release-bin/build-manifest.json
            release-bin/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Bound persistent BuildKit state
        if: always() && steps.buildx-cache.outputs.local == 'true'
        env:
          BUILDER_NAME: ${{ steps.buildx-cache.outputs.builder-name }}
        run: scripts/ci-buildkit-prune "$BUILDER_NAME" 50

  # CD validates the tag in this workflow, then delegates artifact construction,
  # per-platform smoke, and alias publication to the manually recoverable release
  # workflow. A cancelled tag run can therefore be recovered without moving it.
  publish:
    name: publish image (ghcr)
    needs: [check, package_smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-release.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  # Configure this as the single required check for main-bound PRs and the
  # merge queue when repository protections become available. Until then it is
  # the documented "pretty please" promotion verdict.
  # A conditional job is valid when it either passed or was skipped because
  # its surface was unaffected; on merge_group events nothing is skipped, so
  # a green queue run is the full cross-surface fan-out.
  pr_gate:
    name: Main promotion gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - scope
      - mobile_version
      - preflight
      - check
      - cluster_store
      - cluster_topology
      - cluster_wal
      - cluster_daemon
      - web_layout
      - vod_web
      - android_jvm
      - apple
      - android_device
      - package_smoke
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    timeout-minutes: 2
    steps:
      - name: Require every selected job to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MOBILE_VERSION_RESULT: ${{ needs.mobile_version.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CLUSTER_STORE_RESULT: ${{ needs.cluster_store.result }}
          CLUSTER_TOPOLOGY_RESULT: ${{ needs.cluster_topology.result }}
          CLUSTER_WAL_RESULT: ${{ needs.cluster_wal.result }}
          CLUSTER_DAEMON_RESULT: ${{ needs.cluster_daemon.result }}
          WEB_LAYOUT_RESULT: ${{ needs.web_layout.result }}
          VOD_WEB_RESULT: ${{ needs.vod_web.result }}
          ANDROID_JVM_RESULT: ${{ needs.android_jvm.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          ANDROID_DEVICE_RESULT: ${{ needs.android_device.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package_smoke.result }}
        run: |
          for result in \
            "$SCOPE_RESULT" "$MOBILE_VERSION_RESULT" \
            "$PREFLIGHT_RESULT" "$CHECK_RESULT" \
            "$CLUSTER_STORE_RESULT" "$CLUSTER_TOPOLOGY_RESULT" \
            "$CLUSTER_WAL_RESULT" \
            "$CLUSTER_DAEMON_RESULT" \
            "$WEB_LAYOUT_RESULT" "$VOD_WEB_RESULT" \
            "$ANDROID_JVM_RESULT" "$APPLE_RESULT" "$ANDROID_DEVICE_RESULT" \
            "$PACKAGE_SMOKE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A selected validation job ended with: $result"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v4
        if: needs.scope.outputs.qualification == 'true'
        with:
          fetch-depth: 0
      - name: Write the exact-tree effort qualification record
        if: needs.scope.outputs.qualification == 'true'
        env:
          PLURX_PULL_REQUEST: ${{ github.event.pull_request.number }}
          PLURX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLURX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLURX_QUALIFICATION_RESULTS: >-
            {"scope":"${{ needs.scope.result }}","mobile_version":"${{ needs.mobile_version.result }}","preflight":"${{ needs.preflight.result }}","rust":"${{ needs.check.result }}","cluster_store":"${{ needs.cluster_store.result }}","cluster_topology":"${{ needs.cluster_topology.result }}","cluster_wal":"${{ needs.cluster_wal.result }}","cluster_daemon":"${{ needs.cluster_daemon.result }}","web_layout":"${{ needs.web_layout.result }}","vod_web":"${{ needs.vod_web.result }}","android_jvm":"${{ needs.android_jvm.result }}","apple":"${{ needs.apple.result }}","android_device":"${{ needs.android_device.result }}","package_smoke":"${{ needs.package_smoke.result }}"}
        run: >-
          python3 -m validation.qualification
          --output target/validation/qualification-receipt.json
      - name: Retain the effort qualification record
        if: needs.scope.outputs.qualification == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: effort-qualification-${{ github.event.pull_request.number }}
          path: target/validation/qualification-receipt.json
          if-no-files-found: error
          retention-days: 14
