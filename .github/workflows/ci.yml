name: Qualify bounded topology slot
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: Select full topology and transport checks
    runs-on: [self-hosted, Linux, X64, lab, general]
    outputs:
      cluster_auth: ${{ steps.select.outputs.enabled }}
      hiqlite_spike: ${{ steps.select.outputs.enabled }}
    steps:
      - id: select
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

  cluster_topology:
    name: replicated topology contracts
    needs: [scope]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' ||
      needs.scope.outputs.hiqlite_spike == 'true'
    runs-on: [self-hosted, Linux, X64, lab, incus, ci-store, android-kvm]
    # A cold runner builds the command-profile dependency graph before the
    # three-voter proof. Persistent non-voter caches shorten later runs.
    timeout-minutes: 40
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy
      - name: Resolve pinned Rust executables for the long contract run
        run: |
          cargo_bin="$(rustup which --toolchain 1.97.1 cargo)"
          rustc_bin="$(rustup which --toolchain 1.97.1 rustc)"
          printf 'CARGO=%s\nRUSTC=%s\n' "$cargo_bin" "$rustc_bin" >> "$GITHUB_ENV"
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-topology
      - name: Run replicated topology contracts
        id: topology_contracts
        continue-on-error: true
        shell: bash
        env:
          RUN_CLUSTER_AUTH: ${{ needs.scope.outputs.cluster_auth }}
          RUN_HIQLITE_SPIKE: ${{ needs.scope.outputs.hiqlite_spike }}
          RETAIN_TOPOLOGY_UNITS: ${{ needs.scope.outputs.retain_topology_units }}
          PLURX_RETAINED_UNITS: ${{ needs.scope.outputs.retained_units }}
        run: |
          set -euo pipefail
          mkdir -p target/validation
          {
            if [ "$RUN_CLUSTER_AUTH" = true ]; then
              make hiqlite-vendor-clippy
              if [ "$RETAIN_TOPOLOGY_UNITS" = true ]; then
                python3 -m validation.qualification_unit_continuation --compile-units topology
                make cluster-harness-nonunit-check
              else
                make cluster-harness-check
              fi
            fi
            if [ "$RUN_HIQLITE_SPIKE" = true ]; then
              cargo clippy --locked --manifest-path spikes/hiqlite-m0/Cargo.toml \
                --tests --no-deps -- -D warnings
              make hiqlite-spike
            fi
          } 2>&1 | tee target/validation/cluster-topology.log
      - name: Record the topology lane result
        if: always()
        shell: bash
        env:
          LANE_RESULT: ${{ steps.topology_contracts.outcome }}
          RUN_CLUSTER_AUTH: ${{ needs.scope.outputs.cluster_auth }}
          RUN_HIQLITE_SPIKE: ${{ needs.scope.outputs.hiqlite_spike }}
          RETAIN_TOPOLOGY_UNITS: ${{ needs.scope.outputs.retain_topology_units }}
        run: |
          set -euo pipefail
          receipt=(
            python3 -m validation.ci_lane_receipt
            --output target/validation/cluster-topology-receipt.json
            --log target/validation/cluster-topology.log
            --lane cluster-topology
            --result "$LANE_RESULT"
          )
          if [ "$RUN_CLUSTER_AUTH" = true ]; then
            receipt+=(--command "make hiqlite-vendor-clippy")
            if [ "$RETAIN_TOPOLOGY_UNITS" = true ]; then
              receipt+=(--command "python3 -m validation.qualification_unit_continuation --compile-units topology")
              receipt+=(--command "make cluster-harness-nonunit-check")
            else
              receipt+=(--command "make cluster-harness-check")
            fi
          fi
          if [ "$RUN_HIQLITE_SPIKE" = true ]; then
            receipt+=(
              --command "cargo clippy --locked --manifest-path spikes/hiqlite-m0/Cargo.toml --tests --no-deps -- -D warnings"
              --command "make hiqlite-spike"
            )
          fi
          "${receipt[@]}"
      - name: Retain the topology lane log and receipt
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-topology-contracts
          path: |
            target/validation/cluster-topology.log
            target/validation/cluster-topology-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain deterministic topology evidence
        if: always() && needs.scope.outputs.cluster_auth == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-topology-semantic
          path: target/validation/cluster-topology-semantic.json
          if-no-files-found: error
          retention-days: 1
      - name: Retain deterministic failure-drill evidence
        if: always() && needs.scope.outputs.cluster_auth == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-failure-drills
          path: target/validation/cluster-failure-drills.json
          if-no-files-found: error
          retention-days: 1
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the topology contract result
        if: always() && steps.topology_contracts.outcome != 'success'
        run: exit 1

  cluster_transport_recovery_contracts:
    name: cluster transport recovery contracts
    needs: [scope]
    if: needs.scope.outputs.cluster_auth == 'true'
    runs-on: [self-hosted, Linux, X64, lab, incus, ci-store, android-kvm]
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-transport-recovery-contracts
      - name: Run recovery schemas, validators, and focused regressions
        id: recovery_contracts
        continue-on-error: true
        shell: bash
        env:
          RETAIN_TRANSPORT_UNITS: ${{ needs.scope.outputs.retain_transport_units }}
          PLURX_RETAINED_UNITS: ${{ needs.scope.outputs.retained_units }}
        run: |
          set -euo pipefail
          mkdir -p target/validation
          {
            test "$(uname -s)" = Linux
            if [ "$RETAIN_TRANSPORT_UNITS" = true ]; then
              python3 -m validation.qualification_unit_continuation --compile-units transport
            else
              make cluster-transport-recovery-contracts
            fi
          } 2>&1 | tee target/validation/cluster-transport-recovery-contracts.log
      - name: Retain recovery contract logs
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-transport-recovery-contracts
          path: target/validation/cluster-transport-recovery-contracts.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the recovery contract result
        if: always() && steps.recovery_contracts.outcome != 'success'
        run: exit 1

  cluster_transport_recovery_voter:
    name: cluster transport recovery voter role
    needs: [scope, cluster_transport_recovery_contracts]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' &&
      needs.cluster_transport_recovery_contracts.result == 'success'
    runs-on: [self-hosted, Linux, X64, lab, incus, ci-store, android-kvm]
    timeout-minutes: 240
    steps:
      - name: Record the role job budget start
        run: echo "RECOVERY_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-transport-recovery-voter
      - name: Build the exact voter role runner
        env:
          PLURX_BUILD_SHA: ${{ github.sha }}
        run: cargo build --locked --profile transport-recovery -p plurx-cluster-check
      - name: Run 20 voter snapshot recovery cycles
        id: voter_recovery
        continue-on-error: true
        shell: bash
        env:
          PLURX_BUILD_SHA: ${{ github.sha }}
          PLURX_RUNNER_LABEL: ${{ runner.name }}
        run: |
          set -euo pipefail
          mkdir -p target/validation
          elapsed=$(( $(date +%s) - RECOVERY_JOB_STARTED ))
          role_budget=$(( 13800 - elapsed ))
          if [ "$role_budget" -le 0 ]; then
            echo "No positive voter role budget remains before the ten-minute evidence reserve"
            exit 1
          fi
          make cluster-transport-recovery-voter-check \
            RECOVERY_EXECUTION_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            RECOVERY_OUTPUT_DIR=target/validation/transport-recovery-voter \
            RECOVERY_MAX_RUN_SECONDS="$role_budget" \
            RECOVERY_CARGO_PROFILE=transport-recovery \
            RECOVERY_BINARY="${{ steps.cargo-cache.outputs.target-dir }}/transport-recovery/plurx-cluster-check" \
            2>&1 | tee target/validation/cluster-transport-recovery-voter.log
      - name: Retain voter report, diagnostics, and log
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-transport-recovery-voter
          path: |
            target/validation/cluster-transport-recovery-voter.log
            target/validation/transport-recovery-voter/voter-role.json
            target/validation/transport-recovery-voter/voter-diagnostics
          if-no-files-found: error
          retention-days: 14
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the voter role result
        if: always() && steps.voter_recovery.outcome != 'success'
        run: exit 1

  cluster_transport_recovery_learner:
    name: cluster transport recovery learner role
    needs: [scope, cluster_transport_recovery_contracts]
    if: >-
      needs.scope.outputs.cluster_auth == 'true' &&
      needs.cluster_transport_recovery_contracts.result == 'success'
    runs-on: [self-hosted, Linux, X64, lab, incus, ci-store, android-kvm]
    timeout-minutes: 240
    steps:
      - name: Record the role job budget start
        run: echo "RECOVERY_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-transport-recovery-learner
      - name: Build the exact learner role runner
        env:
          PLURX_BUILD_SHA: ${{ github.sha }}
        run: cargo build --locked --profile transport-recovery -p plurx-cluster-check
      - name: Run 20 learner snapshot recovery cycles
        id: learner_recovery
        continue-on-error: true
        shell: bash
        env:
          PLURX_BUILD_SHA: ${{ github.sha }}
          PLURX_RUNNER_LABEL: ${{ runner.name }}
        run: |
          set -euo pipefail
          mkdir -p target/validation
          elapsed=$(( $(date +%s) - RECOVERY_JOB_STARTED ))
          role_budget=$(( 13800 - elapsed ))
          if [ "$role_budget" -le 0 ]; then
            echo "No positive learner role budget remains before the ten-minute evidence reserve"
            exit 1
          fi
          make cluster-transport-recovery-learner-check \
            RECOVERY_EXECUTION_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            RECOVERY_OUTPUT_DIR=target/validation/transport-recovery-learner \
            RECOVERY_MAX_RUN_SECONDS="$role_budget" \
            RECOVERY_CARGO_PROFILE=transport-recovery \
            RECOVERY_BINARY="${{ steps.cargo-cache.outputs.target-dir }}/transport-recovery/plurx-cluster-check" \
            2>&1 | tee target/validation/cluster-transport-recovery-learner.log
      - name: Retain learner report, diagnostics, and log
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-transport-recovery-learner
          path: |
            target/validation/cluster-transport-recovery-learner.log
            target/validation/transport-recovery-learner/learner-role.json
            target/validation/transport-recovery-learner/learner-diagnostics
          if-no-files-found: error
          retention-days: 14
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the learner role result
        if: always() && steps.learner_recovery.outcome != 'success'
        run: exit 1

  cluster_transport_recovery:
    name: cluster transport recovery campaign
    needs:
      - scope
      - cluster_transport_recovery_contracts
      - cluster_transport_recovery_voter
      - cluster_transport_recovery_learner
    if: always() && needs.scope.outputs.cluster_auth == 'true'
    runs-on: [self-hosted, Linux, X64, lab, incus, ci-store, android-kvm]
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-transport-recovery-aggregate
      - name: Build the exact evidence validator
        id: build_recovery_validator
        continue-on-error: true
        env:
          PLURX_BUILD_SHA: ${{ github.sha }}
        run: cargo build --locked --profile transport-recovery -p plurx-cluster-check
      - name: Download this run's voter evidence
        id: download_voter_recovery
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: cluster-transport-recovery-voter
          path: target/validation/voter-artifact
      - name: Download this run's learner evidence
        id: download_learner_recovery
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: cluster-transport-recovery-learner
          path: target/validation/learner-artifact
      - name: Validate and assemble current-run role evidence
        id: transport_recovery
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CONTRACTS_RESULT: ${{ needs.cluster_transport_recovery_contracts.result }}
          VOTER_RESULT: ${{ needs.cluster_transport_recovery_voter.result }}
          LEARNER_RESULT: ${{ needs.cluster_transport_recovery_learner.result }}
          VALIDATOR_RESULT: ${{ steps.build_recovery_validator.outcome }}
          VOTER_DOWNLOAD_RESULT: ${{ steps.download_voter_recovery.outcome }}
          LEARNER_DOWNLOAD_RESULT: ${{ steps.download_learner_recovery.outcome }}
          PLURX_BUILD_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          mkdir -p target/validation
          validator="${{ steps.cargo-cache.outputs.target-dir }}/transport-recovery/plurx-cluster-check"
          {
            test "$CONTRACTS_RESULT" = success
            test "$VOTER_RESULT" = success
            test "$LEARNER_RESULT" = success
            test "$VALIDATOR_RESULT" = success
            test "$VOTER_DOWNLOAD_RESULT" = success
            test "$LEARNER_DOWNLOAD_RESULT" = success
            "$validator" transport-recovery-assemble \
              --execution-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --voter target/validation/voter-artifact/transport-recovery-voter/voter-role.json \
              --learner target/validation/learner-artifact/transport-recovery-learner/learner-role.json \
              --output target/validation/cluster-transport-recovery.json
            "$validator" validate-transport-recovery-stdin \
              < target/validation/cluster-transport-recovery.json
          } 2>&1 | tee target/validation/cluster-transport-recovery.log
      - name: Record the transport recovery lane result
        if: always()
        env:
          LANE_RESULT: ${{ steps.transport_recovery.outcome }}
          EVIDENCE_VALIDATOR: ${{ steps.cargo-cache.outputs.target-dir }}/transport-recovery/plurx-cluster-check
          RETAIN_TRANSPORT_UNITS: ${{ needs.scope.outputs.retain_transport_units }}
        run: |
          set -euo pipefail
          unit_command="make cluster-transport-recovery-contracts"
          if [ "$RETAIN_TRANSPORT_UNITS" = true ]; then
            unit_command="python3 -m validation.qualification_unit_continuation --compile-units transport"
          fi
          python3 -m validation.ci_lane_receipt \
            --output target/validation/cluster-transport-recovery-receipt.json \
            --log target/validation/cluster-transport-recovery.log \
            --evidence target/validation/cluster-transport-recovery.json \
            --evidence-validator "$EVIDENCE_VALIDATOR" \
            --lane cluster-transport-recovery \
            --result "$LANE_RESULT" \
            --command "$unit_command" \
            --command "make cluster-transport-recovery-voter-check" \
            --command "make cluster-transport-recovery-learner-check" \
            --command "transport-recovery-assemble"
      - name: Retain transport recovery log, receipt, and evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-transport-recovery
          path: |
            target/validation/cluster-transport-recovery.log
            target/validation/cluster-transport-recovery-receipt.json
            target/validation/cluster-transport-recovery.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the transport recovery result
        if: always() && steps.transport_recovery.outcome != 'success'
        run: exit 1
