name: main fast lane

# Every main-bound pull request, as soon as it is ready. `ready_for_review`
# is what starts the lane now — a PR that is marked ready and merged can no
# longer skip the gate, which is what an opt-in label allowed.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

env:
  CARGO_TERM_COLOR: always

# Preserve per-method success journals through head updates and draft changes.
# Queued runs still fail the current-head/base guard when superseded.
concurrency:
  group: main-fast-lane-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Runs first, on drafts too, in about a minute: the bookkeeping rules that
  # otherwise fail a lane after its compile fan-out has already been spent.
  # Every other job waits on it. Same script as `make paperwork` and the
  # pre-push hook; docs/ci/PAPERWORK.md lists the rules and their fixes.
  paperwork:
    name: paperwork
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Check index rows, release counters, names and Regression-Test fields
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --force origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 scripts/paperwork --base "$PR_BASE_SHA" --merge-target "origin/$BASE_REF" --body-env

  scope:
    name: fast-lane validation scope
    needs: paperwork
    # Draft is the whole gate. A draft allocates only the paperwork job, so a
    # PR opened early costs about a minute of one runner; anything else runs. It was `draft == false` AND the
    # `fast-lane` label, and the label is what let three lanes merge in one day
    # without this workflow ever running - one of them carrying a fix for the
    # regression the lane before it had shipped to the fleet.
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      apple: ${{ steps.scope.outputs.apple }}
      desktop_macos: ${{ steps.scope.outputs.desktop_macos }}
      android_jvm: ${{ steps.scope.outputs.android_jvm }}
      web_layout: ${{ steps.scope.outputs.web_layout }}
      mobile_version: ${{ steps.scope.outputs.mobile_version }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Check out the candidate
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected compile surfaces
        id: scope
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -m validation.ci_scope
          --event pull_request --base "$VALIDATION_BASE" >> "$GITHUB_OUTPUT"

  worker_control_proof:
    name: production worker controller proof
    needs: scope
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 45
    steps:
      - name: Check out the candidate
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected worker controller proof inputs
        id: worker-control-inputs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ]; then
            echo "pull request base/head SHA is missing" >&2
            exit 1
          fi
          changed="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          affected=false
          while IFS= read -r path; do
            case "$path" in
              crates/plurx-worker-control/*|verification/worker-control/*|\
              crates/plurxd/src/library_work.rs|crates/plurxd/Cargo.toml|\
              Cargo.toml|Cargo.lock|rust-toolchain.toml|\
              scripts/check-worker-control|validation/worker_control_resume.py|\
              .github/workflows/main-fast-lane.yml)
                affected=true
                break
                ;;
            esac
          done <<< "$changed"
          printf 'affected=%s\n' "$affected" >> "$GITHUB_OUTPUT"
          echo "Worker controller proof inputs affected: $affected"
      - name: Install the pinned Python 3.12 runtime
        if: steps.worker-control-inputs.outputs.affected == 'true'
        run: |
          set -euo pipefail
          python_dir="$GITHUB_WORKSPACE/target/worker-control-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$python_dir"
          mkdir -p "$python_dir"
          runtime_archive="$python_dir/runtime.tgz"
          curl -q --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --max-filesize 34285590 \
            --output "$runtime_archive" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.12.15%2B20261003-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          test "$(wc -c < "$runtime_archive")" -eq 34285590
          printf '%s  %s\n' '731af898886c5f821890dc901eca3c651cca8e51fa7308c159d12a1194aeac91' \
            "$runtime_archive" | sha256sum --check --status
          tar -xzf "$runtime_archive" -C "$python_dir"
          "$python_dir/python/bin/python3" -c \
            'import platform, sys; assert sys.version_info[:3] == (3, 12, 15) and sys.platform == "linux" and platform.machine() == "x86_64"'
          rm -- "$runtime_archive"
          printf '%s\n' "$python_dir/python/bin" >> "$GITHUB_PATH"
      - name: Prepare same-PR worker proof resumption
        id: worker-control-resume
        if: steps.worker-control-inputs.outputs.affected == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m validation.worker_control_resume
      - name: Run the pinned production worker controller proof
        if: steps.worker-control-inputs.outputs.affected == 'true'
        run: >-
          python3 scripts/check-worker-control full
          --cache-dir target/worker-control-tools
          --output-dir "$GITHUB_WORKSPACE/target/verification/worker-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --resume-from "${{ steps.worker-control-resume.outputs.resume_dir }}"
          --provision
      - name: Attach worker proof resume provenance
        if: always() && steps.worker-control-inputs.outputs.affected == 'true'
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/target/verification/worker-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          origin="$GITHUB_WORKSPACE/target/verification/worker-control-resume-origin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          test -s "$output_dir/receipt.json"
          test -s "$origin"
          cp -- "$origin" "$output_dir/resume-origin.json"
      - name: Preserve worker controller proof receipts and logs
        if: always() && steps.worker-control-inputs.outputs.affected == 'true'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: worker-control-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/verification/worker-control-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
      - name: Remove this job's Python runtime
        if: always() && steps.worker-control-inputs.outputs.affected == 'true'
        run: |
          python_dir="$GITHUB_WORKSPACE/target/worker-control-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -n "$GITHUB_WORKSPACE"
          rm -rf -- "$python_dir"

  preflight:
    name: fast policy and contract preflight
    needs: scope
    runs-on: [self-hosted, Linux, X64, lab, general]
    # A cold continuation can run the full unit set when older receipts cannot
    # authenticate. History alone took seven minutes in run 6234; allow the
    # remaining contracts and receipt publication to finish on a busy runner.
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the job-local Python receipt runtime
        id: python-runtime
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP" && test ! -L "$RUNNER_TEMP"
          plurx_python_dir="$(mktemp -d "$RUNNER_TEMP/plurx-python312.XXXXXXXX")"
          printf 'directory=%s\n' "$plurx_python_dir" >> "$GITHUB_OUTPUT"
          curl -q --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --max-filesize 34285590 \
            --output "$plurx_python_dir/runtime.tgz" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.12.15%2B20261003-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          test "$(wc -c < "$plurx_python_dir/runtime.tgz")" -eq 34285590
          printf '%s  %s\n' '731af898886c5f821890dc901eca3c651cca8e51fa7308c159d12a1194aeac91' \
            "$plurx_python_dir/runtime.tgz" | sha256sum --check --status
          tar -xzf "$plurx_python_dir/runtime.tgz" -C "$plurx_python_dir"
          "$plurx_python_dir/python/bin/python3" -c \
            'import platform, sys; assert sys.version_info[:2] == (3, 12) and sys.platform == "linux" and platform.machine() == "x86_64"'
          printf '%s\n' "$plurx_python_dir/python/bin" >> "$GITHUB_PATH"
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Restore attributable main Python successes
        id: receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m validation.main_unit_receipts prepare
      - name: Publish main Python attempt-start marker
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ steps.receipts.outputs.receipt_key }}-start-${{ github.run_id }}
          path: .main-python-unit-receipts/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish preflight attempt-start journal
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ steps.receipts.outputs.adoption_receipt_key }}-start-${{ github.run_id }}
          path: .main-preflight-receipts/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Audit corrective-history evidence
        run: make history-check
      # docs/ci/LEDGER-TEXT-CONTRACTS-AND-RELEASE-TAGS.md §3.1: the pull
      # request's `Regression-Test:` lines, judged in the tree the merge will
      # produce. The body and title are payload data on the `pull_request`
      # event, read from the environment: no API call, no credential, and
      # nothing interpolated into the script. This checkout is the branch
      # head, not a merge candidate (the step prints both to keep that
      # visible), so the module builds the candidate with `git merge-tree`.
      # Advisory while validation/merge-errata.toml sets no boundary (phase
      # A); the change that sets the boundary removes `continue-on-error` in
      # the same diff, and tests/validation/test_regression_field.py refuses
      # one without the other.
      - name: Check validation catalog and static contracts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          KNOWLEDGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          make validation-lint
      - name: Check formal protocol source mapping
        id: formal-inputs
        env:
          PLURX_FORMAL_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          mkdir -p target/verification/durable-jobs target/verification/operation-progress target/verification/worker-refinement
          if [ -n "$PLURX_FORMAL_BASE" ]; then
            python3 scripts/check-formal check-mapping --package durable-jobs --affected-base "$PLURX_FORMAL_BASE" > target/verification/durable-jobs/ci-inputs.json
            python3 scripts/check-formal check-mapping --package operation-progress --affected-base "$PLURX_FORMAL_BASE" > target/verification/operation-progress/ci-inputs.json
            python3 scripts/check-formal check-mapping --package worker-refinement --affected-base "$PLURX_FORMAL_BASE" > target/verification/worker-refinement/ci-inputs.json
          else
            python3 scripts/check-formal check-mapping --package durable-jobs > target/verification/durable-jobs/ci-inputs.json
            python3 scripts/check-formal check-mapping --package operation-progress > target/verification/operation-progress/ci-inputs.json
            python3 scripts/check-formal check-mapping --package worker-refinement > target/verification/worker-refinement/ci-inputs.json
          fi
          python3 -c 'import json, os; from pathlib import Path; base=Path("target/verification"); durable=json.loads((base/"durable-jobs/ci-inputs.json").read_text()); progress=json.loads((base/"operation-progress/ci-inputs.json").read_text()); worker=json.loads((base/"worker-refinement/ci-inputs.json").read_text()); assert all(type(item["affected"]) is bool for item in (durable, progress, worker)); out=open(os.environ["GITHUB_OUTPUT"], "a"); print("affected_durable=" + str(durable["affected"]).lower(), file=out); print("affected_progress=" + str(progress["affected"]).lower(), file=out); print("affected_worker_refinement=" + str(worker["affected"]).lower(), file=out); print("affected=" + str(durable["affected"] or progress["affected"] or worker["affected"]).lower(), file=out)'
      - name: Provision the pinned formal toolchain
        if: steps.formal-inputs.outputs.affected == 'true'
        run: python3 scripts/bootstrap-formal-toolchain fetch --cache-dir target/formal-toolchain
      - name: Complete the bounded formal smoke configuration
        id: formal-smoke
        if: steps.formal-inputs.outputs.affected_durable == 'true'
        run: python3 scripts/check-formal smoke --package durable-jobs --cache-dir target/formal-toolchain
      - name: Complete operation-progress formal smoke configurations
        id: formal-progress-smoke
        if: steps.formal-inputs.outputs.affected_progress == 'true'
        run: python3 scripts/check-formal smoke --package operation-progress --cache-dir target/formal-toolchain
      - name: Complete worker-refinement formal smoke configurations
        id: formal-worker-refinement-smoke
        if: steps.formal-inputs.outputs.affected_worker_refinement == 'true'
        run: python3 scripts/check-formal smoke --package worker-refinement --cache-dir target/formal-toolchain
      - name: Preserve formal model receipts and counterexamples
        if: always() && steps.formal-inputs.outcome != 'skipped'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: formal-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/verification/durable-jobs/
            target/verification/operation-progress/
            target/verification/worker-refinement/
          if-no-files-found: error
          retention-days: 90
      - name: Provision checksummed public K08 oracle sources
        run: |
          set -eu
          fixture="$RUNNER_TEMP/hiqlite-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          timeout 90s python3 scripts/provision-hiqlite-upstream "$fixture"
          printf 'PLURX_HIQLITE_UPSTREAM_DIR=%s\n' "$fixture" >> "$GITHUB_ENV"
      - name: Check CI, deploy, and shipping contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m validation.main_unit_receipts run --suite-dir tests/validation --suite-dir tests/operations
      - name: Preserve main Python success journal even on unit failure
        if: always() && steps.receipts.outcome == 'success'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ steps.receipts.outputs.receipt_key }}
          path: .main-python-unit-receipts/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Check the shared player input contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m validation.main_preflight_adoption node
      - name: Preserve per-ID preflight journal even on failure
        if: always() && steps.receipts.outcome == 'success'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ steps.receipts.outputs.adoption_receipt_key }}
          path: .main-preflight-receipts/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove the exact job-local Python receipt runtime
        if: always()
        env:
          PLURX_PYTHON_DIRECTORY: ${{ steps.python-runtime.outputs.directory }}
        run: |
          set -euo pipefail
          if [ -n "$PLURX_PYTHON_DIRECTORY" ]; then
            test "$(dirname "$PLURX_PYTHON_DIRECTORY")" = "$RUNNER_TEMP"
            case "$(basename "$PLURX_PYTHON_DIRECTORY")" in plurx-python312.????????) ;; *) exit 1 ;; esac
            test ! -L "$PLURX_PYTHON_DIRECTORY"
            rm -rf -- "$PLURX_PYTHON_DIRECTORY"
          fi
      - name: Record the documentation-only lane
        if: needs.scope.outputs.docs_only == 'true'
        run: echo "Documentation-only diff; compiler surfaces are skipped."

  rust_compile:
    name: fast Rust gate
    needs: [scope, preflight]
    if: needs.scope.outputs.rust == 'true'
    runs-on: [self-hosted, Linux, X64, lab, general, high-cpu]
    # The online generic runners currently carry ffmpeg 8. Ubuntu 24.04 is the
    # pinned ffmpeg 6 environment used by this lane, while the host label keeps
    # the job on the high-CPU pool.
    container: ubuntu:24.04
    # Compile all targets and enforce workspace/vendor Clippy here. The full
    # Rust unit and SQLite suites belong to manual full CI, while each change
    # carries its named, locally run focused regression through preflight.
    # A cold run spent 21m36s provisioning before compilation. Budget for
    # that setup plus all-target checking and both Clippy stages; no tests
    # are added by this ceiling.
    timeout-minutes: 60
    env:
      # Keep compilation within the shared guest's memory budget.
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Install Rust gate prerequisites
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl git libssl-dev lld llvm \
            libgtk-4-dev libdbus-1-dev make nasm ninja-build nodejs pkg-config python3
      - name: Check out the candidate
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Install the pinned FFmpeg
        uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Restore the main fast Rust cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: main-fast-rust
      - name: Compile every Rust target without executing tests
        run: |
          make effort-rust-check
          make hiqlite-vendor-clippy
      - name: Lint the workspace
        run: |
          make lint
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        continue-on-error: true
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"

  web_compile:
    name: fast web syntax gate
    needs: [scope, preflight]
    if: needs.scope.outputs.web_layout == 'true'
    runs-on: [self-hosted, Linux, X64, lab, general]
    # web-unit-check measured 103 s serial on two cores; the rest is checkout,
    # node and the pinned tsc.
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # --base reads the baseline at the merge-base with the target.
          fetch-depth: 0
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Parse every shipped JavaScript surface
        run: |
          scripts/js-check
          git ls-files -z 'crates/plurxd/src/web/*.js' | xargs -0 -n1 node --check
      # TypeScript's checker over the same rows, against tests/web/
      # tsc-baseline.tsv: the counts must match exactly, so a new or raised
      # diagnostic fails and so does one that fell without the baseline being
      # lowered. --base also refuses a count the pull request raised in the
      # TSV without a new `# accepted` line for that key. The script runs
      # `npm ci` into tools/web-types from its lockfile (one package, no
      # dependencies) when the pinned tsc is not already there.
      - name: Type-check the web shell against its baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m validation.web_unit_receipts --command jsconfig-generated
          scripts/web-types --base "$PR_BASE_SHA"
          python3 -m validation.web_unit_receipts --command player-typedef
      # Every Node web and playback test, the same list `make web-check` runs
      # minus its two real-browser scripts. Until 2026-10-04 a pull request ran
      # two of them here and the rest ran only when someone typed make; a stale
      # assertion sat red on main for two days that way.
      - name: Run every Node web and playback test
        env:
          TMPDIR: /tmp
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m validation.web_unit_receipts --command suite
      - name: Preserve original web unit adoption provenance
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: web-unit-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: .main-preflight-receipts/web-unit
          if-no-files-found: error
          retention-days: 90

  apple_compile:
    name: Apple compile and native TV navigation
    needs: [scope, preflight]
    if: needs.scope.outputs.apple == 'true' || needs.scope.outputs.desktop_macos == 'true'
    runs-on: [self-hosted, macOS, ARM64, lab, apple, xcode-27.1]
    # 32 native journeys take 81-163 s each (about 60 min, up to 87) after the compile.
    timeout-minutes: 120
    concurrency:
      group: plurx-apple-silicon-heavy
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the pinned Apple toolchain
        run: |
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Fxq "Xcode 27.1" <<< "$xcode_version"
          grep -Fxq "Build version 27A9275" <<< "$xcode_version"
          xcrun --find swift
      - name: Authenticate compatible original native test receipts
        id: native_receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m validation.native_receipts
      - name: Preserve native adoption provenance
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: native-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: .main-preflight-receipts/native/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Build and test native macOS server tray
        if: needs.scope.outputs.desktop_macos == 'true'
        # Keep desktop XCTest namespaces out of mobile unit receipt parsing.
        # The complete native output is preserved independently, including failures.
        run: |
          mkdir -p target/validation
          if [ "${{ steps.native_receipts.outputs.desktop_macos }}" = "true" ]; then
            echo "Native macOS server tray builds and tests adopted from authenticated original evidence; see native-adoption artifact." > target/validation/desktop-macos-check.log
            echo "Native macOS server tray builds and tests adopted; original provenance is preserved in native-adoption artifact."
          else
            make desktop-macos-check > target/validation/desktop-macos-check.log 2>&1
            echo "Native macOS server tray build and unit checks passed."
          fi
      - name: Preserve native macOS server tray check output
        if: always() && needs.scope.outputs.desktop_macos == 'true'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: desktop-macos-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/validation/desktop-macos-check.log
          if-no-files-found: error
          retention-days: 14
      - name: Verify the pinned mobile Apple toolchain
        if: needs.scope.outputs.apple == 'true'
        run: |
          test "$(xcodegen --version)" = "Version: 2.46.0"
      - name: Compile iOS and tvOS without running simulator tests
        if: needs.scope.outputs.apple == 'true' && steps.native_receipts.outputs.tv_navigation != 'true'
        run: make apple-build
      - name: Reauthenticate original native cases before executing the pending selection
        if: needs.scope.outputs.apple == 'true' && steps.native_receipts.outputs.tv_navigation != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m validation.native_receipts --verify-tv-plan
      - name: Require native TV navigation journeys
        if: needs.scope.outputs.apple == 'true' && steps.native_receipts.outputs.tv_navigation != 'true'
        env:
          PLURX_TV_NAVIGATION_OUTPUT: ${{ runner.temp }}/tv-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          PLURX_TV_NAVIGATION_PLAN: .main-preflight-receipts/native/receipt.json
        run: make apple-tv-navigation-test
      - name: Preserve TV navigation evidence including failures
        if: always() && needs.scope.outputs.apple == 'true' && steps.native_receipts.outputs.tv_navigation != 'true'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: tv-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tv-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90

  android_compile:
    name: fast Android compile
    needs: [scope, preflight]
    if: needs.scope.outputs.android_jvm == 'true'
    runs-on: [self-hosted, Linux, X64, lab, android-kvm]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reuse the pinned Android toolchain image from Forgejo
        env:
          REGISTRY_TOKEN: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
        run: |
          tag="${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/android-build:$(sha256sum clients/android/Dockerfile | cut -c1-16)"
          echo "$REGISTRY_TOKEN" | docker login ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }} -u fleet --password-stdin || true
          if docker pull "$tag"; then
            docker tag "$tag" plurx-android-build
          else
            make android-image \
              && docker tag plurx-android-build "$tag" \
              && docker push "$tag" || true
          fi
          echo "PLURX_ANDROID_IMAGE_READY=1" >> "$GITHUB_ENV"
      - name: Cache Gradle dependencies
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            clients/android/.gradle-docker/caches
            clients/android/.gradle-docker/wrapper
          key: main-fast-gradle-${{ hashFiles('clients/android/build.gradle.kts', 'clients/android/settings.gradle.kts', 'clients/android/app/build.gradle.kts', 'clients/android/gradle/libs.versions.toml', 'clients/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            main-fast-gradle-
            effort-gradle-
      - name: Compile the Android debug application without running tests
        run: make android

  promotion_gate:
    name: Main promotion gate
    if: >-
      always() &&
      github.event.pull_request.draft == false
    needs:
      - paperwork
      - scope
      - preflight
      - worker_control_proof
      - rust_compile
      - web_compile
      - apple_compile
      - android_compile
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 2
    steps:
      - name: Require policy and every affected compile surface
        env:
          PAPERWORK_RESULT: ${{ needs.paperwork.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          WORKER_CONTROL_RESULT: ${{ needs.worker_control_proof.result }}
          RUST_RESULT: ${{ needs.rust_compile.result }}
          WEB_RESULT: ${{ needs.web_compile.result }}
          APPLE_RESULT: ${{ needs.apple_compile.result }}
          ANDROID_RESULT: ${{ needs.android_compile.result }}
        run: |
          # Paperwork must pass outright: when it fails, every job below it is
          # skipped, and a skipped job is otherwise accepted here.
          if [ "$PAPERWORK_RESULT" != success ]; then
            echo "paperwork ended with: $PAPERWORK_RESULT"; exit 1
          fi
          if [ "$WORKER_CONTROL_RESULT" != success ]; then
            echo "The required production worker controller proof ended with: $WORKER_CONTROL_RESULT"
            exit 1
          fi
          for result in \
            "$SCOPE_RESULT" "$PREFLIGHT_RESULT" \
            "$RUST_RESULT" "$WEB_RESULT" "$APPLE_RESULT" \
            "$ANDROID_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A selected fast-lane job ended with: $result"; exit 1 ;;
            esac
          done
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every job above built the PR head alone -- Forgejo checks out
      # refs/pull/<n>/head, not a merge preview -- so the one thing this gate
      # can prove is that the head is still that commit: a newer push is
      # untested and must pass its own lane. The base branch is deliberately
      # not compared. Requiring it unchanged rejected nearly every green lane
      # on a busy main (PR #986 needed four runs) while proving nothing the
      # jobs had built; Paul approved dropping it on 2026-10-11. A conflicting
      # merge is still refused by the forge, and the merge itself should pin
      # this head (`head_commit_id`) so a push after the gate cannot land.
      - name: Require the reviewed head to remain current
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ -z "$EVENT_HEAD_SHA" ]; then
            echo "No pull_request head to check: this gate runs only for pull requests."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --force origin \
            "+refs/pull/$PR_NUMBER/head:refs/plurx/current-head"
          current_head="$(git rev-parse refs/plurx/current-head)"
          if [ "$current_head" != "$EVENT_HEAD_SHA" ]; then
            echo "The PR head moved from the tested $EVENT_HEAD_SHA to $current_head; a newer push must pass its own lane."
            exit 1
          fi
      - name: Publish the qualified Rust lint badge
        if: needs.rust_compile.result == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-badge \
            --branch badges-pr-lint \
            --alias codex/badges-pr-lint \
            --filename lint \
            --label "PR lint" \
            --message passing \
            --fill '#4c1' \
            --json-color brightgreen \
            --label-width 46 \
            --message-width 48
      - name: Publish the qualified PR gate badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-badge \
            --branch badges-pr-ci \
            --alias codex/badges-pr-ci \
            --filename ci \
            --label "PR gate" \
            --message passing \
            --fill '#4c1' \
            --json-color brightgreen \
            --label-width 48 \
            --message-width 48
