name: fix evidence (opt-in)

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit to compare in the disposable proof clone.
        required: true
        type: string

jobs:
  revert-proof:
    name: report whether retained Rust tests reject the base implementation
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Revert production paths in a disposable clone
        id: proof
        continue-on-error: true
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          mapfile -t paths < <(
            git diff --name-only "$BASE_SHA...HEAD" -- 'crates/**/*.rs' \
              | grep -Ev '(^|/)(tests?|benches)/' \
              | sort -u
          )
          if (( ${#paths[@]} == 0 )); then
            echo "No changed Rust production paths; use the documented Swift/manual protocol." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/prove-fix "$BASE_SHA" - "${paths[@]}"
      - name: Publish the report-only result
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          if [[ "$PROOF_OUTCOME" == success ]]; then
            echo "## Revert proof: discriminating test observed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Revert proof: no discriminating failure observed" >> "$GITHUB_STEP_SUMMARY"
            echo "This is report-only during the evidence-policy trial month." >> "$GITHUB_STEP_SUMMARY"
          fi
