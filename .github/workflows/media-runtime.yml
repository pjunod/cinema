name: publish media runtime
run-name: media runtime ${{ github.sha }}

# Media dependency maintenance is explicit; application commits never start it.
on:
  workflow_dispatch:
    inputs:
      audited_amd64:
        description: Build the reviewed Dolby amd64 media base required for releases (false builds a local-only ordinary base)
        type: boolean
        default: true

concurrency:
  group: media-runtime
  cancel-in-progress: false

env:
  RUNTIME_IMAGE: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-media-runtime

jobs:
  platform:
    name: media dependencies (${{ matrix.arch }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: '["self-hosted", "Linux", "X64", "lab", "general", "high-cpu"]'
          - arch: arm64
            runs_on: '["self-hosted", "Linux", "ARM64", "lab", "release-arm64"]'
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [registry."${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}"]
              http = true
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
          username: fleet
          password: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
      - name: Build and export the audited amd64 media package
        if: matrix.arch == 'amd64' && inputs.audited_amd64
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.media-runtime
          target: linux-dolby-package-export
          platforms: linux/amd64
          outputs: type=tar,dest=linux-dolby-export.tar
          provenance: false
          sbom: false
      - name: Validate and unpack the complete audited media export
        if: matrix.arch == 'amd64' && inputs.audited_amd64
        run: python3 -m validation.media_export linux-dolby-export.tar linux-dolby-export
      - name: Build and publish media dependencies
        id: runtime
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.media-runtime
          target: ${{ matrix.arch == 'amd64' && inputs.audited_amd64 && 'runtime-assets-dolby-amd64' || 'media-runtime' }}
          build-contexts: ${{ matrix.arch == 'amd64' && inputs.audited_amd64 && 'linux-dolby-package=./linux-dolby-export/package' || '' }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.RUNTIME_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke the published media platform
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          AUDITED_AMD64: ${{ matrix.arch == 'amd64' && inputs.audited_amd64 }}
        run: |
          set -euo pipefail
          image="$RUNTIME_IMAGE@$RUNTIME_DIGEST"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = 'linux/${{ matrix.arch }}'
          docker run --rm "$image" /usr/lib/jellyfin-ffmpeg/ffmpeg -version
          docker run --rm "$image" /usr/local/lib/plurx/ffprobe -version
          docker run --rm "$image" /usr/local/bin/subtitle-engine/whisper-cli --version
          if test "$AUDITED_AMD64" = true; then
            docker run --rm --entrypoint sh "$image" -eu -c '
              provenance=/usr/lib/jellyfin-ffmpeg/provenance
              test -s "$provenance/linux-dolby-package.json"
              test -s "$provenance/shipping-system-elf-sha256.txt"
              sha256sum -c "$provenance/shipping-system-elf-sha256.txt"
              if dpkg-query -W -f="\${db:Status-Status}" libmfx1 2>/dev/null | grep -qx installed; then
                echo "Audited media base still contains the competing Debian Media SDK" >&2
                exit 1
              fi
            '
          fi
          mkdir -p media-digests
          printf '%s\n' "$RUNTIME_DIGEST" > 'media-digests/${{ matrix.arch }}.digest'
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: media-digest-${{ matrix.arch }}
          path: media-digests/
          retention-days: 30

  index:
    name: publish index and candidate pin
    needs: platform
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          pattern: media-digest-*
          merge-multiple: true
          path: media-digests
      - uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [registry."${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}"]
              http = true
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
          username: fleet
          password: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
      - name: Publish immutable index and prepare reviewed pin
        env:
          AUDITED_AMD64: ${{ inputs.audited_amd64 }}
        run: |
          set -euo pipefail
          amd64=$(cat media-digests/amd64.digest)
          arm64=$(cat media-digests/arm64.digest)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag="$RUNTIME_IMAGE:source-$GITHUB_SHA"
          docker manifest create --insecure --amend "$tag" "$RUNTIME_IMAGE@$amd64" "$RUNTIME_IMAGE@$arm64"
          digest=$(docker manifest push --insecure --purge "$tag" | tail -1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          scripts/media-runtime pin --insecure "$RUNTIME_IMAGE@$digest"
          mkdir -p media-candidate
          cp Dockerfile media-candidate/Dockerfile
          printf 'Source-Revision: %s\nMedia-Runtime: %s@%s\nAudited-amd64: %s\namd64: %s\narm64: %s\n' \
            "$GITHUB_SHA" "$RUNTIME_IMAGE" "$digest" "$AUDITED_AMD64" "$amd64" "$arm64" > media-candidate/receipt.txt
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: media-runtime-candidate
          path: media-candidate/
          retention-days: 90
