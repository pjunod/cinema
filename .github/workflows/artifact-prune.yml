name: artifact prune

# Cross-built binaries already declare `retention-days: 1` in ci.yml, but the
# repository still accumulated 4,885 artifacts / ~34 GB, and a full quota does
# not fail a build — it fails the *upload*, which `ci.yml` deliberately treats
# as fatal for a qualification. So a full quota silently reds every effort
# promotion until someone deletes by hand. This keeps that from recurring.
#
# It deletes only cross-built binaries older than the retention they already
# declare. Validation evidence, cluster topology and failure-drill artifacts,
# nightly evidence and qualification receipts are never touched.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete plurxd-* binaries older than this many days"
        required: false
        default: "2"
      dry_run:
        description: "List what would be deleted without deleting it"
        required: false
        default: "false"

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-prune
  cancel-in-progress: false

jobs:
  prune:
    name: prune stale cross-built binaries
    # The same selector every other job uses. Pinned to `ubuntu-24.04`, this
    # job could not be scheduled at all on a self-hosted fleet: it reported
    # failed with zero steps and an empty log every night since it merged,
    # which is the shape a job that never started leaves behind.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'github' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    timeout-minutes: 30
    steps:
      - name: Delete stale plurxd binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLDER_THAN_DAYS: ${{ inputs.older_than_days || '2' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, sys, urllib.error, urllib.request


          class ArtifactApiError(RuntimeError):
              """A call this job can report on rather than dying inside."""


          repo = os.environ["GITHUB_REPOSITORY"]
          older = float(os.environ.get("OLDER_THAN_DAYS") or 2)
          dry = os.environ.get("DRY_RUN", "false").lower() == "true"
          now = datetime.datetime.now(datetime.timezone.utc)

          # urllib rather than the gh CLI: a self-hosted runner image is not
          # obliged to ship gh, and this job has no other reason to need it.
          def api(method, path):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "plurx-artifact-prune",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
              except urllib.error.HTTPError as failure:
                  detail = failure.read().decode("utf-8", "replace")[:200]
                  raise ArtifactApiError(f"{method} {path}: {failure.code} {detail}")
              except urllib.error.URLError as failure:
                  raise ArtifactApiError(f"{method} {path}: {failure.reason}")
              return json.loads(body) if body.strip() else {}

          # Only names ci.yml publishes as cross-built binaries. Anything else
          # — evidence, receipts, topology, nightlies — is left alone. A prefix
          # rather than an exact name because the matrix target is appended.
          KEEP_PREFIXES_EXEMPT = ("plurxd-",)

          stale, kept, total_bytes, freed = [], 0, 0, 0
          page = 1
          while True:
              try:
                  body = api("GET", f"/repos/{repo}/actions/artifacts?per_page=100&page={page}")
              except ArtifactApiError as failure:
                  raise SystemExit(f"listing artifacts failed: {failure}")
              batch = body.get("artifacts", [])
              if not batch:
                  break
              for a in batch:
                  total_bytes += a["size_in_bytes"]
                  if a.get("expired"):
                      continue
                  age = (now - datetime.datetime.fromisoformat(
                      a["created_at"].replace("Z", "+00:00"))).total_seconds() / 86400
                  if a["name"].startswith(KEEP_PREFIXES_EXEMPT) and age > older:
                      stale.append(a)
                      freed += a["size_in_bytes"]
                  else:
                      kept += 1
              page += 1
              if page > 60:
                  print("::warning::stopped paging at 6000 artifacts")
                  break

          print(f"total {total_bytes/1e9:.2f} GB · keeping {kept} · "
                f"{'would delete' if dry else 'deleting'} {len(stale)} "
                f"({freed/1e9:.2f} GB)")

          if dry:
              for a in stale[:25]:
                  print(f"  would delete {a['id']} {a['name']} {a['created_at']}")
              sys.exit(0)

          failed = 0
          for a in stale:
              try:
                  api("DELETE", f"/repos/{repo}/actions/artifacts/{a['id']}")
              except ArtifactApiError as failure:
                  # One artifact deleted by a concurrent expiry is not a reason
                  # to leave the other few thousand in place.
                  print(f"::warning::{failure}")
                  failed += 1
          print(f"deleted {len(stale) - failed}, failed {failed}")

          # GitHub recalculates quota usage every 6-12 hours, so freeing space
          # here is not visible to an uploader immediately. That is the reason
          # this runs on a schedule rather than as a pre-flight step.
          if failed:
              print(f"::warning::{failed} artifact deletions failed")
          PY
