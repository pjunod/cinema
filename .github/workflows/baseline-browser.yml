name: diagnostic frozen browser continuation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen source commit to execute
        required: true
        type: string
        default: "86f1385005b27122e8a8d3a3d5bd9501eb2fdb16"
      diagnostic_baseline:
        description: Must remain true; continuation evidence only
        required: true
        type: string
        default: "true"

jobs:
  browser_continuation:
    name: frozen browser continuation (${{ matrix.cell }})
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [seek, cinema]
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:3d84b711936233da699308d0301ac1e91f12e76c6b928967c41817e841f5e855
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CONTINUATION_CELL: ${{ matrix.cell }}
    steps:
      - name: Capture mounted runner workspace owner
        run: |
          # Forgejo v13.1.0 provisions paired random job volumes and deletes
          # both on cleanup (BindWorkdir=false, ReuseContainers=false).
          # Persistent host binds still require their actual non-root owner.
          ephemeral="$(python3 - "$GITHUB_WORKSPACE" <<'PYTHON'
          import os
          import re
          import sys

          def ephemeral_workspace(workspace, act_path, mountinfo, env):
              if env.get("ACT") != "true" or env.get("FORGEJO_ACTIONS") != "true":
                  return False
              records = [line.split() for line in mountinfo.splitlines()]
              def direct(path):
                  rows = [r for r in records if len(r) >= 10 and r[4] == path]
                  return rows[0] if len(rows) == 1 else None
              work, act = direct(workspace), direct(act_path)
              if work is None or act is None or work[0] == act[0]:
                  return False
              match = re.fullmatch(r"/var/lib/docker/volumes/([0-9a-f]{32})/_data", work[3])
              if match is None or act[3] != "/var/lib/docker/volumes/" + match[1] + "-env/_data":
                  return False
              try:
                  wi, ai = work.index("-"), act.index("-")
                  return (wi >= 6 and ai >= 6 and wi + 3 < len(work) and ai + 3 < len(act)
                          and work[0].isdigit() and act[0].isdigit() and work[2] == act[2]
                          and work[wi + 1:wi + 3] == act[ai + 1:ai + 3]
                          and "rw" in work[5].split(",") and "rw" in act[5].split(","))
              except (ValueError, IndexError):
                  return False

          with open("/proc/self/mountinfo", encoding="utf-8") as mounted:
              ephemeral = ephemeral_workspace(os.path.realpath(sys.argv[1]),
                  os.path.realpath("/var/run/act"), mounted.read(), os.environ)
          print("yes" if ephemeral else "no")
          PYTHON
          )"
          if [ "$ephemeral" = yes ]; then
            echo 'PLURX_WORKSPACE_MODE=forgejo-ephemeral' >> "$GITHUB_ENV"
            echo 'HOST_WORKSPACE_OWNER=' >> "$GITHUB_ENV"
            echo 'Paired Forgejo job volumes are removed by the provisioner; no host bind to restore'
            exit 0
          fi
          owner="$(stat -c '%u:%g' "$(dirname -- "$GITHUB_WORKSPACE")")"
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          fi
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            echo '::error::No non-root mounted workspace owner; refusing to leave root-owned runner files' >&2
            exit 1
          fi
          echo "HOST_WORKSPACE_OWNER=$owner" >> "$GITHUB_ENV"
          echo 'PLURX_WORKSPACE_MODE=persistent-bind' >> "$GITHUB_ENV"
      - name: Verify the controlled Python unit environment
        run: |
          python3 -c 'import sys; assert sys.version_info[:3] == (3, 11, 2), sys.version'
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Bind frozen source and external browser environment
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DIAGNOSTIC_BASELINE: ${{ inputs.diagnostic_baseline }}
          WORKFLOW_TRANSPORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYBIND'
          import json, os, pathlib, platform, re, subprocess
          assert os.environ['DIAGNOSTIC_BASELINE'] == 'true', 'Diagnostic continuation only'
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch('[0-9a-f]{40}', expected), 'Expected SHA must be exact'
          transport = os.environ['WORKFLOW_TRANSPORT_SHA']
          assert re.fullmatch('[0-9a-f]{40}', transport), 'Workflow transport SHA must be exact'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          actual, tree = git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}')
          assert actual == expected, 'Frozen checkout differs'
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          checkout = pathlib.Path.cwd().resolve()
          assert temporary.is_dir() and not temporary.is_relative_to(checkout), 'RUNNER_TEMP must be outside checkout'
          cell = os.environ['CONTINUATION_CELL']
          assert cell in ('seek', 'cinema'), 'Unknown browser cell'
          output = pathlib.Path('target/full-suite-baseline') / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-browser-' + cell)
          output.mkdir(parents=True, exist_ok=True)
          status = git('status', '--porcelain', '--untracked-files=all')
          (output / 'source-initial.json').write_text(json.dumps(dict(candidate_sha=actual, candidate_tree=tree, status=status)))
          assert not status, 'Initial checkout must be clean'
          (output / 'continuation-provenance.json').write_text(json.dumps(dict(tested_sha=actual, tested_tree=tree, workflow_transport_sha=transport, observation_kind='separate-browser-continuation', primary_run_id=5620, cell=cell, limitation='Separate continuation; preserve first-observation timing. Cinema live seam may remain explicitly skipped without a synthetic live fixture.'), indent=2))
          context = dict(candidate_sha=actual, candidate_tree=tree, cell_id='python:seek-layout', framework='unittest', target=platform.system() + '-' + platform.machine(), profile='baseline', features=[], toolchain='Python ' + platform.python_version(), suite_dir='tests/web', test_files=['test_seek_controls_layout.py'])
          (output / 'context-seek-layout.json').write_text(json.dumps(context))
          argv = (['python3', '-m', 'validation.baseline_python', '--context', str(output / 'context-seek-layout.json'), '--suite-dir', 'tests/web', '--output', str(output / 'python-seek-layout.json')] if cell == 'seek' else ['make', 'cinema-remote-browser-check'])
          (output / 'command-manifest.json').write_text(json.dumps(dict(candidate_sha=actual, candidate_tree=tree, cells=[dict(id=cell, argv=argv, cwd='.', timeout_seconds=240 if cell == 'seek' else 600)])))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              for key, value in dict(PLURX_BASELINE_DIR=str(output), PLURX_TEST_CANDIDATE_SHA=actual, PLURX_TEST_CANDIDATE_TREE=tree, PLAYWRIGHT_BROWSERS_PATH=str(temporary / 'plurx-browser-continuation')).items():
                  environment.write(key + '=' + value + '\n')
          PYBIND
      - name: Provision headed Cinema browser dependencies before tests
        if: matrix.cell == 'cinema'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            timeout 120s apt-get -o Acquire::Retries=2 update
            timeout 120s apt-get -o Acquire::Retries=2 install -y --no-install-recommends xvfb xauth
          fi
          command -v xvfb-run
          command -v xauth
      - uses: ./.github/actions/playwright
        with:
          version: "1.62.0"
      - name: Assert pristine source before test execution
        run: |
          python3 - <<'PYSTATUS'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          receipt = dict(candidate_sha=git('rev-parse', 'HEAD'), candidate_tree=git('rev-parse', 'HEAD^{tree}'), status=git('status', '--porcelain', '--untracked-files=all'))
          (output / 'source-before.json').write_text(json.dumps(receipt, indent=2))
          assert receipt['candidate_sha'] == os.environ['PLURX_TEST_CANDIDATE_SHA']
          assert receipt['candidate_tree'] == os.environ['PLURX_TEST_CANDIDATE_TREE']
          assert not receipt['status'], 'Checkout must remain clean; see source-before.json'
          PYSTATUS
      - name: Begin candidate-bound resource recording
        continue-on-error: true
        run: python3 -m validation.baseline_resources start --output "$PLURX_BASELINE_DIR/resources" --cell "browser-$CONTINUATION_CELL"
      - name: Execute exact frozen browser command with original exit evidence
        run: python3 -m validation.baseline_commands --manifest "$PLURX_BASELINE_DIR/command-manifest.json" --output "$PLURX_BASELINE_DIR/commands"
      - name: Assert pristine source after test execution
        if: always() && env.PLURX_BASELINE_DIR != ''
        run: |
          python3 - <<'PYAFTER'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          receipt = dict(candidate_sha=git('rev-parse', 'HEAD'), candidate_tree=git('rev-parse', 'HEAD^{tree}'), status=git('status', '--porcelain', '--untracked-files=all'))
          (output / 'source-after.json').write_text(json.dumps(receipt, indent=2))
          assert receipt['candidate_sha'] == os.environ['PLURX_TEST_CANDIDATE_SHA']
          assert receipt['candidate_tree'] == os.environ['PLURX_TEST_CANDIDATE_TREE']
          assert not receipt['status'], 'Checkout changed; see source-after.json'
          PYAFTER
      - name: Finish candidate-bound resource recording
        if: always() && env.PLURX_BASELINE_DIR != ''
        continue-on-error: true
        run: python3 -m validation.baseline_resources finish --output "$PLURX_BASELINE_DIR/resources"
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          if [ "${PLURX_WORKSPACE_MODE:-}" = persistent-bind ] && [ -n "${HOST_WORKSPACE_OWNER:-}" ]; then
            chown -R "$HOST_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          fi
      - name: Preserve frozen browser continuation evidence
        if: always() && env.PLURX_BASELINE_DIR != ''
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: browser-continuation-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-suite-baseline
          if-no-files-found: error
          retention-days: 14
