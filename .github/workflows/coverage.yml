name: coverage

# Manual diagnostics share the existing capacity-one full-unit registration.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: coverage-main
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: [self-hosted, Linux, X64, lab, unit-memory-16g]
    # The existing :host registration launches one bounded standard Docker child.
    # Fixed default, sharing and replicated corpora need more than the old 120m.
    timeout-minutes: 240
    if: github.ref == 'refs/heads/main'
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: llvm-tools-preview
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: coverage
      - name: Measure line coverage
        env:
          # Ubuntu 24.04, the same resolved base used for the repair measurement.
          COVERAGE_IMAGE: ubuntu@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/target/unit-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scripts/unit-coverage --image "$COVERAGE_IMAGE" \
            --cache-root "${{ steps.cargo-cache.outputs.cache-root }}" --output "$output"
          cp -- "$output/cov.json" cov.json
      - name: Publish the unit coverage badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pct=$(jq -er '.data[0].totals.lines.percent | select(type == "number" and . >= 0 and . <= 100)' cov.json)
          receipt="$GITHUB_WORKSPACE/target/unit-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/receipt.json"
          measured_on=$(python3 - "$receipt" <<'PYTHON'
          import json
          import sys
          from datetime import datetime, timezone
          with open(sys.argv[1]) as source:
              timestamp = datetime.fromisoformat(json.load(source)["measured_at_utc"].replace("Z", "+00:00"))
          if timestamp.tzinfo is None or timestamp.utcoffset() is None:
              raise ValueError("measurement timestamp must include its timezone")
          print(timestamp.astimezone(timezone.utc).date().isoformat())
          PYTHON
          )
          msg=$(printf '%.1f' "$pct"); int=${msg%.*}
          if   [ "$int" -ge 90 ]; then color=brightgreen; fill='#4c1'
          elif [ "$int" -ge 75 ]; then color=green;       fill='#97ca00'
          elif [ "$int" -ge 55 ]; then color=yellowgreen; fill='#a4a61d'
          elif [ "$int" -ge 40 ]; then color=yellow;      fill='#dfb317'
          elif [ "$int" -ge 20 ]; then color=orange;      fill='#fe7d37'
          else color=red; fill='#e05d44'; fi
          scripts/publish-badge \
            --branch badges \
            --alias codex/badges \
            --filename coverage \
            --receipt "$receipt" \
            --label "unit coverage" \
            --message "${msg}% · ${measured_on} UTC" \
            --fill "$fill" \
            --json-color "$color" \
            --label-width 91 \
            --message-width 188
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
