name: coverage

# Refresh the diagnostic badge independently of the manual full-CI sweep.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: coverage-main
  # Let a measurement finish even while main is busy. Pending runs coalesce;
  # each checks out current main when it starts, including manual retries.
  cancel-in-progress: false

jobs:
  coverage:
    name: coverage
    # Available general runners carry FFmpeg 8. Supply the pinned FFmpeg 6
    # environment in a container, as the main fast Rust lane does.
    runs-on: [self-hosted, Linux, X64, lab, general, high-cpu]
    container: ubuntu:24.04
    # Instrumented cold builds need headroom beyond the ordinary unit lane.
    # The uninstrumented suite alone grew to ~55 minutes in the week of
    # 2026-09-27 (the fast lane went 35 -> 60 -> 90). Runs 4087, 4103, 4106 and
    # 4115 were all cut off at exactly 45:00 inside the llvm-cov step,
    # still passing tests, so a 45-minute bound could no longer finish.
    timeout-minutes: 120
    # Manual runs on other refs must never overwrite the main badge.
    if: github.ref == 'refs/heads/main'
    # Private-repository coverage badge — no codecov.io account or token.
    # Measure the runner-neutral fast lane and force-push both the endpoint JSON
    # and a directly renderable SVG to an orphan `badges` branch. The README's
    # branch-relative URL resolves through either Forgejo or GitHub, so each host
    # authenticates the private image request itself.
    steps:
      - name: Install coverage prerequisites
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl git jq lld llvm \
            make nasm ninja-build nodejs pkg-config python3
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A queued or retried run measures current main, never an older event.
          ref: main
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: llvm-tools-preview
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: coverage
      - uses: https://github.com/taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
      # Instrumented tests need the same ffmpeg as the regular Rust unit lane.
      - uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Measure line coverage
        # Tests intentionally terminate helper processes. A helper can leave one
        # truncated .profraw behind even though the suite and every other profile
        # completed; merge the valid profiles, but still fail if none are valid.
        run: >-
          cargo llvm-cov --workspace --locked --exclude plurx-cluster-check
          --no-fail-fast --summary-only --json --output-path cov.json --failure-mode all
      - name: Publish the unit coverage badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pct=$(jq -er '.data[0].totals.lines.percent | select(type == "number" and . >= 0 and . <= 100)' cov.json)
          measured_on=$(date -u +%F)
          msg=$(printf '%.1f' "$pct"); int=${msg%.*}
          if   [ "$int" -ge 90 ]; then color=brightgreen; fill='#4c1'
          elif [ "$int" -ge 75 ]; then color=green;       fill='#97ca00'
          elif [ "$int" -ge 55 ]; then color=yellowgreen; fill='#a4a61d'
          elif [ "$int" -ge 40 ]; then color=yellow;      fill='#dfb317'
          elif [ "$int" -ge 20 ]; then color=orange;      fill='#fe7d37'
          else color=red; fill='#e05d44'; fi
          scripts/publish-badge \
            --branch badges \
            --alias codex/badges \
            --filename coverage \
            --label "unit coverage" \
            --message "${msg}% · ${measured_on} UTC" \
            --fill "$fill" \
            --json-color "$color" \
            --label-width 91 \
            --message-width 188
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"
