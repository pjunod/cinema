name: ARM64 runner qualification
on:
  push:
    branches: [codex/arm64-runner-canary-20261119]

env:
  CARGO_TERM_COLOR: always

jobs:
  package_smoke:
    name: package and smoke (${{ matrix.arch }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    concurrency:
      group: ${{ matrix.arch == 'arm64' && 'plurx-apple-silicon-heavy' || format('plurx-package-{0}-{1}', github.run_id, matrix.arch) }}
      cancel-in-progress: false
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            kernel_machine: aarch64
            docker_machine: aarch64
            runs_on: '["self-hosted","Linux","ARM64","lab","release-arm64"]'
    steps:
      - name: Verify effective nonvoter resource bounds
        if: matrix.arch == 'amd64'
        shell: sh
        run: |
          set -eu
          cgroup_membership=/proc/self/cgroup
          cgroup_mount=/sys/fs/cgroup
          # Exactly one unified (cgroup v2) line; unrelated v1 hierarchies such as a
          # VPN's net_cls may precede it on hybrid hosts and are ignored.
          relative=
          while IFS=: read -r hierarchy controllers path; do
            if [ "$hierarchy" = 0 ]; then
              if [ -n "$relative" ] || [ -n "$controllers" ]; then exit 1; fi
              relative=$path
            fi
          done < "$cgroup_membership"
          case "$relative" in /*) ;; *) exit 1 ;; esac
          case "/$relative/" in */../*|*/./*) exit 1 ;; esac
          cgroup_root="$cgroup_mount$relative"
          for limit in memory.max=21474836480 memory.swap.max=0 'cpu.max=400000 100000' cpuset.cpus.effective=0-3 pids.max=4096; do
            name=${limit%%=*}
            expected=${limit#*=}
            actual="$(cat "$cgroup_root/$name")"
            if [ "$actual" != "$expected" ]; then
              printf '%s\n' "Unexpected effective $name: $actual (required $expected)" >&2
              exit 1
            fi
          done
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove the package runner and Docker engine are native
        env:
          ARCH: ${{ matrix.arch }}
          DOCKER_ARCH: ${{ matrix.docker_machine }}
          KERNEL_ARCH: ${{ matrix.kernel_machine }}
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = "Linux/$KERNEL_ARCH"
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = "linux/$DOCKER_ARCH"
      - id: buildx-cache
        uses: ./.github/actions/buildx-cache
        with:
          lane: package-smoke-${{ matrix.arch }}
      - name: Bound the AMD package builder before compilation
        if: matrix.arch == 'amd64'
        env:
          BUILDER: ${{ steps.buildx-cache.outputs.builder-name }}
        run: |
          set -euo pipefail
          [[ "$BUILDER" =~ ^plurx-[a-z0-9_.-]+$ ]] || exit 1
          builder_info="$(docker buildx inspect "$BUILDER" | python3 -c 'import sys; data = sys.stdin.buffer.read(65537); len(data) <= 65536 or sys.exit("Buildx inspection exceeds 64 KiB"); sys.stdout.buffer.write(data)')"
          printf '%s\n' "$builder_info" | awk -v expected="$BUILDER" '
            /^Nodes:[[:space:]]*$/ { nodes = 1 }
            !nodes && /^[[:space:]]*Name[[:space:]]*:/ {
              names++
              if ($0 !~ /^Name:[[:space:]]+/) invalid = 1
              value = $0
              sub(/^Name:[[:space:]]*/, "", value)
              sub(/[[:space:]]*$/, "", value)
              if (value != expected) invalid = 1
            }
            !nodes && /^[[:space:]]*Driver[[:space:]]*:/ {
              drivers++
              if ($0 !~ /^Driver:[[:space:]]+/) invalid = 1
              value = $0
              sub(/^Driver:[[:space:]]*/, "", value)
              sub(/[[:space:]]*$/, "", value)
              if (value != "docker-container") invalid = 1
            }
            END { if (names != 1 || drivers != 1 || !nodes || invalid) exit 1 }
          '
          container="buildx_buildkit_${BUILDER}0"
          test "$(docker inspect --format '{{.Name}}' "$container")" = "/$container"
          # This dedicated nonvoter builder shares the verified 20-GiB budget.
          # Bound its sibling container independently of the runner service.
          docker update --memory 20g --memory-swap 20g --pids-limit 4096 --cpuset-cpus 0-3 --cpu-period 100000 --cpu-quota 400000 "$container"
          test "$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.CpuQuota}} {{.HostConfig.CpuPeriod}} {{.HostConfig.CpusetCpus}} {{.HostConfig.PidsLimit}}' "$container")" = '21474836480 21474836480 400000 100000 0-3 4096'
      - name: Derive the binary-only Bookworm build
        id: binary-build
        run: |
          python3 -m validation.release_dockerfile --binary-export \
            Dockerfile Dockerfile.binaries
          echo "source_date_epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compile and export the exact candidate binaries
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx-cache.outputs.builder-name }}
          context: .
          file: Dockerfile.binaries
          target: release-binaries
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=binary-export
          build-args: |
            PLURX_BUILD_REF=${{ github.sha }}
            PLURX_BUILD_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.binary-build.outputs.source_date_epoch }}
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,scope=package-compile-{0}', matrix.arch) || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,mode=max,scope=package-compile-{0}', matrix.arch) || '' }}
      - name: Bind the binary set to this candidate tree
        run: |
          scripts/release-package-candidate \
            . . binary-export release-bin \
            "${{ matrix.target }}" "$GITHUB_SHA" "$GITHUB_SHA"
          for name in plurxd plurx-cluster-check; do
            max_glibc=$(readelf --version-info "release-bin/$name" \
              | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
              | sort -V | tail -1)
            test -n "$max_glibc"
            test "$(printf '%s\n' "$max_glibc" 2.36 | sort -V | tail -1)" = 2.36 || {
              echo "::error::${{ matrix.arch }} $name requires GLIBC_$max_glibc; Bookworm provides 2.36"
              exit 1
            }
          done
      # Dockerfile.release starts FROM the private, digest-pinned media
      # runtime; its builder needs the same fleet credential the publishers use.
      - name: Authenticate the runtime build to the private media-runtime registry
        uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
          username: fleet
          password: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
      - name: Build the runtime from only the verified binaries
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx-cache.outputs.builder-name }}
          context: .
          file: Dockerfile.release
          build-args: |
            PLURX_MEDIA_RUNTIME_REPOSITORY=${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-media-runtime
          push: false
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: plurx/plurxd:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            tv.plurx.build-ref=${{ github.sha }}
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,scope=package-runtime-{0}', matrix.arch) || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,mode=min,scope=package-runtime-{0}', matrix.arch) || '' }}
      - name: Verify architecture, identity, and stop/start runtime
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: plurx/plurxd:ci-${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/$ARCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test "$(docker run --rm --platform "linux/$ARCH" "$IMAGE" --version)" = "plurxd $version ($GITHUB_SHA)"
          test "$(docker run --rm --platform "linux/$ARCH" \
            --entrypoint /usr/local/bin/plurx-cluster-check \
            "$IMAGE" build-identity)" = "$GITHUB_SHA"
          scripts/container-smoke "$IMAGE"
      - name: Back up the running image and restore it into a fresh container
        env:
          IMAGE: plurx/plurxd:ci-${{ matrix.arch }}
        run: scripts/container-restore-smoke "$IMAGE"
      - name: Retain the exact package receipt
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: package-smoke-receipt-${{ matrix.arch }}
          path: |
            release-bin/build-manifest.json
            release-bin/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Bound persistent BuildKit state
        if: always() && steps.buildx-cache.outputs.local == 'true'
        env:
          BUILDER_NAME: ${{ steps.buildx-cache.outputs.builder-name }}
        run: scripts/ci-buildkit-prune "$BUILDER_NAME" 50

  # CD validates the tag in this workflow, then delegates artifact construction,
  # per-platform smoke, and alias publication to the manually recoverable release
  # workflow. A cancelled tag run can therefore be recovered without moving it.
