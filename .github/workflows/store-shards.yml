name: replicated Store shards

# Both triggers populate the `inputs` context and both declare
# `execution-mode`, so every expression below reads that one resolved value.
# `github.event.inputs` is deliberately never used: it is populated only for
# `workflow_dispatch` and would be silently empty on every `workflow_call`,
# which is how a rollout switch turns into a no-op nobody notices.
on:
  workflow_call:
    inputs:
      execution-mode:
        description: Validated rollout mode selected by the caller.
        required: true
        type: string
  # Proving the sharded path must not cost pull-request traffic. A manual run
  # exercises these exact jobs on the real fleet and defaults to `shadow`, so
  # the rehearsal stays advisory until someone deliberately asks for the
  # required shape. Run this before `scripts/ci-execution-mode accelerated`,
  # not after.
  workflow_dispatch:
    inputs:
      execution-mode:
        description: Rollout mode to rehearse. `shadow` keeps the run advisory.
        required: false
        default: shadow
        type: choice
        options:
          - shadow
          - accelerated

permissions:
  contents: read

jobs:
  shard:
    name: replicated Store shard ${{ matrix.shard_index }}
    # Every shard selects the same label set, so a shard cannot be pinned to a
    # runner class of its own — which is precisely how shard 1 came to ask for
    # `ci-store-shard-1`, a label no runner has ever carried, and would have
    # queued every pull request forever the moment this path became required.
    # `validation/runner-fleet.toml` now says what the fleet carries and
    # `make operations-check` rejects a label no rostered runner answers to.
    runs-on: [self-hosted, Linux, X64, lab, ci-store]
    timeout-minutes: 40
    continue-on-error: ${{ inputs.execution-mode == 'shadow' }}
    env:
      # The shard count lives here once and both `validation.store_shard`
      # invocations read it. The matrix below is the only other place the
      # number appears, because a matrix cannot be built from `env` — and a
      # mismatch between the two still fails closed rather than silently
      # dropping tests: `validation/store_shard.py` rejects a receipt set whose
      # size or index set disagrees with the count the receipts declare.
      #
      # Three, because the fleet carries three `ci-store` slots and one physical
      # host may hold only one — so this number is bounded by eligible hosts
      # rather than chosen, and `make operations-check` fails when it exceeds
      # the slots `validation/runner-fleet.toml` records. The floor is two,
      # enforced by `validation/store_shard.py` in `assigned_tests` and again
      # in the aggregate validator, so the count can track the fleet up and
      # down without ever collapsing into a single unsharded job wearing the
      # sharded lane's name.
      SHARD_COUNT: "3"
    strategy:
      fail-fast: false
      matrix:
        # One shard per `ci-store` slot: `nuc1`, `rogg16` and `nuc2`, one per
        # physical non-voter host. Keep this list and SHARD_COUNT in step —
        # `make operations-check` fails when they disagree, and when the count
        # exceeds the number of slots the fleet actually carries.
        shard_index: [0, 1, 2]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - id: buildx-cache
        uses: ./.github/actions/buildx-cache
        with:
          lane: cluster-store-shard-${{ matrix.shard_index }}
          execution-mode: ${{ inputs.execution-mode }}
          persistent-eligible: "true"
      - name: Build the exact Store test binary
        id: build_store_binary
        continue-on-error: true
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.store-shard
          target: store-contract-binary
          platforms: linux/amd64
          outputs: type=local,dest=store-contract-export
          build-args: |
            PLURX_BUILD_REF=${{ github.sha }}
            PLURX_BUILD_SHA=${{ github.sha }}
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,scope=cluster-store-shard-{0}', matrix.shard_index) || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,mode=max,scope=cluster-store-shard-{0}', matrix.shard_index) || '' }}
      - name: Run the assigned Store tests once
        id: store_shard
        if: steps.build_store_binary.outcome == 'success'
        continue-on-error: true
        run: >-
          python3 -m validation.store_shard run
          --binary store-contract-export/store_contract
          --rustc-vv store-contract-export/rustc-vv.txt
          --receipt target/validation/cluster-store-shard-${{ matrix.shard_index }}-receipt.json
          --log target/validation/cluster-store-shard-${{ matrix.shard_index }}.log
          --shard-count "$SHARD_COUNT"
          --shard-index ${{ matrix.shard_index }}
      - name: Record a Store binary build failure
        if: always() && steps.build_store_binary.outcome != 'success'
        run: >-
          python3 -m validation.store_shard record-failure
          --receipt target/validation/cluster-store-shard-${{ matrix.shard_index }}-receipt.json
          --log target/validation/cluster-store-shard-${{ matrix.shard_index }}.log
          --shard-count "$SHARD_COUNT"
          --shard-index ${{ matrix.shard_index }}
          --error "Store test binary build failed"
      - name: Retain the Store shard log and receipt
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: cluster-store-shard-${{ matrix.shard_index }}
          path: |
            target/validation/cluster-store-shard-${{ matrix.shard_index }}.log
            target/validation/cluster-store-shard-${{ matrix.shard_index }}-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Bound persistent BuildKit state
        if: always() && steps.buildx-cache.outputs.local == 'true'
        env:
          BUILDER_NAME: ${{ steps.buildx-cache.outputs.builder-name }}
        run: scripts/ci-buildkit-prune "$BUILDER_NAME" 50
      - name: Propagate the Store shard result
        if: >-
          always() &&
          (steps.build_store_binary.outcome != 'success' ||
          steps.store_shard.outcome != 'success')
        run: exit 1

  aggregate:
    name: replicated Store shard union
    needs: shard
    if: always()
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 3
    continue-on-error: ${{ inputs.execution-mode == 'shadow' }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download every Store shard receipt
        id: download_store_shards
        continue-on-error: true
        uses: https://data.forgejo.org/actions/download-artifact@v4
        with:
          pattern: cluster-store-shard-*
          path: target/validation/store-shards
          merge-multiple: true
      - name: Prove Store shard union and disjointness
        id: validate_store_shards
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/validation
          python3 -m validation.store_shard validate \
            --receipts-directory target/validation/store-shards \
            --output target/validation/cluster-store-shard-aggregate.json \
            2>&1 | tee target/validation/cluster-store-shard-aggregate.log
      - name: Retain the Store shard aggregate
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: cluster-store-shard-aggregate
          path: |
            target/validation/cluster-store-shard-aggregate.log
            target/validation/cluster-store-shard-aggregate.json
          if-no-files-found: error
          retention-days: 14
      - name: Propagate the Store shard aggregate result
        if: >-
          always() &&
          (needs.shard.result != 'success' ||
          steps.download_store_shards.outcome != 'success' ||
          steps.validate_store_shards.outcome != 'success')
        run: exit 1
