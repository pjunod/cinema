name: async proof session

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Registered unit or current Main completion
        type: choice
        options: [unit, complete]
        required: true
      operation:
        description: Capability probe or authenticated execution
        type: choice
        options: [probe, execute]
        required: true
      registration_sha256:
        description: Exact source and producer registration digest
        required: true
      control:
        description: Closed immutable admission and ordered predecessor run chain
        required: true

# Units never overlap within a session. A failed unit keeps the preceding root.
concurrency:
  group: async-proof-${{ github.event.inputs.registration_sha256 }}
  cancel-in-progress: false

jobs:
  unit:
    name: async proof session producer
    if: github.event.inputs.mode == 'unit'
    # Reserved dedicated route; provisioning and live uniqueness are prerequisites.
    runs-on: [self-hosted, Linux, X64, lab, general, high-cpu, async-proof-owned]
    container:
      image: ubuntu:24.04
      volumes:
        - /srv/plurx-async-proof:/srv/plurx-async-proof
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Install pinned-runtime prerequisites
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl git libssl-dev lld llvm \
            libgtk-4-dev libdbus-1-dev make nasm ninja-build nodejs pkg-config python3
      - name: Check out the registered candidate
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Register source-bound capability post-action fixture
        if: github.event.inputs.operation == 'probe'
        uses: ./.github/actions/async-proof-capability
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          LD_PRELOAD: ""
          DYLD_INSERT_LIBRARIES: ""
      - name: Install the pinned Rust compiler
        uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Install pinned FFmpeg
        uses: ./.github/actions/ffmpeg
        with:
          major: "6"
      - name: Restore the owned compiler slot
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: async-proof-session
      - name: Provision locked offline inputs
        run: |
          set -euo pipefail
          cargo +1.97.1 fetch --locked --manifest-path Cargo.toml
          cargo +1.97.1 fetch --locked --offline --manifest-path Cargo.toml
          git diff --exit-code -- Cargo.lock
          python3 scripts/bootstrap-formal-toolchain fetch --cache-dir target/formal-toolchain
      - name: Authenticate and execute the registered protocol
        id: session
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m validation.async_refinement_session runner
      - name: Native immutable part 0
        if: steps.session.outputs.part_0_name != ''
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ steps.session.outputs.part_0_name }}
          path: ${{ steps.session.outputs.part_0_path }}
