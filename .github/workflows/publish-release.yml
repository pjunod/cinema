name: publish release image
run-name: publish ${{ inputs.release_tag }}

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated vX.Y.Z tag to publish without moving it
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurxd
  REGISTRY_RUNTIME_IMAGE: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-media-runtime

jobs:
  resolve:
    name: resolve immutable release source
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      tag_object: ${{ steps.release.outputs.tag_object }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_minor: ${{ steps.release.outputs.release_minor }}
      packaging_sha: ${{ steps.release.outputs.packaging_sha }}
      version_exists: ${{ steps.registry.outputs.version_exists }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate and peel the annotated release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$EVENT_REF" != refs/heads/main ]; then
            echo "::error::manual release recovery must run from refs/heads/main"
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be exactly vX.Y.Z"
            exit 1
          }
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag || {
            echo "::error::$RELEASE_TAG must be an annotated tag"
            exit 1
          }
          tag_object=$(git rev-parse "refs/tags/$RELEASE_TAG")
          commit_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          release_version="${RELEASE_TAG#v}"
          cargo_ver=$(git show "$commit_sha:Cargo.toml" \
            | sed -n '/^\[workspace.package\]/,/^\[/p' \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test "$cargo_ver" = "$release_version" || {
            echo "::error::$RELEASE_TAG does not match workspace version $cargo_ver"
            exit 1
          }
          # No `grep -q`: it exits at the first match, and once CHANGELOG.md
          # outgrows the pipe buffer the SIGPIPE it leaves `git show` with fails
          # this pipeline under pipefail, refusing a heading that is there
          # (v0.7.0, a 222 KB changelog, 2026-10-17).
          # Anchored: `### [X.Y.Z]` or a mention mid-line is not the heading.
          git show "$commit_sha:CHANGELOG.md" \
            | grep -E "^## \[${release_version//./\\.}\]( |$)" >/dev/null || {
            echo "::error::CHANGELOG.md has no $release_version release heading"
            exit 1
          }
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$commit_sha")" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_minor=${release_version%.*}" >> "$GITHUB_OUTPUT"
          echo "packaging_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            # The fleet registry is deliberately plain HTTP on the private LAN. A
            # BuildKit container does not inherit Docker daemon insecure-registry
            # settings, so the builder needs the same trust decision explicitly.
            # Only requests to this exact address are affected.
            [registry."${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}"]
              http = true
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
          username: fleet
          password: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
      - name: Detect an existing immutable version index
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          is_missing_ref() {
            local ref="$1" err="$2"
            grep -Eqi 'manifest unknown|name unknown' "$err" ||
              { grep -Fq "$ref" "$err" && grep -Eqi '(^|[[:space:]:])not found([[:space:].:]|$)' "$err"; }
          }
          version_ref="$REGISTRY_IMAGE:$RELEASE_VERSION"
          if docker buildx imagetools inspect "$version_ref" \
              > /dev/null 2> inspect.err; then
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif is_missing_ref "$version_ref" inspect.err; then
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
          else
            cat inspect.err >&2
            echo "::error::registry state is indeterminate; refusing to publish"
            exit 1
          fi

  image:
    name: build, package, and smoke (${{ matrix.arch }})
    needs: resolve
    if: >-
      always() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.version_exists != 'true'
    # Each leg builds on its own architecture. arm64 runs on the native
    # aarch64 Linux VM on the M4 lab Mac, never under QEMU on an X64 host:
    # emulated C/C++ stages (FFmpeg, the subtitle engine) overran their build
    # guards there (v0.7.0, runs 5384 and 5399; #1163).
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runs_on: '["ci-nonvoter-heavy-amd64"]'
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runs_on: '["self-hosted", "Linux", "ARM64", "lab", "release-arm64"]'
    steps:
      - name: Verify effective nonvoter resource bounds
        if: matrix.arch == 'amd64'
        shell: sh
        run: |
          set -eu
          cgroup_membership=/proc/self/cgroup
          cgroup_mount=/sys/fs/cgroup
          # Exactly one unified (cgroup v2) line; unrelated v1 hierarchies such as a
          # VPN's net_cls may precede it on hybrid hosts and are ignored.
          relative=
          while IFS=: read -r hierarchy controllers path; do
            if [ "$hierarchy" = 0 ]; then
              if [ -n "$relative" ] || [ -n "$controllers" ]; then exit 1; fi
              relative=$path
            fi
          done < "$cgroup_membership"
          case "$relative" in /*) ;; *) exit 1 ;; esac
          case "/$relative/" in */../*|*/./*) exit 1 ;; esac
          cgroup_root="$cgroup_mount$relative"
          for limit in memory.max=21474836480 memory.swap.max=0 'cpu.max=400000 100000' cpuset.cpus.effective=0-3 pids.max=4096; do
            name=${limit%%=*}
            expected=${limit#*=}
            actual="$(cat "$cgroup_root/$name")"
            if [ "$actual" != "$expected" ]; then
              printf '%s\n' "Unexpected effective $name: $actual (required $expected)" >&2
              exit 1
            fi
          done
      - name: Check out the trusted packaging tool
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.packaging_sha }}
          path: trusted-packaging
      - name: Check out the exact tagged source
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.commit_sha }}
          path: release-source
      - name: Derive the binary-only Bookworm build from the tagged source
        run: >-
          PYTHONPATH="$GITHUB_WORKSPACE/trusted-packaging"
          python3 -m validation.release_dockerfile --binary-export
          release-source/Dockerfile release-source/Dockerfile.binaries
      - uses: https://github.com/docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - id: release-builder
        uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: plurx-publish-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          buildkitd-config-inline: |
            # The fleet registry is deliberately plain HTTP on the private LAN. A
            # BuildKit container does not inherit Docker daemon insecure-registry
            # settings, so the builder needs the same trust decision explicitly.
            # Only requests to this exact address are affected.
            [registry."${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}"]
              http = true
      - name: Bound the AMD publisher builder before compilation
        if: matrix.arch == 'amd64'
        env:
          BUILDER: ${{ steps.release-builder.outputs.name }}
        run: |
          set -euo pipefail
          [[ "$BUILDER" =~ ^plurx-[a-z0-9_.-]+$ ]] || exit 1
          builder_info="$(docker buildx inspect "$BUILDER" | python3 -c 'import sys; data = sys.stdin.buffer.read(65537); len(data) <= 65536 or sys.exit("Buildx inspection exceeds 64 KiB"); sys.stdout.buffer.write(data)')"
          printf '%s\n' "$builder_info" | awk -v expected="$BUILDER" '
            /^Nodes:[[:space:]]*$/ { nodes = 1 }
            !nodes && /^[[:space:]]*Name[[:space:]]*:/ {
              names++
              if ($0 !~ /^Name:[[:space:]]+/) invalid = 1
              value = $0
              sub(/^Name:[[:space:]]*/, "", value)
              sub(/[[:space:]]*$/, "", value)
              if (value != expected) invalid = 1
            }
            !nodes && /^[[:space:]]*Driver[[:space:]]*:/ {
              drivers++
              if ($0 !~ /^Driver:[[:space:]]+/) invalid = 1
              value = $0
              sub(/^Driver:[[:space:]]*/, "", value)
              sub(/[[:space:]]*$/, "", value)
              if (value != "docker-container") invalid = 1
            }
            END { if (names != 1 || drivers != 1 || !nodes || invalid) exit 1 }
          '
          container="buildx_buildkit_${BUILDER}0"
          test "$(docker inspect --format '{{.Name}}' "$container")" = "/$container"
          # This dedicated nonvoter builder shares the verified 20-GiB budget.
          # Bound its sibling container independently of the runner service.
          docker update --memory 20g --memory-swap 20g --pids-limit 4096 --cpuset-cpus 0-3 --cpu-period 100000 --cpu-quota 400000 "$container"
          test "$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.CpuQuota}} {{.HostConfig.CpuPeriod}} {{.HostConfig.CpusetCpus}} {{.HostConfig.PidsLimit}}' "$container")" = '21474836480 21474836480 400000 100000 0-3 4096'
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
          username: fleet
          password: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
      - name: Select the tagged media source contract
        id: media-contract
        env:
          ARCH: ${{ matrix.arch }}
          MEDIA_REGISTRY: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
        run: |
          set -euo pipefail
          pinned_runtime=$(PYTHONPATH="$GITHUB_WORKSPACE/trusted-packaging" \
            python3 -m validation.release_dockerfile --print-runtime-image --media-registry "$MEDIA_REGISTRY" release-source/Dockerfile)
          echo "pinned_runtime=$pinned_runtime" >> "$GITHUB_OUTPUT"
          required=false
          # Historical tags keep their original inline runtime build contract.
          if test -z "$pinned_runtime" && test "$ARCH" = amd64 && grep -qx 'FROM scratch AS linux-dolby-package-export' release-source/Dockerfile; then
            required=true
          fi
          echo "dolby_required=$required" >> "$GITHUB_OUTPUT"
      - name: Build and export the exact audited Bookworm media package
        if: steps.media-contract.outputs.dolby_required == 'true'
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.release-builder.outputs.name }}
          context: release-source
          file: release-source/Dockerfile
          target: linux-dolby-package-export
          platforms: linux/amd64
          outputs: type=local,dest=linux-dolby-export
          provenance: false
          sbom: false
      - name: Publish the historical inline platform runtime by immutable digest
        id: legacy-runtime
        if: steps.media-contract.outputs.pinned_runtime == ''
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.release-builder.outputs.name }}
          context: release-source
          file: release-source/Dockerfile
          target: ${{ steps.media-contract.outputs.dolby_required == 'true' && 'runtime-assets-dolby-amd64' || 'runtime-assets' }}
          build-contexts: ${{ steps.media-contract.outputs.dolby_required == 'true' && 'linux-dolby-package=./linux-dolby-export/package' || '' }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY_RUNTIME_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Select the immutable runtime without rebuilding current dependencies
        id: runtime
        env:
          PINNED_RUNTIME: ${{ steps.media-contract.outputs.pinned_runtime }}
          LEGACY_RUNTIME_DIGEST: ${{ steps.legacy-runtime.outputs.digest }}
        run: |
          set -euo pipefail
          runtime_ref="$PINNED_RUNTIME"
          if test -z "$runtime_ref"; then
            test -n "$LEGACY_RUNTIME_DIGEST"
            runtime_ref="$REGISTRY_RUNTIME_IMAGE@$LEGACY_RUNTIME_DIGEST"
          fi
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
          echo "digest=${runtime_ref##*@}" >> "$GITHUB_OUTPUT"
      - name: Check the selected runtime and record its packages
        env:
          ARCH: ${{ matrix.arch }}
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          runtime_ref="$RUNTIME_REF"
          docker pull --platform "linux/$ARCH" "$runtime_ref"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$runtime_ref")" = "linux/$ARCH"
          docker run --rm --platform "linux/$ARCH" --entrypoint cat "$runtime_ref" \
            /usr/share/doc/plurx/media-runtime-packages.txt > runtime-packages.txt
          grep -q '^jellyfin-ffmpeg8=8.1.3-1-bookworm$' runtime-packages.txt
          grep -q '^mkvtoolnix=74.0.0-1$' runtime-packages.txt
      - name: Require audited amd64 provenance for the pinned release runtime
        if: matrix.arch == 'amd64' && steps.media-contract.outputs.pinned_runtime != ''
        env:
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint sh "$RUNTIME_REF" -eu -c '
            provenance=/usr/lib/jellyfin-ffmpeg/provenance
            if ! test -s "$provenance/linux-dolby-package.json" || ! test -s "$provenance/shipping-system-elf-sha256.txt"; then
              echo "::error::Pinned amd64 runtime lacks audited Dolby shipping provenance. Publish and promote an audited media base before releasing." >&2
              exit 1
            fi
            sha256sum -c "$provenance/shipping-system-elf-sha256.txt"
            if dpkg-query -W -f="\${db:Status-Status}" libmfx1 2>/dev/null | grep -qx installed; then
              echo "::error::Pinned amd64 runtime still contains the competing Debian Media SDK." >&2
              exit 1
            fi
          '
          audit_dir=$(mktemp -d "$RUNNER_TEMP/pinned-media-audit.XXXXXX")
          audit_container=$(docker create --platform linux/amd64 "$RUNTIME_REF" /unused)
          trap 'docker rm -f "$audit_container" >/dev/null; rm -rf "$audit_dir"' EXIT HUP INT TERM
          mkdir -p "$audit_dir/provenance"
          for name in ffmpeg ffprobe lib; do
            docker cp "$audit_container:/usr/lib/jellyfin-ffmpeg/$name" "$audit_dir/$name"
          done
          docker cp "$audit_container:/usr/local/lib/plurx/ffprobe" "$audit_dir/sealed-ffprobe"
          for name in linux-dolby-package.json system-elf-sha256.txt shipping-system-elf-sha256.txt; do
            docker cp "$audit_container:/usr/lib/jellyfin-ffmpeg/provenance/$name" "$audit_dir/provenance/$name"
          done
          python3 trusted-packaging/scripts/build-linux-dolby-ffmpeg --step verify-shipping \
            --root "$audit_dir" --output "$audit_dir"
      - name: Compile and export the exact tagged binaries
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.release-builder.outputs.name }}
          context: release-source
          file: release-source/Dockerfile.binaries
          target: release-binaries
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=release-source/binary-export
          build-args: |
            PLURX_BUILD_REF=${{ needs.resolve.outputs.release_tag }}
            PLURX_BUILD_SHA=${{ needs.resolve.outputs.commit_sha }}
            SOURCE_DATE_EPOCH=${{ needs.resolve.outputs.source_date_epoch }}
      - name: Bind the binary set to the tagged tree and verify its ABI
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          set -euo pipefail
          trusted-packaging/scripts/release-package-candidate \
            release-source trusted-packaging \
            release-source/binary-export release-source/release-bin \
            "$TARGET" "$RELEASE_TAG" "$SOURCE_SHA"
          while IFS= read -r name; do
            binary="release-source/release-bin/$name"
            test "$(file -b "$binary")" != ""
            max_glibc=$(readelf --version-info "$binary" \
              | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
              | sort -V | tail -1)
            test -n "$max_glibc"
            test "$(printf '%s\n' "$max_glibc" 2.36 | sort -V | tail -1)" = 2.36 || {
              echo "::error::$ARCH $name requires GLIBC_$max_glibc; Bookworm provides 2.36"
              exit 1
            }
          done < <(
            PYTHONPATH="$GITHUB_WORKSPACE/trusted-packaging" \
              python3 -m validation.release_dockerfile --list-binaries \
              release-source/Dockerfile
          )
      - name: Bind release packaging to the selected runtime digest
        env:
          RUNTIME_REF: ${{ steps.runtime.outputs.ref }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/trusted-packaging" \
            python3 -m validation.release_dockerfile \
            --runtime-image "$RUNTIME_REF" \
            release-source/Dockerfile release-source/Dockerfile.release
          grep -Fq "FROM $RUNTIME_REF AS runtime-assets" \
            release-source/Dockerfile.release
      - name: Build and push the untagged platform manifest
        id: build
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.release-builder.outputs.name }}
          context: release-source
          file: release-source/Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PLURX_BUILD_SHA=${{ needs.resolve.outputs.commit_sha }}
            PLURX_MEDIA_RUNTIME_DIGEST=${{ steps.runtime.outputs.digest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.release_version }}
            tv.plurx.packaging-revision=${{ github.sha }}
      - name: Verify the pushed platform image before it can receive a tag
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit_sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          image_ref="$REGISTRY_IMAGE@$DIGEST"
          docker pull --platform "linux/$ARCH" "$image_ref"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref")" = "linux/$ARCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")" = "$RELEASE_VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image_ref")" = "$SOURCE_URL"
          reported=$(docker run --rm --platform "linux/$ARCH" "$image_ref" --version)
          test "$reported" = "plurxd $RELEASE_VERSION ($RELEASE_TAG)"
          if [ -x release-source/release-bin/plurx-cluster-check ]; then
            cluster_identity=$(docker run --rm --platform "linux/$ARCH" \
              --entrypoint /usr/local/bin/plurx-cluster-check \
              "$image_ref" build-identity)
            test "$cluster_identity" = "$SOURCE_SHA"
          fi
          release-source/scripts/container-smoke "$image_ref"
          runtime_record=$(docker run --rm --platform "linux/$ARCH" "$image_ref" media-runtime-identity)
          printf '%s\n' "$runtime_record" | jq -e --arg sha "$SOURCE_SHA" --arg arch "$ARCH" \
            --arg runtime_digest "${{ steps.runtime.outputs.digest }}" '
            .application_sha == $sha and
            .runtime_image_digest == $runtime_digest and
            .architecture == (if $arch == "amd64" then "x86_64" else "aarch64" end) and
            (.engine_digest | test("^[0-9a-f]{64}$")) and
            (.package_manifest_sha256 | test("^[0-9a-f]{64}$")) and
            .engine_current == true
          ' >/dev/null
          mkdir -p runtime-record
          printf '%s\n' "$runtime_record" | jq \
            --arg image_digest "$DIGEST" \
            --arg runtime_digest "${{ steps.runtime.outputs.digest }}" \
            '. + {application_image_digest: $image_digest, media_runtime_image_digest: $runtime_digest}' \
            > "runtime-record/$ARCH.json"
          docker run --rm --platform "linux/$ARCH" --entrypoint cat "$image_ref" \
            /usr/share/doc/plurx/media-runtime-packages.txt > "runtime-record/$ARCH.packages.txt"
          cmp runtime-packages.txt "runtime-record/$ARCH.packages.txt"
          test "$(sha256sum "runtime-record/$ARCH.packages.txt" | cut -d ' ' -f 1)" = \
            "$(printf '%s\n' "$runtime_record" | jq -r .package_manifest_sha256)"
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: media-runtime-record-${{ matrix.arch }}
          path: runtime-record
          if-no-files-found: error
          retention-days: 14
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: release-image-digest-${{ matrix.arch }}
          path: digests
          if-no-files-found: error
          retention-days: 1
      - name: Retain the exact tagged binary receipt for one day
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: release-binary-receipt-${{ matrix.arch }}
          path: release-source/release-bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  reuse:
    name: verify existing release (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.version_exists == 'true'
    runs-on: [self-hosted, Linux, X64, lab, general, high-cpu]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit_sha }}
      - uses: https://github.com/docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            # The fleet registry is deliberately plain HTTP on the private LAN. A
            # BuildKit container does not inherit Docker daemon insecure-registry
            # settings, so the builder needs the same trust decision explicitly.
            # Only requests to this exact address are affected.
            [registry."${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}"]
              http = true
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
          username: fleet
          password: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
      - name: Verify architecture binding, labels, version, and runtime
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit_sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          version_ref="$REGISTRY_IMAGE:$RELEASE_VERSION"
          index_digest=$(docker buildx imagetools inspect "$version_ref" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -1)
          test -n "$index_digest"
          verified_ref="$REGISTRY_IMAGE@$index_digest"
          docker buildx imagetools inspect --raw "$verified_ref" > index.json
          platforms=$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' index.json | sort)
          test "$platforms" = "$(printf 'linux/amd64\nlinux/arm64')"
          count=$(jq --arg arch "$ARCH" \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | length' \
            index.json)
          test "$count" = 1
          digest=$(jq -r --arg arch "$ARCH" \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
            index.json)
          image_ref="$REGISTRY_IMAGE@$digest"
          docker pull --platform "linux/$ARCH" "$image_ref"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref")" = "linux/$ARCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")" = "$RELEASE_VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image_ref")" = "$SOURCE_URL"
          reported=$(docker run --rm --platform "linux/$ARCH" "$image_ref" --version)
          test "$reported" = "plurxd $RELEASE_VERSION ($RELEASE_TAG)"
          scripts/container-smoke "$image_ref"
          current_digest=$(docker buildx imagetools inspect "$version_ref" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -1)
          test "$current_digest" = "$index_digest"
          mkdir -p verified-index
          printf '%s\n' "$index_digest" > "verified-index/$ARCH"
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: verified-release-index-${{ matrix.arch }}
          path: verified-index
          if-no-files-found: error

  publish:
    name: attach verified release aliases
    needs: [resolve, image, reuse]
    if: >-
      always() && needs.resolve.result == 'success' &&
      ((needs.resolve.outputs.version_exists == 'true' && needs.reuse.result == 'success') ||
       (needs.resolve.outputs.version_exists != 'true' && needs.image.result == 'success'))
    runs-on: [self-hosted, Linux, X64, lab, general, high-cpu]
    timeout-minutes: 30
    concurrency:
      group: publish-release-aliases
      cancel-in-progress: false
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.packaging_sha }}
      - uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        if: needs.resolve.outputs.version_exists != 'true'
        with:
          pattern: release-image-digest-*
          path: digests
          merge-multiple: true
      - uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        if: needs.resolve.outputs.version_exists == 'true'
        with:
          pattern: verified-release-index-*
          path: verified-index
          merge-multiple: true
      - uses: https://github.com/docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: https://github.com/docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            # The fleet registry is deliberately plain HTTP on the private LAN. A
            # BuildKit container does not inherit Docker daemon insecure-registry
            # settings, so the builder needs the same trust decision explicitly.
            # Only requests to this exact address are affected.
            [registry."${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}"]
              http = true
      - uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}
          username: fleet
          password: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
      - name: Reconfirm the remote tag has not moved
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TAG_OBJECT: ${{ needs.resolve.outputs.tag_object }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          set -euo pipefail
          refs=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          remote_object=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref {print $1}')
          remote_commit=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref {print $1}')
          test "$remote_object" = "$TAG_OBJECT"
          test "$remote_commit" = "$COMMIT_SHA"
      - name: Create the immutable version index from the two smoked digests
        if: needs.resolve.outputs.version_exists != 'true'
        env:
          AMD64_DIGEST_FILE: digests/amd64
          ARM64_DIGEST_FILE: digests/arm64
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          amd64=$(cat "$AMD64_DIGEST_FILE")
          arm64=$(cat "$ARM64_DIGEST_FILE")
          version_ref="$REGISTRY_IMAGE:$RELEASE_VERSION"
          is_missing_ref() {
            local ref="$1" err="$2"
            grep -Eqi 'manifest unknown|name unknown' "$err" ||
              { grep -Fq "$ref" "$err" && grep -Eqi '(^|[[:space:]:])not found([[:space:].:]|$)' "$err"; }
          }
          if docker buildx imagetools inspect "$version_ref" \
              > /dev/null 2> inspect.err; then
            echo "::error::$version_ref appeared after source resolution; rerun so it is verified before reuse"
            exit 1
          elif ! is_missing_ref "$version_ref" inspect.err; then
            cat inspect.err >&2
            echo "::error::registry state is indeterminate; refusing to create $version_ref"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$version_ref" \
            "$REGISTRY_IMAGE@$amd64" "$REGISTRY_IMAGE@$arm64"
      - name: Advance aliases monotonically and verify their index digests
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          RELEASE_MINOR: ${{ needs.resolve.outputs.release_minor }}
          VERSION_EXISTS: ${{ needs.resolve.outputs.version_exists }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          version_ref="$REGISTRY_IMAGE:$RELEASE_VERSION"
          minor_ref="$REGISTRY_IMAGE:$RELEASE_MINOR"
          latest_ref="$REGISTRY_IMAGE:latest"

          index_digest() {
            local ref="$1"
            docker buildx imagetools inspect "$ref" 2>/dev/null \
              | sed -n 's/^Digest:[[:space:]]*//p' | head -1
          }
          is_missing_ref() {
            local ref="$1" err="$2"
            grep -Eqi 'manifest unknown|name unknown' "$err" ||
              { grep -Fq "$ref" "$err" && grep -Eqi '(^|[[:space:]:])not found([[:space:].:]|$)' "$err"; }
          }
          assert_ref_snapshot() {
            local ref="$1" expected="$2" file="$3" err="$3.err" current=""
            if docker buildx imagetools inspect "$ref" > "$file" 2> "$err"; then
              current=$(sed -n 's/^Digest:[[:space:]]*//p' "$file" | head -1)
              test -n "$current"
            elif ! is_missing_ref "$ref" "$err"; then
              cat "$err" >&2
              echo "::error::registry state for $ref is indeterminate"
              return 1
            fi
            test "$current" = "$expected" || {
              echo "::error::$ref changed while its release decision was being validated"
              return 1
            }
          }
          declare -A validated_alias_versions=()
          alias_version() {
            local ref="$1" file="$2" version_output="$3" digest_output="$4" err="$2.err"
            local platforms alias_digest immutable_digest value="" revision=""
            local arch digest image_ref arch_value arch_revision arch_source
            local refs remote_object remote_commit tag_ref
            printf -v "$version_output" '%s' ""
            printf -v "$digest_output" '%s' ""
            if ! docker buildx imagetools inspect "$ref" > "$file.inspect" 2> "$err"; then
              if is_missing_ref "$ref" "$err"; then
                return 0
              fi
              cat "$err" >&2
              echo "::error::registry state for $ref is indeterminate"
              return 1
            fi
            alias_digest=$(sed -n 's/^Digest:[[:space:]]*//p' "$file.inspect" | head -1)
            test -n "$alias_digest"
            printf -v "$digest_output" '%s' "$alias_digest"
            if [[ -v "validated_alias_versions[$alias_digest]" ]]; then
              printf -v "$version_output" '%s' "${validated_alias_versions[$alias_digest]}"
              return 0
            fi
            docker buildx imagetools inspect --raw "$REGISTRY_IMAGE@$alias_digest" > "$file"
            platforms=$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' "$file" | sort)
            test "$platforms" = "$(printf 'linux/amd64\nlinux/arm64')"
            for arch in amd64 arm64; do
              digest=$(jq -r --arg arch "$arch" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
                "$file")
              image_ref="$REGISTRY_IMAGE@$digest"
              docker pull --platform "linux/$arch" "$image_ref" >/dev/null
              test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref")" = "linux/$arch"
              arch_value=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")
              arch_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")
              arch_source=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image_ref")
              [[ "$arch_value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              [[ "$arch_revision" =~ ^[0-9a-f]{40}$ ]]
              test "$arch_source" = "$SOURCE_URL"
              test "$(docker run --rm --platform "linux/$arch" "$image_ref" --version)" = "plurxd $arch_value (v$arch_value)"
              scripts/container-smoke "$image_ref" >&2
              if [ -z "$value" ]; then
                value="$arch_value"
                revision="$arch_revision"
              else
                test "$arch_value" = "$value"
                test "$arch_revision" = "$revision"
              fi
            done
            tag_ref="refs/tags/v$value"
            refs=$(git ls-remote origin "$tag_ref" "$tag_ref^{}")
            remote_object=$(printf '%s\n' "$refs" | awk -v ref="$tag_ref" '$2 == ref {print $1}')
            remote_commit=$(printf '%s\n' "$refs" | awk -v ref="$tag_ref^{}" '$2 == ref {print $1}')
            test -n "$remote_object"
            test "$remote_commit" = "$revision"
            immutable_digest=$(index_digest "$REGISTRY_IMAGE:$value")
            test -n "$immutable_digest"
            test "$alias_digest" = "$immutable_digest"
            validated_alias_versions[$alias_digest]="$value"
            printf -v "$version_output" '%s' "$value"
          }

          candidate_digest=$(index_digest "$version_ref")
          test -n "$candidate_digest"
          docker buildx imagetools inspect --raw "$REGISTRY_IMAGE@$candidate_digest" > published.json
          platforms=$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' published.json | sort)
          test "$platforms" = "$(printf 'linux/amd64\nlinux/arm64')"
          if [ "$VERSION_EXISTS" = true ]; then
            verified_amd64=$(cat verified-index/amd64)
            verified_arm64=$(cat verified-index/arm64)
            test "$verified_amd64" = "$verified_arm64"
            test "$candidate_digest" = "$verified_amd64"
          else
            published_amd64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' published.json)
            published_arm64=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' published.json)
            test "$published_amd64" = "$(cat digests/amd64)"
            test "$published_arm64" = "$(cat digests/arm64)"
          fi
          test "$(index_digest "$version_ref")" = "$candidate_digest"
          source_ref="$REGISTRY_IMAGE@$candidate_digest"
          minor_existing=""
          minor_before=""
          latest_existing=""
          latest_before=""
          alias_version "$minor_ref" minor.json minor_existing minor_before
          alias_version "$latest_ref" latest.json latest_existing latest_before
          minor_args=(--alias minor --candidate "$RELEASE_VERSION")
          if [ -n "$minor_existing" ]; then minor_args+=(--existing "$minor_existing"); fi
          latest_args=(--alias latest --candidate "$RELEASE_VERSION")
          if [ -n "$latest_existing" ]; then latest_args+=(--existing "$latest_existing"); fi
          minor_action=$(python3 -m validation.release_aliases "${minor_args[@]}")
          latest_action=$(python3 -m validation.release_aliases "${latest_args[@]}")

          assert_ref_snapshot "$minor_ref" "$minor_before" minor-before-create.inspect
          assert_ref_snapshot "$latest_ref" "$latest_before" latest-before-create.inspect
          tags=()
          if [ "$minor_action" = advance ]; then tags+=(--tag "$minor_ref"); fi
          if [ "$latest_action" = advance ]; then tags+=(--tag "$latest_ref"); fi
          if [ "${#tags[@]}" -gt 0 ]; then
            docker buildx imagetools create "${tags[@]}" "$source_ref"
          fi

          minor_expected="$candidate_digest"
          if [ "$minor_action" = keep ]; then minor_expected="$minor_before"; fi
          latest_expected="$candidate_digest"
          if [ "$latest_action" = keep ]; then latest_expected="$latest_before"; fi
          test "$(index_digest "$minor_ref")" = "$minor_expected"
          test "$(index_digest "$latest_ref")" = "$latest_expected"
          test "$(index_digest "$version_ref")" = "$candidate_digest"
