name: replicated Store backstop

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cluster-store-backstop:
    name: full unsharded replicated Store contracts
    runs-on: [self-hosted, Linux, X64, lab, ci-store]
    timeout-minutes: 40
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-store-backstop
      - name: Run the complete Store inventory without sharding
        id: store_backstop
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/validation
          make cluster-store-check 2>&1 \
            | tee target/validation/cluster-store-backstop.log
      - name: Record the complete Store result
        if: always()
        env:
          LANE_RESULT: ${{ steps.store_backstop.outcome }}
        run: >-
          python3 -m validation.ci_lane_receipt
          --output target/validation/cluster-store-backstop-receipt.json
          --log target/validation/cluster-store-backstop.log
          --lane cluster-store-backstop
          --result "$LANE_RESULT"
          --command "make cluster-store-check"
      - name: Retain the complete Store evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: cluster-store-backstop
          path: |
            target/validation/cluster-store-backstop.log
            target/validation/cluster-store-backstop-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}
      - name: Propagate the complete Store result
        if: always() && steps.store_backstop.outcome != 'success'
        run: exit 1
