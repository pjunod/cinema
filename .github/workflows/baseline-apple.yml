name: diagnostic frozen Apple unit continuation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen source commit to execute
        required: true
        type: string
        default: "86f1385005b27122e8a8d3a3d5bd9501eb2fdb16"
      diagnostic_baseline:
        description: Must remain true; unit continuation evidence only
        required: true
        type: string
        default: "true"

jobs:
  apple_unit_continuation:
    name: frozen Apple units (${{ matrix.cell }})
    runs-on: [self-hosted, macOS, ARM64, lab, apple, xcode-27]
    # Native budgets: mobile at most 26m (setup/project/build/units); desktop at most 30m.
    # Checkout, setup, artifact uploads and cleanup have separate bounded reserve under the 60m cap.
    timeout-minutes: 60
    concurrency:
      group: plurx-apple-silicon-heavy
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cell: [desktop, iphone, ipad, tvos]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      PYTHONDONTWRITEBYTECODE: "1"
      CONTINUATION_CELL: ${{ matrix.cell }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Preserve exact committed safe observer outside tested checkout
        timeout-minutes: 1
        env:
          WORKFLOW_TRANSPORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PYCOPY'
          import ast, hashlib, json, os, pathlib, re, subprocess, sys, tempfile
          transport = os.environ['WORKFLOW_TRANSPORT_SHA']
          assert re.fullmatch('[0-9a-f]{40}', transport)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == transport, 'Observer checkout differs from workflow transport'
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          checkout = pathlib.Path.cwd().resolve()
          assert temporary.is_dir() and not temporary.is_relative_to(checkout), 'Observer must be outside tested checkout'
          source = 'validation/baseline_commands.py'
          spec = transport + ':' + source
          payload = subprocess.check_output(['git', 'show', spec])
          blob = subprocess.check_output(['git', 'rev-parse', spec], text=True).strip()
          assert subprocess.check_output(['git', 'hash-object', '--stdin'], input=payload).decode().strip() == blob
          for node in ast.walk(ast.parse(payload, filename=source)):
              if isinstance(node, ast.ImportFrom):
                  assert node.level == 0 and node.module, 'Standalone observer cannot use relative imports'
              imports = ([alias.name.split('.')[0] for alias in node.names] if isinstance(node, ast.Import) else [node.module.split('.')[0]] if isinstance(node, ast.ImportFrom) and node.module else [])
              assert all(name in sys.stdlib_module_names for name in imports), 'Standalone observer must use only the standard library'
          owned = pathlib.Path(tempfile.mkdtemp(prefix='plurx-apple-observer-', dir=temporary))
          observer = owned / 'baseline_commands.py'
          observer.write_bytes(payload)
          digest = hashlib.sha256(observer.read_bytes()).hexdigest()
          assert observer.read_bytes() == payload
          receipt = owned / 'observer-provenance.json'
          receipt.write_text(json.dumps(dict(workflow_transport_sha=transport, source_path=source, git_blob=blob, blob_sha256=digest, external_path=str(observer), standard_library_only=True), indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('PLURX_BASELINE_COMMANDS=' + str(observer) + '\n')
              environment.write('PLURX_BASELINE_OBSERVER_RECEIPT=' + str(receipt) + '\n')
          PYCOPY
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Bind exact frozen source and workflow transport
        id: bind
        timeout-minutes: 1
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DIAGNOSTIC_BASELINE: ${{ inputs.diagnostic_baseline }}
          WORKFLOW_TRANSPORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PYBIND'
          import hashlib, json, os, pathlib, platform, re, subprocess
          assert os.environ['DIAGNOSTIC_BASELINE'] == 'true', 'Diagnostic continuation only'
          expected, transport = os.environ['EXPECTED_SHA'], os.environ['WORKFLOW_TRANSPORT_SHA']
          assert all(re.fullmatch('[0-9a-f]{40}', item) for item in [expected, transport])
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          actual, tree = git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}')
          assert actual == expected, 'Frozen source differs'
          cell = os.environ['CONTINUATION_CELL']
          assert cell in ['desktop', 'iphone', 'ipad', 'tvos']
          output = pathlib.Path('target/full-suite-baseline') / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-apple-' + cell)
          output.mkdir(parents=True, exist_ok=True)
          status = git('status', '--porcelain', '--untracked-files=all')
          (output / 'source-before.json').write_text(json.dumps(dict(candidate_sha=actual, candidate_tree=tree, status=status)))
          assert not status, 'Initial source must be clean'
          observer = pathlib.Path(os.environ['PLURX_BASELINE_COMMANDS']).resolve()
          assert observer.is_file() and not observer.is_relative_to(pathlib.Path.cwd().resolve())
          provenance = json.loads(pathlib.Path(os.environ['PLURX_BASELINE_OBSERVER_RECEIPT']).read_text())
          assert provenance['workflow_transport_sha'] == transport
          assert provenance['source_path'] == 'validation/baseline_commands.py'
          assert provenance['external_path'] == str(observer) and provenance['standard_library_only'] is True
          assert provenance['blob_sha256'] == hashlib.sha256(observer.read_bytes()).hexdigest(), 'External observer changed'
          (output / 'observer-provenance.json').write_text(json.dumps(provenance, indent=2))
          (output / 'baseline-commands-observer.py').write_bytes(observer.read_bytes())
          (output / 'continuation-provenance.json').write_text(json.dumps(dict(tested_sha=actual, tested_tree=tree, workflow_transport_sha=transport, observation_kind='separate-Apple-unit-continuation', primary_run_id=5620, cell=cell, python=platform.python_version(), limitation='Separate fresh execution; preserve primary3601s timeout and timing. No result reuse or TV navigation claim.'), indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              for key, value in dict(PLURX_BASELINE_DIR=str(output), PLURX_TEST_CANDIDATE_SHA=actual, PLURX_TEST_CANDIDATE_TREE=tree).items():
                  environment.write(key + '=' + value + '\n')
          PYBIND
      - name: Verify the original pinned Apple toolchain
        id: toolchain
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          grep -Fxq "Xcode 27.0" <<< "$xcode_version"
          grep -Fxq "Build version 27A266a" <<< "$xcode_version"
          xcrun --find swift
          if [ "$CONTINUATION_CELL" != desktop ]; then
            test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"
            test "$(xcrun --sdk appletvos --show-sdk-version)" = "27.0"
            test "$(xcodegen --version)" = "Version: 2.46.0"
            simulator_runtimes="$(xcrun simctl list runtimes)"
            grep -Fq "iOS 26.5 (26.5 - 23F77)" <<< "$simulator_runtimes"
            grep -Fq "tvOS 26.5 (26.5 - 23L470)" <<< "$simulator_runtimes"
          fi
          printf '%s\n' "$xcode_version" > "$PLURX_BASELINE_DIR/xcode-version.txt"
      - name: Begin candidate-bound resource recording
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -m validation.baseline_resources start --output "$PLURX_BASELINE_DIR/resources" --cell "apple-$CONTINUATION_CELL"
      - name: Prepare one owned simulator setup cell
        if: ${{ matrix.cell != 'desktop' }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PYSIMPLAN'
          import json, os, pathlib, textwrap
          root = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          script = root / 'owned-simulator-setup.py'
          script.write_text(textwrap.dedent("""
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          cell = os.environ['CONTINUATION_CELL']
          spec = dict(iphone=('com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro', 'com.apple.CoreSimulator.SimRuntime.iOS-26-5', 'iOS'), ipad=('com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB', 'com.apple.CoreSimulator.SimRuntime.iOS-26-5', 'iOS'), tvos=('com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K', 'com.apple.CoreSimulator.SimRuntime.tvOS-26-5', 'tvOS'))[cell]
          name = 'plurx baseline ' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + cell
          udid = subprocess.check_output(['xcrun', 'simctl', 'create', name, spec[0], spec[1]], text=True, timeout=60).strip()
          assert re.fullmatch('[0-9A-Fa-f-]{36}', udid), 'Invalid owned simulator ID'
          (root / 'owned-simulator.json').write_text(json.dumps(dict(udid=udid, name=name, cell=cell, run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])))
          destination = 'platform=' + spec[2] + ' Simulator,id=' + udid
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              for key in (['APPLE_IOS_SIM'] if cell == 'iphone' else ['APPLE_IOS_SIM', 'APPLE_IPAD_SIM'] if cell == 'ipad' else ['APPLE_TVOS_SIM']):
                  environment.write(key + '=' + destination + '\\n')
          subprocess.run(['xcrun', 'simctl', 'boot', udid], check=True, timeout=60)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True, timeout=240)
          """))
          manifest = dict(candidate_sha=os.environ['PLURX_TEST_CANDIDATE_SHA'], candidate_tree=os.environ['PLURX_TEST_CANDIDATE_TREE'], cells=[dict(id='simulator-setup', argv=['python3', str(script)], timeout_seconds=240)])
          (root / 'simulator-setup.json').write_text(json.dumps(manifest))
          PYSIMPLAN
      - name: Create and boot only this run simulator
        if: ${{ matrix.cell != 'desktop' }}
        id: simulator
        timeout-minutes: 5
        shell: bash
        run: |
          python3 "$PLURX_BASELINE_COMMANDS" --manifest "$PLURX_BASELINE_DIR/simulator-setup.json" --output "$PLURX_BASELINE_DIR/simulator-setup"
      - name: Preserve native setup evidence before another phase
        if: always() && env.PLURX_BASELINE_DIR != '' && matrix.cell != 'desktop'
        timeout-minutes: 1
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: apple-unit-setup-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-suite-baseline
          if-no-files-found: error
          retention-days: 14
      - name: Select exact native Make commands from frozen source
        id: plan
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && (matrix.cell == 'desktop' || steps.simulator.outcome == 'success') }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PYPLAN'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          cell = os.environ['CONTINUATION_CELL']
          binding = dict(candidate_sha=os.environ['PLURX_TEST_CANDIDATE_SHA'], candidate_tree=os.environ['PLURX_TEST_CANDIDATE_TREE'])
          def write(name, cells):
              (root / (name + '.json')).write_text(json.dumps(dict(binding, cells=cells)))
          def shell(name, command, timeout):
              return dict(id=name, argv=['bash', '-e', '-o', 'pipefail', '-c', command], timeout_seconds=timeout)
          if cell == 'desktop':
              write('build', [dict(id='desktop-build', argv=['make', 'desktop-macos-build'], timeout_seconds=600)])
              write('units', [dict(id='desktop-units', argv=['make', 'desktop-macos-test'], timeout_seconds=1200)])
          else:
              required = dict(iphone=['APPLE_IOS_SIM'], ipad=['APPLE_IOS_SIM', 'APPLE_IPAD_SIM'], tvos=['APPLE_TVOS_SIM'])[cell]
              assert all(os.environ.get(name) for name in required), 'Missing owned destination'
              dry = subprocess.check_output(['make', '--no-print-directory', '-n', 'apple-test'], text=True, timeout=30)
              commands, pending = [], []
              for raw in dry.splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  if line.endswith('\\'):
                      pending.append(line[:-1].rstrip())
                  else:
                      commands.append(' '.join(pending + [line]))
                      pending = []
              assert not pending and len(commands) == 6, 'Apple recipe inventory changed'
              assert 'xcodegen generate' in commands[0]
              assert all('plurx-iOS' in commands[index] for index in [1, 2, 3])
              assert all('plurx-tvOS' in commands[index] for index in [4, 5])
              (root / 'frozen-make-dry-run.txt').write_text(dry)
              write('project', [shell('xcodegen', commands[0], 120)])
              build, test = dict(iphone=(1, 2), ipad=(1, 3), tvos=(4, 5))[cell]
              write('units', [shell(cell + '-units', '(' + commands[build] + ') && (' + commands[test] + ')', 1200)])
          PYPLAN
      - name: Generate only the mobile unit project
        id: project
        if: ${{ !cancelled() && matrix.cell != 'desktop' && steps.plan.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          python3 "$PLURX_BASELINE_COMMANDS" --manifest "$PLURX_BASELINE_DIR/project.json" --output "$PLURX_BASELINE_DIR/project"
      - name: Preserve native project evidence before another phase
        if: always() && env.PLURX_BASELINE_DIR != '' && matrix.cell != 'desktop'
        timeout-minutes: 1
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: apple-unit-project-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-suite-baseline
          if-no-files-found: error
          retention-days: 14
      - name: Build desktop slices as an independent cell
        id: desktop_build
        if: ${{ !cancelled() && matrix.cell == 'desktop' && steps.plan.outcome == 'success' }}
        timeout-minutes: 11
        shell: bash
        run: |
          python3 "$PLURX_BASELINE_COMMANDS" --manifest "$PLURX_BASELINE_DIR/build.json" --output "$PLURX_BASELINE_DIR/build"
      - name: Preserve native build evidence before another phase
        if: always() && env.PLURX_BASELINE_DIR != '' && matrix.cell == 'desktop'
        timeout-minutes: 1
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: apple-unit-build-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-suite-baseline
          if-no-files-found: error
          retention-days: 14
      - name: Require qualified cleanup before starting native units
        id: safe
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && (matrix.cell == 'desktop' || steps.project.outcome == 'success') }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PYSAFE'
          import json, os, pathlib
          root = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          if os.environ['CONTINUATION_CELL'] == 'desktop':
              report = json.loads((root / 'build/results.json').read_text())
              assert report['cells'] and not report['errors'], 'Build execution report incomplete'
              assert all(not cell.get('cleanup_error') for cell in report['cells']), 'Build cleanup unqualified; unit launch blocked'
          PYSAFE
      - name: Run fresh exact native unit bodies with bounded deadline
        if: ${{ !cancelled() && steps.safe.outcome == 'success' }}
        timeout-minutes: 21
        shell: bash
        run: |
          python3 "$PLURX_BASELINE_COMMANDS" --manifest "$PLURX_BASELINE_DIR/units.json" --output "$PLURX_BASELINE_DIR/units"
      - name: Preserve native units evidence before another phase
        if: always() && env.PLURX_BASELINE_DIR != ''
        timeout-minutes: 1
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: apple-unit-units-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-suite-baseline
          if-no-files-found: error
          retention-days: 14
      - name: Delete only the simulator from this run create receipt
        if: ${{ always() && env.PLURX_BASELINE_DIR != '' && matrix.cell != 'desktop' }}
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PYCLEAN'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          receipt = root / 'owned-simulator.json'
          if receipt.exists():
              owned = json.loads(receipt.read_text())
              assert owned['run_id'] == os.environ['GITHUB_RUN_ID'] and owned['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
              assert owned['cell'] == os.environ['CONTINUATION_CELL']
              assert re.fullmatch('[0-9A-Fa-f-]{36}', owned['udid'])
              devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '--json'], text=True, timeout=30))
              matches = [device for rows in devices['devices'].values() for device in rows if device['udid'] == owned['udid']]
              assert len(matches) <= 1
              if matches:
                  assert matches[0]['name'] == owned['name'], 'Owned simulator identity changed; refusing delete'
                  shutdown = subprocess.run(['xcrun', 'simctl', 'shutdown', owned['udid']], timeout=30)
                  deletion = subprocess.run(['xcrun', 'simctl', 'delete', owned['udid']], timeout=30)
                  (root / 'simulator-cleanup.json').write_text(json.dumps(dict(owned=owned, shutdown_returncode=shutdown.returncode, delete_returncode=deletion.returncode)))
                  assert deletion.returncode == 0, 'Owned simulator deletion failed'
          PYCLEAN
      - name: Preserve and verify final frozen source identity
        if: ${{ always() && env.PLURX_BASELINE_DIR != '' }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PYAFTER'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['PLURX_BASELINE_DIR'])
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          receipt = dict(candidate_sha=git('rev-parse', 'HEAD'), candidate_tree=git('rev-parse', 'HEAD^{tree}'), status=git('status', '--porcelain', '--untracked-files=all'))
          (root / 'source-after.json').write_text(json.dumps(receipt, indent=2))
          assert receipt['candidate_sha'] == os.environ['PLURX_TEST_CANDIDATE_SHA']
          assert receipt['candidate_tree'] == os.environ['PLURX_TEST_CANDIDATE_TREE']
          assert not receipt['status'], 'Source changed; see source-after.json'
          PYAFTER
      - name: Finish candidate-bound resource recording
        if: ${{ always() && env.PLURX_BASELINE_DIR != '' }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -m validation.baseline_resources finish --output "$PLURX_BASELINE_DIR/resources"
      - name: Preserve native final evidence before another phase
        if: always() && env.PLURX_BASELINE_DIR != ''
        timeout-minutes: 1
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: apple-unit-final-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/full-suite-baseline
          if-no-files-found: error
          retention-days: 14
