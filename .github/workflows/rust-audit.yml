name: Rust dependency audit

on:
  schedule:
    - cron: "23 9 * * 1"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-audit.yml"
      - "scripts/vendor-audit-lock"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-audit.yml"
      - "scripts/vendor-audit-lock"

jobs:
  # Release artifacts resolve from the root workspace; the standalone M0
  # hiqlite experiment is compiled and exercised by CI but does not ship.
  # Its dependency findings are recorded in docs/PHASE3-SPIKE.md and must be
  # cleared before any dependency moves into this audited workspace.
  workspace:
    name: RustSec workspace advisory scan
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@1.97.1
      - name: Restore patched crates to registry provenance for advisory matching
        run: scripts/vendor-audit-lock --output target/vendor-audit/Cargo.lock
      # v2.0.0, pinned so the security gate cannot move without review.
      #
      # It installs the pinned cargo-audit binary and annotates the commit when
      # it can. It is NOT the verdict: it reports through GitHub's check-run
      # API, which Forgejo does not implement, and it only reaches that call
      # when it has an advisory to annotate. That made the job pass for as long
      # as the lockfile carried no informational advisory and fail with
      # `::error::404 page not found` the day one appeared -- on a commit that
      # introduced neither the advisory nor the dependency.
      - uses: https://github.com/rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        continue-on-error: true
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
      # The verdict. `cargo audit` exits non-zero for an actual vulnerability
      # and reports informational notices -- unmaintained, unsound, yanked --
      # in the log without failing. A crate going unmaintained upstream is
      # news, not a broken build, and it must not be able to close `main`.
      - name: Audit the workspace lockfile
        run: cargo audit
      # cargo-audit intentionally skips path-sourced packages. Re-scan a
      # synthesized lockfile so future advisories against either vendored
      # upstream release remain visible.
      - name: Audit synthesized vendor lockfile
        run: cargo audit --file target/vendor-audit/Cargo.lock

  fuzz:
    name: RustSec fuzz advisory scan
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@1.97.1
      # v2.0.0, pinned so the security gate cannot move without review.
      - uses: https://github.com/rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          working-directory: fuzz

  scheduled:
    name: RustSec scheduled advisory report
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@1.97.1
      - name: Build one complete advisory inventory
        run: >-
          scripts/vendor-audit-lock --output target/rust-audit/Cargo.lock
          --additional-lock fuzz/Cargo.lock
      # Keep exactly one issue publisher over the deduplicated root, vendored,
      # and fuzz package inventory. One reporter per lockfile can race when the
      # same advisory affects dependencies shared by more than one lock.
      - uses: https://github.com/rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          working-directory: target/rust-audit
