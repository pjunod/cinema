                  wi, ai = work.index("-"), act.index("-")
                  return (wi >= 6 and ai >= 6 and wi + 3 < len(work) and ai + 3 < len(act)
                          and work[0].isdigit() and act[0].isdigit() and work[2] == act[2]
                          and work[wi + 1:wi + 3] == act[ai + 1:ai + 3]
                          and "rw" in work[5].split(",") and "rw" in act[5].split(","))
              except (ValueError, IndexError):
                  return False

          with open("/proc/self/mountinfo", encoding="utf-8") as mounted:
              ephemeral = ephemeral_workspace(os.path.realpath(sys.argv[1]),
                  os.path.realpath("/var/run/act"), mounted.read(), os.environ)
          print("yes" if ephemeral else "no")
          PYTHON
          )"
          if [ "$ephemeral" = yes ]; then
            echo 'PLURX_WORKSPACE_MODE=forgejo-ephemeral' >> "$GITHUB_ENV"
            echo 'HOST_WORKSPACE_OWNER=' >> "$GITHUB_ENV"
            echo 'Paired Forgejo job volumes are removed by the provisioner; no host bind to restore'
            exit 0
          fi
          owner="$(stat -c '%u:%g' "$(dirname -- "$GITHUB_WORKSPACE")")"
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          fi
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            echo '::error::No non-root mounted workspace owner; refusing to leave root-owned runner files' >&2
            exit 1
          fi
          echo "HOST_WORKSPACE_OWNER=$owner" >> "$GITHUB_ENV"
          echo 'PLURX_WORKSPACE_MODE=persistent-bind' >> "$GITHUB_ENV"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c470d5aa033e84b4a2de1f8d36aa4180d62cd971
          persist-credentials: false
      - name: Verify actual merged main source
        run: |
          test "$(git rev-parse HEAD)" = "$CINEMA_MAIN_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = c84c24964c1c00b3cdc3e06c8a7489c71ab6a95b

      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: vod-web
          # This lane carries Playwright browsers and an ffmpeg build on top
          # of the 21G workspace tree, and it is the one that passed the
          # default check and then filled the disk mid-build.
          disk-gb: "45"
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - name: Cache Playwright browsers
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0
      - uses: ./.github/actions/rust-native-deps
      - uses: ./.github/actions/ffmpeg
        with:
          major: "8"
          binary: /usr/lib/jellyfin-ffmpeg/ffmpeg
      - uses: ./.github/actions/playwright
        with:
          version: "1.62.0"
      - name: Build the exact server under test
        run: cargo build --locked -p plurxd
      - name: Run VOD browser acceptance
        run: |
          mkdir -p target/playback-lab/acceptance
          chrome="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          scripts/playback-lab run --suite vod --case suspend-resume --browser chrome \
            --chrome "$chrome" --json target/playback-lab/acceptance/vod.json
          # Steady, seek-storm, and stall-recovery are intentionally out of CI.
          # See docs/streaming/VOD-STEADY-ACCEPTANCE-HANDOFF.md,
          # docs/streaming/VOD-SEEK-STORM-ACCEPTANCE-HANDOFF.md, and
          # docs/streaming/VOD-STALL-ACCEPTANCE-HANDOFF.md for restoration prompts.
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          if [ "${PLURX_WORKSPACE_MODE:-}" = persistent-bind ] && [ -n "${HOST_WORKSPACE_OWNER:-}" ]; then
            chown -R "$HOST_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          fi

