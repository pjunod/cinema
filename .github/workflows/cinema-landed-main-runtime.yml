name: Cinema landed main integration and package checks
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CINEMA_MAIN_COMMIT: 'c470d5aa033e84b4a2de1f8d36aa4180d62cd971'
concurrency:
  group: cinema-landed-main-runtime-c470d5aa033e
  cancel-in-progress: false
jobs:
  package_smoke:
    name: package and smoke (${{ matrix.arch }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    concurrency:
      group: ${{ matrix.arch == 'arm64' && 'plurx-apple-silicon-heavy' || format('plurx-package-{0}-{1}', github.run_id, matrix.arch) }}
      cancel-in-progress: false
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            kernel_machine: x86_64
            docker_machine: x86_64
            runs_on: '["self-hosted","Linux","X64","lab","ci-topology"]'
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            kernel_machine: aarch64
            docker_machine: aarch64
            runs_on: '["self-hosted","Linux","ARM64","lab","ci-arm64"]'
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c470d5aa033e84b4a2de1f8d36aa4180d62cd971
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual merged main source
        run: |
          test "$(git rev-parse HEAD)" = "$CINEMA_MAIN_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = c84c24964c1c00b3cdc3e06c8a7489c71ab6a95b

      - name: Prove the package runner and Docker engine are native
        env:
          ARCH: ${{ matrix.arch }}
          DOCKER_ARCH: ${{ matrix.docker_machine }}
          KERNEL_ARCH: ${{ matrix.kernel_machine }}
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = "Linux/$KERNEL_ARCH"
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = "linux/$DOCKER_ARCH"
      - id: buildx-cache
        uses: ./.github/actions/buildx-cache
        with:
          lane: package-smoke-${{ matrix.arch }}
      - name: Derive the binary-only Bookworm build
        id: binary-build
        run: |
          python3 -m validation.release_dockerfile --binary-export \
            Dockerfile Dockerfile.binaries
          echo "source_date_epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compile and export the exact candidate binaries
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.binaries
          target: release-binaries
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=binary-export
          build-args: |
            PLURX_BUILD_REF=c470d5aa033e84b4a2de1f8d36aa4180d62cd971
            PLURX_BUILD_SHA=c470d5aa033e84b4a2de1f8d36aa4180d62cd971
            SOURCE_DATE_EPOCH=${{ steps.binary-build.outputs.source_date_epoch }}
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,scope=package-compile-{0}', matrix.arch) || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,mode=max,scope=package-compile-{0}', matrix.arch) || '' }}
      - name: Bind the binary set to this candidate tree
        run: |
          scripts/release-package-candidate \
            . . binary-export release-bin \
            "${{ matrix.target }}" "$CINEMA_MAIN_COMMIT" "$CINEMA_MAIN_COMMIT"
          for name in plurxd plurx-cluster-check; do
            max_glibc=$(readelf --version-info "release-bin/$name" \
              | sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' \
              | sort -V | tail -1)
            test -n "$max_glibc"
            test "$(printf '%s\n' "$max_glibc" 2.36 | sort -V | tail -1)" = 2.36 || {
              echo "::error::${{ matrix.arch }} $name requires GLIBC_$max_glibc; Bookworm provides 2.36"
              exit 1
            }
          done
      - name: Build and export the exact audited Bookworm media package
        if: matrix.arch == 'amd64'
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: linux-dolby-package-export
          platforms: linux/amd64
          outputs: type=tar,dest=linux-dolby-export.tar
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && 'type=gha,scope=package-media-amd64' || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && 'type=gha,mode=max,scope=package-media-amd64' || '' }}
      - name: Validate and unpack the complete audited media export
        if: matrix.arch == 'amd64'
        run: python3 -m validation.media_export linux-dolby-export.tar linux-dolby-export
      - name: Build the runtime from only the verified binaries
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.release
          build-contexts: ${{ matrix.arch == 'amd64' && 'linux-dolby-package=./linux-dolby-export/package' || '' }}
          push: false
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: plurx/plurxd:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=c470d5aa033e84b4a2de1f8d36aa4180d62cd971
            tv.plurx.build-ref=c470d5aa033e84b4a2de1f8d36aa4180d62cd971
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,scope=package-runtime-{0}', matrix.arch) || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && format('type=gha,mode=min,scope=package-runtime-{0}', matrix.arch) || '' }}
      - name: Verify architecture, identity, and stop/start runtime
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: plurx/plurxd:ci-${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/$ARCH"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$CINEMA_MAIN_COMMIT"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test "$(docker run --rm --platform "linux/$ARCH" "$IMAGE" --version)" = "plurxd $version ($CINEMA_MAIN_COMMIT)"
          test "$(docker run --rm --platform "linux/$ARCH" \
            --entrypoint /usr/local/bin/plurx-cluster-check \
            "$IMAGE" build-identity)" = "$CINEMA_MAIN_COMMIT"
          scripts/container-smoke "$IMAGE"
      - name: Back up the running image and restore it into a fresh container
        env:
          IMAGE: plurx/plurxd:ci-${{ matrix.arch }}
        run: scripts/container-restore-smoke "$IMAGE"
      - name: Retain the exact package receipt
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: package-smoke-receipt-${{ matrix.arch }}
          path: |
            release-bin/build-manifest.json
            release-bin/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain candidate binaries for push, tag, and qualification runs
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: package-smoke-binaries-${{ matrix.arch }}
          path: |
            release-bin/plurxd
            release-bin/plurx-cluster-check
            release-bin/*.dwp
            release-bin/build-manifest.json
            release-bin/*.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Retain candidate binaries for non-qualification push and tag runs
        if: github.event_name == 'push'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: package-smoke-binaries-${{ matrix.arch }}
          path: |
            release-bin/plurxd
            release-bin/plurx-cluster-check
            release-bin/*.dwp
            release-bin/build-manifest.json
            release-bin/*.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Bound persistent BuildKit state
        if: always() && steps.buildx-cache.outputs.local == 'true'
        env:
          BUILDER_NAME: ${{ steps.buildx-cache.outputs.builder-name }}
        run: scripts/ci-buildkit-prune "$BUILDER_NAME" 50

  # CD validates the tag in this workflow, then delegates artifact construction,
  # per-platform smoke, and alias publication to the manually recoverable release
  # workflow. A cancelled tag run can therefore be recovered without moving it.

  cluster_daemon:
    name: cluster daemon contracts
    runs-on: [self-hosted, Linux, X64, lab, ci-topology]
    container:
      options: --cpus 3 --memory 12g --memory-swap 12g
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:3d84b711936233da699308d0301ac1e91f12e76c6b928967c41817e841f5e855
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Capture mounted runner workspace owner
        run: |
          # Forgejo v13.1.0 provisions paired random job volumes and deletes
          # both on cleanup (BindWorkdir=false, ReuseContainers=false).
          # Persistent host binds still require their actual non-root owner.
          ephemeral="$(python3 - "$GITHUB_WORKSPACE" <<'PYTHON'
          import os
          import re
          import sys

          def ephemeral_workspace(workspace, act_path, mountinfo, env):
              if env.get("ACT") != "true" or env.get("FORGEJO_ACTIONS") != "true":
                  return False
              records = [line.split() for line in mountinfo.splitlines()]
              def direct(path):
                  rows = [r for r in records if len(r) >= 10 and r[4] == path]
                  return rows[0] if len(rows) == 1 else None
              work, act = direct(workspace), direct(act_path)
              if work is None or act is None or work[0] == act[0]:
                  return False
              match = re.fullmatch(r"/var/lib/docker/volumes/([0-9a-f]{32})/_data", work[3])
              if match is None or act[3] != "/var/lib/docker/volumes/" + match[1] + "-env/_data":
                  return False
              try:
                  wi, ai = work.index("-"), act.index("-")
                  return (wi >= 6 and ai >= 6 and wi + 3 < len(work) and ai + 3 < len(act)
                          and work[0].isdigit() and act[0].isdigit() and work[2] == act[2]
                          and work[wi + 1:wi + 3] == act[ai + 1:ai + 3]
                          and "rw" in work[5].split(",") and "rw" in act[5].split(","))
              except (ValueError, IndexError):
                  return False

          with open("/proc/self/mountinfo", encoding="utf-8") as mounted:
              ephemeral = ephemeral_workspace(os.path.realpath(sys.argv[1]),
                  os.path.realpath("/var/run/act"), mounted.read(), os.environ)
          print("yes" if ephemeral else "no")
          PYTHON
          )"
          if [ "$ephemeral" = yes ]; then
            echo 'PLURX_WORKSPACE_MODE=forgejo-ephemeral' >> "$GITHUB_ENV"
            echo 'HOST_WORKSPACE_OWNER=' >> "$GITHUB_ENV"
            echo 'Paired Forgejo job volumes are removed by the provisioner; no host bind to restore'
            exit 0
          fi
          owner="$(stat -c '%u:%g' "$(dirname -- "$GITHUB_WORKSPACE")")"
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          fi
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            echo '::error::No non-root mounted workspace owner; refusing to leave root-owned runner files' >&2
            exit 1
          fi
          echo "HOST_WORKSPACE_OWNER=$owner" >> "$GITHUB_ENV"
          echo 'PLURX_WORKSPACE_MODE=persistent-bind' >> "$GITHUB_ENV"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c470d5aa033e84b4a2de1f8d36aa4180d62cd971
          persist-credentials: false
      - name: Verify actual merged main source
        run: |
          test "$(git rev-parse HEAD)" = "$CINEMA_MAIN_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = c84c24964c1c00b3cdc3e06c8a7489c71ab6a95b

      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: cluster-daemon
      - uses: ./.github/actions/rust-native-deps
      - uses: ./.github/actions/ffmpeg
        with:
          major: "8"
          binary: /usr/lib/jellyfin-ffmpeg/ffmpeg
      - name: Verify the cluster fixture generator
        run: |
          command -v ffmpeg
          ffmpeg -version
      - name: Run real-daemon activation and activity contracts
        run: make cluster-daemon-check
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          if [ "${PLURX_WORKSPACE_MODE:-}" = persistent-bind ] && [ -n "${HOST_WORKSPACE_OWNER:-}" ]; then
            chown -R "$HOST_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          fi

  web_layout:
    name: web layout and accessibility
    # Pinned for the same reason as `check`: a browser sweep still plays media
    # through ffmpeg. See .github/actions/ffmpeg.
    runs-on: [self-hosted, Linux, X64, lab, ci-topology]
    container:
      options: --cpus 3 --memory 12g --memory-swap 12g
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:3d84b711936233da699308d0301ac1e91f12e76c6b928967c41817e841f5e855
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    # Cold builds, fixture setup and 104 captures need room for later browser gates.
    timeout-minutes: 45
    steps:
      - name: Capture mounted runner workspace owner
        run: |
          # Forgejo v13.1.0 provisions paired random job volumes and deletes
          # both on cleanup (BindWorkdir=false, ReuseContainers=false).
          # Persistent host binds still require their actual non-root owner.
          ephemeral="$(python3 - "$GITHUB_WORKSPACE" <<'PYTHON'
          import os
          import re
          import sys

          def ephemeral_workspace(workspace, act_path, mountinfo, env):
              if env.get("ACT") != "true" or env.get("FORGEJO_ACTIONS") != "true":
                  return False
              records = [line.split() for line in mountinfo.splitlines()]
              def direct(path):
                  rows = [r for r in records if len(r) >= 10 and r[4] == path]
                  return rows[0] if len(rows) == 1 else None
              work, act = direct(workspace), direct(act_path)
              if work is None or act is None or work[0] == act[0]:
                  return False
              match = re.fullmatch(r"/var/lib/docker/volumes/([0-9a-f]{32})/_data", work[3])
              if match is None or act[3] != "/var/lib/docker/volumes/" + match[1] + "-env/_data":
                  return False
              try:
                  wi, ai = work.index("-"), act.index("-")
                  return (wi >= 6 and ai >= 6 and wi + 3 < len(work) and ai + 3 < len(act)
                          and work[0].isdigit() and act[0].isdigit() and work[2] == act[2]
                          and work[wi + 1:wi + 3] == act[ai + 1:ai + 3]
                          and "rw" in work[5].split(",") and "rw" in act[5].split(","))
              except (ValueError, IndexError):
                  return False

          with open("/proc/self/mountinfo", encoding="utf-8") as mounted:
              ephemeral = ephemeral_workspace(os.path.realpath(sys.argv[1]),
                  os.path.realpath("/var/run/act"), mounted.read(), os.environ)
          print("yes" if ephemeral else "no")
          PYTHON
          )"
          if [ "$ephemeral" = yes ]; then
            echo 'PLURX_WORKSPACE_MODE=forgejo-ephemeral' >> "$GITHUB_ENV"
            echo 'HOST_WORKSPACE_OWNER=' >> "$GITHUB_ENV"
            echo 'Paired Forgejo job volumes are removed by the provisioner; no host bind to restore'
            exit 0
          fi
          owner="$(stat -c '%u:%g' "$(dirname -- "$GITHUB_WORKSPACE")")"
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          fi
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            echo '::error::No non-root mounted workspace owner; refusing to leave root-owned runner files' >&2
            exit 1
          fi
          echo "HOST_WORKSPACE_OWNER=$owner" >> "$GITHUB_ENV"
          echo 'PLURX_WORKSPACE_MODE=persistent-bind' >> "$GITHUB_ENV"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c470d5aa033e84b4a2de1f8d36aa4180d62cd971
          persist-credentials: false
      - name: Verify actual merged main source
        run: |
          test "$(git rev-parse HEAD)" = "$CINEMA_MAIN_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = c84c24964c1c00b3cdc3e06c8a7489c71ab6a95b

      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: web-layout
      # Pinned so the browser-bundle cache key below is meaningful; bump both
      # together. A cache hit skips the ~150 MB Chromium download every run.
      - name: Cache Playwright browsers
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0
      - uses: ./.github/actions/rust-native-deps
      - uses: ./.github/actions/ffmpeg
        with:
          major: "8"
          binary: /usr/lib/jellyfin-ffmpeg/ffmpeg
      - uses: ./.github/actions/playwright
        with:
          version: "1.62.0"
      - name: Check every affected web layout
        run: make ui-check
      # Cheap (one page, no server, no media) and it covers the one thing the
      # Node web tests structurally cannot: that the shipped reporter actually
      # runs in a browser.
      - name: Run the playback-control reporter in a real browser
        run: make control-browser-check
      - name: Provision headed Cinema browser dependencies
        run: |
          set -eu
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            timeout 120s apt-get -o Acquire::Retries=2 update
            timeout 120s apt-get -o Acquire::Retries=2 install -y --no-install-recommends xvfb xauth
          fi
          command -v xvfb-run
          command -v xauth
      - name: Test Cinema remote browser contracts
        run: make cinema-remote-browser-check
      - name: Test grouped library rows in a real browser
        run: make library-rows-browser-check
      - name: Test Shared library layouts and enriched metadata in a real browser
        run: make web-shared-library-browser-check
      - name: Test subtitle model setup and generated-caption completion in a real browser
        run: make subtitle-generation-browser-check
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          if [ "${PLURX_WORKSPACE_MODE:-}" = persistent-bind ] && [ -n "${HOST_WORKSPACE_OWNER:-}" ]; then
            chown -R "$HOST_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          fi

  vod_web:
    name: film-addressed VOD browser acceptance
    # The eligible lab6 runners are separate VMs on one physical host. Running
    # both Chromium-heavy gates together starved one player to 0.5% speed and
    # made a settled layout capture see a transient activity-endpoint failure.
    # A dependency is deliberate: Forgejo 16 accepted the same job-level
    # concurrency group on both siblings but still executed them together.
    needs: web_layout
    runs-on: [self-hosted, Linux, X64, lab, ci-topology]
    container:
      options: --cpus 3 --memory 12g --memory-swap 12g
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:3d84b711936233da699308d0301ac1e91f12e76c6b928967c41817e841f5e855
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    timeout-minutes: 25
    steps:
      - name: Capture mounted runner workspace owner
        run: |
          # Forgejo v13.1.0 provisions paired random job volumes and deletes
          # both on cleanup (BindWorkdir=false, ReuseContainers=false).
