name: Linux Player APT release

on:
  push:
    branches: [main]
    paths:
      - clients/linux-player/debian/changelog
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-player-apt-release
  cancel-in-progress: false

jobs:
  package:
    if: github.server_url != 'https://github.com' && github.ref == 'refs/heads/main'
    runs-on: [ci-nonvoter-heavy-amd64]
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify the Debian package
        run: make linux-player-deb
        env:
          PLURX_DEB_JOBS: 4
      - name: Attach the verified release to the Forgejo project
        run: python3 clients/linux-player/packaging/attach-apt-release.py target/linux-player-deb
        env:
          RELEASE_TOKEN: ${{ github.token }}
