name: Linux Player APT release

on:
  push:
    branches: [main]
    paths:
      - clients/linux-player/debian/changelog
  workflow_dispatch:

concurrency:
  group: linux-player-apt-release
  cancel-in-progress: false

jobs:
  package:
    if: github.server_url != 'https://github.com' && github.ref == 'refs/heads/main'
    runs-on: [ci-nonvoter-heavy-amd64]
    timeout-minutes: 45
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify the Debian package
        run: env -u FORGEJO_TOKEN -u GITHUB_TOKEN -u GITEA_TOKEN make linux-player-deb
        env:
          PLURX_DEB_JOBS: 4
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: linux-player-debian-release
          path: |
            target/linux-player-deb/plurx-player_*
            target/linux-player-deb/SHA256SUMS
          if-no-files-found: error
          overwrite: true

  release:
    needs: package
    if: github.server_url != 'https://github.com' && github.ref == 'refs/heads/main'
    runs-on: [ci-nonvoter-heavy-amd64]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: linux-player-debian-release
          path: target/linux-player-deb
      - name: Attach the verified release to the Forgejo project
        run: python3 clients/linux-player/packaging/attach-apt-release.py target/linux-player-deb
        env:
          RELEASE_TOKEN: ${{ github.token }}
