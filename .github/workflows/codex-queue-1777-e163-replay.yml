name: Private focused Linux check for PR 1777
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_MIN_STACK: "8388608"
jobs:
  check:
    name: Replay exact Linux cases from Brix
    runs-on: [self-hosted, Linux, X64, lab, unit-memory-16g]
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:6a989b4d92f55b29befa9eae08f9cd59940b3067d771629549ebf5ab1f4d433d
      options: --memory 14g --memory-swap 14g --cpus 3 --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 65
    steps:
      - name: Verify this job has its own bounded Docker cgroup
        run: |
          set -euo pipefail
          relative="$(awk -F: '$1=="0" { print $3 }' /proc/self/cgroup)"
          [[ "$relative" = /* ]]
          root="/sys/fs/cgroup$relative"
          memory=$(cat "$root/memory.max")
          swap=$(cat "$root/memory.swap.max")
          printf 'Effective diagnostic container memory=%s swap=%s\n' "$memory" "$swap"
          [[ "$memory" =~ ^[0-9]+$ && "$swap" =~ ^[0-9]+$ ]]
          # This registration's standard inherited swap cap is 4 GiB.
          # Keep the requested resident-memory limit at 14 GiB.
          (( memory == 15032385536 && swap <= 4294967296 ))
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 75a34c1b8dc3a0a2ef431fedfdc7c4d04dfa51c2
          persist-credentials: false
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
      - uses: ./.github/actions/rust-native-deps
        with:
          desktop: "true"
      - uses: ./.github/actions/ffmpeg
        with:
          major: "8"
          binary: /usr/lib/jellyfin-ffmpeg/ffmpeg
      - name: Verify the candidate and run the named cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 75a34c1b8dc3a0a2ef431fedfdc7c4d04dfa51c2
          mkdir -p target/queue-1777-e163-diagnostic
          receipt=target/queue-1777-e163-diagnostic/outcomes.txt
          {
            git rev-parse HEAD
            rustc --version | grep -F 'rustc 1.97.1 '
            /usr/lib/jellyfin-ffmpeg/ffmpeg -version | sed -n '1p'
          } | tee "$receipt"
          run_exact() {
            local case_id="$1" log="$2"
            shift 2
            set +e
            cargo test --locked -j1 "$@" "$case_id" -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"
            local result=${PIPESTATUS[0]}
            set -e
            if test "$result" = 0 && grep -q 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log" && ! grep -q 'SKIP:' "$log"; then
              printf 'passed %s\n' "$case_id" | tee -a "$receipt"
            else
              printf 'failed %s\n' "$case_id" | tee -a "$receipt"
            fi
          }
          cases=(
            decode_facts::tests::blocked_source_identity_returns_deadline_without_releasing_probe_ownership
            decode_facts::tests::facts_are_collected_from_the_held_descriptor_and_cached_by_build
            decode_facts::tests::legacy_selection_binds_attached_art_and_catalog_to_the_resolved_absolute_stream
            decode_facts::tests::metrics_count_each_phase_once
            decode_facts::tests::normal_completion_kills_descendants_before_reaping_the_group_leader
            decode_facts::tests::persistent_steady_response_eintr_cannot_wedge_detached_cleanup
            decode_facts::tests::pidfd_open_failure_detaches_bounded_version_cleanup
            decode_facts::tests::production_probe_cannot_export_the_bound_source_descriptor
            decode_facts::tests::running_cancellation_reaps_before_restoring_and_releasing_the_source
            decode_facts::tests::source_lease_wait_is_charged_to_the_probe_deadline
            decode_facts::tests::supervisor_stop_bounds_persistent_steady_response_interrupts
            http::hls::start_plan::tests::the_create_catalog_answers_from_the_create_plan_and_reads_nothing
            http::shared_source_playback::tests::sharing_source_http_burned_text_h1_h2_and_confirmed_end
          )
          for i in "${!cases[@]}"; do
            run_exact "${cases[$i]}" "target/queue-1777-e163-diagnostic/daemon-$i.log" -p plurxd --features plurx-core/hiqlite-store --bin plurxd
          done
          test "$(grep -c '^passed ' "$receipt")" = 13
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: queue-1777-e163-replay
          path: target/queue-1777-e163-diagnostic
          if-no-files-found: warn
          retention-days: 7
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"
