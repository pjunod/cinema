name: Cinema landed main Rust unit remainder
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
concurrency:
  group: cinema-rust-remainder-c470d5aa033e
  cancel-in-progress: false
jobs:
  check:
    name: Rust unit and SQLite contracts
    # Kotlin and Swift diffs compile nothing under crates/, so the cargo lane
    # only runs when the diff can reach it; qualification and queue runs force
    # the complete fan-out.
    # The 16-GiB unit container shares a capacity-one build slot on a nonvoter.
    runs-on: [self-hosted, Linux, X64, lab, baremetal, ci-store]
    # Private, smoke-tested CI target; never expose the management credential.
    container:
      image: ${{ vars.FLEET_REGISTRY || 'fleet-registry.unset.invalid' }}/noirr/plurx-ci@sha256:3d84b711936233da699308d0301ac1e91f12e76c6b928967c41817e841f5e855
      options: --cpus 3 --memory 16g --memory-swap 18g --pids-limit 4096
      credentials:
        username: noirr
        password: ${{ secrets.CI_REGISTRY_PULL_TOKEN }}
    # Run 5447 failed after 88m50s; the two following serial FFmpeg checks
    # never ran. Source fixture admission may also queue independent bodies.
    # Preserve every command with a finite 120m cap. Passing full-gate duration
    # remains unmeasured; this budget is not a completion guarantee.
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "2"
    steps:
      - name: Capture mounted runner workspace owner
        run: |
          # Forgejo v13.1.0 provisions paired random job volumes and deletes
          # both on cleanup (BindWorkdir=false, ReuseContainers=false).
          # Persistent host binds still require their actual non-root owner.
          ephemeral="$(python3 - "$GITHUB_WORKSPACE" <<'PYTHON'
          import os
          import re
          import sys

          def ephemeral_workspace(workspace, act_path, mountinfo, env):
              if env.get("ACT") != "true" or env.get("FORGEJO_ACTIONS") != "true":
                  return False
              records = [line.split() for line in mountinfo.splitlines()]
              def direct(path):
                  rows = [r for r in records if len(r) >= 10 and r[4] == path]
                  return rows[0] if len(rows) == 1 else None
              work, act = direct(workspace), direct(act_path)
              if work is None or act is None or work[0] == act[0]:
                  return False
              match = re.fullmatch(r"/var/lib/docker/volumes/([0-9a-f]{32})/_data", work[3])
              if match is None or act[3] != "/var/lib/docker/volumes/" + match[1] + "-env/_data":
                  return False
              try:
                  wi, ai = work.index("-"), act.index("-")
                  return (wi >= 6 and ai >= 6 and wi + 3 < len(work) and ai + 3 < len(act)
                          and work[0].isdigit() and act[0].isdigit() and work[2] == act[2]
                          and work[wi + 1:wi + 3] == act[ai + 1:ai + 3]
                          and "rw" in work[5].split(",") and "rw" in act[5].split(","))
              except (ValueError, IndexError):
                  return False

          with open("/proc/self/mountinfo", encoding="utf-8") as mounted:
              ephemeral = ephemeral_workspace(os.path.realpath(sys.argv[1]),
                  os.path.realpath("/var/run/act"), mounted.read(), os.environ)
          print("yes" if ephemeral else "no")
          PYTHON
          )"
          if [ "$ephemeral" = yes ]; then
            echo 'PLURX_WORKSPACE_MODE=forgejo-ephemeral' >> "$GITHUB_ENV"
            echo 'HOST_WORKSPACE_OWNER=' >> "$GITHUB_ENV"
            echo 'Paired Forgejo job volumes are removed by the provisioner; no host bind to restore'
            exit 0
          fi
          owner="$(stat -c '%u:%g' "$(dirname -- "$GITHUB_WORKSPACE")")"
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            owner="$(stat -c '%u:%g' "$GITHUB_WORKSPACE")"
          fi
          if [ "${owner%%:*}" = 0 ] || [ "${owner##*:}" = 0 ]; then
            echo '::error::No non-root mounted workspace owner; refusing to leave root-owned runner files' >&2
            exit 1
          fi
          echo "HOST_WORKSPACE_OWNER=$owner" >> "$GITHUB_ENV"
          echo 'PLURX_WORKSPACE_MODE=persistent-bind' >> "$GITHUB_ENV"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c470d5aa033e84b4a2de1f8d36aa4180d62cd971
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout the reviewed closed-promotion verifier separately
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 61b525add3836e11d863cc4d35d2a7506bb083fe
          path: .cinema-unit-selector
          persist-credentials: false
      - name: Separate the verifier from the landed checkout
        run: |
          test "$(git -C .cinema-unit-selector rev-parse HEAD)" = 61b525add3836e11d863cc4d35d2a7506bb083fe
          mv .cinema-unit-selector "$RUNNER_TEMP/cinema-unit-selector"
      - name: Verify landed source and select prior passes from the closed promotion
        id: workspace-continuation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = c470d5aa033e84b4a2de1f8d36aa4180d62cd971
          test "$(git rev-parse 'HEAD^{tree}')" = c84c24964c1c00b3cdc3e06c8a7489c71ab6a95b
          git status --porcelain --untracked-files=normal
          descriptor=$(mktemp)
          trap 'rm -f "$descriptor"' EXIT
          printf '%s\n' '{"sha256":"b0724ffb983580aaadbfeb1fc0c2175a7533a546cd54114b5f1e5d57761ebefe","attachment_id":146,"attachment_uuid":"1649bb38-8987-4a63-b91a-7e07620ab46f"}' > "$descriptor"
          mkdir -p target/validation
          PYTHONPATH="$RUNNER_TEMP/cinema-unit-selector" python3 -P -m validation.postmerge_unit_retention rust --pull 1399 --landing c470d5aa033e84b4a2de1f8d36aa4180d62cd971 --descriptor "$descriptor" --out target/validation/workspace-rust-selection.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          selection = json.loads(Path('target/validation/workspace-rust-selection.json').read_bytes())
          assert selection['candidate'] == 'c470d5aa033e84b4a2de1f8d36aa4180d62cd971'
          assert selection['postmerge_binding']['head_sha'] == '0d05ba03455b0ad67990acacb5e6551baaec9326'
          assert sum(map(len, selection['retained'].values())) == 2848
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('root_retained=' + str(selection['root_ownership_passed']).lower(), file=output)
          PYTHON
      - uses: https://github.com/dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-native-deps
        with:
          desktop: "true"
      - uses: ./.github/actions/ffmpeg
        with:
          major: "8"
          binary: /usr/lib/jellyfin-ffmpeg/ffmpeg
      - id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          lane: rust-gate
      - name: Verify source recovery ownership in the root Linux unit container
        if: steps.workspace-continuation.outputs.root_retained != 'true'
        run: |
          # This container is already the root-capable pinned Linux unit
          # surface. Exercise real UID/GID handoff instead of counting the
          # non-root operations lane's ownership-case skip as coverage.
          python3 -c 'import os; assert os.geteuid() == 0, "source recovery ownership regression requires the root unit container"'
          python3 -m unittest discover -s tests/operations -p test_source_custody_recovery.py -v
      - name: Compile the full workspace and execute missing Rust outcomes
        run: python3 -m validation.workspace_rust_execute
      - name: Enforce persistent Cargo bounds
        if: always() && steps.cargo-cache.outputs.local == 'true'
        uses: ./.github/actions/cargo-cache-finalize
        with:
          cache-root: ${{ steps.cargo-cache.outputs.cache-root }}
          budget-gb: ${{ steps.cargo-cache.outputs.budget-gb }}
          last-used: ${{ steps.cargo-cache.outputs.last-used }}

      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          if [ "${PLURX_WORKSPACE_MODE:-}" = persistent-bind ] && [ -n "${HOST_WORKSPACE_OWNER:-}" ]; then
            chown -R "$HOST_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          fi
