name: Prepare landed Cinema native media
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CINEMA_MAIN_COMMIT: '99d08f9b5ed0ecfd8992e82ac5d2ff93f59a2b5c'
concurrency:
  group: cinema-reader-package-99d08f9b5ed0
  cancel-in-progress: false
jobs:
  package_amd64:
    name: Prepare source-pinned native media
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    concurrency:
      group: plurx-cinema-amd-package
      cancel-in-progress: false
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            kernel_machine: x86_64
            docker_machine: x86_64
            runs_on: '["self-hosted","Linux","X64","lab","incus","ubuntu-24.04","android-kvm","ci-store"]'
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 99d08f9b5ed0ecfd8992e82ac5d2ff93f59a2b5c
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual merged main source
        run: |
          test "$(git rev-parse HEAD)" = "$CINEMA_MAIN_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = 69c68295b931791890ae454e7dc6bd162499bc02

      - name: Prove the package runner and Docker engine are native
        env:
          ARCH: ${{ matrix.arch }}
          DOCKER_ARCH: ${{ matrix.docker_machine }}
          KERNEL_ARCH: ${{ matrix.kernel_machine }}
        run: |
          set -euo pipefail
          test "$(uname -s)/$(uname -m)" = "Linux/$KERNEL_ARCH"
          test "$(docker info --format '{{.OSType}}/{{.Architecture}}')" = "linux/$DOCKER_ARCH"
      - name: Unpack the Ubuntu-signed native Buildx tool
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/reader-media-buildx"
          mkdir -p "$tool/debs" "$tool/root" "$tool/config/cli-plugins"
          cd "$tool/debs"
          apt-get download 'docker-buildx=0.30.1-0ubuntu1~24.04.1'
          dpkg-deb -x ./*.deb "$tool/root"
          ln -s "$tool/root/usr/libexec/docker/cli-plugins/docker-buildx" "$tool/config/cli-plugins/docker-buildx"
          export DOCKER_CONFIG="$tool/config"
          docker buildx version | grep -F '0.30.1'
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - id: buildx-cache
        uses: ./.github/actions/buildx-cache
        with:
          lane: package-smoke-${{ matrix.arch }}
      - name: Bound this runner-owned package builder
        env:
          BUILDER: ${{ steps.buildx-cache.outputs.builder-name }}
        run: |
          set -euo pipefail
          [[ "$BUILDER" =~ ^plurx-[a-z0-9_.-]+$ ]]
          container="buildx_buildkit_${BUILDER}0"
          test "$(docker inspect --format '{{.Name}}' "$container")" = "/$container"
          docker update --memory 9g --memory-swap 9g --cpuset-cpus 0-1 --cpu-period 100000 --cpu-quota 200000 "$container"
          test "$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.CpuQuota}} {{.HostConfig.CpuPeriod}} {{.HostConfig.CpusetCpus}}' "$container")" = '9663676416 9663676416 200000 100000 0-1'
      - name: Build and export the exact audited Bookworm media package
        if: matrix.arch == 'amd64'
        uses: https://github.com/docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: linux-dolby-package-export
          platforms: linux/amd64
          outputs: type=tar,dest=linux-dolby-export.tar
          cache-from: ${{ steps.buildx-cache.outputs.local != 'true' && 'type=gha,scope=package-media-amd64' || '' }}
          cache-to: ${{ steps.buildx-cache.outputs.local != 'true' && 'type=gha,mode=max,scope=package-media-amd64' || '' }}
      - name: Validate and unpack the complete audited media export
        if: matrix.arch == 'amd64'
        run: python3 -m validation.media_export linux-dolby-export.tar linux-dolby-export
