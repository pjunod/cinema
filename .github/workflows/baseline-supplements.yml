                     'profile': 'node', 'features': [],
                     'toolchain': subprocess.check_output(['node', '--version'], text=True).strip(),
                     'include_desktop_remote': True}
          (output / 'context.json').write_text(json.dumps(context, indent=2) + '\n')
          report = collect(context, Path.cwd(), output / 'logs', environment=environment)
          (output / 'cell.json').write_text(json.dumps(report, indent=2) + '\n')
          raise SystemExit(0 if report['passed'] else 1)
          PY
      - name: Restore persistent runner workspace ownership
        if: always()
        run: |
          if [ "${PLURX_WORKSPACE_MODE:-}" = persistent-bind ] && [ -n "${HOST_WORKSPACE_OWNER:-}" ]; then
            chown -R "$HOST_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          fi
      - name: Preserve every exact Node command result and raw log
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: baseline-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline-node
          if-no-files-found: error
          retention-days: 14
