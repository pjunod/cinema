name: paperwork

# The fast lane runs its own paperwork job for pull requests into main. Task
# pull requests into an effort branch otherwise allocate no jobs at all, so
# this is the one check they get: the bookkeeping rules, in about a minute,
# drafts included. docs/ci/PAPERWORK.md lists the rules and their fixes.
on:
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: paperwork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paperwork:
    name: paperwork
    runs-on: [self-hosted, Linux, X64, lab, general]
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - name: Check index rows, release counters, names and Regression-Test fields
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The description and title are read from the event payload file
          # (validation/pr_event.py), never the environment: a long
          # description made the runner unable to start this step at all.
          GITHUB_TOKEN: ${{ github.token }}
          # A push made with the run's own token starts no workflow, so a fix
          # pushed with it leaves its head without a lane run. With this
          # secret set the fix's push starts the next run itself.
          PAPERWORK_PUSH_TOKEN: ${{ secrets.PAPERWORK_PUSH_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --force origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
            "+refs/heads/main:refs/remotes/origin/main"
          # Release counters are judged against main: an effort that already
          # claimed its bump does not owe another one per task pull request.
          if python3 scripts/paperwork --base "$PR_BASE_SHA" --merge-target "origin/$BASE_REF" --counter-target origin/main --body-env; then
            exit 0
          fi
          # Derivable bookkeeping is fixed on the branch instead of failing the
          # lane (docs/ci/PAPERWORK.md "What fixes itself"). Anything else, or
          # a head that is already a fix, fails here with paperwork's own fix.
          [ "$SAME_REPO" = true ] || exit 1
          python3 scripts/paperwork-fix --ci --base "$PR_BASE_SHA" --merge-target "origin/$BASE_REF" --counter-target origin/main \
            --head-sha "$PR_HEAD_SHA" --run-url "$RUN_URL" || exit 1
          python3 scripts/paperwork --base "$PR_BASE_SHA" --merge-target "origin/$BASE_REF" --counter-target origin/main --body-env || remaining=1
          # Leased to the checked head, only to an ordinary work branch, token
          # through git's environment (scripts/paperwork-fix push_refusal).
          python3 scripts/paperwork-fix --push --head-ref "$HEAD_REF" --base-ref "$BASE_REF" \
            --head-sha "$PR_HEAD_SHA" || exit 1
          fixed="$(git rev-parse HEAD)"
          echo "::notice::paperwork pushed $fixed to $HEAD_REF with the derivable fixes; pull it before your next push (git pull --rebase)."
          if [ -n "${remaining:-}" ]; then
            echo "Paperwork still fails after the derivable fixes; the [FAIL] above is the author's to fix."
            exit 1
          fi
          if [ -n "$PAPERWORK_PUSH_TOKEN" ]; then
            # The push started the lane on $fixed, which cancels this run.
            sleep 300
            echo "The fix push started no new run within five minutes; push any commit to run the lane on $fixed."
            exit 1
          fi
          echo "The fix was pushed with the run's own token, which starts no run: push any commit (git commit --allow-empty) to run the lane on $fixed."
          exit 1
