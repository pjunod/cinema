# Host-specific compose override — copy to docker-compose.override.yml (which
# is gitignored) and edit for THIS machine. Compose merges it automatically.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Every volume line must be `host:container` — a line with no colon does NOT
# bind your folder; it creates an empty anonymous volume at that path inside
# the container, and scans of it will (loudly, now) find nothing.
#
# The paths you enter in the plurx web UI are the *container-side* paths:
# mount /mnt/qnap/media at /media below, then add /media/movies in the UI.
# Mounting shares at the same path as the host (second example) keeps UI
# paths identical to host paths — pick whichever you find saner.
#
# A shared external network is also valid here. If you add `networks:` to the
# service, do not also set `network_mode: host`: Compose treats those as
# mutually exclusive and refuses the entire project before starting a build.
# The tracked `plurx-discovery` companion already uses host networking for
# Bonjour, so adding this shared network does not disable native discovery.

services:
  plurxd:
    # Attach the service to a shared external media network by uncommenting
    # these two lines and the matching top-level declaration below:
    # networks:
    #   - media

    volumes:
      - /mnt/qnap/media:/media:ro
      # - /mnt/qnap/20t:/mnt/qnap/20t:ro
      # - /mnt/qnap/8tb:/mnt/qnap/8tb:ro
      # Optional cluster shared-cache mount. Use the same underlying writable
      # filesystem and PLURX_SHARED_CACHE_ID on every participating voter;
      # the container path itself may differ between hosts.
      # - /mnt/shared/plurx-cache:/var/cache/plurx-shared
      # Optional persistent-cache and disposable-scratch roots, paired with the
      # PLURX_CACHE_DIR / PLURX_TRANSCODE_DIR block below. Create both host
      # directories owned by PUID:PGID before the first start. The scratch
      # directory must be empty on first claim and must not be a path under
      # PLURX_DATA; plurx claims it with a .plurx-transcode-scratch marker and
      # then empties it at every start:
      # - /srv/plurx-cache:/var/cache/plurx
      # - /srv/plurx-scratch:/var/tmp/plurx-transcode

    # Point at a specific ffmpeg build (e.g. jellyfin-ffmpeg), force an
    # encoder family, configure the optional verified shared cache, or leave
    # unset for validated auto-detect and node-local cache behavior:
    # environment:
    #   PLURX_FFMPEG: "/usr/lib/jellyfin-ffmpeg/ffmpeg"
    #   PLURX_FFPROBE: "/usr/lib/jellyfin-ffmpeg/ffprobe"
    #   PLURX_HWACCEL: "vaapi"   # nvenc | qsv | vaapi | videotoolbox | software
    #   PLURX_SHARED_CACHE_DIR: "/var/cache/plurx-shared"
    #   PLURX_SHARED_CACHE_ID: "media-cache-a"
    #   # Container-side paths of the two mounts above. Setting PLURX_CACHE_DIR
    #   # on an existing install moves nothing: copy <data>/artwork,
    #   # <data>/cache/transcode and <data>/cache/subs to <cache>/artwork,
    #   # <cache>/transcode and <cache>/subs first — `cp -a <data>/cache
    #   # <cache>` puts the finished transcodes and every completed offline
    #   # package where nothing reads them. See docs/OPERATIONS.md.
    #   PLURX_CACHE_DIR: "/var/cache/plurx"
    #   PLURX_TRANSCODE_DIR: "/var/tmp/plurx-transcode"
    #   # Local replicated-read pool, 1-16. Leave 4 without retained 4/8/16
    #   # evidence for this workload.
    #   PLURX_CLUSTER_READ_POOL_SIZE: "4"

    # --- Hardware transcode passthrough (uncomment for your GPU) ---
    #
    # Intel QuickSync / AMD VA-API:
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # NVIDIA (needs nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# Matching top-level declaration for the optional service attachment above:
# networks:
#   media:
#     external: true
