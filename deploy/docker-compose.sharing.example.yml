# Opt-in Linux bridge Sharing. Copy to docker-compose.sharing.yml and include
# it in COMPOSE_FILE alongside the base and your ordinary host override.
# Choose a free subnet; the static IP must match sharing-bridge.toml.
services:
  plurxd:
    ports:
      - "127.0.0.1:32444:32444/tcp"
    environment:
      PLURX_CONFIG: "/etc/plurx/plurx.toml"
    volumes:
      - "./sharing-bridge.toml:/etc/plurx/plurx.toml:ro"
    networks:
      default: {}
      sharing:
        ipv4_address: "172.30.44.2"
networks:
  sharing:
    driver: bridge
    ipam:
      config:
        - subnet: "172.30.44.0/24"
