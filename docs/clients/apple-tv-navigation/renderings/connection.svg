<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Proposed connection recovery with contextual Help"><title>Proposed connection recovery with contextual Help</title><defs><linearGradient id="art" x2="1" y2="1"><stop stop-color="#364754"/><stop offset="1" stop-color="#172027"/></linearGradient><linearGradient id="shade" x2="0" y2="1"><stop stop-color="#0a0a0c" stop-opacity="0"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0a0a0c"/><text x="80" y="95" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#e5484d" font-weight="700">cinema</text><text x="450" y="300" font-family="Helvetica,Arial,sans-serif" font-size="58" fill="#ededf0" font-weight="700">Cinema is unavailable</text><text x="450" y="385" font-family="Helvetica,Arial,sans-serif" font-size="31" fill="#aaaab5" font-weight="400">Your sign-in is saved.</text><text x="450" y="433" font-family="Helvetica,Arial,sans-serif" font-size="31" fill="#aaaab5" font-weight="400">Check the server connection, then try again.</text><rect x="450" y="535" width="1020" height="90" rx="14" fill="#29292f" stroke="#ededf0" stroke-width="4"/><text x="474" y="590.0" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="400">Try again</text><rect x="450" y="655" width="1020" height="80" rx="14" fill="#17171c" stroke="#35353e" stroke-width="1"/><text x="474" y="705.0" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="400">Use a different server</text><rect x="450" y="765" width="1020" height="80" rx="14" fill="#17171c" stroke="#35353e" stroke-width="1"/><text x="474" y="815.0" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="400">Help</text><text x="450" y="925" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#aaaab5" font-weight="400">No account changes are needed to retry.</text></svg>