<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Proposed navigation qualification receipt, not a product screen"><title>Proposed navigation qualification receipt, not a product screen</title><defs><linearGradient id="art" x2="1" y2="1"><stop stop-color="#364754"/><stop offset="1" stop-color="#172027"/></linearGradient><linearGradient id="shade" x2="0" y2="1"><stop stop-color="#0a0a0c" stop-opacity="0"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0a0a0c"/><text x="80" y="100" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#e5484d" font-weight="700">RELEASE EVIDENCE · ILLUSTRATIVE</text><text x="80" y="185" font-family="Helvetica,Arial,sans-serif" font-size="59" fill="#ededf0" font-weight="700">Navigation must be proven</text><text x="80" y="250" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#aaaab5" font-weight="400">A compile is not a remote journey. A missing receipt is not a pass.</text><text x="80" y="355" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#aaaab5" font-weight="400">REQUIRED JOURNEY</text><text x="1020" y="355" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#aaaab5" font-weight="400">NATIVE FOCUS</text><text x="1450" y="355" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#aaaab5" font-weight="400">RESULT</text><rect x="80" y="405" width="1760" height="75" rx="8" fill="#17171c"/><text x="105" y="453" font-family="Helvetica,Arial,sans-serif" font-size="29" fill="#ededf0" font-weight="400">Movies → View → Close</text><text x="1020" y="453" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#aaaab5" font-weight="400">Inside menu → View</text><text x="1450" y="453" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="700">PASS</text><rect x="80" y="505" width="1760" height="75" rx="8" fill="#17171c"/><text x="105" y="553" font-family="Helvetica,Arial,sans-serif" font-size="29" fill="#ededf0" font-weight="400">Movie 416 → Details → Back</text><text x="1020" y="553" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#aaaab5" font-weight="400">Same movie retained</text><text x="1450" y="553" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="700">PASS</text><rect x="80" y="605" width="1760" height="75" rx="8" fill="#17171c"/><text x="105" y="653" font-family="Helvetica,Arial,sans-serif" font-size="29" fill="#ededf0" font-weight="400">Playback → More → Report</text><text x="1020" y="653" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#aaaab5" font-weight="400">More restored</text><text x="1450" y="653" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="700">PASS</text><rect x="80" y="705" width="1760" height="75" rx="8" fill="#17171c"/><text x="105" y="753" font-family="Helvetica,Arial,sans-serif" font-size="29" fill="#ededf0" font-weight="400">Delete → Back</text><text x="1020" y="753" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#aaaab5" font-weight="400">Keep → same recording</text><text x="1450" y="753" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="700">PASS</text><rect x="80" y="805" width="1760" height="75" rx="8" fill="#17171c"/><text x="105" y="853" font-family="Helvetica,Arial,sans-serif" font-size="29" fill="#ededf0" font-weight="400">Physical Siri Remote sweep</text><text x="1020" y="853" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#aaaab5" font-weight="400">Not yet recorded</text><text x="1450" y="853" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#e5484d" font-weight="700">MISSING</text><text x="80" y="990" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#e5484d" font-weight="700">RELEASE HELD · Complete the physical acceptance receipt for this candidate.</text></svg>