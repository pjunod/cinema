 rx="0" fill="#00000099"/><rect x="470" y="330" width="980" height="450" rx="24" fill="#1b1b21"/><text x="530" y="420" font-family="Helvetica,Arial,sans-serif" font-size="43" fill="#ededf0" font-weight="700">Delete “Wild places”?</text><text x="530" y="485" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#aaaab5" font-weight="400">The recording and its saved file will be removed.</text><text x="530" y="527" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#aaaab5" font-weight="400">Other episodes and the recording rule stay.</text><rect x="530" y="640" width="400" height="80" rx="14" fill="#29292f" stroke="#ededf0" stroke-width="4"/><text x="554" y="690.0" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="400">Keep recording</text><rect x="970" y="640" width="420" height="80" rx="14" fill="#17171c" stroke="#35353e" stroke-width="1"/><text x="994" y="690.0" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#ededf0" font-weight="400">Delete recording</text><text x="80" y="1030" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#aaaab5" font-weight="400">Confirmation owns focus · Back cancels · Deletion returns to the next recording</text></svg>