# A forward seek into the loaded window's 20 s refresh margin refreshed without
# clearing, because the position was still inside the loaded window, so the
# pre-seek cue (often one that had ended) stayed up until the new window
# loaded. The anchored line is where the controller acts on seekPlan's
# clearNow; aSeekIntoTheRefreshMarginDropsTheStaleFrameAtOnce drives a real
# PGSOverlayController through that seek and fails with "expected null, but
# was <c2>" when the old window-containment rule is put back. The same commit
# read refusals from errorBody(): manifestResponsesFromSharedFixture feeds
# readPGSOverlayManifestResponse real retrofit2.Response objects, which is the
# function the controller's source calls. The code of this commit was
# restructured by af514df1; the anchors name where the behaviour lives now.
