# The unmerged counter-fallback proposals were superseded by callback
# lifecycle repair; retain their history mappings against the current proof.
# The capacity 503 this player's previous start produced was codeless, so
# every client correctly declined to retry it and the viewer got a terminal
# overlay quoting an internal sentence. The fix is the wire code that lets it
# enter the create-retry ladder all three clients already carry.
