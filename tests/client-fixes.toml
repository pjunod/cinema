[[fixes]]
# A start answer nobody recognises must keep the durable handle: a code this
# build has never heard of is not evidence that no session exists. The
# DEFINITIVE_START_REFUSALS set this once anchored on became the shared
# reducer, which decides it from owner_decided and the status rather than from
