[[fixes]]
# The screen set the retention flag before calling `enterPictureInPictureMode`
# and discarded the Boolean it returns. The system refuses PiP whenever the
# user has turned it off for the app, and on that path no mode-changed callback
# ever fires — so the flag latched true for the life of the process and every
# lifecycle release path was disabled. The client then kept renewing the lease
# on the household's only tuner against a screen nobody was on, with no way
# back to the Stop button.
id = "android.live-tv-refused-pip-must-not-latch-retention"
commits = ["01413da4"]
source = "clients/android/app/src/main/java/tv/plurx/app/livetv/LiveTvScreen.kt"
source_anchor = "controller.setRetained(entered)"
test = "clients/android/app/src/test/java/tv/plurx/app/livetv/LiveTvInputPolicyTest.kt"
test_anchor = "a refused picture-in-picture never latches the retention flag"

[[fixes]]
# Nothing in the tvOS live surface was focusable while the overlay was hidden.
# tvOS delivers move/exit/playPause only to the focused view and its ancestors,
# and PlayerSurfaceView refuses focus — so the overlay's own four-second
# auto-hide removed the last focusable view from the presented cover and the
# surface went permanently deaf. Every `hidden -> reveal` row of the contract
# was unreachable, with no way back to any chrome.
id = "apple.live-tv-ten-foot-surface-keeps-something-focusable"
commits = ["9268f5f6"]
source = "clients/apple/Sources/LiveTvView.swift"
source_anchor = ".focused($focusedControl, equals: FocusTarget.reveal)"
test = "clients/apple/Tests/LiveTvTests.swift"
test_anchor = "testTheTenFootSurfaceKeepsSomethingFocusableWhileTheOverlayIsHidden"

