# `runTest`'s virtual clock the watchdog either fires before the create settles
# or is cancelled while its delay is still pending, and nothing settles a
# sequence inside the window between the two. The anchor is therefore the rule
# itself, in the `finally` a revert removes; the test named is the nearest
# sequence-level case, which requires a session landing after the deadline to be
# released rather than attached and to raise no second prompt - the outcome this
# ordering keeps true when the two land on the same millisecond.
