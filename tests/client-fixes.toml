[[fixes]]
# Both Android backup rule files excluded only `offline/`, so the Preferences
# DataStore holding the account bearer, the origin and the username was copied
# to Google by Auto Backup and handed to a new handset by device-to-device
# transfer. The correction excludes the whole `datastore/` directory in both
# files and — this is the half that is easy to lose — under BOTH sections of
# `data-extraction-rules`, because excluding `cloud-backup` alone leaves the
# transfer path open, which is F-android-7's named mistake.
#
# No Android toolchain runs in this repository's suites, so the anchored test
# is an operations case that reads the XML rather than a Gradle unit test: it
# parses both files, requires a `domain="file"` exclusion of `datastore/` under
# every declared section, and requires the two files to agree. It also pins
# that the bearer still lives under a `preferencesDataStore` — moving the token
# to SharedPreferences or a plain file would leave both exclusions pointing at
# a directory it no longer occupies while every other assertion still passed.
# A revert to the one-line `offline/`-only rules fails it.
