# iOS does not promise an `.ended` for every `.began`. A hold raised on
# `.began` that only `.ended` could clear stayed up for an hour over a picture
# the viewer had resumed (iPad Pro, 2026-10-04), with the stall monitor off.
# The viewer's press, and film actually playing, now end it, and a `.began`
# while the viewer has already paused holds nothing.
