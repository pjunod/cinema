<script>
  // Every line below is a surface write outside the render. All must trip.
  function showFailure(p, text) {
    setLoading(true, "Playback stopped.", text, "<button>Try again</button>");
    p.el.classList.add("failed");
    p.el.classList.remove("failed");
    p.stallPrompt = true;
    ploadText.textContent = "Reconnecting…";
    ploadSub.innerHTML = "<em>held</em>";
  }
  function bulk() {
    Object.assign(ploadAct, { textContent: "Try again" });
  }
  // The spellings an allow list written against one idiom would miss.
  function sneaky(p, on, l) {
    p.el.className = "ploading failed";
    ploading.setAttribute("class", "ploading failed");
    l.classList.add(FAILED);
    l.classList.add("fai" + "led");
    p.el.classList[on ? "add" : "remove"]("failed");
    Object.assign(p, { stallPrompt: true });
    window["setLoading"](true);
    const paint = setLoading;
    return paint;
  }
  function split() {
    setLoading
      (true, "Preparing…", "", "");
  }
  // The spellings a DOM API list written in 2015 would miss.
  function modernDom(l) {
    ploadText.innerText = "Reconnecting…";
    ploadSub.insertAdjacentHTML("beforeend", "<em>held</em>");
    ploadAct.append(document.createElement("button"));
    ploadAct.prepend(document.createElement("button"));
    ploadAct.replaceChildren();
    ploading.replaceWith(document.createElement("div"));
    setLoading?.(true, "Preparing…", "", "");
    setLoading.call(null, true, "Preparing…", "", "");
    setLoading.apply(null, [true]);
    setLoading.bind(null)(true);
  }
  // The declaration exemption is for a line that is ONLY the declaration. A
  // line that declares AND writes is a write, and the loose spelling excused it.
  function shadow(l) { setLoading(true); return l; } function setLoading(on) { return on; }
  // M1 added the two surfaces that are not the full screen. They are the
  // presenter's output too, and every spelling above reaches them as well.
  function notices() {
    psurfText.textContent = "Waiting for the server.";
    psurfSub.innerText = "held";
    psurfAct.innerHTML = "<button>Try again</button>";
    pindText.className = "pindicator on";
    psurfAct.insertAdjacentHTML("beforeend", "<button>Close</button>");
    psurfAct.replaceChildren();
    psurface.setAttribute("class", "psurface on");
    psurface.classList.add("on");
    pindicator.classList.remove("on");
    Object.assign(psurfText, { textContent: "held" });
  }
</script>
