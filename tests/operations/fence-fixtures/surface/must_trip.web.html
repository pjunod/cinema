<script>
  // Every line below is a surface write outside the render. All must trip.
  function showFailure(p, text) {
    setLoading(true, "Playback stopped.", text, "<button>Try again</button>");
    p.el.classList.add("failed");
    p.el.classList.remove("failed");
    p.stallPrompt = true;

    ploadSub.innerHTML = "<em>held</em>";
  }
</script>
