[capture]
host_binary_sha256 = "sha256sum \"$(command -v ffmpeg)\""
host_buildconf_sha256 = "ffmpeg -buildconf 2>&1 | sha256sum"
container_binary_sha256 = "docker exec plurxd sha256sum /usr/bin/ffmpeg"
container_buildconf_sha256 = "docker exec plurxd sh -c 'ffmpeg -buildconf 2>&1 | sha256sum'"
container_decoder_inventory_sha256 = "docker exec plurxd ffmpeg -hide_banner -decoders 2>&1 | sha256sum"
container_hwaccels_sha256 = "docker exec plurxd ffmpeg -hide_banner -hwaccels 2>&1 | sha256sum"
container_image_id = "docker inspect --format '{{.Image}}' plurxd"
canonicalization = "hash exact command bytes including line order and terminating newlines; no filtering"

