id = "process-lifecycle-method"
pattern = "\\.(?:kill|start_kill|wait|try_wait|exec)\\s*\\("
# +3: the bounded chapter probe kills and reaps oversized output, and reaps
# ordinary completion. Cancellation/deadline drops the kill-on-drop child.
