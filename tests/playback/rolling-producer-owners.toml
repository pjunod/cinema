[[symbols]]
id = "replacement-mask-flag"
pattern = "replacing_child"
# 29 -> 30 with M5c3: one test-only read. The durable recovery budget is
# reserved before `begin_child_replacement`, so a refused reservation must
# leave the failed producer where the actor left it; the regression asserts
# the mask is still clear at that point. No production reader was added and
# nothing new elects a replacement.
# +1 for the actor-transition regression assertion.
# +2 for segment-delivery attribution: the shipped read reports whether the
# actor is already replacing this response's producer, and the test-only write
# creates that exact state before dropping the delivery. Neither elects or
# starts a replacement; the actor remains the sole owner of that transition.
# +2 for the rolling publication clock and immutable segment lookup. Both are
# read-only fences: publication declines while replacement owns the child, and
# a request waits only while the same exact attempt remains installed.
expected_occurrences = 35
kind = "recovery_election"
replacement = "retained process-replacement serialization projection; actor decisions and exact attempts own transcode prepublication"

