id = "namespaced-time-constructor"
pattern = "(?:[A-Za-z_]\\w*::)+(?:sleep|sleep_until|interval|interval_at|timeout|timeout_at)\\s*\\("
# 503 since settle_producer_flow_signal_before joined
# request_producer_flow_before: two tokio::time::timeout_at calls, each
# bounding the caller's wait for one actor reply, the same shape and budget as
# their sibling classify_producer_exit_before. Both bound a mailbox round trip,
# not a producer; neither selects a recipe, publishes a response or starts a
# process. The transaction bound that CAN end a producer is the actor-owned
# PRODUCER_FLOW_ACTION_BUDGET, which is not a time constructor and is named in
# the lifecycle allowlist instead.
# 505 since the two HDR10 boot probes joined: each wraps its one-shot ffmpeg
# in the same 20-second `tokio::time::timeout` every probe beside it uses. A
# capability check that can hang is a daemon that never finishes starting.
# 503 since cluster discovery stopped probing media directly: it now persists
# background requests into the unified queue, whose leased resolver owns the
# one shared attestation deadline. The discovery-only polling helper left with
# that direct execution path as well.
# 505 with the HTTP marker race fixture: two test-only timeouts bound the two
# halves of its deterministic barrier, and the spawned handle is always joined.
# 506 with the detached marker telemetry assertion: one test-only sleep yields
# to the handler's bounded background recorder; it owns no process or producer.
# 521 with marker prewarm attribution: one test-only sleep yields to the
# handler's bounded background recorder while the fixture waits for the exact
# prewarm proof; it owns no process or producer.
# +11 M5b: conversion deadlines and cancellation/race fixtures. Production
# subprocess and hash deadlines are paired with kill-on-drop or a bounded
# residual-I/O permit; every test-only timer is awaited by its fixture.
# +6 with M7 R-M2's bounded subtitle materialization acceptance: two shipped
# handler deadlines bound replicated-setting and sidecar reads, while four
# fixture deadlines bound producer-start observation, the concurrent first
# touch, publication observation, and whole-producer teardown. Every fixture
# wait is awaited before its temporary media is released.
# +3 with the bounded subtitle window: the window read and the two warm starts in the subtitle segment arm.
# +1 for the process-shared Activity gate's `sleep_until`: the mutex owner
# awaits the durable one-second fanout-start reservation before issuing another
# bounded peer wave. Cancellation drops the owner while the reservation stays
# in shared state; no timer or producer is detached.
# +1 for the delayed-directory cancellation fixture: its two-second paused-time
# sleep moves the wire start beyond the initial reservation and is fully owned
# by the test task that the fixture aborts and joins.
expected_occurrences = 529

