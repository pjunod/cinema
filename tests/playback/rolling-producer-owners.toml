# Whole-module structural sentinels use normalized Rust code rather than a
# list of today's helper names: comments and literals cannot contribute to or
# offset a count, and turbofish payloads are removed before matching. Tests are
# included deliberately. A new task, timer, process construction, or direct
# process action anywhere under the reviewed roots must change a reviewed
# count.
# Parenthesized call paths are normalized and aliases are fenced so a renamed
# or wrapped function cannot bypass the scan. S-01 extends the inventory to
# the shared process owner and its scan consumer in plurx-core; otherwise the
# move out of plurxd would make the most sensitive spawn, kill, wait, task and
# timer shapes invisible to this gate. The counts below cover all three roots.
# Cluster operations accounts for one joined test-only admission waiter; four
# bounded timers (the shared peer deadline, its paused-time fixture, the CLI
# drain poll, and the offline worker idle poll); and three non-process `status`
# accessors on membership and HTTP responses. It adds no detached production
# task or child-process owner.
# The PR #636 hosted-gate fixtures add one joined replacement-waiter task,
# nine net bounded test timers, and six net Barrier `wait` calls conservatively
# matched by the process-lifecycle shape. They add no production recovery or
# process owner.
# The copy-lifetime cut removes every compatibility watcher and its fixtures.
# The retained namespaced tasks are actor/executor, exact-attempt cleanup, or
# typed reader owners; the remaining task/timer/process counts are reviewed
# lifecycle and race fixtures rather than producer-policy side channels.
# Windows adds nine bounded `spawn_blocking` owners for handle-based identity
# and filesystem work. Every JoinHandle is awaited by its caller; timeout paths
# retain or abort-and-await the task before the surrounding owner returns.

[[module_structures]]
id = "namespaced-task-spawn"
pattern = "(?:[A-Za-z_]\\w*::)+spawn(?:_blocking|_local)?\\s*\\("
# 348 since M2: the Dolby Vision facts backfill is spawned from the per-tick
# maintenance block beside the genre backfill. It is a leased catalogue job
# (`catalogue:dv-facts`) that walks a node-local cursor and writes columns —
# it owns no producer, no process, and no timer of its own.
# M5b's frozen media-safety implementation adds 22 namespaced spawns to the
# current-main tree: the single-flight queue owner plus bounded hashing,
# descriptor/namespace work, and deterministic race fixtures. Production queue
# and file workers retain their slots and leases through publication; test
# actors are joined before their fixture returns.
# 347 -> 348 on main: the additional spawn is confined to the HTTP marker race
# fixture; its join handle is awaited inside the test and it owns no shipped
# producer or process.
#
# This milestone adds none of its own. The Profile 7 -> 8.1 conversion runs no
# process: it used to be a second ffmpeg with a bridging task between the two,
# and that design was withdrawn because feeding a raw elementary stream between
# ffmpegs destroys the video timeline (see `plurxd::dvpipe`). The conversion now
# rewrites NAL units inside the fragments the one producer already writes, so
# the process and task counts are exactly what they were before it.
# +2 with M7 R-M2's handler acceptance fixture: two concurrent subtitle segment
# requests prove that the production warmup registry coalesces them into one
# window extraction. Both request tasks are joined by the fixture's bounded
# wait; neither is a shipped producer or process owner.
# +1 with the bounded subtitle window: the window warmer's detached extraction.
# +4 for the Activity read-gate and response regressions: eight concurrent
# callers share one joined task shape, the cancelled owner is explicitly
# aborted and awaited, its successor is joined after the preserved start floor,
# and the hostile error-body HTTP fixture is aborted before its test returns.
# All four are test-only owners; none detaches a producer, timer, or process.
# 377 -> 380 with M6's preparation executor. The three additions are the
# `oneshot::channel()` pairs behind `stage_preparation`,
# `may_commit_preparation` and `settle_preparation` — bounded actor round
# trips of the same shape as `snapshot` and `poll_producer_decision`, awaited
# by the caller that opened them. Each owns no producer, no timer and no
# process: the actor answers on its own mailbox and the sender is dropped when
# that arm returns, so a retired actor closes the channel rather than leaving a
# waiter detached. Reviewed as part of the M6 preparation slot's executor.
# 381 -> 382 with M6's production preparation candidate. This is a detached
# task rather than a test actor, so it is worth the words. It owns no producer,
# process, or timer. It reads the source, resolves the candidate, records the
# decision, and can claim the actor slot plus durably stage an admitted
# successor. It is detached deliberately: the control exchange is under an
# absolute deadline it has already spent, the response is fully built, and
# awaiting candidate Store work there could turn a completed transaction into
# a 503. It holds no lifecycle lock, and fan-out is bounded at 32 by
# `PREPARATION_CANDIDATES_IN_FLIGHT`; a client alternating selections would
# otherwise schedule one candidate per accepted exchange.
# 378 -> 379 with the executor's own tests: `preparation_fixture` spawns one
# `RollingControlHandle` per test, which is the ordinary test-actor shape
# already counted a dozen times over. It is owned by the handle the fixture
# returns; dropping the last handle closes the sender and the run loop exits,
# so nothing outlives the test. It owns no producer, no process and no timer
# beyond the actor's own lease clock, and no test in the group advances that
# clock.
# 379 -> 381 with M7 R-M2's handler acceptance fixture: its two concurrent
# subtitle-segment request tasks are both joined by the fixture's bounded wait.
# Neither task is a shipped producer or process owner.
# 382 -> 383: the deterministic Activity in-flight-sharing regression holds
# one leading fetch in a joined test task while seven followers queue behind
# the same process-local gate. The fixture releases and awaits every task; it
# owns no shipped producer, timer, or process.
# 383 -> 388 with the shared analysis lease heartbeat: the five additions are
# all `tokio::spawn` inside `state.rs`'s own unit tests, each driving the
# heartbeat loop with a renewal closure on a paused runtime clock and each
# joined before its test returns. The two production spawns are unchanged —
# the job heartbeat and the request heartbeat still spawn exactly one task
# apiece, now running the same loop instead of two copies of it. Neither owns
# a producer, a process, or a recipe.
# 388 -> 389 with M6 §3.4's preparation deadline: one `tokio::spawn` that
# sleeps to the staged successor's deadline and then aborts it, freeing the
# one preparation slot and its durable row together. Without it the first
# successful stage is the last one for the life of the session. It owns no
# producer and starts no process — it only settles a slot the actor holds.
# 389 -> 394 with abb872ba's admitted VOD demand regressions: five test-only
# task sites exercise control cancellation, publication-to-file-open pinning,
# refused/cancelled segment GETs, the absolute HTTP deadline, and cancelled
# init GETs. The cancellation fixtures abort and await their request handles;
# the file-open fixture joins its GET, and the paused-clock fixture joins its
# GET through a 100 ms timeout. The segment-cap fixture creates at most
# PER_SESSION_WAIT_CAP requests from its one spawn site and aborts/joins each.
# No production task site is added. The existing materialization watchdog now
# has an exact MaterializeClock AbortHandle instead of being unowned: the
# request's MaterializeDemand drop removes the last cancelled episode, and
# clock drop aborts its watchdog. Registration and clock binding share one
# synchronous lock, so a refused GET creates neither demand nor a watchdog.
# Expiry only answers that entry's waiters (or wakes init waiters); it no
# longer terminates the shared producer or records a rendition-wide failure.
# 389 -> 390 after settlement review: HTTP commit/abort settlement runs in one
# detached task so cancellation of the request waiter cannot cancel an already
# authorized Store mutation or release its serving guard early. The task owns
# that guard until the bounded Store operation finishes; it owns no producer
# or process, and the durable receipt makes completion replayable.
# 390 -> 391 after the second adversarial review: one process-wide singleflight
# owner settles an actor-accepted preparation independently of the HTTP waiter.
# A 32-slot semaphore bounds active owners, exact retries join the same receipt,
# and the task starts no worker or process.
# 391 -> 393: the serving-loss regression owns and joins/cancels its HTTP
# waiter and serving-loss task. No new production task owner is introduced.
# 393 -> 408 with M4 transport status and cache-recovery safety. Three shipped
# node-owned tasks refresh the two bounded status projections and perform the
# one-time exact-roster activation; a fourth shipped task owns a cancellation-
# safe Store result. The remaining eleven are joined Rust test tasks (including
# two std::thread fixtures) that drive cancellation, publication, and poisoned-
# cache races. Every shipped loop has an explicit shutdown token and every
# fixture handle is awaited or cancelled before its test returns.
# 389 -> 392 with HDHomeRun document-boundary fixtures: the one-response
# redirect/size server, stalled-body server, and stalled fetch are test-only.
# The first is joined by each caller; the stall pair is explicitly aborted or
# awaited after the absolute deadline. None ships or owns a media producer.
# 392 -> 394 with the HDHomeRun review regressions. One joined fake-body server
# proves a truncated device response is URL-redacted; one joined caller task
# per admitted forced-refresh slot proves the cache shares exactly one device
# operation. Every handle is awaited before its test returns, neither task is
# shipped, and neither owns an FFmpeg or tuner process.
# +19 HDHomeRun M2: six production sites in live_tv.rs own the session worker,
# bounded stderr drain, single tuner-response/stdin pump, descriptor open,
# segment-response watchdog, and bounded segment reader. Two main.rs tasks
# run shutdown-token-bound scratch sweeping and metrics refresh.
# Eleven additional sites are regression fixtures (ten Live TV, one relay).
# Session teardown joins the pump and confirms child exit before retirement;
# response tasks have child cancellation and progress/total deadlines. The
# descriptor-open blocking task cannot forcibly cancel an operating-system call.
# Merging main and the HDHomeRun Live TV effort: this counter had moved to
# 413 on the effort branch and 393 on main from a shared base, and neither
# value describes the merged tree. 417 is what the checker reads off the
# merge, so it is what is recorded -- the two inventories above are both
# still true, and the total is measured rather than added up.
# 417 -> 423 with M1 bound decoder facts: one blocking digest worker and one
# probe singleflight owner ship in `decode_facts`; four additional probe/cache
# race tasks are test-only. The blocking worker retains its semaphore permit
# until the operating-system read ends, the singleflight owner publishes one
# shared result, and every fixture task is joined before its test returns.
# None chooses or replaces a rolling producer.
# 423 -> 425 after bound-cleanup review: one production owner retains the
# version child, group terminator, and admission permit when its caller times
# out; one test-only task proves detached cleanup retains its owned permit.
# Both finish independently of the caller, and neither chooses a producer.
# 425 -> 428 after fifth-review deadline repair: one blocking owner contains
# `Command::spawn` and the inherited pre-exec handshake; a second holds both
# source-identity and probe admissions through an uninterruptible metadata
# syscall; a third owns final source revalidation. Caller timeout detaches each
# owner without releasing its permits, and no task selects recovery policy.
# 428 -> 427 after sixth-review offset-lane repair: final source observation
# remains authoritative but no longer runs inside the collection task. The
# probe tree restores the shared offset and releases its permit immediately
# after reap; only the final fstat owner can remain detached.
# 427 -> 437 with M3b's owned observation. Two are shipped and are the point of
# the milestone: both FFmpeg readers become `tokio::spawn` handles the attempt
# *holds*, where before they were spawned and forgotten — the same construct,
# now with an owner that joins it. The other eight are in the `decoder_health`
# suite, each awaited or aborted by the test that made it, several of them
# proving precisely that a reader is not left running.
# 437 -> 439 with M3b2's two test spawns: the reader above, and the
# `RollingControlHandle::spawn` that gives that test a real actor to report
# into. Both are owned by the test that made them; neither is shipped.
# 394 + (393 - 389) -> 398 when integrating the independent effort and M6
# settlement task: retain all five demand-regression owners and all four
# settlement owners. No source spawn or ownership obligation is discarded.
# Merged inventory: both parents moved this counter from a shared base, so
# neither parent's value describes the merged tree. Every ownership
# obligation recorded above is retained on both sides; the total is read
# off the merge rather than added up.
# 422 -> 424 with §1's race proofs: two `tokio::spawn` calls in `mod tests`,
# each running one `create` concurrently so the other side can move the ask
# underneath it. Both are joined before the test ends, so neither outlives
# its test and neither owns a producer.
# +1 encoded VOD: ensure_burn_file's bounded no-follow sidecar-open worker.
# It is awaited by preparation; extraction itself reuses the existing owned,
# timed singleflight and is not a second task per requesting viewer.
# +6 final encoded review: three BoundedDiagnosticChild::spawn calls (one
# production, two injected-child tests) are conservatively matched alongside
# task spawns. One actual production task owns a cancelled extractor through
# kill/reap; two test tasks own the cancelled output and held-admission driver.
# No detached stderr reader exists. Tests abort/join or await their actors.
# -1 after the immutable-input review: the bounded file writer drains stderr in
# the same joined future as stdout instead of spawning a diagnostic task. A
# cancelled copy therefore drops both readers while the exact child transfers
# to BoundedDiagnosticChild's runtime-owned kill/reap path.
# 439 -> 440 with the Live TV programme-guide refresh loop: one `tokio::spawn`
# in `spawn_background_loops`, beside the two Live TV loops already there and
# cancelled by the same `BackgroundLoopGuard` token. It owns no producer, no
# process and no media session. It reads settings, fetches a read-only guide
# document over HTTP, and writes an in-memory cache; it starts nothing, selects
# no recipe, and cannot open a tuner — a guide refresh reads the *cached*
# lineup precisely so it can never be a reason to talk to the device. It also
# refuses to run off the configured owner node and while serving authority is
# not admitted, so a fenced node's loop does nothing but sleep.
# 471 -> 472 with the direct recovery-switch regression: one test-only
# diagnostic reader task feeds an advisory selected-stream fault and is joined
# before the test returns. It owns no producer or process and cannot outlive
# its fixture.
# 479 -> 480 with Library-channel reconciliation: one `tokio::spawn` installs
# the catalogue-notification reconciler beside the existing server background
# loops. The shared `BackgroundLoopGuard` cancellation token owns its lifetime;
# the loop starts no media producer or process and returns when the token fires.
# 472 -> 479 for the bounded review work: two joined pipe drains belong to the
# exact short-lived probe child; one Drop fallback owns that child until reap;
# three blocking authentication/guide parsers retain their admissions until
# their OS work returns; and one test-only parser actor is awaited. None is a
# competing rolling producer or playback clock.
# +1 for Live TV's stderr drain. The session retains and joins its handle; it
# only records decoder/source facts and never owns producer policy.
# One joined copy-init fixture producer is added in transcode.rs tests.
# 482 -> 486 with cancellation-safe prepared work: one watcher cancels an
# exact speculative successor when foreground waits, one detached settlement
# owns cleanup to completion, and reservation plus actor activation each
# transfer their exact guard through an owned task. The registry/cancellation
# token bounds every task; none owns an untracked producer or process.
# 486 -> 487: the actor-managed HLS delivery fixture owns one ordinary control
# actor through its returned handle and retained executor registration. The
# fixture drops both together; no task escapes the test and no shipped spawn
# was added.
# +3 for the Live TV reliability lane, all reviewed and none a producer:
# two tokio::task::spawn_blocking calls in GuideCache (persist_guide's encode
# and rename, discard_persisted's remove) that move one bounded file operation
# off the runtime, and one tokio::spawn in the retire path. None of them selects
# a recipe, publishes a response, or starts a tuner.
# +1 Windows service startup-checkpoint thread. It exits when readiness or
