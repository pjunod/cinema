[[symbols]]
id = "all-async-sleeps"
pattern = "tokio::time::sleep\\("
# +1 for `a_copy_that_cannot_convert_strips_the_argv_it_spawns`. The argv it
# reads is logged by the producer task, not by the call that returns the
# session, so the test has to let that task be polled before it can assert
# anything — a bare read passes on an idle machine and fails under a loaded
# one. `#[cfg(test)]`-only, bounded by a 20s deadline that asserts rather than
# hangs, and it decides nothing about producer recovery: it waits for a log
# line that has already been written or is about to be.
# 35 -> 37 with M4's mixed-pipeline admission. Both are shipped polls of the
# software pool, both on the existing `ADMISSION_POLL` cadence, and both clamp
# their final wait to the deadline they already hold rather than overrunning
# it. One is a live start that has a hardware slot and needs the CPU its
# software decode will spend; the other is a recovery that keeps its encoder
# and moves the chain to the CPU. Neither owns a producer or a process — a
# deadline that expires in either place declines to begin work rather than
# abandoning any — and both exist because the pool's usual refusal is a
# background producer that yields only after a live waiter is registered and
# only at its next checkpoint, so a single non-blocking try turns "wait two
# seconds" into "destroy the session".
# +1 for the bounded test wait while the actor records the replacement attempt.
# The copy-init regression delays fixture publication by 100 ms to reproduce the empty-init window; no runtime timer is added.
# +1 for the segment-delivery telemetry regression. The 10 ms poll is test-only
# and sits inside one two-second timeout; it waits for an already-enqueued Store
# event and owns neither a producer nor a replacement decision.
# +3 are bounded rolling waits: retired-object cleanup retry, publication-clock
# cadence, and segment availability polling under the request deadline. None
# elects recovery or extends its already-owned deadline.
# The seek-scratch ledger adds the conversion owner's fixed 5 s retry interval
# (capped at 24 attempts) and the copy writer's grant-wait poll; the retired
# cleanup owner's plain `sleep_until` became a shortenable select, so the net
# count moves by one.
# +1 is a test-only 10 ms poll inside a two-second timeout while the real
# publication worker records low-rate window exhaustion. The worker owns the
# terminal verdict; the regression only waits for that already-started owner.
# 45 -> 41 in P-01's current-main fixture reconciliation: the post-fetch
# publication-clock test no longer manufactures the retired inferred-ahead
# suspend/resume path. Its fixed hold sleep and three progress/event polls were
# removed; all four were test-only and owned no producer.
expected_occurrences = 41
kind = "structural_timer_scan"
replacement = "every new sleep requires classification; actor-managed producer verdict polls are deleted, while failed exact reap attempts retain ownership across the bounded cleanup retry cadence"

