# assertions inside `mod tests`: each one reads the pointer to prove what a
# stage, a commit, a lost CAS, an abort or a refused stage did or did not do
# to it. The single shipped read is unchanged and still the only one — the
# executor itself never reads the pointer, which is the point: the store's
# CAS decides, and a read-then-act here would be a second authority.
# 7 -> 11 with M6 §3.4's first production caller: four test-only reads of
# `media_session_route_for_playback` — two asserting the pointer still names
# the predecessor after staging, two reading the committed successor back to
# prove the staged row is usable rather than merely present. The pointer
# assertions are what say `prepare_media_session` is the entry point rather
# than `activate_media_session`, which would have advanced it.
# 11 -> 12 with M6 §3.4c's Prepare announcement: the integration assertion
# reads the pointer after the action is emitted to prove it still names the
# predecessor. Test-only; it witnesses the existing pointer authority and
# neither writes nor competes with it.
# 12 -> 13 after adversarial review replaced helper-only coverage with the
# actual accepted selection-change seam. Its final assertion proves that the
# detached stage and later announcement still did not move the pointer.
expected_occurrences = 13

