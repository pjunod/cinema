id = "process-command-construction"
pattern = "(?:[A-Za-z_]\\w*::)*Command::new\\s*\\("
# +2: the two HDR10 boot probes in `ffmpeg.rs`
# (`has_hdr10_passthrough`, `has_hdr10_passthrough_qsv`). Both are one-shot
# capability checks against a synthetic 64x64 lavfi frame, awaited to
# completion behind a process-lifetime `OnceCell` at boot. Neither owns a
# rolling producer, neither outlives its `await`, and both are `kill_on_drop`.
# +1: the `sh` fixture in `ffmpeg.rs`'s
# `a_help_listing_larger_than_a_megabyte_survives_the_probe_bound` test. It is
# `#[cfg(test)]`-only, emits a fixed number of lines and exits, and is handed
# straight to `bounded_command_output` -- so it inherits that function's
# `kill_on_drop`, its 5s timeout, and its awaited `child.wait()`. Nothing owns
# it beyond the await, and it never runs in a shipped binary.
# M5b contributes a net +2 command constructions to the current-main tree.
# They are boot/conversion probes routed through the bounded command helper;
# capability failure prevents admission and conversion children are cancellable,
# kill-on-drop, output-capped, and reaped.
# +1 with the bounded subtitle window: the window extractor.
expected_occurrences = 66

[[module_structures]]
id = "process-capable-launch-method"
pattern = "\\.(?:spawn|output|status)\\s*\\("
# Four new MembershipManager::status calls are direct replicated-state reads,
# not process launches or rolling-producer owners. Keep them visible in the
# module-wide sentinel so any later process-capable shape still needs review.
# +2: `.output()` and `.status()` on the two HDR10 boot probes above.
# +3 (M3): `Response::status()` reads in the caps-document body-limit test.
# They are HTTP status codes on an in-process `oneshot` response — no child
# process, no producer, nothing to own.
# +10: `ProducerDecisionReason::status()` reads — one in `from_status`, one in
# the terminal message fallback, two in the relay believability check, and six
# across the tests that pin the permanence split, the action ranking and the
# wire names. All are `&'static str` lookups on a fieldless enum used to name
# one wire field; none launches anything or owns a producer.
# M5b is a net +1 launch-shaped method on the merged current-main tree. The
# apparent launch set includes JoinSet's in-process leased worker; the actual
# child is retained by `run_tool` until exit or cancellation.
# +2 with M7 R-M2's handler acceptance fixture: both are `Response::status()`
# assertions on in-process subtitle responses. They launch no process and own
# no producer; the actual window extractor remains behind the existing bounded
# command helper inventoried above.
# +1 with the bounded subtitle window: its output().
# +1 for Activity response classification: `reqwest::Response::status()` reads
# the received HTTP headers before deciding whether its unused error body needs
# no buffering. It launches no process and owns no child.
# +1 in the Trakt device-link test: `TraktManager::status()` inside the loop
# that waits for the link to finish. It is an in-process read of three
# mutex-guarded fields — auth, pending, note — and the reason it moved into the
# loop is that polling the *store* observed only the first of the three writes,
# so the test could assert against a status its own task had not finished
# producing. No child process, no producer, no timer.
# +2 for the VOD fetched-side frontier test: two `VodServe::status()` reads of
# one session's diagnostics, before and after the hole is filled. They take a
# manifest lock and return a struct; nothing is launched and nothing is owned.
expected_occurrences = 202

