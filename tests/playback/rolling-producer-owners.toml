id = "namespaced-time-constructor"
pattern = "(?:[A-Za-z_]\\w*::)+(?:sleep|sleep_until|interval|interval_at|timeout|timeout_at)\\s*\\("
# 503 since settle_producer_flow_signal_before joined
# request_producer_flow_before: two tokio::time::timeout_at calls, each
# bounding the caller's wait for one actor reply, the same shape and budget as
# their sibling classify_producer_exit_before. Both bound a mailbox round trip,
# not a producer; neither selects a recipe, publishes a response or starts a
# process. The transaction bound that CAN end a producer is the actor-owned
# PRODUCER_FLOW_ACTION_BUDGET, which is not a time constructor and is named in
# the lifecycle allowlist instead.
# 505 since the two HDR10 boot probes joined: each wraps its one-shot ffmpeg
# in the same 20-second `tokio::time::timeout` every probe beside it uses. A
# capability check that can hang is a daemon that never finishes starting.
# 503 since cluster discovery stopped probing media directly: it now persists
# background requests into the unified queue, whose leased resolver owns the
# one shared attestation deadline. The discovery-only polling helper left with
# that direct execution path as well.
# 505 with the HTTP marker race fixture: two test-only timeouts bound the two
# halves of its deterministic barrier, and the spawned handle is always joined.
# 506 with the detached marker telemetry assertion: one test-only sleep yields
# to the handler's bounded background recorder; it owns no process or producer.
# 521 with marker prewarm attribution: one test-only sleep yields to the
# handler's bounded background recorder while the fixture waits for the exact
# prewarm proof; it owns no process or producer.
# +11 M5b: conversion deadlines and cancellation/race fixtures. Production
# subprocess and hash deadlines are paired with kill-on-drop or a bounded
# residual-I/O permit; every test-only timer is awaited by its fixture.
# +6 with M7 R-M2's bounded subtitle materialization acceptance: two shipped
# handler deadlines bound replicated-setting and sidecar reads, while four
# fixture deadlines bound producer-start observation, the concurrent first
# touch, publication observation, and whole-producer teardown. Every fixture
# wait is awaited before its temporary media is released.
# +3 with the bounded subtitle window: the window read and the two warm starts in the subtitle segment arm.
# +1 for the process-shared Activity gate's `sleep_until`: the mutex owner
# awaits the durable one-second fanout-start reservation before issuing another
# bounded peer wave. Cancellation drops the owner while the reservation stays
# in shared state; no timer or producer is detached.
# +1 for the delayed-directory cancellation fixture: its two-second paused-time
# sleep moves the wire start beyond the initial reservation and is fully owned
# by the test task that the fixture aborts and joins.
# +9 with M7 R-M3's seek coalescing. One is shipped: the subtitle segment arm
# reads the client's settled destination under the same publication deadline
# that already bounds its sibling reads, and a deadline that expires there
# starts nothing at all — it cannot leak a producer, only decline to begin one.
# The other eight are fixture waits in the `seek_coalescing` acceptance: five
# bound producer-start and teardown observation, one bounds the first window's
# publication, and two are the above-250 ms spacing the protocol's exchange
# floor requires for a storm to be measured rather than rate-limited. Every one
# of them is awaited by the test before its temporary media is released.
# +2 with R-M3's review findings: one fixture wait for the surviving producer to
# publish once the storm releases its gate — the wait that stops "nothing was
# published" from being true because nothing was ever let through — and one in
# the latch tests that drive the owner registry directly. Both are awaited by
# their test before its temporary media is released.
# +1 for the storm's temp-file sweep: the survivor's publication answers
# `read_cached_window` at the atomic write, one unlink before that producer is
# finished, so sampling the directory on that edge measures the runner rather
# than the contract. The wait is bounded and still fails on the defect it exists
# for — a temp file nothing will ever unlink outlasts any timeout.
# 541 -> 548 with the shared analysis lease heartbeat. Two hand-rolled
# `tokio::time::interval` loops became one, and that one gained a
# `tokio::time::sleep_until` per iteration: the deadline arm that self-fences
# a claim when the lease it holds actually expires, which is what makes it
# safe to retry a renewal error rather than abandon the build. Net production
# change is zero constructors and one new shape. The other seven are
# `tokio::time::sleep` in the same unit tests, advancing a paused clock. None
# of them bounds a producer: the queue's own bounds are the store's lease and
# backoff, which are values, not timers.
#
# 548 -> 549 on the merge with `main`: +1 for the `tokio::time::sleep` in
# `a_copy_that_cannot_convert_strips_the_argv_it_spawns`, reviewed under
# `all-async-sleeps` above. Same call, counted once in each sentinel. The two
# efforts moved this number from the same base independently, so the merged
# count is both deltas rather than either one.
# 549 -> 550 with M6 §3.4: the `Duration::from_millis` that timer sleeps for.
# It is the preparation deadline, not a playback-progress watchdog.
# 550 -> 555 with M6 §3.4c review regressions: four short sleeps cross the
# control exchange floor, and one two-second timeout bounds observation of the
# detached production stage. Every timer is test-only and awaited; none owns a
# process, recipe, or recovery decision.
# 555 -> 557 after adversarial review: the incapable-client production-seam
# regression adds one exchange-floor sleep and one bounded wait for its
# detached decision to finish. Both are test-only and awaited.
expected_occurrences = 557

