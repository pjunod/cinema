# calls coordinate test tasks before the leading fetch is released. They are
# in-process synchronization and do not address or reap an operating-system
# process.
# 306 -> 310 with M4: four Barrier::wait calls coordinate the test-only
# in-flight authentication publication race. They are joined in-process test
# synchronization and are not child-process lifecycle actions.
# +4 HDHomeRun M2: cleanup_session calls start_kill and bounded wait while
# retaining child/admission on failure; the session observer calls try_wait;
# the real video-only fixture awaits its production-graph child.
# 310 -> 313 with M1: version and selected-stream collection each await their
# retained FFprobe child, and the common group-termination helper performs the
# final reap after signalling. Source/build leases survive all three waits.
# 313 -> 315 with Linux pidfd exit anchoring: each shipping probe path has
# mutually exclusive Linux and non-Linux reap expressions in source. Linux
# waits for exit without reaping, kills the anchored process group, then reaps;
# non-Linux production refuses before spawn and retains its fixture-only arm.
# 315 -> 313 after pidfd error ownership repair: both Linux branches now use
# the same explicit reap helper as termination instead of spelling a second
# `.wait()` at each call site. The helper retains the owned child, source, and
# permits until the one wait completes, including injected anchor failures.
# 306 -> 319 with abb872ba: nine Barrier::wait calls belong to the two
# deterministic control-acceptance/file-open cancellation seams (five behind
# cfg(test) in the production methods and four in their fixtures). Four more
# are WaitPool/RegisteredWait waits: the compatibility test helper delegates
# to the request-owned wait, and three fixture calls prove notified pin
# retention, admission refusal, and entry-local failure. The shipped GET's
# old pool.wait becomes registered.wait, for no net change. All thirteen are
# in-process waits, not OS-child lifecycle calls; the existing timeout remains
# owned by each admitted request rather than by a detached task.
# 319 -> 322 with the departing-session wait retirement: three
# `RegisteredWait::wait` calls in `a_departing_session_takes_its_own_waits_and
# _nobody_elses`. The sentinel's pattern catches `.wait(` alongside `.kill(` and
# `.try_wait(`; these await a oneshot from the pool under a bounded deadline and
# own no child process. The test requires the departing session's waiter to be
# answered `Gone` and both surviving waiters to be served normally.
# Merged inventory: both parents moved this counter from a shared base, so
# neither parent's value describes the merged tree. Every ownership
# obligation recorded above is retained on both sides; the total is read
# off the merge rather than added up.
# +4 encoded VOD: slot drop's start_kill + awaited child.wait, and explicit
# kill/reap in the two impossible missing-stdout branches (generation/head)
# before their acquired encoder permits may drop. Close/failure retirement
# also uses the existing serialized ProducerSlot::perform termination path.
# +7 final encoded review: extractor ordinary wait and cancellation start_kill
# plus wait (three OS actions); two test-only admission-hook barriers and two
# fixture rendezvous waits (four in-process synchronization calls).
# +2 after the immutable-input review: bounded sidecar output explicitly
# start-kills on a cap or daemon I/O error and awaits the exact child before
# returning. Ordinary completion uses the same wait.
# 346 -> 352: the shared probe owner waits on ordinary exit, kill-and-reap, and
# Drop fallback, while its two drains are joined before success. The remaining
# matched waits are bounded test synchronization; no path releases admission
# before its child or blocking work has actually ended.
# +3 for finite Live TV source observation: ordinary ffprobe wait plus timeout
# start-kill and wait. All three address the same retained child before the
# replay sample and session scratch can be released.
# +2 for the real logout-fence regression's two-party Barrier rendezvous.
# Both waits are test-only in-process synchronization, not child lifecycle.
# Windows adds nine explicit waits/start-kills in the shared job-owned output
# and status helpers and in bounded probe cleanup. All address retained children
# and complete before their Job Object guard can leave scope.
# +1 service install status poll; it waits only for the SCM state transition
# and cannot own or detach a media child.
# +1 fragment-index cleanup wait after start_kill when the first wait expires.
# The second wait is bounded to one second and addresses the retained child;
