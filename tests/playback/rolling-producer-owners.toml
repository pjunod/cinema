pattern = "(?:let|const|static)\\b[^=;]*=\\s*(?:(?:\\(\\s*)|(?:&\\s*(?:mut\\s+)?)|(?:\\*\\s*))*(?:::)?(?:[A-Za-z_]\\w*::)*Command::(?:new|spawn|output|status)\\b\\s*(?:\\)\\s*)*(?:as\\b[^;]+)?;"
expected_occurrences = 0

[[module_structures]]
id = "forbidden-low-level-callable-alias"
pattern = "(?:let|const|static)\\b[^=;]*=\\s*(?:(?:\\(\\s*)|(?:&\\s*(?:mut\\s+)?)|(?:\\*\\s*))*(?:::)?(?:[A-Za-z_]\\w*::)*(?:fork|vfork|clone|clone3|posix_spawn|posix_spawnp|kill|signal|raise|wait|waitpid|waitid|wait3|wait4|exec|execl|execle|execlp|execv|execve|execvp|execvpe)\\b\\s*(?:\\)\\s*)*(?:as\\b[^;]+)?;"
expected_occurrences = 0

# These snippets are not compiled; they are contract probes for the lexical
# normalization and structural patterns above. Every spelling we promise to
# inventory must keep hitting at least one named sentinel.

[[contract_cases]]
id = "namespaced-task-turbofish"
source = "tokio::spawn::<Ready<()>>(future);"
must_trigger = ["namespaced-task-spawn"]

[[contract_cases]]
id = "method-task-spawn-local"
source = "local.spawn_local(future);"
must_trigger = ["method-spawn"]

[[contract_cases]]
id = "bare-task-spawn"
source = "spawn_blocking(job);"
must_trigger = ["bare-task-spawn"]

[[contract_cases]]
id = "parenthesized-task-call"
