id = "all-detached-tokio-tasks"
pattern = "tokio::spawn\\("
also_in = ["crates/plurxd/src/transcode"]
# 79 -> 80 with M3b2's end-to-end reporting test: one `tokio::spawn` runs a
# real diagnostic reader against a duplex so the fault can travel through the
# real sink, handle and actor. It is joined by the test before any assertion —
# without it, replacing `DecodeFaultSink::report` with an empty body left the
# whole workspace green and the feature dead in production.
# The copy-init regression adds one joined synthetic producer; it publishes fixture bytes after a 100 ms delay.
# +2 are the rolling publication-clock task and retired-object cleanup task.
# Each holds the session it owns; the first exits on retirement/failure and the
# second begins only at the fixed serve-until boundary and owns bounded retry.
# The seek-scratch ledger adds the retired scratch conversion owner: after
# retirement it retries the quiescent measurement on a bounded schedule and
# converts the conservative reservation to measured bytes exactly once, then
# exits. It carries the ledger key rather than the session, so it cannot keep a
# retired session alive.
# 84 -> 85 with S-13's bound-source refusal regression. The added `tokio::spawn`
# is in `source_change_refuses_bound_plan`, which S-14's extraction keeps in
# `crates/plurxd/src/transcode/tests/chunk_01.rs`: it waits 100 ms and then
# rewrites the held source file, so the decode-fact collection binds a source
# that changes underneath it and the final identity check refuses the bound
# plan instead of falling back to catalogue facts. The task is `#[cfg(unix)]`
# test-only, its `JoinHandle` is awaited by the test before any assertion, and
# its whole body is one `std::fs::write` — it owns no producer, no process and
# no timer, and it decides nothing about recovery.
# +2 for the HTTP wait ledger tests (#444): each spawns one segment request
# against an unpublished segment, then aborts and joins it before asserting.
# Test-only; they own no producer.
# S-14 moves these without changing any of them, so it adds nothing to the
# total: fifty-seven of the eighty-seven now sit in `transcode/tests/` chunks
# 01, 02 and 04 through 08 rather than in the inline `mod tests` of
# `transcode.rs`, and `also_in` scopes this entry to the `transcode/` module
# directory as well so the same text is still counted exactly once. Every
# moved one is a test-only detached task inside a `#[cfg(test)]` body:
# synthetic producers, playlist/segment/refresh readers held against a
# concurrent replacement, retirement and cleanup calls whose caller is then
# cancelled, and loops (`reap_loop`, `serving_fence_loop`,
# `rate_control_refresh_once`) driven directly by the fixture. Each belongs to
# the per-test runtime that spawned it and dies with it; none is a shipped task
# owner.
expected_occurrences = 87
kind = "structural_task_scan"
replacement = "every detached task requires ownership-catalog review; published failure, completion, and executor-loss cleanup transfer exact child ownership before awaiting, while the removed published-transcode watchdog contributes no task"

