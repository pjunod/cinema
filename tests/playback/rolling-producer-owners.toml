# 68 -> 71 with M6's preparation-executor tests: one confirmation of the
# activation that advances the pointer out from under a staged successor, and
# two assertions that a *commit* leaves the fence at the sentinel. All three
# are test-only. The fence is not moved by any new shipped path — a commit
# updates the lease and nothing else, exactly as before.
# 71 -> 72 with R-M3's pointer test: one test-only activation built from what
# admission returned, so the fence it asks for is proved against the durable
# pointer rather than against the constant in the code. It sets the sentinel
# like every other first commit and moves no shipped fence.
# 72 -> 73 with M8 §10.3: one test-only activation for the public status read
# that proves an untakeoverable route answers `media_owner_lost` through the
# handler rather than through the classifier alone. It sets the fence to zero
# like any ordinary first activation and moves no shipped fence.
# 73 -> 74 with the live-lease correction: one test-only route stamped with a
# publication fence to prove a renewing successor is never read as owner loss.
# It sets the field on a fixture and moves no shipped fence.
# 74 -> 76 with the control plane's owner-loss answer: the publication fence is
# now folded into the same classification as the expired lease on all three
# control gates instead of being answered unconditionally, so each gate's
# condition names the field, and one test stamps a fence on a fixture to prove
# a renewing successor is still retryable on this plane. Then 76 -> 75 when the
# gate condition moved into `control_owner_refusal` beside its answer, so the
# two call sites name the field once between them instead of twice. No shipped
# fence moves either way.
# 75 -> 77 with the relay-gate harness: two test-only activations that stand up
# a durable route this node owns whose lease has already run out, so the relay's
# own owner gate can be driven at all. Each sets the blocked sentinel and then
# confirms to zero like any ordinary first activation; no shipped fence moves.
# 77 -> 78 with M6 §3.4: one test-only activation standing up a live route for
# the staging fixture. It confirms to zero like any ordinary first activation
# and moves no shipped fence.
# 78 -> 79 with M6 §3.4c's staged-row reader: the shipped read checks that the
# proposed successor is still held at the blocked publication fence before
# asking the existing actor slot to authorize its announcement. It writes no
# fence and creates no publication authority.
expected_occurrences = 79

