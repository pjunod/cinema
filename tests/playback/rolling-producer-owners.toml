[[module_symbols]]
id = "m4-durable-terminal-cause"
pattern = "terminal_reason"
# 18 -> 20 with M6's preparation-executor tests. Both additions assert
# `replaced` — the cause `abort_staged_generation` writes — on the abandoned
# successor of a lost CAS and on the row a refused stage rolled back. They are
# there because an empty preparation ledger is satisfied by a row that was
# never created as much as by one that was torn down, and only the cause tells
# the two apart. No new writer of a terminal cause.
# 20 -> 21 after settlement review: the public post-retirement replay test
# asserts the predecessor's durable `superseded` cause before exercising the
# retained exact response. This is a test-only read of the existing writer.
# 21 -> 22 with M5b's recovery-epoch test: the same one test-only route
# fixture, which sets `terminal_reason: None` because it stands for a live
# session. No new writer of a terminal cause.
# 21 -> 20 when `preparation_ack_replay` stopped gating on that cause. Reading
# `terminal_reason == 'superseded'` there was the same fact as "this commit
# already happened" only while the commit retires the predecessor inside its
# own transaction, which §4 has to stop it doing; the durable receipt is the
# fence now, and a stricter one. A read is removed, no writer is. The count
# goes back up if anything reintroduces a state gate on that cause.
# 20 -> 22 with the §4 drain, and neither addition is a new writer. One is the
# cause the owner's lease tick passes to `end_media_session_if_owner` when a
# drain deadline lapses -- `superseded`, the same cause the commit used to
# write in its own transaction, moved to the moment the predecessor actually
# stops serving. The other is a test reading that the commit no longer decides
# a cause at all: a predecessor mid-drain has `terminal_reason` null, which is
# the property the whole step turns on.
# 22 -> 23 with the drain-release test, which asserts the predecessor ends
# with cause `superseded` rather than merely ending. Test-only: the cause is
# written by the release that already existed on this branch.
# 25 -> 27 with M0's supersession tests. Both additions assert `replaced`
# — the cause `abort_staged_generation` writes — on the successor a supersession
# tore down, because an empty registry is satisfied by a successor that was
# never reserved as much as by one that was settled, and only the durable cause
# tells the two apart. No new writer of a terminal cause.
# +4 for content-analysis response reporting: three analysis API field/test
# references and one browse DTO initializer. These expose or assert the
# existing terminal cause; none writes a new durable cause.
# +1 browse reporting reads the terminal reason for a failed analysis badge.
# +1: the capacity refusal carries a durable terminal reason of its own, so a
# 503 is distinguishable from an anonymous producer fault.
expected_occurrences = 33

