# This catalog is intentionally mechanical and scans the whole Rust source,
# including test-only references. Removing a legacy owner must update both the
# source and this ledger in the same change; adding an occurrence fails
# validation until its ownership and M4 replacement are named here.

# [[symbols]] counts `source`. An entry may also carry `also_in`, a list of
# extra paths counted together with `source` by that same entry; each is either
# a file or a directory, and a directory contributes every `*.rs` file beneath
# it. An entry without `also_in` counts `source` alone, as before.
#
# S-14 moved `transcode.rs`'s inline `mod tests` into `transcode/tests/` and
# its rolling segment index into `transcode/rolling/`. The fifteen entries
# whose occurrences went there name `crates/plurxd/src/transcode` in `also_in`,
# so each counts exactly what it counted before the split: no occurrence was
# added or deleted and no ownership changed. [[module_symbols]] and
# [[module_structures]] scan `module_roots` and reach the extracted files
# unchanged.

