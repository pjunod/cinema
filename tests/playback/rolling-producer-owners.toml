# 32 with M6's `VodPreparationGate`, and both extra occurrences are doc
# cross-references rather than owners. This pattern reads the raw source, so a
# name in prose counts.
#
# One says the gate holds `Arc<Shared>` plus an id "the same shape as
# `VodPreparationGuard`", because `Session` lives in the registry by value and
# cannot be borrowed across an await. The other says what the gate's `None`
# does *not* mean: absence from `sessions` is not absence from this engine —
# `owns_or_preparing` is the question a router must ask — so a caller cannot
# read `None` as "ask the rolling actor" and re-create the misrouting M6's slot
# move exists to fix.
#
# The gate owns no producer, no process and no admission: it takes the sessions
# lock for one slot transition, pinned to the exact incarnation it was made
# for, and releases it. That is why the count moves and the ownership picture
# does not.
