# Whole-module structural sentinels use normalized Rust code rather than a
# list of today's helper names: comments and literals cannot contribute to or
# offset a count, and turbofish payloads are removed before matching. Tests are
# included deliberately. A new task, timer, process construction, or direct
# process action anywhere under plurxd/src must change a reviewed count.
# Parenthesized call paths are normalized and aliases are fenced so a renamed
# or wrapped function cannot bypass the scan.
# Cluster operations accounts for one joined test-only admission waiter; four
# bounded timers (the shared peer deadline, its paused-time fixture, the CLI
# drain poll, and the offline worker idle poll); and three non-process `status`
# accessors on membership and HTTP responses. It adds no detached production
# task or child-process owner.
# The PR #636 hosted-gate fixtures add one joined replacement-waiter task,
# nine net bounded test timers, and six net Barrier `wait` calls conservatively
# matched by the process-lifecycle shape. They add no production recovery or
# process owner.
# The copy-lifetime cut removes every compatibility watcher and its fixtures.
# The retained namespaced tasks are actor/executor, exact-attempt cleanup, or
# typed reader owners; the remaining task/timer/process counts are reviewed
# lifecycle and race fixtures rather than producer-policy side channels.

[[module_structures]]
id = "namespaced-task-spawn"
pattern = "(?:[A-Za-z_]\\w*::)+spawn(?:_blocking|_local)?\\s*\\("
# 348 since M2: the Dolby Vision facts backfill is spawned from the per-tick
# maintenance block beside the genre backfill. It is a leased catalogue job
# (`catalogue:dv-facts`) that walks a node-local cursor and writes columns —
# it owns no producer, no process, and no timer of its own.
# M5b's frozen media-safety implementation adds 22 namespaced spawns to the
# current-main tree: the single-flight queue owner plus bounded hashing,
# descriptor/namespace work, and deterministic race fixtures. Production queue
# and file workers retain their slots and leases through publication; test
# actors are joined before their fixture returns.
# 347 -> 348 on main: the additional spawn is confined to the HTTP marker race
# fixture; its join handle is awaited inside the test and it owns no shipped
# producer or process.
#
# This milestone adds none of its own. The Profile 7 -> 8.1 conversion runs no
# process: it used to be a second ffmpeg with a bridging task between the two,
# and that design was withdrawn because feeding a raw elementary stream between
# ffmpegs destroys the video timeline (see `plurxd::dvpipe`). The conversion now
# rewrites NAL units inside the fragments the one producer already writes, so
# the process and task counts are exactly what they were before it.
# +2 with M7 R-M2's handler acceptance fixture: two concurrent subtitle segment
# requests prove that the production warmup registry coalesces them into one
# window extraction. Both request tasks are joined by the fixture's bounded
# wait; neither is a shipped producer or process owner.
# +1 with the bounded subtitle window: the window warmer's detached extraction.
# +4 for the Activity read-gate and response regressions: eight concurrent
# callers share one joined task shape, the cancelled owner is explicitly
# aborted and awaited, its successor is joined after the preserved start floor,
# and the hostile error-body HTTP fixture is aborted before its test returns.
# All four are test-only owners; none detaches a producer, timer, or process.
# 377 -> 380 with M6's preparation executor. The three additions are the
# `oneshot::channel()` pairs behind `stage_preparation`,
# `may_commit_preparation` and `settle_preparation` — bounded actor round
# trips of the same shape as `snapshot` and `poll_producer_decision`, awaited
# by the caller that opened them. Each owns no producer, no timer and no
# process: the actor answers on its own mailbox and the sender is dropped when
# that arm returns, so a retired actor closes the channel rather than leaving a
# waiter detached. Reviewed as part of the M6 preparation slot's executor.
# 381 -> 382 with M6's shadow measurement, and this one is a *production*
# detached task rather than a test actor, so it is worth the words. It owns no
# producer, no process and no timer; it does one store read and increments an
# atomic. It is detached deliberately: the control exchange is under an
# absolute deadline it has already spent by the time this runs, the response is
# fully built, and awaiting a store read there could turn a completed exchange
# into a 503 *after* its accepted metric had been recorded — so a measurement
# would corrupt the metrics it sits beside. It holds no lock (the VOD
# lifecycle guard is dropped before the response is built), and the fan-out is
# bounded at 32 in flight by `PREPARATION_SHADOWS_IN_FLIGHT`, because the gate
# fires per selection change and a client alternating between two selections
# would otherwise spawn one per exchange.
# 378 -> 379 with the executor's own tests: `preparation_fixture` spawns one
# `RollingControlHandle` per test, which is the ordinary test-actor shape
# already counted a dozen times over. It is owned by the handle the fixture
# returns; dropping the last handle closes the sender and the run loop exits,
# so nothing outlives the test. It owns no producer, no process and no timer
# beyond the actor's own lease clock, and no test in the group advances that
# clock.
# 379 -> 381 with M7 R-M2's handler acceptance fixture: its two concurrent
# subtitle-segment request tasks are both joined by the fixture's bounded wait.
# Neither task is a shipped producer or process owner.
expected_occurrences = 382

