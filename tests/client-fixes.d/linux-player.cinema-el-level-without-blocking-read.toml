source_anchor = "mp.observe_property('native-dovi-target-state','native',function(_,value) S.native=table_of(value); invalidate() end)"
test = "clients/linux-player/tests/test_cinema.lua"
test_anchor = "read_overrides['native-dovi-target-state']=function() error('native-dovi-target-state read on render') end"
