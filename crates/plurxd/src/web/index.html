" id="pbquality" aria-haspopup="menu" aria-expanded="false" aria-label="Playback quality" title="Playback quality" onclick="toggleMenu('quality',1)">◆</button><button class="picon" id="pbsettings" aria-haspopup="menu" aria-expanded="false" aria-label="Playback settings" title="Playback settings" onclick="toggleMenu('settings',1)">⚙</button><button class="picon" id="pbinfo" aria-label="Title info" title="Show title, synopsis & release info" onclick="togglePlayerInfo()">≡</button><button class="picon" id="pbpip" aria-label="Picture in picture" title="Picture-in-picture" style="display:none" onclick="togglePip()">◲</button><button class="picon" id="pblarger" onclick="toggleWatchSize()" aria-label="Larger">Larger</button><button class="picon" id="pbfs" aria-label="Fullscreen" title="Fullscreen (f)" onclick="toggleFullscreen()">⛶</button></div><div class="pinfo" id="pinfo"></div><div class="pskip" id="pskip"></div><div class="ploading" id="ploading"><div class="pspin"></div><div class="ploadText" id="ploadText">Loading…</div><div class="ploadSub" id="ploadSub"></div><div class="ploadAct" id="ploadAct"></div></div><div class="psurface" id="psurface" role="status" aria-live="polite"><div class="psurfText" id="psurfText"></div><div class="psurfSub" id="psurfSub"></div><div class="psurfAct" id="psurfAct"></div></div><div class="pindicator" id="pindicator" role="status" aria-live="polite"><div class="pspin" aria-hidden="true"></div><span id="pindText"></span></div><div class="statsov" id="statsov" data-mode="standard"><div class="statshd"><span id="statstitle">Playback info</span><div class="statsmodes" role="radiogroup" aria-label="Playback information level"><button type="button" data-stats-mode="mini" role="radio" onclick="setStatsMode('mini')">Compact</button><button type="button" data-stats-mode="standard" role="radio" onclick="setStatsMode('standard')">Overview</button><button type="button" data-stats-mode="details" role="radio" onclick="setStatsMode('details')">Details
