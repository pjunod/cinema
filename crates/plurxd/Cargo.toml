[package]
name = "plurxd"
description = "plurx media server daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["live-hls-recovery"]
# Incident recovery only. VOD remains the preferred segmented presentation;
# this retains the proven growing-HLS engine so a missing/stale prerequisite
# never makes an otherwise playable title unavailable.
live-hls-recovery = []
# Separate-process daemon tests bind several loopback listeners, launch real
# voters, and create media with ffmpeg. Keep them out of the ordinary unit lane;
# validation targets enable them explicitly where those contracts belong.
cluster-integration-tests = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
plurx-core = { path = "../plurx-core", features = ["hiqlite-store"] }
hiqlite-wal = { workspace = true }
plurx-compat-plex = { path = "../plurx-compat-plex" }
plurx-pgs = { path = "../plurx-pgs" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "fs", "cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
libc = { workspace = true }
futures-util = { workspace = true }
mime_guess = { workspace = true }
mdns-sd = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
qrcode = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
crc32fast = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# `fixtures` builds plurx-core's shared media-fixture helper for the copyseg
# tests. A dev-dependency, so a release build never compiles it.
plurx-core = { path = "../plurx-core", features = [
  "fixtures",
  # Lets the startup tests fail a scratch clear the same way for root and for
  # an unprivileged uid; a permission-based injection is a no-op for uid 0.
  "scratch-fault-injection",
] }
http-body-util = { workspace = true }
serde_urlencoded = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
# `test-util` gives tests a pausable clock (`start_paused`), so the lifetime
# watchdog's suites run in virtual time instead of sleeping out real grace
# windows. Dev-only: the shipped binary never compiles with it.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "cluster_activation"
required-features = ["cluster-integration-tests"]

[[test]]
name = "cluster_activity"
required-features = ["cluster-integration-tests"]

[[test]]
name = "live_tv_two_node"
required-features = ["cluster-integration-tests"]
