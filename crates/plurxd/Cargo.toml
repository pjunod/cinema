[package]
name = "plurxd"
description = "plurx media server daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# `live-hls-recovery` was a default feature gating the retained growing-HLS
# engine. It is gone, not because the engine is: nothing in the Makefile,
# Dockerfile, deploy or scripts ever passed `--no-default-features`, so the
# switch decided nothing while hiding ~100 code sites and a whole streaming
# engine behind a compile flag no build ever flipped. Whether the engine runs
# is a runtime setting an operator can see and change; whether it exists is
# not a question a build should answer silently.

# Separate-process daemon tests bind several loopback listeners, launch real
# voters, and create media with ffmpeg. Keep them out of the ordinary unit lane;
# validation targets enable them explicitly where those contracts belong.
cluster-integration-tests = []

[dependencies]
# CPU-only inference, loaded only when semantic search is enabled.
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
toml = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "server-graceful",
    "tokio",
    "http1",
    "http2",
    "service",
] }
clap = { workspace = true }
plurx-core = { path = "../plurx-core", features = ["hiqlite-store"] }
hiqlite-wal = { workspace = true }
plurx-compat-plex = { path = "../plurx-compat-plex" }
plurx-pgs = { path = "../plurx-pgs" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "fs", "cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
libc = { workspace = true }
futures-util = { workspace = true }
mime_guess = { workspace = true }
mdns-sd = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
qrcode = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
crc32fast = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
# `fixtures` builds plurx-core's shared media-fixture helper for the copyseg
# tests. A dev-dependency, so a release build never compiles it.
plurx-core = { path = "../plurx-core", features = [
  "fixtures",
  # Lets the startup tests fail a scratch clear the same way for root and for
  # an unprivileged uid; a permission-based injection is a no-op for uid 0.
  "scratch-fault-injection",
] }
http-body-util = { workspace = true }
serde_urlencoded = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
# `test-util` gives tests a pausable clock (`start_paused`), so the lifetime
# watchdog's suites run in virtual time instead of sleeping out real grace
# windows. Dev-only: the shipped binary never compiles with it.
tokio = { workspace = true, features = ["test-util"] }
# The discarded-Store-result regression parses production Rust syntax instead
# of guessing from receiver spelling or a bounded source suffix.
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true

[[test]]
name = "cluster_activation"
required-features = ["cluster-integration-tests"]

[[test]]
name = "cluster_activity"
required-features = ["cluster-integration-tests"]

[[test]]
name = "live_tv_two_node"
required-features = ["cluster-integration-tests"]
