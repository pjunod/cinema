<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema support inbox</title><link rel="stylesheet" href="/support.css"><script src="/operator.js" defer></script></head>
<body><main class="wide"><h1>Cinema support inbox</h1><p id="status" role="status" aria-live="polite">Sign in with your named operator passkey.</p>
<section id="signin"><form id="login"><label>Operator name <input id="name" autocomplete="username webauthn" maxlength="64" required></label><button>Sign in with passkey</button></form><details><summary>Enroll a new operator passkey</summary><form id="enroll"><label>One-use enrollment token <input id="token" type="password" autocomplete="off" maxlength="64" required></label><button>Create passkey</button></form></details></section>
<section id="inbox" hidden><form id="filters" class="toolbar"><label>Reference <input id="search" maxlength="64" placeholder="C-…"></label><label>Platform <select id="platform"><option value="">All platforms</option><option>web</option><option>browser_tv</option><option>ios</option><option>ipados</option><option>tvos</option><option>android</option><option>android_tv</option></select></label><label>Build <input id="build" maxlength="128"></label><label>Category <select id="category"><option value="">All categories</option><option>playback</option><option>connection</option><option>interface</option><option>other</option></select></label><label>Since <input id="since" type="date"></label><label>Until <input id="until" type="date"></label><label>Label <select id="label-filter"><option value="">All labels</option><option>new</option><option>investigating</option><option>resolved</option></select></label><button>Find reports</button></form>
<div class="scroll"><table><thead><tr><th>Reference</th><th>Platform / build</th><th>Category</th><th>Received</th><th>Label</th></tr></thead><tbody id="rows"></tbody></table></div><button id="more" hidden>Next page</button>
<details><summary>Issue a restricted upload invitation</summary><form id="invitation"><label>Publisher ID <input id="publisher" maxlength="64" required></label><button>Create one-use invitation</button></form><p id="invitation-result"></p></details></section>
<section id="detail" hidden><h2 id="detail-title">Report</h2><pre id="summary"></pre><h3>Description</h3><p id="description" class="preserve"></p><h3>Coverage and timeline</h3><pre id="timeline"></pre><button id="download">Download verified archive</button>
<form id="label-form"><label>Label <select id="label"><option>new</option><option>investigating</option><option>resolved</option></select></label><button>Save label</button></form><form id="retention-form"><label>Retention in days from receipt <input id="days" type="number" min="1" max="90" value="30" required></label><button>Set retention</button></form><button id="delete" class="danger">Delete report permanently</button></section>
</main></body></html>
