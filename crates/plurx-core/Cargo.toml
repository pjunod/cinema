[package]
name = "plurx-core"
description = "plurx core: storage boundary, configuration, shared domain types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Compiles `testfixtures` — the shared media-fixture builder the plurxd test
# suite also uses. Dev-dependencies only; `cargo build` never turns it on.
fixtures = []
# The workspace cluster harness enables the replicated backend, so feature
# unification also runs these core unit tests during workspace checks. M2
# enables the same backend on plurxd when the complete store becomes selectable.
hiqlite-store = ["dep:hiqlite"]
# Test-only operation accounting for deterministic three-voter read-cost gates.
# The daemon does not enable this feature, so production requests pay no atomic
# counter overhead.
cluster-read-cost-validation = ["hiqlite-contract-tests", "hiqlite/validation-test-helpers"]
# Exposes force paths used only by the separate-process fault harness. The
# daemon never enables this feature, so production callers cannot bypass
# write coalescing accidentally.
cluster-validation = ["hiqlite-store"]
# Boots three real Hiqlite voter processes for every backend-neutral Store
# contract. Production enables `hiqlite-store`; keeping this separate prevents
# that shipping feature from turning an ordinary workspace test into the
# replicated integration suite.
hiqlite-contract-tests = ["hiqlite-store"]
# Compiles the scratch-cleanup fault injection plurxd's startup tests use to
# prove that a failed clear fails startup without deleting anything. The
# daemon never enables it, so no production build carries the failpoint.
scratch-fault-injection = []

[dependencies]
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
tempfile = { workspace = true }
dolby_vision = { workspace = true }
async-trait = { workspace = true }
bincode = { version = "2", features = ["serde"] }
hiqlite = { workspace = true, optional = true }
# Shared by pinned sharing TLS and the process-level Hiqlite provider. rustls panics instead of erroring when a process reaches TLS without
# one, and `hiqlite::start_node` installs it only on the server side — which the
# maintenance commands never reach. See `install_default_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ipnet = { workspace = true }
icu_normalizer = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
subtle = "2"
base64 = "0.22"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem"] }
time = "0.3"
x509-parser = { version = "0.18", default-features = false, features = ["verify"] }
rustls-webpki = { version = "0.103.13", default-features = false, features = ["ring", "std"] }
# Scanner
walkdir = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
# Select zip's already-used pure-Rust DEFLATE backend when plurx-core is
# tested alone (plurxd also depends on flate2, but feature unification must not
# be the reason EPUB parsing works).
flate2 = { workspace = true }
kamadak-exif = { workspace = true }
# Metadata
reqwest = { workspace = true }
futures-util = { workspace = true }
# Auth
argon2 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
ring = { workspace = true }
libc = { workspace = true }
# Envelope encryption for the Trakt bearer credential (CLUSTERING-PLAN §3.2).
# Already in the tree via hiqlite's cryptr, so this adds no new compiled crate.
chacha20poly1305 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
openraft = { version = "0.9.25", features = ["serde"] }
# The encoder `hiqlite-wal` writes Raft entries with. Tests only, and only so
# the import transaction estimate can be checked against the real encoding
# rather than trusted. Already in the tree via hiqlite, so this adds no new
# compiled crate; pinned to the version hiqlite 0.14 resolves.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# `trace` (sqlite3_trace_v2) is how the page-wide lookups prove they are one
# statement rather than one per item. Tests only — resolver 2 keeps a
# dev-dependency's features out of the shipped build.
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
