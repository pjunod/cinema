[package]
name = "plurx-cluster-check"
description = "separate-process clustering failure harness"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
hiqlite = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
plurx-core = { path = "../plurx-core", features = ["hiqlite-store"] }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The included production coalescer's tests use a paused Tokio clock.
jsonschema = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
