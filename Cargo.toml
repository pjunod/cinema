[workspace]
resolver = "2"
members = [
    "crates/plurx-core",
    "crates/plurx-cluster-check",
    "crates/plurx-compat-plex",
    "crates/plurx-pgs",
    "crates/plurxd",
]
exclude = [
    "vendor/dolby_vision",
    "vendor/hiqlite",
    "vendor/hiqlite-wal",
    "vendor/rust_decimal",
    "vendor/s3-simple",
]

[workspace.package]
# One version for the whole workspace: the crates are not published separately,
# so a single number is what "a plurx release" means. Bump policy and the tag
# process live in docs/RELEASING.md.
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/pjunod/plurx"

[workspace.dependencies]
# HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "process", "io-util", "fs"] }
async-trait = "0.1"
# Storage. M2 selects one-voter Hiqlite after a verified SQLite import; the
# retained SQLite database is the pre-membership rollback source.
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
hiqlite = { version = "=0.14.0", default-features = false, features = ["auto-heal", "macros", "sqlite"] }
hiqlite-wal = { version = "=0.14.0" }
# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = { version = "2", features = ["serde"] }
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
# The exact query decoder axum's `Query` extractor uses. A dev-dependency of
# plurxd only, so the caps-v2 equality test can prove the two wire shapes agree
# by parsing a real `CAPS_Q` string rather than by hand-building the struct the
# extractor would have produced — which is precisely the step that could hide a
# disagreement.
serde_urlencoded = "0.7"
# Dolby Vision RPU parsing and rewriting, for the Profile 7 to 8.1 conversion
# (PLAYBACK-CAPS-V2-PLAN section 4.8). Default features only: `capi`, `xml`
# and `serde` are for tools that emit RPU files, and plurx rewrites NAL units
# in memory and writes nothing.
dolby_vision = { version = "3.4", default-features = false }
toml = "0.8"
# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Scanner / metadata
walkdir = "2"
# XML: NFO sidecar parsing (home libraries). plurx-compat-plex hand-rolls a
# *writer*; this is the reader, and real-world NFOs are too filthy to hand-roll.
quick-xml = "0.41"
# EPUB is an OCF ZIP container. Only the two formats EPUB requires in
# practice (stored and deflate) are enabled; archive parsing is bounded again
# in plurxd before any entry is allocated or served.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# EXIF: capture dates for photos in home libraries (pure Rust, JPEG/TIFF).
kamadak-exif = "0.6"
notify = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Auth
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
jsonschema = { version = "0.50.1", default-features = false }
# Envelope encryption for durable credentials that must be replayed rather
# than verified — today only the Trakt bearer pair (CLUSTERING-PLAN §3.2).
chacha20poly1305 = "0.10"
zeroize = "1"
# PNG object publication uses the already-audited primitives directly instead
# of adding an image-processing stack to the untrusted subtitle boundary.
flate2 = "1.1.9"
crc32fast = "1.5.0"
getrandom = "0.2"
ring = "0.17"
# Streaming
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
mdns-sd = "0.20"
# Misc
clap = { version = "4", features = ["derive", "env"] }
# POSIX signals: SIGSTOP/SIGCONT to hold a transcode that has run ahead of the
# playhead (plurxd only, and only on the platforms plurxd runs on).
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# Dev
tempfile = "3"
http-body = "1"
http-body-util = "0.1"

[workspace.lints.clippy]
unwrap_used = "warn"

# Argon2id runs ~80 times across the test suite (every seeded admin setup and
# login), and at opt-level 0 each 19 MiB / t=2 hash costs on the order of a
# second of pure KDF. Optimizing only the KDF crates keeps workspace code
# fully debuggable while cutting minutes from every `cargo test` — local, CI,
# and sandboxes alike.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Test executables are replicated in every isolated swarm worker cache. Rust
# debug info made each plurxd test binary hundreds of megabytes even though the
# harness never attaches a debugger to them. Keep normal development builds
# debuggable, but omit debug info from the disposable test artifacts.
[profile.test]
debug = 0

# The real-process recovery harness spends minutes in SQLite image generation
# and verification. Optimize that executable without changing production or
# ordinary development profiles, while retaining assertions and line tables
# for failure diagnosis.
[profile.transport-recovery]
inherits = "dev"
opt-level = 2
debug = 1
debug-assertions = true
overflow-checks = true

[profile.release]
lto = "thin"
strip = "symbols"

# Patch Hiqlite's sparse-membership, WAL-recovery, and optional-dependency
# compatibility without advisory ignores. Path packages are
# skipped by cargo-audit, so rust-audit.yml also scans a synthesized
# registry-provenance lockfile built by scripts/vendor-audit-lock.
#
# `s3-simple` is deliberately NOT overridden here. plurx builds hiqlite without
# `backup`/`s3`, so the workspace graph contains no s3-simple at all and a
# patch row for it would be an unused patch -- a warning on every cargo
# invocation and evidence of nothing. The override that keeps the *fork's*
# advertised backup/S3 graph advisory-clean lives in
# vendor/hiqlite/Cargo.toml, which is the manifest cargo honours when that
# feature is enabled. If plurx ever enables `hiqlite/backup` from here, the
# registry s3-simple 0.8.0 returns with quick-xml 0.39.4 and aws-lc-sys
# 0.39.1; `deny.toml`'s ban on that aws-lc-sys version is the tripwire, and
# this row has to come back with it.
[patch.crates-io]
# dolby_vision 3.4.0 sizes allocations from unbounded ue(v) counts in the
# RPU it is parsing; a corrupted or hostile RPU could abort plurxd. The
# vendored copy refuses counts that cannot fit in the bits left. See
# vendor/dolby_vision/PLURX-PATCH.md.
dolby_vision = { path = "vendor/dolby_vision" }
hiqlite = { path = "vendor/hiqlite" }
hiqlite-wal = { path = "vendor/hiqlite-wal" }
rust_decimal = { path = "vendor/rust_decimal" }
